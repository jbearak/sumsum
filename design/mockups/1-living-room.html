<!doctype html>
<html lang="en" dir="ltr" data-palette="terracotta" data-appearance="system" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Living Room · Sumsum library mockup 1</title>
<style>
/* ---------- tokens: copied from library.template.html (scheme + Terracotta palette) ---------- */
:root{color-scheme:light;
 --font:ui-rounded,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
 --whole:#1b7a4b;--parts:#a86400;--excerpt:#5f4fb3;--missing:#b3392c;--unknown:#7e8a83;--whole-ink:#fff;
 --whole-bg:#e2f1e7;--parts-bg:#faefd9;--excerpt-bg:#ece9fa;--missing-bg:#fbe8e4;--unknown-bg:#eef0ea;
 --acc-ok:#1f5fa8;--acc-public:#5c6b75;--acc-vpn:#8f3f71;--acc-lic:#1d6a6a;--acc-bad:#3d3d3d;
 --ser-modern:#126844;--ser-classic:#7a5e10;--ser-shalom-classic:#2f5f8c;--ser-shalom-modern:#7a4a80;--ser-elmo:#9c4a2f;
 --star:#f5cf45;--star-ink:#a77300;--scrim:#000000a0;--scrim-ink:#fff;--host-bg:#fffffff2;--host-ink:#18291f;
 --seg-hatch:#ffffff5c;--seg-dot:#ffffff80;--shadow-badge:0 1px 3px #0003;--shadow-toast:0 6px 30px #0004}
:root[data-scheme=dark]{color-scheme:dark;
 --whole:#5cc790;--parts:#e9a640;--excerpt:#ab9ef2;--missing:#f2826f;--unknown:#84928a;--whole-ink:#05231a;
 --whole-bg:#173827;--parts-bg:#3a2c12;--excerpt-bg:#29244a;--missing-bg:#40201b;--unknown-bg:#1c2823;
 --acc-ok:#8cc3ff;--acc-public:#a9b6bf;--acc-vpn:#e59ac6;--acc-lic:#7fd1cc;--acc-bad:#cfcfcf;
 --ser-modern:#86d6a8;--ser-classic:#e3c167;--ser-shalom-classic:#9cc4ec;--ser-shalom-modern:#d6a6dc;--ser-elmo:#f2a28e}
:root{
 --bg:#f9f2eb;--surface:#fffcf8;--surface-2:#f3e9e0;--surface-3:#eaddd1;
 --ink:#301f18;--muted:#6a5449;--line:#e3d7cc;--line-strong:#c2ac9b;
 --brand:#803414;--primary:#00445f;--primary-ink:#fff;--primary-hover:#00364c;
 --accent:#dfbd7c;--focus:#1e3a71;--link:#164878;--chip:#e4dad3;--chip-ink:#4b382f;
 --art-veil:#fffcf8cc;--shadow:0 1px 2px #3a1a100f,0 6px 18px #3a1a100d;
 --mast-ink:#fff;--mast-ink-soft:#fdf7f3;--mast-hover:#ffffff18;--mast-chip:#ffffff26;
 --mast-current:#fff;--mast-current-ink:#803414;--mast-ctl:#ffffff14;--mast-ctl-hover:#ffffff26;--mast-ctl-line:#ffffff80;
 --mast-focus:#f3d68f;--mast-divider:#ffffff59;--mast-current-divider:#80341499}
:root[data-scheme=dark]{
 --bg:#140e0b;--surface:#1e1511;--surface-2:#281c17;--surface-3:#33251f;
 --ink:#f1e9e3;--muted:#c1ad9f;--line:#382a25;--line-strong:#56433a;
 --brand:#58230c;--primary:#2f7990;--primary-ink:#fff;--primary-hover:#256a80;
 --accent:#e0d2b4;--focus:#c1e3fc;--link:#b3d6ff;--chip:#463e39;--chip-ink:#e6dbd3;
 --art-veil:#1e1511cc;--shadow:0 1px 2px #0006}
/* Mockup-only derived tokens (mixes of the tokens above, so they follow the scheme) */
:root{--chip-on:var(--primary);--chip-on-ink:var(--primary-ink);--ph-ink:var(--muted);
 --ph-a:var(--surface-3);--ph-b:var(--surface-2);--sheet-scrim:var(--scrim);--r:12px}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button,input,select{font:inherit;color:inherit}
img{display:block}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
bdi{unicode-bidi:isolate}

/* ---------- mockup note ---------- */
.note{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:14px}
.note details{max-width:1240px;margin:0 auto;padding:8px 20px}
.note summary{cursor:pointer;font-weight:650;list-style-position:inside}
.note summary span{font-weight:400;color:var(--muted)}
.note ol{margin:6px 0 6px;padding-inline-start:22px}
.note li{margin:2px 0}
.note .jump{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px}
.note .jump b{font-weight:600;margin-inline-end:4px}
.note .jump a{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;text-decoration:none;color:var(--ink)}
.note .jump a:hover{border-color:var(--line-strong)}

/* ---------- masthead ---------- */
.mast{background:var(--brand);color:var(--mast-ink);position:sticky;top:0;z-index:30}
.mast-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px;min-height:68px}
.mark{display:flex;flex-direction:column;line-height:1.05;color:var(--mast-ink);text-decoration:none;flex:none}
.mark b{font-size:22px;font-weight:800;letter-spacing:.01em}
.mark small{font-size:13px;color:var(--mast-ink-soft);opacity:.92}
.views{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.views a{display:block;color:var(--mast-ink);text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:16px}
.views a:hover{background:var(--mast-hover)}
.views a[aria-current=page]{background:var(--mast-current);color:var(--mast-current-ink)}
.views .n{font-weight:500;opacity:.8;margin-inline-start:4px;font-size:14px}
.search{position:relative;flex:1;max-width:460px;margin-inline-start:auto}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);
 padding:0 18px 0 44px;font-size:16px}
[dir=rtl] .search input{padding:0 44px 0 18px}
.search input::placeholder{color:var(--mast-ink-soft);opacity:.85}
.search input:focus-visible{outline-color:var(--mast-focus)}
.search svg{position:absolute;inset-inline-start:15px;top:12px;width:20px;height:20px;stroke:var(--mast-ink);fill:none;stroke-width:2}
.ctls{display:flex;gap:8px;align-items:center;flex:none}
.mbtn{height:44px;min-width:44px;border-radius:999px;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);
 cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:15px}
.mbtn:hover{background:var(--mast-ctl-hover)}
.mbtn:focus-visible,.lang label:focus-within{outline:3px solid var(--mast-focus);outline-offset:2px}
.mbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.round{width:44px;padding:0}
.lang{display:inline-flex;border:1px solid var(--mast-ctl-line);border-radius:999px;overflow:hidden;height:44px}
.lang label{display:flex;align-items:center;padding:0 12px;cursor:pointer;font-size:15px;font-weight:600}
.lang input{position:absolute;opacity:0;pointer-events:none}
.lang label:has(input:checked){background:var(--mast-current);color:var(--mast-current-ink)}
.stripe{height:6px;background:var(--accent)}
.pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);
 border-radius:var(--r);box-shadow:var(--shadow-toast);padding:14px 16px;min-width:260px;z-index:40;font-size:15px}
.pop h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600}
.pop label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.pop input{margin-top:4px;accent-color:var(--primary);width:18px;height:18px}
.pop p{margin:8px 0 0;color:var(--muted);font-size:13px}
.relative{position:relative}

/* search results */
.sres{position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);
 border-radius:var(--r);box-shadow:var(--shadow-toast);padding:10px;z-index:40;max-height:70vh;overflow:auto;min-width:340px}
.sres h4{margin:6px 8px;font-size:13px;color:var(--muted);font-weight:650;text-transform:none}
.sres a{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.sres a:hover,.sres a:focus-visible{background:var(--surface-2)}
.sres .sth{width:64px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--surface-3)}
.sres .sth img{width:100%;height:100%;object-fit:cover}
.sres small{display:block;color:var(--muted);font-size:13px}
.sres .none{padding:8px;color:var(--muted)}
.sres .tagrow{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px}
.sres .tagrow a{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 12px;font-size:14px}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:32px;line-height:1.2;margin:0 0 6px;font-weight:750}
h2{font-size:26px;line-height:1.25;margin:0;font-weight:720}
.lede{color:var(--muted);margin:0 0 20px;max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:0;
 background:var(--primary);color:var(--primary-ink);text-decoration:none;font-weight:650;cursor:pointer;font-size:17px;line-height:1.2;text-align:center}
.btn:hover{background:var(--primary-hover)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none}
.btn.sm{min-height:40px;padding:8px 16px;font-size:15px}
.btn2{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:999px;border:1px solid var(--line-strong);
 background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer;font-size:16px}
.btn2:hover{background:var(--surface-2)}
.btn2[aria-pressed=true]{background:var(--surface-3);border-color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font-size:inherit}

/* ---------- pictures ---------- */
.pic{position:relative;display:block;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--surface-3)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ph-ink);
 background:repeating-linear-gradient(135deg,var(--ph-a) 0 14px,var(--ph-b) 14px 28px);font-weight:700}
.ph b{font-size:30px;line-height:1}
.ph span{font-size:12px;font-weight:600;letter-spacing:.02em}
.dur{position:absolute;inset-block-end:8px;inset-inline-end:8px;background:var(--scrim);color:var(--scrim-ink);border-radius:6px;padding:1px 8px;
 font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;direction:ltr}
.plaque{position:absolute;inset-block-start:8px;inset-inline-start:8px;background:var(--host-bg);color:var(--host-ink);border-radius:6px;
 padding:1px 8px;font-size:13px;font-weight:700;box-shadow:var(--shadow-badge)}
.star{position:absolute;inset-block-start:8px;inset-inline-end:8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--scrim);
 color:var(--scrim-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.star[aria-pressed=true] svg{fill:var(--star);stroke:var(--star)}

/* ---------- cards: one reading order (picture+duration, title, production+format, access, action) ---------- */
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .t{font-size:18px;font-weight:680;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .t a{color:var(--ink);text-decoration:none}
.card .t a:hover{text-decoration:underline}
html[dir=ltr] :is(.card,.upnext,.hero) .t2{text-align:left}html[dir=rtl] :is(.card,.upnext,.hero) .t2{text-align:right}
.card .t2{font-size:15px;color:var(--muted);margin:-6px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:15px;color:var(--muted);margin:0}
.card .acc{font-size:14px;margin:0;display:flex;gap:7px;align-items:baseline;color:var(--muted)}
.card .go{align-self:flex-start;margin-top:2px}
.amark{flex:none;width:10px;height:10px;border-radius:50%;display:inline-block;transform:translateY(1px)}
.a-vimeo,.a-played{background:var(--acc-ok)}.a-public{background:var(--acc-public)}.a-vpn{background:var(--acc-vpn)}
.a-licensed{background:transparent;border:2.5px solid var(--acc-lic)}.a-unavailable,.a-region{background:var(--acc-bad)}
.cov{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.cov i{width:10px;height:10px;border-radius:50%;display:inline-block}
.cov-whole i{background:var(--whole)}.cov-parts i{background:var(--parts)}.cov-excerpt i{background:var(--excerpt)}.cov-missing i{background:var(--missing)}
.tag{display:inline-block;font-size:12px;font-weight:650;border:1px solid var(--line-strong);color:var(--muted);border-radius:6px;padding:0 6px;
 margin-inline-start:6px;vertical-align:2px;white-space:nowrap}

/* ---------- home ---------- */
.hello{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello p{margin:0;color:var(--muted)}
.upnext{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;background:var(--surface);border:1px solid var(--line);
 border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:44px}
.upnext .pic{border-radius:14px}
.upnext .k{font-size:15px;font-weight:700;color:var(--muted);margin:6px 0 4px;letter-spacing:.02em}
.upnext h2{font-size:34px;margin:0 0 4px}
.upnext .t2{font-size:19px;color:var(--muted);margin:0 0 12px}
.upnext .facts{margin:0 0 14px;color:var(--muted);font-size:15px}
.upnext .syn{font-size:16px;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.upnext .src{font-size:13px;color:var(--muted);margin:-10px 0 16px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.accline{font-size:14px;color:var(--muted);display:flex;gap:7px;align-items:baseline;margin:10px 0 0}
.friends{margin-bottom:44px}
.friends ul{list-style:none;display:flex;gap:18px;padding:4px 2px 8px;margin:14px 0 0;overflow-x:auto;scrollbar-width:thin}
.friend{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);width:96px;flex:none;text-align:center}
.friend .face{width:88px;height:88px;border-radius:50%;overflow:hidden;background:var(--surface-3);border:3px solid var(--surface);
 box-shadow:0 0 0 2px var(--line-strong);position:relative}
.friend:hover .face{box-shadow:0 0 0 3px var(--accent)}
.friend .face img,.mface .face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.friend .face .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--muted)}
.friend b{font-size:15px;line-height:1.2}
.friend small{font-size:13px;color:var(--muted);line-height:1.2}
.shelf{margin-bottom:44px}
.shead{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:6px}
.shead h2 a{color:var(--ink);text-decoration:none}
.shead h2 a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:4px;text-underline-offset:6px}
.shead p{margin:2px 0 0;color:var(--muted);font-size:15px}
.shead .more{white-space:nowrap;font-weight:650;font-size:16px}
.sarrows{display:flex;gap:6px}
.sarrows button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;color:var(--ink)}
.sarrows button:hover{background:var(--surface-2)}
[dir=rtl] .sarrows button{transform:scaleX(-1)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:280px;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 2px 14px;
 scrollbar-width:thin;scroll-padding-inline:2px}
.row>*{scroll-snap-align:start}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px;color:var(--muted)}
.eptile .pic{background:var(--surface-2)}
.eptile.missing .pic{border:2px dashed var(--line-strong);background:var(--surface)}
.grownups{margin-top:20px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;display:flex;gap:10px;flex-wrap:wrap;
 justify-content:space-between}

/* ---------- browse ---------- */
.bwrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:36px;align-items:start}
.facets{position:sticky;top:92px;max-height:calc(100vh - 110px);overflow:auto;padding-inline-end:6px;scrollbar-width:thin}
.fg{border-bottom:1px solid var(--line);padding:14px 0}
.fg:first-child{padding-top:0}
.fg h3{font-size:15px;margin:0 0 8px;font-weight:700}
.fg h3 small{font-weight:500;color:var(--muted)}
.fg .help{font-size:13px;color:var(--muted);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;border-radius:999px;border:1px solid transparent;background:var(--chip);
 color:var(--chip-ink);padding:4px 12px;font-size:14px;font-weight:600;cursor:pointer}
.chip .c{font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip:disabled{opacity:.45;cursor:default}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;align-items:center;gap:10px;padding:5px 2px;cursor:pointer;font-size:15px;border-radius:6px}
.checks label:hover{background:var(--surface-2)}
.checks input{accent-color:var(--primary);width:18px;height:18px;flex:none}
.checks .c{margin-inline-start:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.checks .z{color:var(--muted)}
.minifaces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.mface{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:4px 0;cursor:pointer;border-radius:10px;color:var(--ink)}
.mface .face{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--surface-3);position:relative;box-shadow:0 0 0 2px var(--line)}
.mface .face img{width:100%;height:100%;object-fit:cover}
.mface .face .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted)}
.mface[aria-pressed=true] .face{box-shadow:0 0 0 3px var(--primary)}
.mface[aria-pressed=true] b{color:var(--primary)}
[data-scheme=dark] .mface[aria-pressed=true] b{color:var(--link)}
.mface b{font-size:12.5px;font-weight:650;line-height:1.15}
.mface .c{font-size:12px;color:var(--muted)}
.mface:disabled{opacity:.4;cursor:default}
.fg details summary{cursor:pointer;color:var(--link);font-size:14px;margin-top:10px}
.tgroup{margin-top:10px}
.tgroup h4{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:650}
.bhead{margin-bottom:18px}
.sentence{font-size:30px;line-height:1.25;font-weight:740;margin:0}
.sentence em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent) 62%);padding:0 2px}
.bmeta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:10px;color:var(--muted);font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);padding:3px 6px 3px 12px;
 font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
[dir=rtl] .pill{padding:3px 12px 3px 6px}
.pill span{width:22px;height:22px;border-radius:50%;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.sortsel{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.sortsel select{height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:32px 24px}
.zero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.zero h3{margin:0 0 8px}
.zero ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.fbtn{display:none}
.sheethead,.sheetfoot{display:none}
.editorial{font-size:13px;color:var(--muted);margin:22px 0 0}

/* ---------- episode page ---------- */
.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-size:15px}
.crumbs a{text-decoration:none;font-weight:600}
.crumbs .sp{flex:1}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:36px;align-items:start}
.hero .pic{border-radius:18px;box-shadow:var(--shadow)}
.hero .k{font-size:15px;color:var(--muted);font-weight:650;margin:2px 0 6px}
.hero h1{font-size:36px}
.hero .t2{font-size:20px;color:var(--muted);margin:0 0 4px}
.hero .facts{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:15px;margin:10px 0 16px;align-items:center}
.decide{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:6px 0 14px}
.decide .btn{width:100%;font-size:18px;min-height:54px}
.decide .why{font-size:14px;color:var(--muted);margin:10px 0 0}
.decide .others{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.decide .others summary{cursor:pointer;font-weight:650;font-size:15px;color:var(--link)}
.olist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.olist li{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.olist li:last-child{border-bottom:0}
.olist .od{display:flex;flex-direction:column}
.olist .od small{color:var(--muted)}
.nogo{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:15px;margin:0}
.mine{display:flex;gap:10px;flex-wrap:wrap}
.sect{margin-top:44px;max-width:860px}
.sect h2{font-size:24px;margin-bottom:10px}
.syn{font-size:18px;line-height:1.7;margin:0 0 6px}
.srcl{font-size:13px;color:var(--muted);margin:0}
.parts{list-style:none;margin:10px 0 0;padding:0;counter-reset:p;display:flex;flex-direction:column;gap:10px}
.parts li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);
 border-radius:14px;padding:10px}
.parts .pic{border-radius:10px}
.parts .pn{font-weight:700;font-size:17px;margin:0}
.parts .pm{font-size:14px;color:var(--muted);margin:2px 0 0;display:flex;gap:7px;align-items:baseline}
.parts .pe{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.parts .opened{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.parts .opened input{accent-color:var(--primary)}
.dossier{margin-top:44px;border:1px solid var(--line);border-radius:16px;background:var(--surface);max-width:960px}
.dossier>summary{cursor:pointer;padding:16px 20px;font-weight:700;font-size:18px}
.dossier>summary span{font-weight:500;color:var(--muted);font-size:15px;margin-inline-start:8px}
.dossier .din{padding:0 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.dossier h3{font-size:16px;margin:12px 0 8px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ladder li{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:15px}
.ladder li.now{border-color:var(--ink);background:var(--surface-2)}
.ladder li small{display:block;color:var(--muted);font-size:13px}
.ladder .nowtag{font-size:12px;font-weight:700;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;margin-inline-start:8px}
dl.id{margin:0;display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;font-size:15px}
dl.id dt{color:var(--muted)}
dl.id dd{margin:0}
.copies{grid-column:1/-1}
table.ct{width:100%;border-collapse:collapse;font-size:14px}
.ct th,.ct td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ct th{color:var(--muted);font-weight:650}
.ct td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.ct tr.poss td{color:var(--muted)}
.possnote{font-size:14px;color:var(--muted);margin:14px 0 6px}

/* ---------- research ---------- */
.rtable{width:100%;border-collapse:collapse;font-size:15px;background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.rtable th,.rtable td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.rtable th{font-size:13px;color:var(--muted);font-weight:650;background:var(--surface-2)}
.rtable td.n{font-variant-numeric:tabular-nums}
.rtable .sub td{background:var(--surface-2);font-weight:700;font-size:14px}
.wb{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0 34px}
.wb a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink)}
.wb a:hover{border-color:var(--line-strong)}
.wb b{display:block;font-size:18px}
.wb span{color:var(--muted);font-size:14px}
.tablewrap{overflow-x:auto}

footer{max-width:1240px;margin:0 auto;padding:0 20px 40px;font-size:14px;color:var(--muted)}
.tabbar{display:none}
.toast{position:fixed;inset-block-end:24px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;
 border-radius:999px;box-shadow:var(--shadow-toast);font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
[dir=rtl] .toast{transform:translateX(50%)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ---------- tablet ---------- */
@media (max-width:1060px){
 .views .n{display:none}
 .bwrap{grid-template-columns:250px minmax(0,1fr);gap:24px}
 .hero{grid-template-columns:1fr 1fr;gap:24px}
}
/* ---------- phone ---------- */
@media (max-width:760px){
 html{font-size:16px}
 .note details{padding:8px 14px}
 .mast-in{padding:10px 14px;gap:10px;min-height:60px;flex-wrap:wrap}
 .views{display:none}
 .mark b{font-size:19px}
 .search{order:3;flex-basis:100%;max-width:none;margin:0}
 .search input{height:42px}
 .ctls{margin-inline-start:auto}
 .mbtn .wl{display:none}
 main{padding:20px 14px 110px}
 h1{font-size:26px}
 h2{font-size:21px}
 .upnext{grid-template-columns:1fr;gap:14px;padding:12px;border-radius:16px;margin-bottom:32px}
 .upnext h2{font-size:26px}
 .upnext .acts .btn{flex:1 1 100%}
 .row{grid-auto-columns:76%;gap:14px}
 .shelf,.friends{margin-bottom:32px}
 .sarrows{display:none}
 .friend{width:78px}.friend .face{width:70px;height:70px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
 .grid .card .t{font-size:15.5px}
 .grid .card .t2{font-size:13.5px}
 .grid .card .m,.grid .card .acc{font-size:13px}
 .grid .card .go{display:none}
 .grid .star{width:34px;height:34px}
 .bwrap{display:block}
 .facets{display:none}
 .facets.open{display:block;position:fixed;inset:0;max-height:none;z-index:70;background:var(--bg);padding:0 16px 90px;overflow:auto}
 .sheethead{display:flex;position:sticky;top:0;background:var(--bg);align-items:center;justify-content:space-between;padding:14px 0;
  border-bottom:1px solid var(--line);z-index:2}
 .sheethead b{font-size:19px}
 .sheetfoot{display:block;position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);
  border-top:1px solid var(--line)}
 .sheetfoot .btn{width:100%}
 .fbtn{display:inline-flex;position:sticky;top:132px;z-index:20;margin-bottom:14px;box-shadow:var(--shadow)}
 .sentence{font-size:23px}
 .sortsel{margin-inline-start:0}
 .hero{grid-template-columns:1fr;gap:16px}
 .hero h1{font-size:28px}
 .dossier .din{grid-template-columns:1fr}
 .parts li{grid-template-columns:96px minmax(0,1fr);gap:12px}
 .parts .pe{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
 .wb{grid-template-columns:1fr}
 .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
 .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--muted);font-size:12.5px;
  font-weight:650;min-height:56px;position:relative}
 .tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
 .tabbar a[aria-current=page]{color:var(--primary)}
 [data-scheme=dark] .tabbar a[aria-current=page]{color:var(--link)}
 .tabbar a[aria-current=page]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
 .tabbar .badge{position:absolute;top:4px;inset-inline-start:56%;background:var(--brand);color:var(--mast-ink);font-size:11px;border-radius:999px;
  padding:0 6px;line-height:17px}
 .pop{position:fixed;top:auto;bottom:0;inset-inline:0;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));z-index:80}
 .sres{position:fixed;top:auto;inset-inline:8px;min-width:0}
 .toast{inset-block-end:80px}
}
@media (forced-colors:active){.chip[aria-pressed=true],.views a[aria-current=page]{outline:2px solid CanvasText}.amark,.cov i{forced-color-adjust:none}}

const H = document.documentElement;
let LANG = H.lang === 'he' ? 'he' : 'en';
const S = {
 stars: new Set(['hop-10333', 'yt-LHS8n2YNFFY', 'hop-8864']),

 how: {vpn: false, card: false, buy: false},

};
const t = (k, v) => { let s = (T[LANG][k] ?? T.en[k] ?? k); if (v) for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(b); return s; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const he = () => LANG === 'he';
const fmtDur = s => { if (!s && s !== 0) return ''; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const durH = s => s ? `<bdi dir="ltr">${fmtDur(s)}</bdi>` : '';
const lab = k => (D.labels[k] || [k.replace(/\b\w/g, c => c.toUpperCase()), k])[he() ? 1 : 0];
const savePrefs = () => { try { localStorage.setItem('sumsum-mock1-prefs', JSON.stringify({lang: LANG, appearance: H.getAttribute('data-appearance')})); } catch (e) {} };

/* ---------------- domain helpers ---------------- */
const FAM = {classic: ['Rechov Sumsum', 'רחוב סומסום'], modern: ['Rechov Sumsum', 'רחוב סומסום'], elmo: ['Elmo’s talk show', 'תכנית האירוח של אלמו'],
 'shalom-classic': ['Shalom Sesame', 'שלום סומסום'], 'shalom-modern': ['Shalom Sesame', 'שלום סומסום']};
function prodShort(pid, series) {
 const p = P[pid];
 if (!p || p.f === 'queue') return t('s_' + (series || p?.s || 'classic'));
 if (pid === 'word-of-day-2023') return (he() ? 'מילת היום' : 'Word of the Day') + ' · 2023';
 if (pid === 'sesame-stories-2003') return (he() ? 'סיפורי סומסום' : 'Sippuray Sumsum') + ' · ' + p.y;
 return FAM[p.s][he() ? 1 : 0] + ' · ' + `<bdi dir="ltr">${esc(p.y)}</bdi>`;
}
const langOf = r => { const l = r.lang; if (!l || l === 'und') return 'none'; if (['he', 'en', 'ar'].includes(l)) return l; return 'mixed'; };
const accGroup = r => r.a === 'licensed' ? (r.host === 'hoopla' ? 'card' : 'buy') : r.a;
function access(r) {
 const host = esc(r.host === 'archive.org' ? 'Internet Archive' : r.host);
 const g = accGroup(r);
 if (g === 'vimeo') return {cls: r.played ? 'a-played' : 'a-vimeo', text: r.played ? t('acc_played') : t('acc_vimeo')};
 if (g === 'public') return {cls: 'a-public', text: t('acc_public', {host})};
 if (g === 'vpn') return {cls: 'a-vpn', text: r.host === 'Hop' ? t('acc_hop') : t('acc_restricted', {host})};
 if (g === 'card') return {cls: 'a-licensed', text: t('acc_card', {host})};
 if (g === 'buy') return {cls: 'a-licensed', text: t('acc_buy', {host})};
 if (g === 'region') return {cls: 'a-region', text: t('acc_region', {host})};
 return {cls: 'a-unavailable', text: t('acc_unavailable')};
}
const accH = r => { const a = access(r); return `<span class="amark ${a.cls}" aria-hidden="true"></span><span>${a.text}</span>`; };
function watchLabel(r) {
 const g = accGroup(r);
 if (g === 'card') return t('w_card', {host: r.host});
 if (g === 'buy') return t('w_buy', {host: r.host});
 return t('w_' + r.host) !== 'w_' + r.host ? t('w_' + r.host) : t('w_web');
}
const playable = r => !['unavailable'].includes(r.a);
const allowedNow = r => { const g = accGroup(r); return g === 'vimeo' || g === 'public' || (g === 'vpn' && S.how.vpn) || (g === 'card' && S.how.card) || (g === 'buy' && S.how.buy); };
const ACC_RANK = {played: 0, vimeo: 1, public: 2, card: 3, vpn: 4, buy: 5, region: 6, unavailable: 9};
const rankOf = r => ACC_RANK[r.played ? 'played' : accGroup(r)];
function epCopies(e, roles) { return e.ups.filter(u => roles.includes(u[1])).map(([rid, role, part]) => ({r: R[rid], role, part})).filter(x => x.r); }
function bestFor(e) {
 const c = epCopies(e, ['whole-candidate', 'alternate-edition']).filter(x => playable(x.r))
  .sort((a, b) => (a.role === 'whole-candidate' ? 0 : 1) - (b.role === 'whole-candidate' ? 0 : 1) || (allowedNow(b.r) - allowedNow(a.r)) || rankOf(a.r) - rankOf(b.r));
 return c[0] || null;
}
function epTitle(e) {
 if (he()) return {main: e.story || e.he || e.hed || e.en, mainEd: !e.story && !e.he && !!e.hed, other: e.en, otherLang: 'en'};
 return {main: e.en || e.story || e.he, mainEd: false, other: e.story || e.he, otherLang: 'he'};
}
function recTitle(r) {
 if (he()) return {main: r.he || r.hed || r.en, mainEd: !r.he && !!r.hed, other: r.he || r.hed ? r.en : '', otherLang: 'en'};
 return {main: r.en, other: r.he || '', otherLang: 'he'};
}
const linksOf = r => LINKS[r.id] || [];
const mainLink = r => linksOf(r).find(l => l.role !== 'possible');
const isPossibleOnly = r => linksOf(r).length && !mainLink(r);
const kindOf = r => r.k;
const imgOf = e => { for (const [rid, role] of e.ups) if (role !== 'possible' && R[rid]?.img) return R[rid].img; return null; };
const prodEps = pid => D.eps.filter(e => e.p === pid).sort((a, b) => a.n - b.n);

/* ---------------- pictures ---------------- */
let phN = 0;
function pic(img, n, extra = '') {
 const num = n ?? (++phN);
 return `${phHtml(num)}${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async" data-n="${esc(num)}">` : ''}${extra}`;
}
const phHtml = n => `<div class="ph" aria-hidden="true"><b>${esc(n)}</b><span>${t('noPic')}</span></div>`;
document.addEventListener('error', ev => { const i = ev.target; if (i.tagName === 'IMG' && i.dataset.n !== undefined) { i.remove(); } }, true);

const starBtn = rid => `<button class="star" data-act="star" data-id="${esc(rid)}" aria-pressed="${S.stars.has(rid)}" aria-label="${S.stars.has(rid) ? t('starOn') : t('starOff')}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>`;
const ext = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const goBtn = (r, cls = 'btn sm go', label) => playable(r) ? `<a class="${cls}" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(label || watchLabel(r))}${ext}</a>` : '';

/* One card reading order: picture and duration, title, production and format, access, action. */
function recCard(r, {asEpisode = true} = {}) {
 const ml = mainLink(r), e = ml && E[ml.e];
 let href = '#/v/' + encodeURIComponent(r.id), title = recTitle(r), sub = '', target = r, kindTxt = t('k_' + kindOf(r));
 if (asEpisode && e && ['whole-candidate', 'alternate-edition'].includes(ml.role)) {
  href = '#/ep/' + encodeURIComponent(e.id); title = epTitle(e);
  const best = bestFor(e); if (best) target = best.r;
  kindTxt = t('f_' + P[e.p].f) + (P[e.p].numEn ? ' ' + (he() ? P[e.p].numHe : P[e.p].numEn) + ' ' + e.n : '');
 } else if (e) {
  const et = epTitle(e).main;
  sub = ml.role === 'part' ? t('asPart', {t: esc(et)}) : ml.role === 'excerpt' ? t('asExcerpt', {t: esc(et)}) : ml.role === 'whole-candidate' ? t('asWhole', {t: esc(et)}) : t('asAlt', {t: esc(et)});
 } else if (isPossibleOnly(r)) {
  sub = t('asPossible', {t: esc(epTitle(E[linksOf(r)[0].e]).main)});
 }
 return `<article class="card">
  <a class="pic" href="${href}" tabindex="-1" aria-hidden="true">${pic(r.img)}${r.d ? `<span class="dur">${fmtDur(target.d || r.d)}</span>` : ''}</a>
  ${starBtn(r.id)}
  <h3 class="t"><a href="${href}" dir="auto">${esc(title.main)}</a></h3>
  ${title.other ? `<p class="t2" lang="${title.otherLang}" dir="auto">${esc(title.other)}</p>` : ''}
  <p class="m">${prodShort(r.p, r.s)} · ${kindTxt}${sub ? `<br>${sub}` : ''}</p>
  <p class="acc">${accH(target)}</p>
  ${goBtn(target)}
 </article>`;
}
function epTile(e) {
 const best = bestFor(e), img = best?.r.img || imgOf(e), tt = epTitle(e), p = P[e.p];
 const covCls = {'whole-candidate': 'whole', 'parts-only': 'parts', 'excerpt-only': 'excerpt', missing: 'missing'}[e.cov];
 const covTxt = e.cov === 'whole-candidate' ? t(p.f === 'core' ? 'cov_whole' : 'cov_whole_' + p.f) : t('cov_' + e.cov);
 const num = (he() ? p.numHe : p.numEn) ? `${he() ? p.numHe : p.numEn} ${e.n}` : '#' + e.n;
 return `<article class="card eptile ${e.cov === 'missing' ? 'missing' : ''}">
  <a class="pic" href="#/ep/${encodeURIComponent(e.id)}" tabindex="-1" aria-hidden="true">${e.cov === 'missing' ? phHtml(e.n) : pic(img, e.n)}<span class="plaque">${esc(num)}</span>${best ? `<span class="dur">${fmtDur(best.r.d)}</span>` : ''}</a>
  <h3 class="t"><a href="#/ep/${encodeURIComponent(e.id)}" dir="auto">${esc(tt.main)}</a></h3>
  ${tt.other ? `<p class="t2" lang="${tt.otherLang}" dir="auto">${esc(tt.other)}</p>` : ''}
  <p class="m"><span class="cov cov-${covCls}"><i aria-hidden="true"></i>${covTxt}</span></p>
  ${best && e.cov === 'whole-candidate' ? `<p class="acc">${accH(best.r)}</p>${goBtn(best.r)}` : ''}
 </article>`;
}

const qEl = document.getElementById('q');
qEl.addEventListener('input', () => searchPanel(qEl.value));
qEl.addEventListener('keydown', ev => { if (ev.key === 'Enter') { location.hash = '#/browse?q=' + encodeURIComponent(qEl.value); closePops(); } if (ev.key === 'Escape') closePops(); });
qEl.addEventListener('focus', () => qEl.value && searchPanel(qEl.value));

/* ---------------- events ---------------- */
let toastT;
function toast(s) { const el = document.getElementById('toast'); el.textContent = s; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
function closePops(except) { for (const [b, p] of [['howbtn', 'howpop'], ['apbtn', 'appop']]) if (p !== except) { document.getElementById(p).hidden = true; document.getElementById(b).setAttribute('aria-expanded', 'false'); } if (except !== 'sres') { document.getElementById('sres').hidden = true; qEl.setAttribute('aria-expanded', 'false'); } }
function togglePop(b, p) { const el = document.getElementById(p), open = el.hidden; closePops(p); el.hidden = !open; document.getElementById(b).setAttribute('aria-expanded', String(open)); if (open) el.querySelector('input')?.focus(); }
document.getElementById('howbtn').addEventListener('click', ev => { ev.stopPropagation(); togglePop('howbtn', 'howpop'); });
document.getElementById('apbtn').addEventListener('click', ev => { ev.stopPropagation(); togglePop('apbtn', 'appop'); });
document.getElementById('langgroup').addEventListener('change', ev => { setLang(ev.target.value); });
function setLang(l) { LANG = l === 'he' ? 'he' : 'en'; H.lang = LANG; H.dir = he() ? 'rtl' : 'ltr'; savePrefs(); render(); }
function setAp(a) { H.setAttribute('data-appearance', a); applyScheme(); savePrefs(); render(); }
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyScheme() { const a = H.getAttribute('data-appearance'); H.setAttribute('data-scheme', a === 'dark' || (a === 'system' && mq.matches) ? 'dark' : 'light'); }
mq.addEventListener?.('change', applyScheme);
function nav(f) { location.hash = '#' + route().path + (toQ(f) ? '?' + toQ(f) : ''); }
document.addEventListener('click', ev => {
 const el = ev.target.closest('[data-act]');
 if (!ev.target.closest('.pop,.search,#howbtn,#apbtn')) closePops();
 if (ev.target.closest('.sres a')) closePops();
 if (!el) return;
 const act = el.dataset.act, {path, qs} = route();
 if (act === 'star' || act === 'star2') { ev.preventDefault(); const id = el.dataset.id; S.stars.has(id) ? S.stars.delete(id) : S.stars.add(id); toast(S.stars.has(id) ? t('starredToast') : t('unstarredToast')); render(); }
 else if (act === 'watched') { const id = el.dataset.id; S.watched.has(id) ? S.watched.delete(id) : S.watched.add(id); render(); }
 else if (act === 'another') { S.upIdx++; render(); }
 else if (act === 'how') { ev.stopPropagation(); scrollTo(0, 0); togglePop('howbtn', 'howpop'); }
 else if (act === 'scroll') { const row = document.getElementById(el.dataset.row); row.scrollBy({left: (he() ? -1 : 1) * Number(el.dataset.dir) * row.clientWidth * 0.8, behavior: 'smooth'}); }
 else if (act === 'f' && el.tagName === 'BUTTON') { const f = parseQ(qs), k = el.dataset.k, v = el.dataset.v; if (el.dataset.single) f[k] = f[k][0] === v ? [] : [v]; else f[k] = f[k].includes(v) ? f[k].filter(x => x !== v) : [...f[k], v]; nav(f); }
 else if (act === 'unf') { const f = parseQ(qs), k = el.dataset.k; if (k === 'q') f.q = ''; else f[k] = f[k].filter(x => x !== el.dataset.v); nav(f); }
 else if (act === 'relax') { const f = parseQ(qs), k = el.dataset.k; if (k === 'q') f.q = ''; else f[k] = []; nav(f); }
 else if (act === 'clear') { const f = blank(); f.sort = parseQ(qs).sort; nav(f); }
 else if (act === 'sheet') { document.getElementById('facets').classList.toggle('open', el.dataset.open === '1'); document.body.style.overflow = el.dataset.open === '1' ? 'hidden' : ''; }
 else if (act === 'back') { ev.preventDefault(); history.length > 1 ? history.back() : (location.hash = '#/'); }
 else if (act === 'jump') { ev.preventDefault(); const s = document.getElementById('parts'); s.scrollIntoView({behavior: 'smooth'}); s.focus({preventScroll: true}); }
 else if (act === 'openpart') { S.opened.add(el.dataset.id); const c = el.closest('li').querySelector('input'); if (c) c.checked = true; }
 else if (act === 'focussearch') { ev.preventDefault(); scrollTo(0, 0); qEl.focus(); }
});
document.addEventListener('change', ev => {
 const el = ev.target, act = el.dataset.act, {qs} = route();
 if (act === 'f') { const f = parseQ(qs), k = el.dataset.k, v = el.dataset.v; f[k] = el.checked ? [...f[k], v] : f[k].filter(x => x !== v); const open = document.getElementById('facets')?.classList.contains('open'); nav(f); if (open) setTimeout(() => document.getElementById('facets')?.classList.add('open')); }
 else if (act === 'sort') { const f = parseQ(qs); f.sort = el.value; nav(f); }
 else if (act === 'howset') { S.how[el.dataset.k] = el.checked; S.upIdx = 0; render(); document.getElementById('howpop').hidden = false; document.getElementById('howbtn').setAttribute('aria-expanded', 'true'); }
 else if (act === 'ap') setAp(el.value);
 else if (act === 'opened') { el.checked ? S.opened.add(el.dataset.id) : S.opened.delete(el.dataset.id); }
});
document.addEventListener('toggle', ev => { if (ev.target.id === 'notedet') noteOpen = ev.target.open; }, true);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { closePops(); document.getElementById('facets')?.classList.remove('open'); document.body.style.overflow = ''; } });
window.addEventListener('hashchange', () => { const keep = document.getElementById('facets')?.classList.contains('open'); render(); if (keep) document.getElementById('facets')?.classList.add('open'); });
/* Probe hooks for screenshots: data-start-route on <html> picks the first screen; data-probe="desk" or "phone" lays out
   several copies of this page in frames (both languages, several screens) so one screenshot covers them. */
var FORCED = (H.dataset.startRoute || '').replace(/^#/, '');
if (H.dataset.probe) probe(H.dataset.probe); else render();
function probe(spec) {
 const [kind, pick] = spec.split(':');
 const src = '<!doctype html>\n' + PRISTINE;
 const desk = [['en', '#/', 1900], ['he', '#/', 1900], ['en', '#/browse?th=music,songs&t=10&lang=he', 1500], ['he', '#/browse?ch=elmo', 1500],
  ['en', '#/ep/original-1980s-ietv-167', 1650], ['he', '#/ep/shalom-modern-01', 1350], ['en', '#/ep/original-1980s-ietv-133', 1150], ['he', '#/research', 1100]];
 const phone = [['en', '#/', 1700], ['he', '#/', 1700], ['en', '#/browse?th=music,songs&t=10', 1700], ['he', '#/ep/original-1980s-ietv-1', 1700],
  ['en', '#/ep/original-1980s-ietv-167', 1700], ['he', '#/v/yt-LHS8n2YNFFY', 1700]];
 const all = kind === 'phone' ? phone : desk, list = pick ? pick.split(',').map(Number).map(i => all[i]) : all, w = kind === 'phone' ? 390 : 1280;
 document.body.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:12px;padding:0">${list.map(([l, r, h]) => `<div><div style="font:600 13px/1.6 var(--font);color:var(--muted)">${l} · ${r} · ${w}px</div><iframe style="width:${w}px;height:${h}px;border:1px solid var(--line-strong);display:block"></iframe></div>`).join('')}</div>`;
 document.body.querySelectorAll('iframe').forEach((f, i) => { const [l, r] = list[i]; f.srcdoc = src.replace(/<html[^>]*>/, `<html lang="en" dir="ltr" data-start-lang="${l}" data-start-route="${r.replace(/&/g, '&amp;')}" data-frame="1">`); });
}
