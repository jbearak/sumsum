function recordOpen(id){personal.opens[id]=(personal.opens[id]||0)+1;personal.recent=[id,...personal.recent.filter(x=>x!==id)].slice(0,20);save();setTimeout(render,0)}
function watched(id){personal.watched.includes(id)?personal.watched=personal.watched.filter(x=>x!==id):personal.watched.push(id);save();render()}
function queue(id){if(!personal.queue.includes(id))personal.queue.push(id);save();render();notify(t('Added for this sitting','נוסף לישיבה הזאת'))}function removeQueue(id){personal.queue=personal.queue.filter(x=>x!==id);save();render()}
function go(s,id){if(id)selected=id;location.hash=s==='episode'?'episode/'+selected:s;if(screen===s)render()}
function openBrowse(){filters={series:'',type:'clip',theme:'',character:'',language:'he',time:'600'};q='';go('browse');render()}function route(){let [s,id]=location.hash.slice(1).split('/');screen=['home','guide','browse','episode','notes','backup','favourites'].includes(s)?s:'home';if(id&&find(id))selected=id;render();window.scrollTo(0,0)}addEventListener('hashchange',route);
function setProduction(id){production=id;go('guide');render()}function setFilter(k,v){filters[k]=v;render()}function searchNow(){q=document.getElementById('search').value.trim();filters={series:'',type:'',theme:'',character:'',language:'',time:''};go('browse');filters={series:'',type:'',theme:'',character:'',language:'',time:''};render()}
function eligibleRecords(e){if(e.clip)return failed(best(e))?[]:[best(e)];return uploads(e).filter(available).map(u=>u.r)}
function matches(e,f=filters){let rs=eligibleRecords(e),r=best(e);return(!q||[title(e),secondary(e),e.number,...rs.map(r=>r.titleEn+' '+r.titleHe)].join(' ').toLowerCase().includes(q.toLowerCase()))&&(!f.series||rs.some(r=>r.series===f.series))&&(!f.type||kind(e)===f.type)&&(!f.theme||rs.some(r=>(r.themes||[]).some(x=>x.toLowerCase()===f.theme)))&&(!f.character||rs.some(r=>(r.characters||[]).includes(f.character)))&&(!f.language||rs.some(r=>r.language===f.language))&&(!f.time||!!r?.durationSeconds&&r.durationSeconds<Number(f.time))}
function filtered(){return ALL.filter(e=>matches(e)).sort((a,b)=>(best(b)?.durationSeconds||-1)-(best(a)?.durationSeconds||-1))}
function optionCount(k,v){return ALL.filter(e=>matches(e,{...filters,[k]:v})).length}
function card(e){let r=rep(e),b=best(e),us=uploads(e).filter(available),isStar=personal.stars.includes(e.id);return `<article class="card"><button class="star" aria-label="${t('Favourite','מועדף')}: ${esc(title(e))}" aria-pressed="${isStar}" onclick="star('${e.id}')">${isStar?'★':'☆'}</button>${picture(r,e.number,true,!!b)}<div class="card-text"><div class="card-label">${e.number!=null?`<span class="plaque" aria-label="${t('Programme number','מספר תכנית')}">${e.number}</span>`:''}<span class="category">${esc(label(e.production))}<br>${label(kind(e))}</span></div><button class="title" onclick="go('episode','${e.id}')">${bi(title(e))}</button><p class="secondary">${bi(secondary(e))}</p>${screen==='guide'?`<p class="coverage ${e.coverage}">${coverage(e)}</p>`:''}<div class="stamp-row">${personal.opens[e.id]?`<span class="stamp">↻ ${t('Opened','נפתח')} ${personal.opens[e.id]} ${t('times','פעמים')}</span>`:''}${personal.watched.includes(e.id)?`<span class="stamp">✓ ${t('Watched','צפיתי')}</span>`:''}</div></div><div class="card-bottom">${b?ticket(b,e):`<button style="width:100%;margin-bottom:9px" onclick="go('episode','${e.id}')">${us.some(u=>u.role==='part')?t('See parts','לרשימת החלקים'):t('Source notes','הערות מקור')}</button>`}${!e.clip?`<details class="drawer"><summary>${t('Viewing choices','אפשרויות צפייה')} · ${us.length}</summary>${us.map(u=>`<div class="drawer-row">${role(u)} · ${host(u.r)} · <bdi dir="ltr">${dur(u.r)}</bdi><br>${evidence(u.r)}<a href="${esc(url(u.r))}" target="_blank" rel="noopener noreferrer" onclick="recordOpen('${e.id}')">${esc(watchLabel(u.r))} ↗</a></div>`).join('')}<button class="text-button" onclick="go('episode','${e.id}')">${t('Episode details','פרטי הפרק')}</button></details>`:''}</div></article>`}
function footer(){return `<div class="foot"><button class="text-button" onclick="go('notes')">▱ ${t('Not found','לא נמצא')} · ${E.filter(e=>e.coverage==='missing').length}</button><span>${t('Personal marks stay on this device.','הסימונים האישיים נשמרים במכשיר הזה.')} <button class="text-button" onclick="go('backup')">${t('Backup','גיבוי')}</button></span></div>`}
function queueView(){return personal.queue.length?`<section class="queue"><strong>${t('This sitting','הישיבה הזאת')} · ${personal.queue.length}</strong>${personal.queue.map(id=>find(id)).filter(Boolean).map((e,i)=>`<div class="queue-row"><span>${i+1}. ${bi(title(e))}</span><button onclick="go('episode','${e.id}')">${t('Viewing choices','אפשרויות צפייה')}</button><button aria-label="${t('Remove','הסרה')} ${esc(title(e))}" onclick="removeQueue('${e.id}')">×</button></div>`).join('')}</section>`:''}
function home(){let recent=personal.recent.map(find).filter(Boolean),stars=personal.stars.map(find).filter(Boolean);return `<div class="heading"><div><h1>${screen==='favourites'?t('Favourites','מועדפים'):t('Recently opened','נפתחו לאחרונה')}</h1></div><button class="text-button" onclick="go('guide')">${t('Episode guide →','מדריך פרקים ←')}</button></div>${screen==='favourites'?`<div class="grid">${stars.map(card).join('')}</div>${!stars.length?`<div class="empty"><h2>${t('No favourites yet','אין עדיין מועדפים')}</h2><button onclick="go('guide')">${t('Episode guide','מדריך פרקים')}</button></div>`:''}`:`<div class="grid">${recent.slice(0,3).map(card).join('')}</div><hr class="shelf-divider"><div class="heading"><h2>${t('Favourites','מועדפים')} <span class="mono small muted">${stars.length}</span></h2><button class="text-button" onclick="go('favourites')">${t('See all →','לכולם ←')}</button></div><div class="grid">${stars.slice(0,3).map(card).join('')}</div>`}${queueView()}${footer()}`}
const FACE_URLS={"elmo": "https://i.vimeocdn.com/video/1805902714-2c3fa112c754e550ce028d3f6d9fc4c4a44104fa86c41d190470d5f2e8fd1a60-d_295x166?region=us", "ofnik": "https://i.vimeocdn.com/video/1795469562-d3624d56ff39c8b3c7dca53c81755a3c6951661ac3a9852e0cf8dacb3a2941de-d_295x166?region=us", "grover": "https://i.vimeocdn.com/video/1791832287-1684b674996c203246622551807bf1aa13171897a3cb4d1af5928af38032cee8-d_295x166?region=us", "kippi": "https://i.ytimg.com/vi/yE_2gHTrwrY/hqdefault.jpg"};
function faceRow(){return `<div class="faces"><span class="faces-label">${t('Characters','דמויות')}</span>${['kippi','ofnik','elmo','grover'].map(ch=>{let r={thumbnailUrl:FACE_URLS[ch]};return `<button class="face" aria-pressed="${filters.character===ch}" onclick="filters.character=filters.character==='${ch}'?'':'${ch}';${screen==='guide'?"go('browse');filters.type='';filters.language='';filters.time='';":''}render()">${r?`<img src="${esc(r.thumbnailUrl)}" alt="" onerror="this.outerHTML='<span class=portrait>${label(ch,true).slice(0,1)}</span>'">`:`<span class="portrait">${label(ch,true).slice(0,1)}</span>`}${label(ch,true)} · ${optionCount('character',ch)}</button>`}).join('')}</div>`}
function layouts(){return `<div class="seg" aria-label="${t('Layout','תצוגה')}">${['album','numbers','list'].map(l=>`<button class="${layout===l?'active':''}" aria-pressed="${layout===l}" onclick="layout='${l}';render()">${l==='album'?t('Album','אלבום'):l==='numbers'?t('Numbers','מספרים'):t('List','רשימה')}</button>`).join('')}</div>`}
function guide(){let es=E.filter(e=>e.production===production).sort((a,b)=>(best(b)?.durationSeconds||-1)-(best(a)?.durationSeconds||-1));return `<div class="phone-production"><select aria-label="${t('Production','הפקה')}" onchange="setProduction(this.value)">${P.map(p=>`<option value="${p.id}" ${p.id===production?'selected':''}>${esc(label(p.id))} · ${p.years}</option>`).join('')}</select></div><div class="heading"><div><div class="section-tag"><bdi dir="ltr">${P.find(p=>p.id===production).years}</bdi></div><h1>${label(production)}</h1></div></div>${faceRow()}<div class="toolbar">${layouts()}<span class="results">${es.length} ${t('entries · longest first','רשומות · הארוכים תחילה')}</span></div><div class="grid ${layout==='numbers'?'numbers':layout==='list'?'list':''}">${es.map(card).join('')}</div><details class="source-notes"><summary>${t('Titles and evidence','כותרות וראיות')}</summary><p>${t('English titles are editorial except published Shalom Sesame titles. Hebrew catalogue and source titles are quoted verbatim. Our Hebrew translations are labelled in each entry. Whole candidate means a matched upload, not a verified uncut programme.','הכותרות באנגלית בעריכתנו, פרט לכותרות המקור של שלום סומסום. כותרות קטלוג ומקור בעברית מצוטטות כלשונן. תרגומים שלנו מסומנים ברשומה. עותק מלא מועמד הוא העלאה שזוהתה, ולא תכנית שנבדקה כשלמה.')}</p></details>${footer()}`}
function filterSelect(k,vs,heading){return `<label>${heading}<select aria-label="${heading}" onchange="setFilter('${k}',this.value)"><option value="">${t('All','הכול')} · ${optionCount(k,'')}</option>${vs.map(v=>`<option value="${v}" ${filters[k]===v?'selected':''}>${label(v,k==='character')} · ${optionCount(k,v)}</option>`).join('')}</select></label>`}
function browse(){let es=filtered();return `<div class="heading"><h1>${t('Browse','עיון')}</h1><button class="text-button" onclick="filters={series:'',type:'',theme:'',character:'',language:'',time:''};q='';render()">${t('Clear filters','ניקוי מסננים')}</button></div>${faceRow()}<section class="filterbox"><div class="filter-grid">${filterSelect('series',['classic','modern','shalom-modern','elmo'],t('Series','סדרה'))}${filterSelect('type',['full','short','talk','clip'],t('Program type','סוג תכנית'))}${filterSelect('language',['he','en'],t('Spoken language','שפת הסרטון'))}${filterSelect('theme',['music','songs','sports','emotions','israel','health','hanukkah','food'],t('Theme','נושא'))}${filterSelect('character',['kippi','ofnik','elmo','grover','bert'],t('Character','דמות'))}</div><div class="times">${[['',t('Any length','כל אורך')],['300',t('Under 5 min','פחות מ־5 דק׳')],['600',t('Under 10 min','פחות מ־10 דק׳')]].map(([v,l])=>`<button class="${filters.time===v?'active':''}" aria-pressed="${filters.time===v}" onclick="setFilter('time','${v}')">${l} · ${optionCount('time',v)}</button>`).join('')}</div></section><div class="toolbar"><span class="results" role="status">${es.length} ${t('entries · longest first','רשומות · הארוכים תחילה')}${q?' · '+esc(q):''}</span>${layouts()}</div>${es.length?`<div class="grid ${layout==='numbers'?'numbers':layout==='list'?'list':''}">${es.map(card).join('')}</div>`:`<div class="empty"><h2>${t('Nothing here.','אין כאן כלום.')}</h2>${Object.keys(filters).filter(k=>filters[k]&&optionCount(k,'')>0).map(k=>`<button onclick="setFilter('${k}','')">${t('Remove','הסרת')} ${label(filters[k],k==='character')} · ${optionCount(k,'')}</button>`).join('')}</div>`}${footer()}`}
function copyRow(u,e){return `<div class="copy-row"><div class="${u.role==='part'?'part-copy':''}">${u.part?`<span class="partno">${u.part}</span>`:''}<div><h3>${role(u)} · ${host(u.r)} · <bdi dir="ltr">${dur(u.r)}</bdi></h3><p class="${u.r.access==='licensed'?'licensed':''}">${access(u.r)}</p><p>${evidence(u.r)}</p>${!available(u)?`<p>${t('Unavailable in recorded check. No viewing link.','לא זמין בבדיקה המתועדת. אין קישור לצפייה.')}</p>`:''}</div></div>${available(u)?ticket(u.r,e):''}</div>`}
function episode(){let e=find(selected)||E[0],r=rep(e),b=best(e),us=uploads(e),parts=us.filter(u=>u.role==='part').sort((a,b)=>(a.part||0)-(b.part||0)),copies=us.filter(u=>['whole-candidate','alternate-edition'].includes(u.role)),possible=us.filter(u=>u.role==='possible');return `<button class="text-button" onclick="go('home')">${t('← Her shelf','המדף שלה →')}</button><div class="episode-top">${picture(r,e.number,false,!!b)}<div><div class="section-tag">${esc(label(e.production))} · ${label(kind(e))}</div>${e.number!=null?`<span class="plaque">${e.number}</span>`:''}<h1>${bi(title(e))}</h1><p class="secondary">${bi(secondary(e))}</p><p class="coverage ${e.coverage}">${coverage(e)}</p>${b?ticket(b,e):parts.length?`<button class="ticket" onclick="document.getElementById('parts').scrollIntoView({block:'start'})">${t('See parts ↓','לרשימת החלקים ↓')}</button>`:''}${b?`<p class="small ${b.access==='licensed'?'licensed':'muted'}">${access(b)}</p><p class="small muted" style="margin-top:8px">${evidence(b)}</p>`:''}<div class="personal"><button aria-pressed="${personal.stars.includes(e.id)}" onclick="star('${e.id}')">${personal.stars.includes(e.id)?'★':'☆'} ${t('Favourite','מועדף')}</button><button aria-pressed="${personal.watched.includes(e.id)}" onclick="watched('${e.id}')">✓ ${t('Watched','צפיתי')}</button><button onclick="queue('${e.id}')">+ ${t('This sitting','הישיבה הזאת')}</button></div>${personal.opens[e.id]?`<div class="stamp-row"><span class="stamp">↻ ${t('Opened','נפתח')} ${personal.opens[e.id]} ${t('times','פעמים')}</span></div>`:''}</div></div>${copies.length?`<hr class="shelf-divider"><h2>${t('Copies','עותקים')} · ${copies.filter(available).length}</h2>${copies.map(u=>copyRow(u,e)).join('')}`:''}${parts.length?`<section id="parts"><hr class="shelf-divider"><h2>${t('Parts','חלקים')} · ${parts.length}</h2>${parts.map(u=>copyRow(u,e)).join('')}</section>`:''}${e.clip?'':`<details class="source-notes"><summary>${t('Source notes','הערות מקור')}</summary><p><strong>${t('Catalogue title','כותרת קטלוג')}</strong><br>${bi(e.titleHe||e.titleEn)}</p>${e.storyHe?`<p>${t('Story title source','מקור שם הסיפור')}: ${esc(lang==='he'?e.storySourceHe||e.storySourceEn:e.storySourceEn)}</p>`:''}${e.titleHeEditorial?`<p>${t('Editorial Hebrew title · our translation','כותרת עברית בעריכתנו · תרגום שלנו')}<br>${bi(e.titleHeEditorial)}</p>`:''}<p>${t('English title','כותרת באנגלית')}: ${e.production.startsWith('shalom')?t('Published','מקורית'):t('Editorial','בעריכתנו')}</p><p>${t('Stable episode ID','מזהה פרק קבוע')}: ${esc(e.id)}</p>${possible.length?`<p><strong>${possible.length} ${t('possible copies · unresolved, not counted','עותקים אפשריים · טרם זוהו ואינם נספרים')}</strong></p>${possible.map(u=>`<p>${bi(u.r.titleHe||u.r.titleEn)} · ${host(u.r)} · <bdi dir="ltr">${dur(u.r)}</bdi></p>`).join('')}`:''}${us.filter(u=>u.role==='excerpt').length?`<p>${us.filter(u=>u.role==='excerpt').length} ${t('excerpts attached. These do not establish a whole copy.','קטעים מקושרים. אינם מעידים על עותק מלא.')}</p>`:''}${(e.sources||[]).filter(s=>s.url).slice(0,2).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${t('Catalogue / source','קטלוג / מקור')} ↗</a>`).join('')}</details>`}${queueView()}${footer()}`}
function backup(){return `<div class="heading"><h1>${t('Backup','גיבוי')}</h1></div><p>${t('Favourites, Watched marks, opening counts, recently opened, saved links and this sitting. Appearance and language are excluded.','מועדפים, סימוני צפיתי, מספרי פתיחות, נפתחו לאחרונה, קישורים שמורים והישיבה הזאת. המראה ושפת הממשק אינם נכללים.')}</p><div class="backup"><button onclick="exportBackup()">${t('Export personal data','ייצוא נתונים אישיים')}</button><label>${t('Import backup','ייבוא גיבוי')}<input type="file" accept="application/json" onchange="importBackup(this.files[0])"></label></div>${footer()}`}
function exportBackup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'sumsum-album-personal-v1',personal},null,2)],{type:'application/json'}));a.download='sumsum-album-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function importBackup(file){if(!file)return;try{let d=JSON.parse(await file.text()),p=d.personal;if(d.format!=='sumsum-album-personal-v1'||!p||!['stars','recent','watched','queue'].every(k=>Array.isArray(p[k])&&p[k].every(x=>typeof x==='string'))||typeof p.opens!=='object'||!p.opens||!Object.values(p.opens).every(n=>Number.isFinite(n)&&n>=0))throw Error();personal={...structuredClone(seed),...p};save();render();notify(t('Backup imported','הגיבוי יובא'))}catch(e){notify(t('Could not read this backup','לא ניתן לקרוא את הגיבוי הזה'))}}
function notes(){let es=E.filter(e=>e.coverage==='missing');return `<div class="heading"><h1>${t('Not found','לא נמצא')}</h1></div>${es.map(e=>`<div class="copy-row"><div><h3>${e.number} · ${bi(title(e))}</h3><p>${label(e.production)}</p><p>${uploads(e).filter(u=>u.role==='possible').length} ${t('possible copies, not counted','עותקים אפשריים, אינם נספרים')}</p></div><button onclick="go('episode','${e.id}')">${t('Source notes','הערות מקור')}</button></div>`).join('')}${footer()}`}
function render(){apply();document.getElementById('palette-button').setAttribute('aria-label',t('Palette','לוח צבעים'));document.getElementById('palette-panel').innerHTML=[['terracotta','Terracotta','טרקוטה'],['stone','Stone','אבן'],['sea','Sea','ים'],['sage','Sage','מרווה'],['kippi','Kippi','קיפי'],['bauhaus','Bauhaus','באוהאוס']].map(([v,en,he])=>`<button class="tp-sw-${v}" aria-pressed="${palette===v}" onclick="setPalette('${v}')">${t(en,he)}</button>`).join('');document.title=t('Her shelf · Sumsum','המדף שלה · סומסום');let search=document.getElementById('search');search.placeholder=t('Search titles or numbers','חיפוש כותרת או מספר');search.setAttribute('aria-label',search.placeholder);search.value=q;document.getElementById('appearance').innerHTML=[['system',t('◐ System','◐ מערכת')],['light',t('☀ Light','☀ בהיר')],['dark',t('☾ Dark','☾ כהה')]].map(([v,l])=>`<option value="${v}" ${appearance===v?'selected':''}>${l}</option>`).join('');document.getElementById('appearance').setAttribute('aria-label',t('Appearance · Terracotta','מראה · טרקוטה'));['en','he'].forEach(l=>{document.getElementById(l).setAttribute('aria-checked',lang===l);document.getElementById(l).tabIndex=lang===l?0:-1});document.getElementById('nav').innerHTML=[['home',t('Her shelf','המדף שלה')],['guide',t('Episode guide','מדריך פרקים')],['browse',t('Browse','עיון')]].map(([s,n])=>`<button class="${screen===s||s==='home'&&screen==='favourites'?'current':''}" ${screen===s?'aria-current="page"':''} onclick="${s==='browse'?'openBrowse()':`go('${s}')`}">${n}</button>`).join('');document.getElementById('rail').innerHTML=`<p class="rail-label">${t('Your album','האלבום שלך')}</p><button class="${screen==='home'?'active':''}" onclick="go('home')">↻ ${t('Recently opened','נפתחו לאחרונה')}<small>${personal.recent.length} ${t('entries','רשומות')}</small></button><button class="${screen==='favourites'?'active':''}" onclick="go('favourites')">☆ ${t('Favourites','מועדפים')}<small>${personal.stars.length} ${t('entries','רשומות')}</small></button><hr><p class="rail-label">${t('Productions','הפקות')}</p>${P.map(p=>`<button class="${screen==='guide'&&p.id===production?'active':''}" onclick="setProduction('${p.id}')">${esc(label(p.id))}<small><bdi dir="ltr">${p.years}</bdi></small></button>`).join('')}<hr><button class="backup-link" onclick="go('backup')">${t('About & backup','מידע וגיבוי')}</button>`;document.getElementById('main').innerHTML=screen==='home'||screen==='favourites'?home():screen==='guide'?guide():screen==='browse'?browse():screen==='episode'?episode():screen==='notes'?notes():backup()}
document.querySelector('.lang').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();setLang(lang==='en'?'he':'en');document.getElementById(lang).focus()}});route();
</script></body></html>
