<!doctype html>
<html lang="en" dir="ltr" data-palette="terracotta" data-appearance="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#803414">
<title>Sumsum</title>
<style>
:root{color-scheme:light;
 --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
 --serif:"New York","Iowan Old Style",Charter,Georgia,"Arial Hebrew","Noto Sans Hebrew",serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --round:"Arial Rounded MT Bold",ui-rounded,"Arial Hebrew","Noto Sans Hebrew",var(--font);
 --whole:#1b7a4b;--parts:#a86400;--excerpt:#5f4fb3;--missing:#b3392c;--unknown:#7e8a83;--whole-ink:#fff;
 --whole-bg:#e2f1e7;--parts-bg:#faefd9;--excerpt-bg:#ece9fa;--missing-bg:#fbe8e4;--unknown-bg:#eef0ea;
 --acc-ok:#1f5fa8;--acc-public:#5c6b75;--acc-vpn:#8f3f71;--acc-lic:#1d6a6a;--acc-bad:#3d3d3d;
 --star:#f5cf45;--star-ink:#a77300;--scrim:#000000a0;--scrim-ink:#fff;--host-bg:#fffffff2;--host-ink:#18291f;
 --shadow-badge:0 1px 3px #0003;--shadow-toast:0 6px 30px #0004;--img-dim:1}
:root[data-scheme=dark]{color-scheme:dark;
 --whole:#5cc790;--parts:#e9a640;--excerpt:#ab9ef2;--missing:#f2826f;--unknown:#84928a;--whole-ink:#05231a;
 --whole-bg:#173827;--parts-bg:#3a2c12;--excerpt-bg:#29244a;--missing-bg:#40201b;--unknown-bg:#1c2823;
 --acc-ok:#8cc3ff;--acc-public:#a9b6bf;--acc-vpn:#e59ac6;--acc-lic:#7fd1cc;--acc-bad:#cfcfcf;
 --scrim:#000000b8;--host-bg:#1e1511f0;--host-ink:#f1e9e3;--img-dim:.86}
:root,.tp-sw-terracotta{
 --bg:#f9f2eb;--surface:#fffcf8;--surface-2:#f3e9e0;--surface-3:#eaddd1;
 --ink:#301f18;--muted:#6a5449;--line:#e3d7cc;--line-strong:#c2ac9b;
 --brand:#803414;--primary:#00445f;--primary-ink:#fff;--primary-hover:#00364c;
 --accent:#dfbd7c;--focus:#1e3a71;--link:#164878;--chip:#e4dad3;--chip-ink:#4b382f;
 --art-veil:#fffcf8cc;--shadow:0 1px 2px #3a1a100f,0 6px 18px #3a1a100d;
 --mast-ink:#fff;--mast-ink-soft:#fdf7f3;--mast-hover:#ffffff18;--mast-chip:#ffffff26;
 --mast-current:#fff;--mast-current-ink:#803414;--mast-ctl:#ffffff14;--mast-ctl-hover:#ffffff26;--mast-ctl-line:#ffffff80;
 --mast-focus:#f3d68f;--mast-divider:#ffffff59;--mast-current-divider:#80341499}
:root[data-scheme=dark],[data-scheme=dark] .tp-sw-terracotta{
 --bg:#140e0b;--surface:#1e1511;--surface-2:#281c17;--surface-3:#33251f;
 --ink:#f1e9e3;--muted:#c1ad9f;--line:#382a25;--line-strong:#56433a;
 --brand:#58230c;--primary:#2f7990;--primary-ink:#fff;--primary-hover:#256a80;
 --accent:#e0d2b4;--focus:#c1e3fc;--link:#b3d6ff;--chip:#463e39;--chip-ink:#e6dbd3;
 --art-veil:#1e1511cc;--shadow:0 1px 2px #0006}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:transparent;border:0;padding:0}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.mast :focus-visible{outline-color:var(--mast-focus)}
img{display:block}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
bdi.he,.he{font-family:var(--font)}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}

/* masthead and awning */
.mast{background:var(--brand);color:var(--mast-ink)}
.mast .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
.word{font:700 25px/1 var(--serif);color:var(--mast-ink);text-decoration:none;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.word small{font:500 14px var(--font);color:var(--mast-ink-soft);opacity:.9}
.nav{display:flex;gap:2px}
.nav a{color:var(--mast-ink);text-decoration:none;padding:10px 13px;border-radius:999px;font-weight:600;min-height:44px;display:flex;align-items:center}
.nav a:hover{background:var(--mast-hover)}
.nav a[aria-current=page]{background:var(--mast-current);color:var(--mast-current-ink)}
.search{flex:1;min-width:120px;position:relative}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);padding:0 16px 0 40px}
[dir=rtl] .search input{padding:0 40px 0 16px}
.search input::placeholder{color:var(--mast-ink-soft);opacity:.85}
.search svg{position:absolute;inset-inline-start:14px;top:13px;width:18px;height:18px;stroke:var(--mast-ink);fill:none;stroke-width:2}
.mbtn{height:44px;min-width:44px;border-radius:999px;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-weight:600;white-space:nowrap}
.mbtn:hover{background:var(--mast-ctl-hover)}
.mbtn .n{font-family:var(--mono);background:var(--mast-chip);border-radius:999px;padding:0 7px;font-size:13px}
.langsw{display:inline-flex;border:1px solid var(--mast-ctl-line);border-radius:999px;overflow:hidden;height:44px;perspective:300px}
.langsw label{display:flex;align-items:center;padding:0 12px;cursor:pointer;font-weight:700;color:var(--mast-ink);transition:transform .3s}
.langsw input{position:absolute;opacity:0;pointer-events:none}
.langsw input:checked+label{background:var(--mast-current);color:var(--mast-current-ink)}
.langsw input:focus-visible+label{outline:3px solid var(--mast-focus);outline-offset:-3px}
.awning{height:16px;background:radial-gradient(circle at 50% 0,var(--brand) 10.5px,transparent 11.5px) 0 0/24px 14px repeat-x,linear-gradient(var(--accent),var(--accent)) 0 0/100% 5px no-repeat}
.themebox{position:relative}
.pop{position:absolute;inset-inline-end:0;top:52px;z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-toast);padding:14px;min-width:220px}
.pop h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pop label{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer}
.sw{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--brand) 50%,var(--accent) 50%);border:2px solid var(--line-strong)}

/* die */
.die{width:26px;height:26px;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.die b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--brand);border:1.5px solid var(--line-strong);border-radius:6px;font:700 15px/1 var(--round);backface-visibility:hidden}
.die b:nth-child(1){transform:translateZ(13px)}.die b:nth-child(2){transform:rotateY(90deg) translateZ(13px)}
.die b:nth-child(3){transform:rotateY(180deg) translateZ(13px)}.die b:nth-child(4){transform:rotateY(-90deg) translateZ(13px)}
.die b:nth-child(5){transform:rotateX(90deg) translateZ(13px)}.die b:nth-child(6){transform:rotateX(-90deg) translateZ(13px)}
.diewrap{perspective:200px;display:inline-flex}
[data-scheme=dark] .die b{color:var(--accent)}

/* layout bits */
main{min-height:60vh;padding-bottom:30px}
h1,h2,h3{margin:0}
.sec{margin-top:34px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sechead h2{font:700 22px/1.2 var(--serif)}
.sechead .count{font-family:var(--mono);color:var(--muted);font-size:13px}
.sechead .sp{flex:1}
.lnk{color:var(--link);font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.lnk:hover{text-decoration:underline}
.ibtn{min-width:44px;height:44px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:600}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{min-height:44px;border-radius:12px;background:var(--primary);color:var(--primary-ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;border:0}
.btn:hover{background:var(--primary-hover)}
.btn.sec2{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn.sec2:hover{background:var(--surface-2)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* session strip: spoken language + length */
.strip{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:18px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-badge)}
.seglab{font-size:13px;color:var(--muted);font-weight:600;margin-inline-end:6px}
.mini-dial{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);position:relative;flex:none;background:var(--surface)}
.mini-dial i{position:absolute;left:50%;top:50%;width:2px;height:8px;background:var(--primary);transform-origin:50% 0;transform:translate(-50%,0) rotate(var(--a,180deg));transition:transform .3s}

/* cards */
.ttl{font:700 17px/1.25 var(--serif);margin:0}
.ttl a{color:inherit;text-decoration:none}
.ttl a:hover{text-decoration:underline}
.alt{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface-3)}
.thumb img{width:100%;height:100%;object-fit:cover;filter:brightness(var(--img-dim))}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--surface-3) 10px 20px);color:var(--muted)}
.ph b{font:700 34px/1 var(--mono);color:var(--ink);opacity:.6}
.ph span{font-size:12px}
.dur{position:absolute;inset-inline-end:8px;bottom:8px;background:var(--scrim);color:var(--scrim-ink);font:600 12px/1 var(--mono);padding:4px 6px;border-radius:6px}
.plaque{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 var(--mono);background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong);border-radius:6px;padding:5px 12px;position:relative;white-space:nowrap}
.plaque::before,.plaque::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--line-strong);position:absolute;top:50%;margin-top:-2px}
.plaque::before{inset-inline-start:4px}.plaque::after{inset-inline-end:4px}
.thumb .plaque{position:absolute;inset-inline-start:8px;top:8px;box-shadow:var(--shadow-badge)}
.stk{position:absolute;inset-inline-end:6px;top:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.stk span{width:30px;height:30px;border-radius:50%;background:var(--art-veil);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.stk svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2}
.stk[aria-pressed=true] span{background:transparent;transform:rotate(var(--tilt,-8deg))}
.stk[aria-pressed=true] svg{width:30px;height:30px;fill:var(--star);stroke:var(--surface);stroke-width:2.2;filter:drop-shadow(0 1px 1px #0005)}
.stk.pressed span{animation:press .12s}
@keyframes press{from{transform:scale(1.25)}to{transform:scale(1) rotate(var(--tilt,-8deg))}}
.cov{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.cov::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.cov-whole-candidate{background:var(--whole-bg);color:var(--whole)}
.cov-parts-only{background:var(--parts-bg);color:var(--parts)}
.cov-excerpt-only{background:var(--excerpt-bg);color:var(--excerpt)}
.cov-missing{background:var(--missing-bg);color:var(--missing)}
.cov-none{background:var(--unknown-bg);color:var(--unknown)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:2px 9px;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative}
.card .body{padding:0 4px;flex:1}
.card .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 4px 4px}
.wbtn{min-height:44px;border-radius:10px;background:var(--primary);color:var(--primary-ink);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:0 11px;font-size:14px}
.wbtn:hover{background:var(--primary-hover)}
.wbtn svg,.tk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.wbtn.quiet{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.wbtn.quiet:hover{background:var(--surface-2)}
.plus{width:44px;height:44px;border-radius:10px;border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;background:var(--surface)}
.plus[aria-pressed=true]{background:var(--chip);border-color:var(--chip)}
.plus svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.drawerbtn{min-height:44px;font-weight:600;color:var(--link);padding:0 6px;display:inline-flex;align-items:center;gap:5px}
.drawerbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .2s}
.drawerbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.drawer{border-top:1px dashed var(--line-strong);margin:0 4px;padding-top:6px;animation:drop .18s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.crow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow .r{flex:1;min-width:0}
.crow .r b{font-weight:700}
.crow a.o{min-height:40px;display:inline-flex;align-items:center;padding:0 10px;border-radius:8px;border:1px solid var(--line-strong);text-decoration:none;color:var(--ink);font-weight:600;white-space:nowrap}
.crow a.o:hover{background:var(--surface-2)}
.note{font-size:12px;color:var(--muted)}

/* shelves */
.shelf{position:relative}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 10px 18px;scrollbar-width:thin}
.row>*{scroll-snap-align:start}
.row .card{box-shadow:none}
.ledge{height:12px;margin-top:-10px;border-radius:3px;background:linear-gradient(var(--surface-3),var(--surface-3)) 0 0/100% 8px no-repeat;border-top:2px solid var(--line-strong);box-shadow:0 6px 10px -6px #3a1a1033}
.shelf-r{grid-auto-columns:calc((100% - 48px)/4)}
.shuffle.deal .card{animation:deal .35s ease both}
@keyframes deal{0%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-2deg)}100%{transform:none}}

/* home top */
.top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-top:20px;align-items:start}
.upnext{--tk-bg:var(--surface);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;box-shadow:var(--shadow)}
.upnext .thumb{border-radius:14px}
.upnext .ttl{font-size:30px;line-height:1.1}
.upnext .alt{font-size:18px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.story{font-size:14px;color:var(--ink);margin:10px 0 0;line-height:1.55;max-height:6.2em;overflow:hidden}
.src{font-size:12px;color:var(--muted);margin-top:4px}
.tk{display:inline-flex;align-items:stretch;min-height:56px;border-radius:12px;text-decoration:none;color:var(--primary-ink);font-weight:700;font-size:16px;position:relative;filter:drop-shadow(0 2px 3px #0002)}
.tk .m{background:var(--primary);display:flex;align-items:center;gap:9px;padding:0 18px;border-start-start-radius:12px;border-end-start-radius:12px}
.tk .s{background:var(--primary);display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-start-end-radius:12px;border-end-end-radius:12px;font:700 14px/1.15 var(--mono);border-inline-start:2px dashed var(--primary-ink);position:relative;text-align:center}
.tk .s small{font:600 10px/1.2 var(--font);opacity:.85}
.tk .s::before,.tk .s::after{content:"";position:absolute;inset-inline-start:-7px;width:12px;height:12px;border-radius:50%;background:var(--tk-bg,var(--bg))}
.tk .s::before{top:-6px}.tk .s::after{bottom:-6px}
.tk:hover .m,.tk:hover .s{background:var(--primary-hover)}
.tkline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.acc{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acc i{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--acc-public)}
.acc i.ok{background:var(--acc-ok)}.acc i.vpn{background:var(--acc-vpn);border-radius:50%}.acc i.lic{background:var(--acc-lic);transform:rotate(45deg)}.acc i.bad{background:var(--acc-bad)}
.side{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.panel h2{font:700 18px/1.2 var(--serif);display:flex;gap:8px;align-items:baseline}
.panel h2 .count{font:500 13px var(--mono);color:var(--muted)}
.sit{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sit li{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center}
.sit .thumb{border-radius:8px}
.sit .t{font-size:14px;font-weight:600;line-height:1.25}
.sit .ctl{display:flex}
.sit .ctl button{width:36px;height:44px;border-radius:8px;color:var(--muted)}
.sit .ctl button:hover{background:var(--surface-2);color:var(--ink)}
.sit .ctl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.sitfoot{display:flex;gap:8px;margin-top:12px;align-items:center}
.voice{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:14px;padding:8px 0}
.recent{list-style:none;margin:8px 0 0;padding:0}
.recent li a{display:flex;gap:10px;align-items:center;min-height:48px;text-decoration:none;color:var(--ink);border-radius:10px;padding:3px}
.recent li a:hover{background:var(--surface-2)}
.recent .thumb{width:64px;flex:none;border-radius:7px}
.recent .x{font:600 12px var(--mono);color:var(--muted);margin-inline-start:auto;white-space:nowrap}

/* stoop */
.stoop{position:relative;margin-top:30px}
.stoop .tokens{display:flex;gap:6px;overflow-x:auto;padding:6px 6px 0;scrollbar-width:thin;position:relative;z-index:1}
.step{height:22px;margin-top:-30px;border-radius:6px 6px 3px 3px;background:linear-gradient(var(--surface-3),var(--surface-3)) 0 0/100% 14px no-repeat,linear-gradient(var(--line-strong),var(--line-strong)) 0 14px/100% 8px no-repeat;position:relative}
.step::after{content:"";position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line-strong);opacity:.6}
.tok{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px 34px;border-radius:14px;text-align:center;transition:transform .15s}
.tok:hover .face{transform:rotate(-4deg)}
.face{width:72px;height:72px;border-radius:50%;position:relative;transition:transform .2s;display:flex;align-items:center;justify-content:center}
.face img{width:62px;height:62px;border-radius:50%;object-fit:cover;filter:brightness(var(--img-dim));background:var(--surface-3)}
.face::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-strong)}
.face.quills::before{border:0;box-shadow:none;background:repeating-conic-gradient(var(--accent) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,transparent 31px,#000 32px);mask:radial-gradient(circle,transparent 31px,#000 32px)}
.face.bin{border-radius:14px 14px 18px 18px}
.face.bin::before{border-radius:12px 12px 18px 18px;border:3px solid var(--line-strong);box-shadow:none;background:linear-gradient(var(--line-strong),var(--line-strong)) 50% 22%/100% 2px no-repeat}
.face.bin img{border-radius:10px 10px 16px 16px;width:58px;height:54px;margin-top:6px}
.face.bin::after{content:"";position:absolute;top:-7px;left:6px;right:6px;height:8px;border-radius:6px 6px 2px 2px;background:var(--line-strong);transform:rotate(-8deg);transform-origin:0 100%;transition:transform .3s}
.tok:hover .face.bin::after{transform:rotate(-22deg)}
.tok .nm{font-weight:700;font-size:13px;line-height:1.15}
.tok .nm2{font-size:12px;color:var(--muted);line-height:1.1}
.tok .c{font:600 11px var(--mono);background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:1px 7px}
.tok[aria-pressed=true]{transform:translateY(-6px)}
.tok[aria-pressed=true] .face::before{box-shadow:0 0 0 3px var(--primary)}
.tok[aria-pressed=true] .face.quills{box-shadow:0 0 0 3px var(--primary);border-radius:50%}
.tok[aria-pressed=true] .c{background:var(--primary);color:var(--primary-ink)}
.tok.zero{opacity:.45}

/* building directory */
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.door{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--surface-2);border:2px solid var(--line-strong);border-radius:80px 80px 8px 8px;padding:12px 12px 10px;min-height:200px;position:relative}
.door:hover{background:var(--surface-3)}
.door .win{aspect-ratio:1/1;border-radius:60px 60px 6px 6px;overflow:hidden;border:2px solid var(--line-strong);background:var(--surface-3)}
.door .win img{width:100%;height:100%;object-fit:cover;filter:brightness(var(--img-dim))}
.door .nm{font:700 14px/1.2 var(--serif);margin-top:9px}
.door .y{font:600 12px var(--mono);color:var(--muted);margin-top:2px}
.door .knob{position:absolute;inset-inline-end:14px;bottom:56px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:1px solid var(--line-strong)}
.door .plaque{align-self:flex-start;margin-top:8px;font-size:12px}

/* footer / sidewalk */
footer{margin-top:44px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 78px,var(--line) 78px 80px);border-top:4px solid var(--line-strong);padding:18px 0 22px}
footer .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
footer a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
footer a:hover{background:var(--surface-3)}
.binico{width:18px;height:20px;position:relative;display:inline-block}
.binico::before{content:"";position:absolute;bottom:0;left:2px;right:2px;height:14px;border:2px solid var(--muted);border-top:0;border-radius:0 0 4px 4px;background:linear-gradient(90deg,transparent 4px,var(--muted) 4px 5.5px,transparent 5.5px) }
.binico::after{content:"";position:absolute;top:1px;left:0;right:0;height:4px;border-radius:3px 3px 1px 1px;background:var(--muted);transform:rotate(-12deg)}
footer .sp{flex:1}

/* browse */
.bgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.facets{display:flex;flex-direction:column;gap:20px}
.fg h3{font:700 13px/1 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.fg .opts{display:flex;flex-wrap:wrap;gap:6px}
.key{min-height:40px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line-strong);border-bottom-width:3px;font-size:14px;font-weight:600;transition:transform .08s}
.key:active{transform:translateY(2px);border-bottom-width:1px}
.key .c{font:500 12px var(--mono);color:var(--muted)}
.key[aria-pressed=true]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);border-bottom-width:1px;transform:translateY(2px)}
.key[aria-pressed=true] .c{color:var(--primary-ink)}
.key.zero{opacity:.5}
.more{color:var(--link);font-weight:600;min-height:40px;padding:0 6px}
.timer{display:flex;gap:16px;align-items:center}
.dial{width:132px;height:132px;border-radius:50%;position:relative;flex:none;background:radial-gradient(circle,var(--surface) 0 44px,transparent 45px),repeating-conic-gradient(from -2deg,var(--line-strong) 0 4deg,transparent 4deg 30deg),var(--surface-2);border:2px solid var(--line-strong)}
.dial .hand{position:absolute;left:50%;top:50%;width:4px;height:40px;margin-left:-2px;border-radius:2px;background:var(--primary);transform-origin:50% 0;transform:rotate(var(--a,180deg));transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.dial .hub{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--brand)}
.dial button{position:absolute;width:40px;height:40px;margin:-20px;border-radius:50%;font:700 12px var(--mono);color:var(--muted)}
.dial button[aria-checked=true]{background:var(--primary);color:var(--primary-ink)}
.dial button:hover{background:var(--surface-3)}
.dial button[aria-checked=true]:hover{background:var(--primary-hover)}
.timer .read{font-size:13px;color:var(--muted)}
.timer .read b{display:block;color:var(--ink);font:700 18px/1.2 var(--serif)}
.resbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.resbar .n{font:700 20px/1.2 var(--serif)}
.resbar .sp{flex:1}
.pegs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:8px 10px;border-radius:10px;background:linear-gradient(var(--line-strong),var(--line-strong)) 0 15px/100% 2px no-repeat}
.peg{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:2px 4px 2px 10px;font-size:13px;font-weight:600;position:relative;min-height:36px}
.peg::before{content:"";position:absolute;top:-6px;inset-inline-start:12px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.peg button{width:32px;height:32px;border-radius:6px;color:var(--muted)}
.peg button:hover{background:var(--surface-2);color:var(--ink)}
select.sort{min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px}
.dieb{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 16px 0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);font-weight:700}
[dir=rtl] .dieb{padding:0 10px 0 16px}
.dieb:hover{background:var(--surface-2)}
.dieb .c{font:500 13px var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-items:start}
.empty{text-align:center;padding:40px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.bigbin{width:70px;height:78px;position:relative}
.bigbin::before{content:"";position:absolute;bottom:0;left:6px;right:6px;height:58px;border-radius:4px 4px 12px 12px;background:repeating-linear-gradient(90deg,var(--surface-3) 0 10px,var(--line-strong) 10px 12px);border:2px solid var(--line-strong)}
.bigbin::after{content:"";position:absolute;top:6px;left:0;right:0;height:10px;border-radius:6px 6px 2px 2px;background:var(--line-strong);transform:rotate(-14deg);transform-origin:0 100%;animation:lid .5s ease-out}
.bigbin i{position:absolute;top:16px;left:26px;width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:12px 0 var(--ink);z-index:1}
@keyframes lid{from{transform:rotate(0)}}
.empty .say{font:700 20px/1.2 var(--serif)}
.relax{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* guide */
.ggrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.dir{background:var(--surface-2);border:2px solid var(--line-strong);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
.dir h2{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 6px}
.bz{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;align-items:center}
.bz:hover{border-color:var(--line-strong)}
.bz b{font-size:14px;line-height:1.2}
.bz span{font:500 12px var(--mono);color:var(--muted);grid-column:1}
.bz i{grid-row:1/3;grid-column:2;width:14px;height:14px;border-radius:50%;background:var(--surface-3);border:2px solid var(--line-strong)}
.bz[aria-current=page]{background:var(--brand);color:var(--mast-ink);border-color:var(--brand)}
.bz[aria-current=page] span{color:var(--mast-ink-soft)}
.bz[aria-current=page] i{background:var(--accent)}
.sign{display:inline-flex;flex-direction:column;background:var(--brand);color:var(--mast-ink);border-radius:10px;padding:10px 18px;border:3px solid var(--mast-ink);box-shadow:0 0 0 2px var(--brand),var(--shadow)}
.sign .a{font:700 24px/1.2 var(--serif)}
.sign .b{font-size:15px;opacity:.92}
.signrow{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.yrs{font:700 13px var(--mono);background:var(--surface);border:2px solid var(--line-strong);border-radius:6px;padding:4px 10px}
.gsum{margin:12px 0 0;color:var(--muted)}
.views{display:flex;gap:10px;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
.views .seg button{min-height:42px;padding:0 16px}
.season{margin-top:22px}
.season h3{font:700 16px/1.3 var(--serif);margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.season h3 .count{font:500 12px var(--mono);color:var(--muted)}
.film{background:linear-gradient(var(--surface-3),var(--surface-3)) 0 0/100% 10px no-repeat,linear-gradient(var(--surface-3),var(--surface-3)) 0 100%/100% 10px no-repeat;padding:0;position:relative}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;align-items:start}
.tile .cv{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.plaques{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.hp{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line-strong);border-radius:8px;overflow:hidden;min-height:62px;position:relative}
.hp:hover{border-color:var(--ink)}
.hp b{font:700 20px/1 var(--mono);text-align:center;padding:9px 0 6px;position:relative}
.hp b::before,.hp b::after{content:"";position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
.hp b::before{left:6px}.hp b::after{right:6px}
.hp span{font-size:10.5px;font-weight:700;text-align:center;padding:3px 2px;line-height:1.15}
.hp .t{position:absolute;inset:auto 0 100%;}
.hp.cv-whole-candidate span{background:var(--whole-bg);color:var(--whole)}
.hp.cv-parts-only span{background:var(--parts-bg);color:var(--parts)}
.hp.cv-excerpt-only span{background:var(--excerpt-bg);color:var(--excerpt)}
.hp.cv-missing span{background:var(--missing-bg);color:var(--missing)}
.hp.cv-gap{border-style:dashed;color:var(--muted)}
.hp.cv-gap span{background:var(--unknown-bg);color:var(--unknown)}
.ltable{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:64px minmax(0,1fr) 190px 130px auto;gap:14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.lrow .t a{font:700 15px/1.25 var(--serif);color:var(--ink);text-decoration:none}
.lrow .t a:hover{text-decoration:underline}
.ruler{height:10px;border-radius:3px;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--u) - 1px),var(--line-strong) calc(var(--u) - 1px) var(--u)),var(--chip);position:relative}
.rl{font:600 12px var(--mono);color:var(--muted);margin-top:3px}
.legend{margin-top:16px;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* episode page */
.crumb{margin-top:18px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.ep{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:30px;margin-top:12px;align-items:start}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.hero .thumb{border-radius:16px}
.hero h1{font:700 34px/1.1 var(--serif);margin-top:10px}
.hero .alt{font-size:19px}
.marks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mk{min-height:44px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;gap:7px;padding:0 14px;font-weight:600;font-size:14px}
.mk:hover{background:var(--surface-2)}
.mk svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.mk[aria-pressed=true]{background:var(--chip);border-color:var(--chip)}
.mk.star[aria-pressed=true] svg{fill:var(--star);stroke:var(--star-ink)}
.train{list-style:none;margin:14px 0 0;padding:6px 0 12px;display:flex;align-items:flex-end;gap:0;overflow-x:auto;background:linear-gradient(var(--line-strong),var(--line-strong)) 0 calc(100% - 9px)/100% 3px no-repeat}
.train li{display:flex;align-items:flex-end}
.train li+li::before{content:"";width:14px;height:4px;background:var(--line-strong);margin-bottom:24px}
.eng{background:var(--brand);color:var(--mast-ink);border-radius:18px 8px 6px 6px;padding:10px 14px 12px;min-width:118px;position:relative;margin-bottom:8px}
[dir=rtl] .eng{border-radius:8px 18px 6px 6px}
.eng b{display:block;font:700 15px/1.2 var(--serif)}
.eng span{font:600 12px var(--mono);opacity:.9}
.eng::after,.car::after{content:"";position:absolute;bottom:-8px;inset-inline-start:14px;width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:calc(var(--wd,60px)) 0 var(--ink)}
.eng{--wd:76px}
.car{display:flex;flex-direction:column;align-items:center;justify-content:center;width:112px;min-height:76px;margin-bottom:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line-strong);border-top-width:8px;border-radius:8px;position:relative;padding:4px;--wd:70px}
.car:hover{background:var(--surface-2)}
.car b{font:700 20px/1 var(--mono)}
.car span{font:600 12px var(--mono);color:var(--muted)}
.car em{font-style:normal;font-size:11px;color:var(--muted)}
.car.dead{border-style:dashed;border-top-style:solid;color:var(--muted);background:transparent}
.car.dead em{text-align:center;line-height:1.1}
.car.opened{border-top-color:var(--accent)}
.car.opened::before{content:attr(data-o);position:absolute;top:-21px;font-size:11px;font-weight:700;color:var(--muted)}
.copies h2,.dossier h2{font:700 20px/1.2 var(--serif);margin:28px 0 8px}
.cgroup h3{font:700 13px var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 4px;display:flex;gap:8px}
.cgroup h3 .count{font-family:var(--mono)}
.cp{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cp .thumb{border-radius:8px}
.cp .h{font-weight:700}
.cp .d{font-size:13px;color:var(--muted)}
.cp .stat{font-size:13px;color:var(--muted);max-width:180px;text-align:end}
.cp.dim{opacity:.85}
.dossier{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 18px 18px}
.dossier dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.dossier dt{color:var(--muted);font-weight:600}
.dossier dd{margin:0}
.ladder{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.ladder li{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line-strong);color:var(--muted)}
.ladder li.now{color:var(--ink);font-weight:700}
.ladder li .now{margin-inline-start:auto;font:700 11px var(--mono);background:var(--ink);color:var(--surface);border-radius:4px;padding:2px 6px}
.dossier .srcs{font-size:13px;padding-inline-start:18px;margin:6px 0 0}
.dossier .srcs li{margin:4px 0}
blockquote.nli{margin:8px 0 0;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:14px;line-height:1.6}

/* starred */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;padding:22px;background:var(--surface-2);border-radius:18px;border:1px solid var(--line)}
.album .card{transform:rotate(var(--r,0deg))}
.sticker{position:absolute;z-index:2;font:700 12px/1 var(--round);background:var(--surface);border:2px solid var(--line-strong);border-radius:999px;padding:6px 9px;box-shadow:var(--shadow-badge);transform:rotate(var(--t,6deg))}
.sticker.w{inset-inline-start:-8px;top:-12px}
.sticker.n{inset-inline-start:96px;top:-12px;font-family:var(--mono)}

/* dialog */
dialog{--tk-bg:var(--surface);border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-toast);max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:var(--scrim)}
.dlg{padding:18px}
.dlg .bubble{background:var(--surface-2);border:2px solid var(--line-strong);border-radius:16px;padding:8px 14px;font:700 16px/1.3 var(--round);display:inline-block;position:relative;margin:0 0 14px}
.dlg .bubble::after{content:"";position:absolute;bottom:-9px;inset-inline-start:22px;width:14px;height:14px;background:var(--surface-2);border-right:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);transform:rotate(45deg)}
.dlg .bubrow{display:flex;gap:12px;align-items:flex-end}
.dlg .bubrow .face{width:56px;height:56px}
.dlg .bubrow .face img{width:48px;height:48px}
.dlg .close{position:absolute;top:10px;inset-inline-end:10px;width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;z-index:3}
.dlg .close svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none}
.dlg h2{font:700 24px/1.15 var(--serif);margin-top:12px}
.dlg .rowb{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.nf h2{font:700 18px/1.2 var(--serif);margin:22px 0 6px}
.nf ul{margin:0;padding:0;list-style:none;font-size:14px}
.nf li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.nf li a{color:var(--ink);font-weight:600}

/* phone */
.bbar{display:none}
@media (max-width:820px){
 .wrap{padding:0 14px}
 .mast .wrap{flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}
 .mast .nav,.mast .mdie{display:none}
 .search{order:5;flex-basis:100%}
 .word{flex:1}
 .word small{display:none}
 #sitbtn .lbl{display:none}
 .sitic{display:inline;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
 .mbtn{padding:0 10px}
 .langsw label{padding:0 10px}
 .bbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line-strong);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 .bbar a,.bbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;border-radius:12px}
 .bbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
 .bbar [aria-current=page]{color:var(--brand);background:var(--surface-2)}
 [data-scheme=dark] .bbar [aria-current=page]{color:var(--accent)}
 .bbar .diewrap{margin-top:-2px}
 body{padding-bottom:76px}
 .top{grid-template-columns:1fr}
 .upnext{grid-template-columns:1fr;padding:10px;gap:12px}
 .upnext .ttl{font-size:24px}
 .tk{width:100%}.tk .m{flex:1}
 .row{grid-auto-columns:78%}
 .bgrid,.ggrid,.ep,.hero{grid-template-columns:1fr}
 .facets{display:none}.facets.open{display:flex}
 .ffold{display:inline-flex!important}
 .grid{grid-template-columns:1fr}
 .dir{position:static;flex-direction:row;overflow-x:auto;background:transparent;border:0;padding:0}
 .dir h2{display:none}
 .bz{flex:none;min-width:150px}
 .plaques{grid-template-columns:repeat(5,minmax(0,1fr))}
 .lrow{grid-template-columns:52px minmax(0,1fr) auto;gap:10px}
 .lrow .rcol,.lrow .ccol{display:none}
 .hero h1{font-size:27px}

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
const closeBtn = () => `<button class="close" data-act="dclose" aria-label="${t('close')}">${ICON.x}</button>`;
let pickHist = [];
function roll(btn) {
 const {parts, q} = parseHash();
 let pool, ch = '';
 if (parts[0] === 'browse') { F = readF(q); pool = filtered(F).filter(eligible); ch = F.ch.length === 1 ? F.ch[0] : ''; }
 else pool = ENTS.filter(x => eligible(x) && passG(x));
 let cand = pool.filter(x => !pickHist.includes(x.key)); if (!cand.length) { pickHist = []; cand = pool; }
 const x = cand[Math.floor(Math.random() * cand.length)];
 spinDice(btn);
 const show = () => {
  if (!x) { dlg.innerHTML = `<div class="dlg">${closeBtn()}${voiceEmpty(t('none'))}</div>`; }
  else {
   pickHist.push(x.key);
   const say = ch ? (S[lang]['say_' + ch] ? t('say_' + ch) : t('say_any')) : '';
   dlg.innerHTML = `<div class="dlg" style="position:relative">${closeBtn()}${ch ? `<div class="bubrow">${faceHTML(ch)}<div class="bubble">${esc(say)}</div></div>` : ''}
   <div class="thumb">${imgTag(entImg(x), x.e?.n)}${x.d ? `<span class="dur" dir="ltr">${dur(x.d)}</span>` : ''}${x.e?.n ? `<span class="plaque">${esc(epNo(x.e))}</span>` : ''}</div>
   <h2>${bdi(entT(x))}</h2>${entAlt(x) ? `<div class="alt">${bdi(entAlt(x))}</div>` : ''}<div class="meta">${metaLine(x)} · ${t('pickedFor', {n: pool.length})}</div>
   <div class="tkline">${ticket(x.best, x.key)}</div>${accLine(x.best)}
   <div class="rowb"><button class="ibtn" data-act="reroll">${dieHTML()}${t('another')}</button>${plusBtn(x.key)}<a class="lnk" href="${entHref(x)}" data-act="dclose-nav">${x.e ? t('epPage') : t('videoPage')} ›</a></div></div>`;
  }
  if (!dlg.open) dlg.showModal();
 };
 const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
 if (reduce || dlg.open) show(); else setTimeout(show, 420);
}
let spins = 0;
function spinDice(btn) {
 spins++; const f = Math.floor(Math.random() * 6);
 const rot = [[0, 0], [0, -90], [0, 180], [0, 90], [-90, 0], [90, 0]][f];
 document.querySelectorAll('.die').forEach(d => { d.style.transform = `rotateX(${rot[0] + spins * 360}deg) rotateY(${rot[1] + spins * 360}deg)`; });
}
function about() {
 dlg.innerHTML = `<div class="dlg" style="position:relative">${closeBtn()}<h2>${t('about')}</h2><p>${t('aboutText')}</p><h3 style="font:700 16px var(--serif);margin-top:16px">${t('backup')}</h3><p class="muted small">${t('backupText')}</p>
 <div class="rowb"><button class="btn" data-act="export">${t('exportB')}</button><button class="btn sec2" data-act="import">${t('importB')}</button></div></div>`;
 dlg.showModal();
}
function sittingDlg() { dlg.innerHTML = `<div class="dlg" style="position:relative">${closeBtn()}${sitPanel()}</div>`; if (!dlg.open) dlg.showModal(); }
function themePop() {
 const pop = $('#thpop'), a = H.dataset.appearance;
 pop.innerHTML = `<h3>${t('themeH')}</h3><label><input type="radio" name="pal" checked> <span class="sw tp-sw-terracotta"></span>${t('terracotta')}</label>
 <h3 style="margin-top:10px">${t('appH')}</h3>${['system', 'light', 'dark'].map(v => `<label><input type="radio" name="app" value="${v}" data-act="app"${a === v ? ' checked' : ''}> ${t(v)}</label>`).join('')}`;
}
function closePop() { const p = $('#thpop'); if (p && !p.hidden) { p.hidden = true; $('#thbtn').setAttribute('aria-expanded', 'false'); } }

/* ---------- events ---------- */
function rerender() { const y = scrollY; render(true); window.scrollTo(0, y); }
document.addEventListener('click', ev => {
 const a = ev.target.closest('[data-open]');
 if (a) {
  const k = a.dataset.key, o = P.opens[k] || {n: 0}; P.opens[k] = {n: o.n + 1, t: Date.now()};
  const r = R.get(a.dataset.open); if (r && r.links.some(l => l.role === 'part')) P.cars[r.i] = 1;
  if (a.dataset.sitnext) P.sit = P.sit.filter(x => x !== k);
  save(); setTimeout(() => { if (dlg.open && dlg.querySelector('.sit')) sittingDlg(); if (!dlg.open) rerender(); else renderChrome(); }, 60);
  return;
 }
 const b = ev.target.closest('[data-act]'); if (!b) { if (!ev.target.closest('.themebox')) closePop(); return; }
 const act = b.dataset.act, k = b.dataset.key;
 if (act === 'star') { if (P.stars[k]) delete P.stars[k]; else P.stars[k] = Date.now(); save(); b.setAttribute('aria-pressed', !!P.stars[k]); if (b.classList.contains('stk')) { b.classList.remove('pressed'); void b.offsetWidth; b.classList.add('pressed'); } if (b.classList.contains('mk')) rerender(); else if (parseHash().parts[0] === 'starred' || !parseHash().parts[0]) setTimeout(rerender, 160); }
 else if (act === 'watched') { if (P.watched[k]) delete P.watched[k]; else P.watched[k] = new Date().toISOString().slice(0, 10); save(); rerender(); }
 else if (act === 'sit-toggle') { P.sit = P.sit.includes(k) ? P.sit.filter(x => x !== k) : [...P.sit, k]; save(); if (dlg.open && !dlg.querySelector('.sit,.voice')) { b.outerHTML = plusBtn(k); renderChrome(); } else rerender(); }
 else if (act === 'sit-rm' || act === 'sit-up' || act === 'sit-down') { const i = +b.dataset.i, s = P.sit; if (act === 'sit-rm') s.splice(i, 1); else { const j = act === 'sit-up' ? i - 1 : i + 1; [s[i], s[j]] = [s[j], s[i]]; } save(); if (dlg.open) sittingDlg(); rerender(); }
 else if (act === 'sit-clear') { P.sit = []; save(); if (dlg.open) sittingDlg(); rerender(); }
 else if (act === 'sitting') sittingDlg();
 else if (act === 'another') { upKey = ''; sessionStorage.removeItem('sumsumA-up'); spinDice(); rerender(); }
 else if (act === 'roll') roll(b);
 else if (act === 'reroll') { spinDice(); roll(b); }
 else if (act === 'dclose') dlg.close();
 else if (act === 'dclose-nav') dlg.close();
 else if (act === 'sp') { G.sp = b.dataset.v; setPref('sumsumA-spoken', G.sp); upKey = upKey; if (parseHash().parts[0] === 'browse') go(writeF(F), true); else rerender(); }
 else if (act === 'len') { G.len = +b.dataset.v; setPref('sumsumA-length', G.len); if (parseHash().parts[0] === 'browse') { const q = parseHash().q; q.delete('len'); go(writeF(readF(q)), true); } else rerender(); }
 else if (act === 'f' || act === 'fchar') { const fk = act === 'fchar' ? 'ch' : b.dataset.k, v = b.dataset.v; F[fk] = F[fk].includes(v) ? F[fk].filter(x => x !== v) : [...F[fk], v]; go(writeF(F), true); }
 else if (act === 'clearq') { F.q = ''; $('#q').value = ''; go(writeF(F), true); }
 else if (act === 'themes') { showAllThemes = !showAllThemes; rerender(); }
 else if (act === 'ffold') { facetsOpen = !facetsOpen; rerender(); }
 else if (act === 'view') { setPref('sumsum-guide-layout', b.dataset.v); const {parts} = parseHash(); go('#/guide/' + (parts[1] || GP[0].i) + '?view=' + b.dataset.v, true); }
 else if (act === 'lsort') { const {parts} = parseHash(); go('#/guide/' + (parts[1] || GP[0].i) + '?view=list' + (b.dataset.v === 'lf' ? '&sort=lf' : ''), true); }
 else if (act === 'drawer') { const c = b.closest('.card'), d = c.querySelector('.drawer'), x = ENT.get(c.dataset.key); const open = b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', open); if (open) d.innerHTML = drawerRows(x.e); d.hidden = !open; }
 else if (act === 'shuffle') { const id = b.dataset.id; shelfSeed[id] = Math.floor(Math.random() * 1e6); const sec = b.closest('.shelf'); const y = scrollY; render(true); window.scrollTo(0, y); const n = $(`[data-shelf="${id}"] .row`); if (n) { n.classList.add('shuffle', 'deal'); setTimeout(() => n.classList.remove('deal'), 400); } }
 else if (act === 'theme') { ev.preventDefault(); const p = $('#thpop'); if (p.hidden) { themePop(); p.hidden = false; b.setAttribute('aria-expanded', 'true'); p.querySelector('input:checked')?.focus(); } else closePop(); }
 else if (act === 'about') { ev.preventDefault(); about(); }
 else if (act === 'export') { const blob = new Blob([JSON.stringify({format: 'sumsum-backup', exportedAt: new Date().toISOString(), personal: P}, null, 1)], {type: 'application/json'}); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'sumsum-backup.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); }
 else if (act === 'import') $('#imp').click();
});
document.addEventListener('change', ev => {
 const el = ev.target;
 if (el.name === 'lang') { lang = el.value; setPref('sumsum-language', lang); renderShell(); render(true); }
 else if (el.dataset.act === 'app') { const v = el.value; H.dataset.appearance = v; setPref('sumsum-appearance', v); H.dataset.scheme = v === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : v; }
 else if (el.dataset.act === 'sort') { F.sort = el.value; go(writeF(F), true); }
 else if (el.id === 'imp' && el.files[0]) { el.files[0].text().then(s => { const j = JSON.parse(s); if (j && j.personal) { P = Object.assign({v: 1, stars: {}, watched: {}, opens: {}, sit: [], cars: {}}, j.personal); save(); dlg.close(); rerender(); } }).catch(() => {}); el.value = ''; }
});
$('#sform').addEventListener('submit', ev => { ev.preventDefault(); const v = $('#q').value.trim(); F = {s: [], k: [], th: [], ch: [], q: v, sort: 'lf'}; go(writeF(F)); });
document.addEventListener('keydown', ev => {
 if (ev.key === 'Escape') { const p = $('#thpop'); if (!p.hidden) { closePop(); $('#thbtn').focus(); } }
 if ((ev.key === 'r' || ev.key === 'R') && !ev.metaKey && !ev.ctrlKey && !ev.altKey && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) roll();
 const rg = ev.target.closest && ev.target.closest('[role=radiogroup]');
 if (rg && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key) && ev.target.getAttribute('role') === 'radio') {
  const items = [...rg.querySelectorAll('[role=radio]')], i = items.indexOf(ev.target); let d = ev.key === 'ArrowRight' || ev.key === 'ArrowDown' ? 1 : -1; if (H.dir === 'rtl' && ev.key.includes('Left') || H.dir === 'rtl' && ev.key.includes('Right')) d = -d;
  const n = items[(i + d + items.length) % items.length]; ev.preventDefault(); n.click(); setTimeout(() => { const g = document.querySelector(`[data-act="${n.dataset.act}"][data-v="${n.dataset.v}"]`); g && g.focus(); }, 0);
 }
});
document.addEventListener('error', ev => { const i = ev.target; if (i.tagName === 'IMG' && !i.dataset.failed) { i.dataset.failed = 1; if (i.closest('.face,.win')) i.style.visibility = 'hidden'; else i.outerHTML = ph(i.dataset.n || '·'); } }, true);
dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });
window.addEventListener('hashchange', () => { if (dlg.open) dlg.close(); render(); });
addEventListener('storage', ev => { if (ev.key === PK) { try { P = JSON.parse(ev.newValue) || P; } catch (e) {} rerender(); } });
renderShell(); render();

</script>
</body>
</html>
