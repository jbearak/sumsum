function filterSelect(key,label,values){return `<div class="filter-group"><label for="f-${key}">${label}</label><select id="f-${key}" data-filter="${key}"><option value="">${tx('Any','הכול')}</option>${values.map(([v,n])=>`<option value="${v}" ${f[key]===v?'selected':''}>${esc(n)} · ${items.filter(e=>match(e,key)&&({...f,[key]:v},key==='series'?(P[e.p]?.s||e.s)===v:key==='kind'?e.type===v:key==='theme'?tags(e,'th').includes(v):key==='character'?tags(e,'ch').includes(v):e.copies.some(r=>r.lang===v))).length}</option>`).join('')}</select></div>`}
function filters(){return `<div class="filters">${filterSelect('series',tx('Series','סדרה'),[['classic',tx('Classic Rechov Sumsum','רחוב סומסום הקלאסי')],['modern',tx('Modern Rechov Sumsum','רחוב סומסום החדש')],['elmo',tx("Elmo's talk show",'תכנית האירוח של אלמו')],['shalom-classic','Shalom Sesame 1986'],['shalom-modern','Shalom Sesame 2010']])}${filterSelect('kind',tx('Program type','סוג תכנית'),Object.keys(kindNames).map(k=>[k,kind(k)]))}${filterSelect('theme',tx('Theme · editorial','נושא · בחירה שלנו'),[...new Set(items.flatMap(e=>tags(e,'th')))].sort().map(k=>[k,lab(k)]))}${filterSelect('spoken',tx('Language spoken','שפת הסרטון'),[['he',tx('Hebrew','עברית')],['en',tx('English','אנגלית')],['ar',tx('Arabic','ערבית')]])}<div class="wide filter-group"><label>${tx('Length','משך')}</label><div class="chips">${['','5','10'].map(v=>`<button data-length="${v}" class="${f.length===v?'active':''}">${v?tx('Under '+v+' min','עד '+v+' דקות'):tx('Any length','כל משך')} · ${items.filter(e=>match(e,'length')&&(!v||duration(e)>0&&duration(e)<=v*60)).length}</button>`).join('')}</div></div><div class="wide controls"><button id="clear">${tx('Clear filters','ניקוי מסננים')}</button><span class="muted">${tx('Counts refer to this selection.','הספירות מתייחסות לבחירה זו.')}</span></div></div>`}
function guide(){let rr=results(),display=rr.filter(e=>view==='browse'||e.ups);return `<div class="guidewrap"><aside class="rail"><span class="eyebrow">${tx('Productions','הפקות')}</span><button data-prod="" class="${!prod?'active':''}">${tx('All productions','כל ההפקות')}</button>${D.prods.filter(p=>p.f!=='queue').map(p=>`<button data-prod="${p.id}" class="${prod===p.id?'active':''}">${esc(tx(p.en,p.he))}<small>${p.y}</small></button>`).join('')}</aside><section><div class="sectionhead"><div><h2>${view==='browse'?tx('Browse','עיון'):tx('Episode guide','מדריך פרקים')}</h2><small>${display.length} ${tx('entries · selected sample','רשומות · מבחר נבחר')}</small></div><div class="viewbuttons">${['album','numbers','list'].map(x=>`<button data-layout="${x}" class="${layout===x?'active':''}">${({album:tx('Album','אלבום'),numbers:tx('Numbers','מספרים'),list:tx('List','רשימה')})[x]}</button>`).join('')}</div></div><div class="row"><small>${prod?esc(production(prod)):tx('All productions','כל ההפקות')}</small><small>${tx('Longest first ↓','הארוכים תחילה ↓')}</small></div>${Object.keys(kindNames).map(k=>{let a=display.filter(e=>e.type===k);return a.length?`<h3 class="sectionlabel">${kind(k)} · ${a.length}</h3><div class="grid ${layout}">${a.map(card).join('')}</div>`:''}).join('')}${display.length?'':`<div class="empty">${tx('No matches.','אין תוצאות.')}<br><button id="reset">${tx('Clear filters','ניקוי מסננים')}</button></div>`}</section></div>`}
function queue(){return `<aside class="queue"><div class="row"><h2>${tx('Tonight','הערב')}</h2><span class="mono">${family.queue.length}</span></div><div class="queue-total">${family.queue.length} ${tx('videos','סרטונים')} · <bdi>${fmt(family.queue.reduce((n,id)=>n+duration(I[id]),0))||'0:00'}</bdi></div><div class="queue-list">${family.queue.map((id,i)=>{let e=I[id],r=primary(e);return `<div class="queue-item">${r?.img?`<img src="${esc(r.img)}" alt="" onerror="this.style.visibility='hidden'">`:'<span>□</span>'}<div><div class="queue-name">${esc(title(e))}</div><small>${i+1} · <bdi>${fmt(duration(e))}</bdi></small></div><button data-remove="${id}" aria-label="${tx('Remove','הסרה')}: ${esc(title(e))}">×</button></div>`}).join('')}</div>${family.queue.length?watch(primary(I[family.queue[0]]),I[family.queue[0]],'primary queue-next'):''}<small>${tx('Open one at a time.','פותחים סרטון אחד בכל פעם.')}</small>${portraits()}</aside>`}
function home(){let candidates=results().filter(e=>options(e).some(r=>!['part','excerpt'].includes(r.role)));let e=candidates.find(e=>e.id===chosen)||candidates[0];if(e)chosen=e.id;let r=e?primary(e):null;return `<div class="topline"><h1>${tx('Channel Sumsum','ערוץ סומסום')}</h1><div class="controls"><button data-shelf="recent" class="${shelf==='recent'?'active':''}">${tx('Play again','שוב')}</button><button data-shelf="stars" class="${shelf==='stars'?'active':''}">☆ ${tx('Starred','כוכבים')}</button></div></div><div class="television-area"><section class="tv">${e?`<div class="tv-main">${image(e,'screen')}<div class="decision"><span class="eyebrow">${tx('Up next','הבא בתור')} · ${kind(e.type)}</span><h1>${esc(title(e))}</h1><p class="subtitle">${esc(production(e.p))}</p>${watch(r,e,'primary ticket')}<small>${evidence(e)}</small><div class="controls">${entryButton(e)}<button data-add="${e.id}">${tx('+ Tonight','+ הערב')}</button>${starButton(e)}</div><div class="controls"><button id="shuffle">⚄ ${tx('Shuffle','ערבוב')}</button><button id="next">${tx('Next →','הבא ←')}</button></div></div></div>`:`<div class="empty">${tx('No matches.','אין תוצאות.')}<button id="reset">${tx('Clear filters','ניקוי מסננים')}</button></div>`}<div class="tv-foot"><span class="brandplate">sumsum · סומסום</span><div class="dialbox"><button class="dial" id="dial" aria-label="${tx('Next production','ההפקה הבאה')}"></button><div style="max-width:235px">${chooser()}</div></div><div class="grille" aria-hidden="true"></div></div></section>${queue()}</div><div class="mobile-production">${chooser()}</div><div class="sectionhead"><div class="chips">${[['',tx('All lengths','כל משך')],['5',tx('Under 5 min','עד 5 דקות')],['10',tx('Under 10 min','עד 10 דקות')]].map(([v,n])=>`<button data-length="${v}" class="${f.length===v?'active':''}">${n}</button>`).join('')}</div><button data-view="browse">${tx('Filters','מסננים')} · ${Object.values(f).filter(Boolean).length}</button></div>${guide()}`}
function episode(){let e=I[detail]||I['original-1980s-ietv-167'],r=primary(e),full=options(e).find(r=>['whole-candidate','alternate-edition','standalone'].includes(r.role)),parts=e.copies.filter(r=>r.role==='part').sort((a,b)=>(a.part||0)-(b.part||0)),other=e.copies.filter(r=>r.role!=='part');return `<button data-view="home">${tx('← Channel','← הערוץ')}</button><div class="episode-layout"><div>${image(e)}</div><div class="decision"><span class="eyebrow">${esc(production(e.p))}</span><span class="plaque">${tx('No.','מס׳')} ${e.n||'—'}</span><h1>${esc(title(e))}</h1><p class="subtitle">${kind(e.type)} · ${cov(e)}</p><p>${evidence(e)}</p>${full?watch(full,e,'primary ticket'):''}<small>${tx('Opens the original host in a new tab.','נפתח באתר המקורי בלשונית חדשה.')}</small><div class="controls">${starButton(e)}${full?`<button data-add="${e.id}">+ ${tx('Tonight','הערב')}</button>`:''}<button data-watched="${e.id}" aria-pressed="${family.watched.includes(e.id)}">${family.watched.includes(e.id)?'✓ ':''}${tx('My Watched mark','סימון הצפייה שלי')}</button></div><small>${tx('Personal marks are separate from evidence.','הסימונים האישיים נפרדים מבדיקת העותק.')}</small></div></div>${parts.length?`<section class="copy-section"><h2>${tx('Available parts','החלקים הזמינים')}</h2><div class="parts">${parts.map(r=>`<div class="part"><span class="mono">${tx('PART','חלק')} ${r.part||'—'}</span><p><bdi>${r.role==='part'?tx('Part ','חלק ')+(r.part||'')+' · ':''}${fmt(r.d)}</bdi> · ${esc(r.host)}</p>${eligible(r)?watch(r,e):tx('Unavailable','לא זמין')}</div>`).join('')}</div><small>${tx('Opening these parts does not establish a complete episode.','פתיחת החלקים אינה מעידה שהפרק שלם.')}</small></section>`:''}<section class="copy-section"><h2>${tx('Copies & excerpts','עותקים וקטעים')}</h2>${other.map(r=>copyRow(r,e)).join('')||`<p>${tx('No whole copy.','אין עותק שלם.')}</p>`}</section><details class="notes"><summary>${tx('Identity & source notes','זיהוי ומקורות')}</summary><p>${tx('Catalogue title','כותרת הקטלוג')}: <bdi>${esc(e.he||e.en)}</bdi></p>${e.story?`<p>${tx('Story title','שם הסיפור')}: <bdi>${esc(e.story)}</bdi><br>${esc(e.storySrc?.[lang==='he'?1:0]||'')}</p>`:''}${e.hed?`<p>${tx('Editorial Hebrew title','כותרת עברית שלנו')}: ${esc(e.hed)}</p>`:''}<p>${tx('English titles and tags may be editorial.','הכותרות באנגלית והתגיות עשויות להיות שלנו.')}</p>${e.alt?`<p>${e.alt.map(a=>esc(a[lang==='he'?1:0]||a[0])).join('<br>')}</p>`:''}${(e.ups||[]).some(u=>u[1]==='possible')?`<p>${tx('Possible copies remain unresolved and are not viewing choices.','עותקים אפשריים טרם זוהו ואינם אפשרויות צפייה.')}</p>`:''}<p>${evidence(e)}${tx(' · Now',' · כעת')}</p><p>${tx('Checked in full · not recorded','נבדק במלואו · לא תועד')}</p><p>${tx('Compared with a reference · not recorded','הושווה לעותק מקור · לא תועד')}</p></details>`}
function footer(){return `<footer class="footer"><button data-view="missing">${tx('Not found & source notes','לא נמצא ומקורות')}</button><button data-view="backup">${tx('About & backup','אודות וגיבוי')}</button></footer>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';$('nav').innerHTML=[['home',tx('Channel','הערוץ')],['guide',tx('Episode guide','מדריך פרקים')],['browse',tx('Browse','עיון')],['stars',tx('Starred','כוכבים')]].map(([v,n])=>`<button data-view="${v}" class="${view===v?'active':''}">${n}</button>`).join('');$('language').textContent='עב';$('english').setAttribute('aria-checked',String(lang==='en'));$('language').setAttribute('aria-checked',String(lang==='he'));$('language').setAttribute('aria-label','עברית');$('english').setAttribute('aria-label','English');$('search').placeholder=tx('Search titles, characters…','חיפוש כותרות ודמויות…');$('search').setAttribute('aria-label',tx('Search titles and characters','חיפוש כותרות ודמויות'));$('appearance').options[0].textContent=tx('System','מערכת');$('appearance').options[1].textContent=tx('Light','בהיר');$('appearance').options[2].textContent=tx('Dark','כהה');$('app').innerHTML=(view==='home'?home():view==='episode'?episode():view==='missing'?`<h1>${tx('Not found','לא נמצא')}</h1>${D.eps.filter(e=>['missing','parts-only','excerpt-only'].includes(e.cov)).map(e=>`<div class="copy"><div>${esc(production(e.p))}<p>${e.n||''} · ${esc(title(e))} · ${cov(e)}</p>${(e.ups||[]).filter(u=>u[1]==='possible').length?`<small>${tx('Possible copies, not counted','עותקים אפשריים, אינם נספרים')}</small>`:''}</div><button data-detail="${e.id}">${tx('Entry','פרטים')}</button></div>`).join('')}`:view==='backup'?`<h1>${tx('About & backup','אודות וגיבוי')}</h1><p class="notes">${tx('Links and metadata. Videos open on their original host.','קישורים ומידע. הסרטונים נפתחים באתר המקורי.')}</p><p class="notes">${tx('Back up your stars, Watched marks, recently opened videos and tonight’s queue. Appearance and language preferences are excluded.','גיבוי הכוכבים, סימוני הצפייה, הסרטונים שנפתחו לאחרונה והתור להערב. העדפות התצוגה והשפה אינן נכללות.')}</p><div class="controls"><button id="export">${tx('Export backup','ייצוא גיבוי')}</button><label class="button">${tx('Import backup','ייבוא גיבוי')}<input id="import" type="file" accept="application/json" hidden></label></div>`:`${view==='browse'?`<div class="topline"><h1>${tx('Browse','עיון')}</h1><small>${tx('Longest first','הארוכים תחילה')}</small></div>${filters()}${portraits()}`:''}<div class="mobile-production">${chooser()}</div>${guide()}`)+footer();}
function changeView(v){shelf=v==='stars'?'stars':'all';view=v==='stars'?'guide':v;if(v==='browse'&&!Object.values(f).some(Boolean)){f.length='10';f.spoken='he'}render();window.scrollTo(0,0)}
function clear(){f={series:'',kind:'',theme:'',character:'',length:'',spoken:''};prod='';shelf='all';query='';$('search').value='';render()}
document.addEventListener('click',ev=>{let b=ev.target.closest('button,a');if(!b)return;let d=b.dataset;if(d.view){changeView(d.view);return}if(d.detail){detail=d.detail;view='episode';render();window.scrollTo(0,0)}if(d.prod!==undefined){prod=d.prod;render()}if(d.layout){layout=d.layout;render()}if(d.character){f.character=f.character===d.character?'':d.character;render()}if(d.length!==undefined){f.length=d.length;render()}if(d.shelf){shelf=shelf===d.shelf?'all':d.shelf;render()}if(d.star){family.stars=family.stars.includes(d.star)?family.stars.filter(x=>x!==d.star):[...family.stars,d.star];save();render()}if(d.watched){family.watched=family.watched.includes(d.watched)?family.watched.filter(x=>x!==d.watched):[...family.watched,d.watched];save();render()}if(d.add){if(!family.queue.includes(d.add))family.queue.push(d.add);save();render();notice('Added to tonight','נוסף להערב')}if(d.remove){family.queue=family.queue.filter(x=>x!==d.remove);save();render()}if(d.open){family.recent=[d.open,...family.recent.filter(x=>x!==d.open)].slice(0,24);if(b.classList.contains('queue-next'))family.queue=family.queue.slice(1);save();setTimeout(render,50)}if(b.id==='shuffle'||b.id==='next'){let a=results().filter(e=>options(e).some(r=>!['part','excerpt'].includes(r.role)));let i=a.findIndex(e=>e.id===chosen);chosen=(b.id==='next'?a[(i+1)%a.length]:a.filter(e=>e.id!==chosen)[Math.floor(Math.random()*Math.max(1,a.length-1))]||a[0])?.id;render()}if(b.id==='dial'){let a=D.prods.filter(p=>p.f!=='queue');prod=a[(a.findIndex(p=>p.id===prod)+1)%a.length].id;render()}if(b.id==='clear'||b.id==='reset')clear();if(b.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,...family},null,2)],{type:'application/json'}));a.download='sumsum-channel-family.json';a.click();URL.revokeObjectURL(a.href)}if(d.palette){document.documentElement.dataset.palette=d.palette;$('palette-menu').hidden=true;savePrefs()}});
document.addEventListener('change',ev=>{let e=ev.target;if(e.matches('.production-select')){prod=e.value;render()}if(e.dataset.filter){f[e.dataset.filter]=e.value;render()}if(e.id==='import'){let file=e.files[0];if(file)file.text().then(s=>{let d=JSON.parse(s);for(let k of ['stars','queue','recent','watched'])if(!Array.isArray(d[k])||d[k].some(id=>!I[id]))throw Error('invalid');family={stars:d.stars,queue:d.queue,recent:d.recent,watched:d.watched};save();render();notice('Backup imported','הגיבוי יובא')}).catch(()=>notice('Backup could not be read','לא ניתן לקרוא את הגיבוי'))}});
$('search').addEventListener('input',ev=>{query=ev.target.value;view='browse';render()});$('language').onclick=()=>{lang='he';savePrefs();render()};$('english').onclick=()=>{lang='en';savePrefs();render()};$('language').onkeydown=ev=>{if(['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();lang='en';savePrefs();render();$('english').focus()}};
$('english').onkeydown=ev=>{if(['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();lang='he';savePrefs();render();$('language').focus()}};
function scheme(){let v=$('appearance').value;document.documentElement.dataset.scheme=v==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):v;savePrefs()}
function savePrefs(){try{localStorage.setItem(KEY+'-prefs',JSON.stringify({lang,palette:document.documentElement.dataset.palette||'terracotta',appearance:$('appearance').value}))}catch{}}
try{let p=JSON.parse(localStorage.getItem(KEY+'-prefs')||'{}');lang=p.lang==='he'?'he':'en';$('appearance').value=['system','light','dark'].includes(p.appearance)?p.appearance:'system';document.documentElement.dataset.palette=p.palette||'terracotta'}catch{}
$('appearance').onchange=scheme;matchMedia('(prefers-color-scheme: dark)').addEventListener('change',scheme);scheme();$('palette').onclick=()=>{$('palette-menu').hidden=!$('palette-menu').hidden;$('palette-menu').innerHTML=['terracotta','stone','sea','sage','kippi','bauhaus'].map(p=>`<button data-palette="${p}">${p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')};
function route(){if(location.hash.startsWith('#episode/')){detail=location.hash.slice(9);view='episode';render();window.scrollTo(0,0)}else if(location.hash==='#home')changeView('home')}window.addEventListener('hashchange',route);render();route();
</script></body></html>
