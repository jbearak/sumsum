<!doctype html>
<html lang="en" dir="ltr" data-palette="terracotta" data-appearance="system" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rechov, the street · Sumsum library mockup 3</title>
<style>
/* Terracotta tokens, copied from library.template.html (scheme layer + Terracotta palette layer). */
:root{color-scheme:light;
 --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
 --whole:#1b7a4b;--parts:#a86400;--excerpt:#5f4fb3;--missing:#b3392c;--unknown:#7e8a83;--whole-ink:#fff;
 --whole-bg:#e2f1e7;--parts-bg:#faefd9;--excerpt-bg:#ece9fa;--missing-bg:#fbe8e4;--unknown-bg:#eef0ea;
 --acc-ok:#1f5fa8;--acc-public:#5c6b75;--acc-vpn:#8f3f71;--acc-lic:#1d6a6a;--acc-bad:#3d3d3d;
 --ser-modern:#126844;--ser-classic:#7a5e10;--ser-shalom-classic:#2f5f8c;--ser-shalom-modern:#7a4a80;--ser-elmo:#9c4a2f;
 --star:#f5cf45;--star-ink:#a77300;--scrim:#000000a0;--scrim-ink:#fff;--host-bg:#fffffff2;--host-ink:#18291f;
 --seg-hatch:#ffffff5c;--seg-dot:#ffffff80;--shadow-badge:0 1px 3px #0003;--shadow-toast:0 6px 30px #0004}
:root[data-scheme=dark]{color-scheme:dark;
 --whole:#5cc790;--parts:#e9a640;--excerpt:#ab9ef2;--missing:#f2826f;--unknown:#84928a;--whole-ink:#05231a;
 --whole-bg:#173827;--parts-bg:#3a2c12;--excerpt-bg:#29244a;--missing-bg:#40201b;--unknown-bg:#1c2823;
 --acc-ok:#8cc3ff;--acc-public:#a9b6bf;--acc-vpn:#e59ac6;--acc-lic:#7fd1cc;--acc-bad:#cfcfcf;
 --ser-modern:#86d6a8;--ser-classic:#e3c167;--ser-shalom-classic:#9cc4ec;--ser-shalom-modern:#d6a6dc;--ser-elmo:#f2a28e}
:root{
 --bg:#f9f2eb;--surface:#fffcf8;--surface-2:#f3e9e0;--surface-3:#eaddd1;
 --ink:#301f18;--muted:#6a5449;--line:#e3d7cc;--line-strong:#c2ac9b;
 --brand:#803414;--primary:#00445f;--primary-ink:#fff;--primary-hover:#00364c;
 --accent:#dfbd7c;--focus:#1e3a71;--link:#164878;--chip:#e4dad3;--chip-ink:#4b382f;
 --art-veil:#fffcf8cc;--shadow:0 1px 2px #3a1a100f,0 6px 18px #3a1a100d;
 --mast-ink:#fff;--mast-ink-soft:#fdf7f3;--mast-hover:#ffffff18;--mast-chip:#ffffff26;
 --mast-current:#fff;--mast-current-ink:#803414;--mast-ctl:#ffffff14;--mast-ctl-hover:#ffffff26;--mast-ctl-line:#ffffff80;
 --mast-focus:#f3d68f;--mast-divider:#ffffff59;--mast-current-divider:#80341499}
:root[data-scheme=dark]{
 --bg:#140e0b;--surface:#1e1511;--surface-2:#281c17;--surface-3:#33251f;
 --ink:#f1e9e3;--muted:#c1ad9f;--line:#382a25;--line-strong:#56433a;
 --brand:#58230c;--primary:#2f7990;--primary-ink:#fff;--primary-hover:#256a80;
 --accent:#e0d2b4;--focus:#c1e3fc;--link:#b3d6ff;--chip:#463e39;--chip-ink:#e6dbd3;
 --art-veil:#1e1511cc;--shadow:0 1px 2px #0006}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body{margin:0;min-height:100vh}
a{color:var(--link)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mast :focus-visible{outline-color:var(--mast-focus)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.2;margin:0}
.tag-ed{font-size:.72rem;font-weight:600;letter-spacing:.02em;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;white-space:nowrap;vertical-align:middle}

/* ---------- mockup note ---------- */
.mock-note{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.92rem}
.mock-note summary{cursor:pointer;padding:8px 20px;max-width:1240px;margin:0 auto;font-weight:600}
.mock-note .body{max-width:1240px;margin:0 auto;padding:0 20px 12px}
.mock-note ol{margin:4px 0 6px;padding-inline-start:22px}
.mock-note p{margin:4px 0}

/* ---------- masthead: the street sign ---------- */
.mast{background:var(--brand);color:var(--mast-ink)}
.mast .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.sign{display:inline-grid;gap:0;padding:6px 14px 7px;border-radius:6px;border:2px solid var(--mast-ctl-line);
 box-shadow:inset 0 0 0 3px var(--brand),inset 0 0 0 4px var(--mast-divider);background:transparent;color:var(--mast-ink);text-decoration:none;cursor:pointer;text-align:start}
.sign b{font-weight:700;letter-spacing:.01em;font-size:1.12rem;line-height:1.15}
.sign b+b{font-size:1.12rem}
.sign small{font-size:.72rem;color:var(--mast-ink-soft);letter-spacing:.06em;text-transform:uppercase;border-top:1px solid var(--mast-divider);margin-top:3px;padding-top:2px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;border:0;color:var(--mast-ink);padding:7px 10px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.95rem}
.nav button:hover{background:var(--mast-hover)}
.nav button[aria-current=page]{background:var(--mast-current);color:var(--mast-current-ink)}
.nav .ico{display:none}
.search{position:relative;flex:1 1 180px;min-width:170px}
.search input{width:100%;border-radius:999px;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);padding:8px 14px}
.search input::placeholder{color:var(--mast-ink-soft)}
.search input:focus{background:var(--mast-ctl-hover)}
.sresults{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-toast);z-index:30;max-height:70vh;overflow:auto;padding:8px}
.sresults h4{margin:6px 6px 4px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.sresults button{display:flex;gap:10px;width:100%;text-align:start;background:transparent;border:0;padding:6px;border-radius:6px;cursor:pointer;align-items:center}
.sresults button:hover,.sresults button:focus-visible{background:var(--surface-2)}
.sresults .more{color:var(--link);font-weight:600}
.ctl{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--mast-ctl-line);border-radius:999px;overflow:hidden}
.seg label{cursor:pointer;padding:5px 11px;font-size:.88rem;font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{background:var(--mast-current);color:var(--mast-current-ink);border-radius:999px;padding:3px 9px;margin:-3px -9px}
.seg label:has(input:focus-visible){outline:3px solid var(--mast-focus);outline-offset:-3px;border-radius:999px}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);cursor:pointer;display:grid;place-items:center;color:var(--mast-ink);position:relative}
.theme-btn:hover{background:var(--mast-ctl-hover)}
.theme-btn i{display:block;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent) 50%,var(--surface) 50%);border:1px solid var(--mast-ctl-line)}
.theme-pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-toast);padding:12px;z-index:40;width:250px;text-align:start;font-size:.92rem}
.theme-pop fieldset{border:0;margin:0 0 8px;padding:0}
.theme-pop legend{font-weight:700;margin-bottom:4px}
.theme-pop label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.theme-pop .soon{color:var(--muted);font-size:.82rem}
.theme-wrap{position:relative}
.kerb{height:10px;background:repeating-linear-gradient(90deg,var(--accent) 0 34px,var(--surface-3) 34px 68px);border-bottom:1px solid var(--line-strong)}

/* ---------- shared bits ---------- */
main{padding:24px 0 80px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:700;border:1px solid transparent;cursor:pointer;text-decoration:none;font-size:.95rem;line-height:1.2}
.btn-p{background:var(--primary);color:var(--primary-ink)}
.btn-p:hover{background:var(--primary-hover)}
.btn-g{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-g:hover{background:var(--surface-2)}
.btn-s{padding:6px 11px;font-size:.88rem}
.linkish{background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;padding:0;text-align:start}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cov{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600}
.cov::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c,var(--unknown));flex:none}
.cov.w{--c:var(--whole)}.cov.p{--c:var(--parts)}.cov.e{--c:var(--excerpt)}.cov.m{--c:var(--missing)}
.acc{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.acc::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--ac,var(--acc-public));transform:translateY(-1px)}
.acc.vpn{--ac:var(--acc-vpn)}.acc.lic{--ac:var(--acc-lic)}.acc.ok{--ac:var(--acc-ok)}.acc.bad{--ac:var(--acc-bad)}
.ev{font-size:.85rem;font-style:italic;color:var(--muted)}
.ev.up{font-style:normal;font-weight:700;color:var(--ink)}

/* plates: street signs and house numbers */
.plate{background:var(--brand);color:var(--mast-ink);border-radius:6px;padding:8px 14px 9px;display:inline-grid;
 box-shadow:inset 0 0 0 2px var(--brand),inset 0 0 0 3px var(--mast-divider);border-inline-start:6px solid var(--band,var(--accent));text-align:start}
.plate .l1,.plate .l2{font-weight:650;font-size:1.05rem;line-height:1.2}
.plate .sub{font-size:.76rem;color:var(--mast-ink-soft);margin-top:3px;letter-spacing:.03em}
.house{display:inline-grid;place-items:center;min-width:2.1em;height:1.75em;padding:0 .4em;background:var(--accent);color:var(--brand);font-weight:800;
 border-radius:5px;box-shadow:inset 0 0 0 2px var(--brand);font-variant-numeric:tabular-nums;font-size:.95rem;line-height:1}
.house.big{font-size:2.2rem;height:1.6em;min-width:1.9em;border-radius:10px;box-shadow:inset 0 0 0 3px var(--brand),inset 0 0 0 6px var(--accent),inset 0 0 0 7px var(--brand)}
.house.none{font-size:.72rem;font-weight:700}
.ser-classic{--band:var(--ser-classic)}.ser-modern{--band:var(--ser-modern)}.ser-shalom-classic{--band:var(--ser-shalom-classic)}
.ser-shalom-modern{--band:var(--ser-shalom-modern)}.ser-elmo{--band:var(--ser-elmo)}

/* thumbnails */
.thumb{position:relative;aspect-ratio:16/9;background:var(--surface-3);border-radius:8px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;
 background:repeating-linear-gradient(135deg,var(--surface-3) 0 10px,var(--surface-2) 10px 20px)}
.thumb .ph small{display:block;font-size:.7rem;font-weight:600;text-align:center}
.thumb .dur{position:absolute;inset-inline-end:6px;bottom:6px;background:var(--scrim);color:var(--scrim-ink);font-size:.78rem;font-weight:700;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.thumb .house{position:absolute;inset-inline-start:6px;top:6px}
.thumb .hostb{position:absolute;inset-inline-start:6px;bottom:6px;background:var(--host-bg);color:var(--host-ink);font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:4px}

/* ---------- screen: the street ---------- */
.street-top{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.tonight{padding:18px;display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
.tonight h2{font-size:1.4rem;margin:6px 0 2px}
.tonight .he2{font-size:1.05rem;margin:0 0 8px}
.tonight .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.short-picks{display:grid;gap:8px;margin-top:12px}
.pick{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;background:var(--surface-2);border-radius:8px;padding:6px;border:0;text-align:start;cursor:pointer}
.pick:hover{background:var(--surface-3)}
.pick .thumb{border-radius:6px}
.pick b{display:block;font-size:.92rem}
.pick span{font-size:.8rem;color:var(--muted)}
.stoop{padding:18px 18px 0;display:flex;flex-direction:column}
.stoop h2{font-size:1.15rem}
.stoop p{margin:4px 0 10px;font-size:.9rem;color:var(--muted)}
.steps{display:grid;gap:0;margin:0 -18px}
.pick .ph{font-size:.8rem;place-items:start;padding:4px 6px}
.pick .ph small,.shop .window .ph small{display:none}
.step-row{display:flex;flex-wrap:wrap;gap:10px 8px;padding:10px 6px 8px;justify-content:center;border-top:2px solid var(--line-strong);background:var(--surface-2)}
.step-row+.step-row{background:var(--surface-3)}
.steps .step-row:last-child{border-radius:0 0 12px 12px}
.who{display:grid;justify-items:center;gap:3px;background:none;border:0;cursor:pointer;padding:2px;width:76px}
.who .face{width:52px;height:52px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong);display:grid;grid-template-rows:1fr 1fr;place-items:center;font-weight:800;line-height:1;box-shadow:var(--shadow)}
.who .face span{font-size:1.05rem}
.who .face span+span{font-size:.98rem;color:var(--muted)}
.who b{font-size:.8rem;line-height:1.1;text-align:center}
.who small{font-size:.72rem;color:var(--muted)}
.who:hover .face{border-color:var(--primary)}
.who[aria-pressed=true] .face{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.who[aria-pressed=true] .face span+span{color:var(--primary-ink)}

.side{margin-top:34px}
.side-head{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.side-head h2{font-size:1.3rem}
.side-head p{margin:0;color:var(--muted);font-size:.92rem}
.shops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.shop{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px 10px 12px 12px;box-shadow:var(--shadow);overflow:hidden}
.awning{height:12px;background:repeating-linear-gradient(90deg,var(--brand) 0 18px,var(--surface-2) 18px 36px);border-bottom:1px solid var(--line-strong)}
.shop .plate{margin:12px 12px 0;display:grid}
.shop .window{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 12px 0;padding:5px;background:var(--surface-3);border-radius:6px;border:1px solid var(--line-strong)}
.shop .window .thumb{border-radius:3px}
.shop .window .thumb .ph{font-size:.95rem}
.shop .meta{padding:10px 14px 0;font-size:.88rem;display:grid;gap:5px}
.shop .covline{display:flex;flex-wrap:wrap;gap:4px 12px}
.shop .unit{color:var(--muted);font-size:.84rem}
.shop .doors{margin-top:auto;padding:12px 14px 14px;display:flex;gap:8px;flex-wrap:wrap}
.shop.shut .window{place-items:center;min-height:70px;grid-template-columns:1fr;color:var(--muted);font-size:.86rem;text-align:center;
 background:repeating-linear-gradient(180deg,var(--surface-3) 0 7px,var(--surface-2) 7px 9px)}
.road{margin:34px 0 0;height:46px;border-radius:6px;background:var(--surface-3);position:relative;display:grid;place-items:center;border-top:6px solid var(--line-strong);border-bottom:6px solid var(--line-strong)}
.road::before{content:"";position:absolute;inset-inline:16px;top:50%;height:4px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--accent) 0 30px,transparent 30px 56px)}
.road span{position:relative;background:var(--surface-3);padding:0 12px;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cityhall{margin-top:34px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px 18px}
.cityhall .plate{--band:var(--accent)}
.cityhall ul{margin:0;padding:0;list-style:none;display:flex;gap:6px 20px;flex-wrap:wrap;font-size:.92rem}

/* ---------- screen: production guide ---------- */
.prod-head{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.prod-head .plate{padding:14px 20px}
.prod-head .plate .l1,.prod-head .plate .l2{font-size:1.5rem}
.prod-head .facts{display:grid;gap:6px;font-size:.95rem}
.prod-head .facts p{margin:0}
.prod-pick{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.prod-pick button{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.85rem;border-inline-start:4px solid var(--band)}
.prod-pick button[aria-current=true]{background:var(--chip);font-weight:700}
.layout-pick{display:flex;gap:10px;margin:22px 0 6px;flex-wrap:wrap}
.layout-pick button{display:grid;text-align:start;gap:1px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer}
.layout-pick button small{color:var(--muted);font-size:.8rem}
.layout-pick button[aria-pressed=true]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.season{margin-top:22px}
.season-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.season-head h3{font-size:1.08rem}
.film{background:var(--brand);border-radius:6px;overflow-x:auto;scrollbar-width:thin}
.film-row{display:flex;gap:6px;padding:17px 10px;width:max-content;min-width:100%;position:relative;background:var(--brand)}
.film-row::before,.film-row::after{content:"";position:absolute;inset-inline:0;height:7px;
 background:repeating-linear-gradient(90deg,transparent 0 9px,var(--bg) 9px 19px,transparent 19px 26px)}
.film-row::before{top:5px}.film-row::after{bottom:5px}
.frame{width:188px;flex:none;background:var(--surface);border-radius:4px;overflow:hidden;cursor:pointer;border:0;padding:0;text-align:start;display:flex;flex-direction:column}
.frame .thumb{border-radius:0}
.frame .cap{padding:6px 8px 8px;display:grid;gap:2px;flex:1}
.frame .cap b{font-size:.85rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.frame .cap .he{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame:hover{outline:3px solid var(--accent);outline-offset:-3px}
.frame.more{display:grid;place-items:center;background:var(--surface-2);color:var(--ink);font-weight:700;padding:10px;text-align:center;font-size:.9rem}
.houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.hn{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:4px 2px 3px;display:grid;justify-items:center;gap:2px;cursor:pointer;border-bottom:5px solid var(--c)}
.hn b{font-variant-numeric:tabular-nums}
.hn small{font-size:.62rem;color:var(--muted);line-height:1.05;text-align:center}
.hn.w{--c:var(--whole)}.hn.p{--c:var(--parts)}.hn.e{--c:var(--excerpt)}.hn.m{--c:var(--missing)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.85rem;margin:8px 0}
.totals{font-size:.88rem;margin:0;padding-inline-start:18px}

/* ---------- screen: browse ---------- */
.browse{display:grid;grid-template-columns:290px 1fr;gap:26px;align-items:start}
.filters{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:4px 4px 20px;scrollbar-width:thin}
.filters>summary{display:none}
.fgroup{border-top:1px solid var(--line);padding:12px 0}
.fgroup h3{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:6px}
.fgroup .help{font-size:.78rem;color:var(--muted);margin:6px 0 0}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;gap:8px;align-items:center;justify-content:space-between;background:none;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;text-align:start;font-size:.92rem}
.opt:hover{background:var(--surface-2)}
.opt .box{width:16px;height:16px;border:2px solid var(--line-strong);border-radius:4px;flex:none;display:grid;place-items:center}
.opt[aria-pressed=true] .box{background:var(--primary);border-color:var(--primary)}
.opt[aria-pressed=true] .box::after{content:"";width:7px;height:4px;border:2px solid var(--primary-ink);border-top:0;border-inline-end:0;transform:rotate(-45deg) translate(0,-1px)}
.opt .lab{flex:1;display:flex;gap:7px;align-items:center}
.opt .n{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.opt[data-zero] .lab{color:var(--muted)}
.opt .band{width:4px;height:16px;border-radius:2px;background:var(--band)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid transparent;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 10px;font-size:.84rem;cursor:pointer}
.chip .n{opacity:.8;font-size:.78rem;margin-inline-start:4px}
.chip[aria-pressed=true]{background:var(--primary);color:var(--primary-ink)}
.chip[data-zero]{opacity:.55}
.tgroup{margin-top:8px}
.tgroup h4{margin:0 0 4px;font-size:.8rem;font-weight:700}
.stoop-mini{display:flex;flex-wrap:wrap;gap:6px 2px}
.stoop-mini .who{width:66px}
.stoop-mini .who .face{width:42px;height:42px}
.stoop-mini .who .face span{font-size:.9rem}.stoop-mini .who .face span+span{font-size:.82rem}
.results-head{display:flex;gap:12px;align-items:start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.summary{font-size:1.05rem;margin:0;max-width:62ch}
.summary b{font-weight:700}
.active{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.active button{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:3px 6px 3px 11px;cursor:pointer;font-size:.84rem}
.active button span{width:18px;height:18px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:.8rem}
.sample-note{font-size:.8rem;color:var(--muted);margin:2px 0 14px}
.sortbox{display:flex;gap:8px;align-items:center;font-size:.9rem}
.sortbox select{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:5px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.vcard .thumb{border-radius:0}
.vcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.vcard h3{font-size:1rem;line-height:1.25}
.vcard .alt{font-size:.85rem;color:var(--muted);margin-top:-2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vcard .prodline{display:flex;gap:6px;align-items:center;font-size:.8rem;flex-wrap:wrap}
.miniplate{background:var(--brand);color:var(--mast-ink);border-radius:3px;padding:1px 6px;font-weight:650;border-inline-start:4px solid var(--band);font-size:.76rem}
.fmtword{font-weight:700;font-size:.8rem}
.vcard .acts{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.vcard .prov{font-size:.76rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.vcard .poss{font-size:.8rem;font-weight:600;color:var(--ink);background:var(--surface-2);border-radius:4px;padding:2px 6px}
.star{background:none;border:1px solid var(--line-strong);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--muted);font-size:1.05rem;line-height:1}
.star[aria-pressed=true]{color:var(--star-ink);border-color:var(--star-ink)}
.zero{padding:22px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface)}
.zero ul{list-style:none;padding:0;margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- screen: episode ---------- */
.ep-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px;font-size:.85rem}
.ep-pick button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.84rem}
.ep-pick button[aria-current=true]{background:var(--chip);font-weight:700}
.crumbs{font-size:.88rem;margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ep-sign{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:20px}
.ep-sign .plate{display:grid;padding:12px 18px}
.ep-sign .plate .l1{font-size:1.65rem}
.ep-sign .plate .l2{font-size:1.45rem}
.ep-sign .plate .sub{font-size:.85rem}
.decide{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;padding:18px}
.decide .thumb{border-radius:10px}
.decide .facts{display:flex;flex-direction:column;gap:10px}
.facts .row{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.watch{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.watch .btn-p{font-size:1.05rem;padding:12px 20px}
.newtab{font-size:.82rem;color:var(--muted)}
.why{font-size:.86rem;color:var(--muted);margin:0}
.others{border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.others summary{cursor:pointer;padding:8px 12px;font-weight:700;font-size:.92rem}
.others ul{list-style:none;margin:0;padding:0 12px 10px;display:grid;gap:8px}
.others li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;font-size:.88rem;border-top:1px solid var(--line);padding-top:8px}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:p}
.parts li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:8px;padding:6px 10px}
.parts .done{font-size:.8rem;color:var(--muted)}
.mine{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.mine .btn-g[aria-pressed=true]{background:var(--chip);border-color:var(--chip-ink)}
.nowhole{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.nowhole p{margin:0 0 6px}
.dossier{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.dossier section{padding:16px 18px}
.dossier h2{font-size:1.1rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.idcard{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:.92rem}
.idcard dt{color:var(--muted)}
.idcard dd{margin:0}
.quote{border-inline-start:4px solid var(--accent);padding:4px 12px;margin:10px 0 0;background:var(--surface-2);border-radius:0 6px 6px 0;font-size:.95rem}
[dir=rtl] .quote{border-radius:6px 0 0 6px}
.quote cite{display:block;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:4px}
.ups{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ups li{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;font-size:.88rem}
.ups li .thumb{border-radius:5px}
.ups .role{font-weight:700}
.ups .title{display:block;font-weight:600}
.ladder{margin:0;padding-inline-start:20px;font-size:.9rem;display:grid;gap:3px}
.ladder li.now{font-weight:700}
.ladder li.now::after{content:" ← " attr(data-now)}
[dir=rtl] .ladder li.now::after{content:" → " attr(data-now)}
.srcs{font-size:.84rem;padding-inline-start:18px;margin:6px 0 0}

/* ---------- screen: research desk ---------- */
.desk{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.desk section{padding:16px 18px}
.desk h2{font-size:1.1rem;margin-bottom:6px}
.desk table{width:100%;border-collapse:collapse;font-size:.88rem}
.desk td,.desk th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.desk th{color:var(--muted);font-weight:600;font-size:.78rem}
.desk td.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.compare{margin-top:18px;padding:16px 18px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.cmp .mid{display:grid;gap:6px;justify-items:center;font-size:.86rem;color:var(--muted);text-align:center}
.cmp .side-b{display:grid;gap:6px;justify-items:start}
.cmpfile{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:.86rem;align-items:center}

.tabbar{display:none}
.foot{border-top:1px solid var(--line);padding:16px 0 30px;font-size:.84rem;color:var(--muted)}

/* ---------- narrow ---------- */
@media (max-width:1060px){
 .shops{grid-template-columns:repeat(2,minmax(0,1fr))}
 .desk{grid-template-columns:1fr 1fr}
}

 .wrap{padding:0 14px}
 .mast .wrap{gap:8px 10px;padding-top:8px;padding-bottom:8px}
 .sign{padding:4px 10px 5px}
 .sign b,.sign b+b{font-size:.98rem}
 .sign small{display:none}
 .mast .nav{display:none}
 .ctl{margin-inline-start:auto}
 .search{order:5;flex-basis:100%}
 .seg label{padding:4px 9px;font-size:.84rem}
 .street-top{grid-template-columns:1fr}
 .tonight{grid-template-columns:1fr}
 .shops{grid-template-columns:1fr}
 .cityhall{grid-template-columns:1fr}
 .prod-head{grid-template-columns:1fr}
 .prod-head .plate .l1,.prod-head .plate .l2{font-size:1.2rem}
 .browse{grid-template-columns:1fr}
 .filters{position:static;max-height:none;overflow:visible;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 12px}
 .filters>summary{display:flex;justify-content:space-between;cursor:pointer;padding:12px 0;font-weight:700;position:sticky;top:0}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .prod-pick,.ep-pick{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
 .prod-pick button,.ep-pick button{flex:none}
 .vcard .body{padding:8px 9px 10px}
 .vcard h3{font-size:.95rem}
 .vcard .acts .btn{padding:6px 9px;font-size:.84rem}
 .vcard .prov{display:none}
 .ep-sign{grid-template-columns:auto 1fr;gap:10px}
 .ep-sign .plate .l1{font-size:1.2rem}.ep-sign .plate .l2{font-size:1.1rem}
 .house.big{font-size:1.5rem}
 .decide{grid-template-columns:1fr;padding:12px}
 .dossier{grid-template-columns:1fr}
 .desk{grid-template-columns:1fr}
 .cmp{grid-template-columns:1fr}
 .ups li{grid-template-columns:90px 1fr}
 .frame{width:150px}
 main{padding-bottom:96px}
 .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;inset-inline:0;background:var(--brand);z-index:20;border-top:4px solid var(--accent);padding-bottom:env(safe-area-inset-bottom)}
 .tabbar button{background:none;border:0;color:var(--mast-ink);padding:8px 2px 9px;font-size:.78rem;font-weight:700;display:grid;justify-items:center;gap:2px;cursor:pointer;min-height:52px}
 .tabbar button svg{width:20px;height:20px}
 .tabbar button[aria-current=page]{background:var(--mast-current);color:var(--mast-current-ink)}
}

/* ---------- links and access ---------- */
const isHop = r => /hop\.co\.il/.test(r.u);

 for (const [k, v] of [['vimeo.com', 'vimeo'], ['youtube.com', 'youtube'], ['youtu.be', 'youtube'], ['hop.co.il', 'hop'], ['archive.org', 'archive'], ['hoopladigital', 'hoopla'],
  ['primevideo', 'prime'], ['tv.apple.com', 'apple'], ['facebook.com', 'facebook'], ['dailymotion', 'dailymotion']]) if (u.includes(k)) return v;
 return 'web'; }
function access(r) {
 const h = hostOf(r), host = t('host_' + h);
 if (r.ac === 'licensed') return {cls: 'lic', text: t(h === 'hoopla' ? 'a_hoopla' : h === 'apple' ? 'a_apple' : 'a_prime')};
 if (isHop(r)) return r.du ? {cls: 'ok', text: t('a_vimeo'), hop: true} : {cls: 'vpn', text: t('a_hop')};
 if (r.av === 'country-restricted') return {cls: 'vpn', text: t('a_restr', {host})};
 if (r.ac === 'vpn-required') return {cls: 'vpn', text: t('a_vpn', {host})};
 return {cls: 'pub', text: t('a_public', {host})};
}
const watchLabel = r => t('w_' + hostOf(r));
function rank(r) { if (r.ac === 'unavailable' || r.av === 'unavailable') return 99; if (r.ac === 'licensed') return hostOf(r) === 'hoopla' ? 6 : 7;
 if (isHop(r)) return r.du ? 1 : 4; if (r.av === 'country-restricted' || r.ac === 'vpn-required') return 5; return hostOf(r) === 'archive' ? 0 : 0.5; }
const whereKey = r => (r.ac === 'licensed' ? 'lic' : isHop(r) ? (r.du ? 'free' : 'il') : (r.av === 'country-restricted' || r.ac === 'vpn-required') ? 'il' : 'free');

/* ---------- facets ---------- */
const FACETS = {
 kind: {vals: r => [r.k], opts: ['episode', 'short-episode', 'unverified', 'clip', 'collection'], label: k => t('k_' + k)},
 len: {vals: r => lenKeys(r.d), opts: ['u5', 'u10', 'm', 'o', 'x'], label: k => t('len_' + k)},
 series: {vals: r => [r.s], opts: ['classic', 'modern', 'shalom-classic', 'shalom-modern', 'elmo'], label: seriesName},
 lang: {vals: r => [langKey(r.lang)], opts: ['he', 'en', 'ar', 'mixed', 'none'], label: k => t('lang_' + k)},
 where: {vals: r => [whereKey(r)], opts: ['free', 'il', 'lic'], label: k => t('where_' + k)},
 ch: {vals: r => r.ch || [], opts: null, label: charName},

};
function qMatch(r, q) { if (!q) return true; q = q.toLowerCase();
 return [r.en, r.he, r.hee, r.up, r.u, r.du, r.id].some(x => x && String(x).toLowerCase().includes(q)); }
function matches(r, f, skip) {
 for (const k in FACETS) { if (k === skip) continue; const sel = f[k]; if (!sel.length) continue;
  const v = FACETS[k].vals(r); if (!sel.some(s => v.includes(s))) return false; }
 return qMatch(r, S.q);
}

   <ol class="ladder">${evs.map((x, i) => `<li class="${e.ev === x ? 'now' : ''}" data-now="${esc(t('now'))}">${esc(t('ev_' + x))}<br><span class="muted" style="font-weight:400;font-size:.84rem">${esc(t(evL[i]))}</span></li>`).join('')}</ol>
   ${!e.ev ? `<p class="muted">${esc(t('ev_none'))}</p>` : ''}
   ${e.srcs ? `<h2 style="margin-top:16px">${esc(t('srcTitle'))}</h2><ul class="srcs">${e.srcs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : ''}</section>
  ${upGroups.length ? `<section class="card" style="grid-column:1/-1"><h2>${esc(t('copiesTitle'))}</h2>${upGroups.map(([k, list]) => `<h3 style="font-size:.95rem;margin:12px 0 8px">${esc(t(k))}</h3><ul class="ups">${list.map(u => { const r = u.rec, rt = recTitles(r);
    return `<li>${thumb(r.th, {d: r.d})}<div><span class="title">${u.part ? `<span class="house" style="font-size:.75rem">${bdi(u.part)}</span> ` : ''}${inLang(rt.main, rt.ml)}${oursTag(rt)}</span>${rt.other ? `<span class="muted">${inLang(rt.other, rt.ol)}</span><br>` : ''}
     <span class="muted">${esc(t('host_' + hostOf(r)))} · ${t('uploadedBy', {u: '<bdi>' + esc(r.up) + '</bdi>'})}</span>${accLine(r)}
     ${u.role === 'possible' ? `<a href="${esc(destOf(r))}" target="_blank" rel="noopener noreferrer">${esc(t('inspect'))}</a>` : `<a href="${esc(destOf(r))}" target="_blank" rel="noopener noreferrer">${esc(watchLabel(r))}</a>`}</div></li>`; }).join('')}</ul>`).join('')}</section>` : ''}
 </div>`;
}

/* ---------- screen: research desk ---------- */
function viewDesk() {
 const order = DATA.prods.filter(p => p.format !== 'related-series' || p.cov.missing).sort((a, b) => (a.format === 'core' ? 0 : 1) - (b.format === 'core' ? 0 : 1));
 const miss = order.filter(p => p.cov.missing || p.cov['parts-only'] || p.cov['excerpt-only']);
 const unid = DATA.prods.filter(p => p.unid);
 const ev = DATA.stats.ev;
 const a = EP['original-1980s-ietv-133'], b = EP['original-1980s-ietv-178'];
 const files = (a.ups || []).filter(u => u.role === 'possible').map(u => REC[u.r]).filter(Boolean);
 const side = e => `<div class="side-b"><span class="house big" style="font-size:1.6rem">${bdi(e.n)}</span>${he(e.he)}<span class="muted">${esc(t('idRuntime'))}: ${bdi(dur(e.nli[0].runtimeSeconds))}</span>
  <button class="btn btn-g btn-s" data-ep="${e.id}" data-fk="cmp-${e.id}" style="justify-self:start">${esc(t('openEp'))}</button></div>`;
 return `<div class="prod-head" style="grid-template-columns:auto 1fr">${plate('City hall', 'העירייה', esc(t('citySub')), 'classic', 'h1')}<p style="margin:0;max-width:60ch">${esc(t('deskLede'))}</p></div>
 <div class="desk">
  <section class="card"><h2>${esc(t('dMissing'))}</h2><p class="muted" style="margin:0 0 8px;font-size:.86rem">${esc(t('dMissingD'))}</p>
   <table><thead><tr><th>${esc(t('th_prod'))}</th><th>${esc(t('th_missing'))}</th><th>${esc(t('th_parts'))}</th><th>${esc(t('th_exc'))}</th></tr></thead><tbody>
   ${miss.map(p => `<tr><td><button class="linkish" data-prod="${p.id}" data-fk="dm-${p.id}">${esc(prodName(p.id))}</button> <span class="muted">${bdi(p.years)}</span>${p.format === 'core' && p.series === 'classic' ? ` <span class="tag-ed">${esc(t('coreTag'))}</span>` : ''}</td><td class="n">${p.cov.missing}</td><td class="n">${p.cov['parts-only']}</td><td class="n">${p.cov['excerpt-only']}</td></tr>`).join('')}
   </tbody></table></section>
  <section class="card"><h2>${esc(t('dUnid'))}</h2><p class="muted" style="margin:0 0 8px;font-size:.86rem">${esc(t('dUnidD'))}</p>
   <table><thead><tr><th>${esc(t('th_prod'))}</th><th>${esc(t('th_uploads'))}</th></tr></thead><tbody>
   ${unid.map(p => `<tr><td>${esc(prodName(p.id))} <span class="muted">${bdi(p.years)}</span></td><td class="n">${p.unid}</td></tr>`).join('')}
   <tr><td>${esc(t('queueName'))}</td><td class="n">${DATA.stats.unidQueue}</td></tr>
   <tr><th>${esc(t('total'))}</th><th class="n" style="text-align:end">${unid.reduce((x, p) => x + p.unid, 0) + DATA.stats.unidQueue}</th></tr></tbody></table></section>
  <section class="card"><h2>${esc(t('dChecks'))}</h2><p class="muted" style="margin:0 0 8px;font-size:.86rem">${esc(t('dChecksD'))}</p>
   <table><thead><tr><th></th><th>${esc(t('th_episodes'))}</th></tr></thead><tbody>
   ${['reference-compared', 'complete-playback-reviewed', 'playback-started', 'metadata-checked', 'none'].map(k => `<tr><td>${esc(t('ev_' + k))}</td><td class="n">${ev[k] || 0}</td></tr>`).join('')}</tbody></table>
   <p style="font-size:.86rem">${esc(t('dChecksNote'))} <button class="linkish" data-ep="word-of-day-2023-ep-02" data-fk="dc-ep">${esc(t('openEp'))}</button></p></section>
 </div>
 <section class="card compare"><h2 style="font-size:1.1rem">${esc(t('dCompare'))}</h2><p class="muted" style="margin:4px 0 14px;font-size:.9rem">${esc(t('dCompareD'))}</p>
  <div class="cmp">${side(a)}<div class="mid"><b>${esc(t('candidates'))}</b>${files.map(r => `<div class="cmpfile">${thumb(r.th, {d: r.d})}<span style="text-align:start">${he(r.he)}<br><a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${esc(t('inspect'))}</a></span></div>`).join('')}</div>${side(b)}</div></section>`;
}

/* ---------- search ---------- */
function searchPanel() {
 const box = document.getElementById('sres'), q = S.qLive || '';
 if (!q.trim()) { box.hidden = true; return; }
 const ql = q.trim().toLowerCase(), num = /^\d+$/.test(ql) ? +ql : null;
 const eps = EPS.filter(e => (num != null && e.n === num) || [e.en, e.he, e.st, e.hee, e.id].some(x => x && x.toLowerCase().includes(ql)));
 const recs = RECS.filter(r => qMatch(r, ql));
 box.innerHTML = `<h4><span>${esc(t('sEpisodes'))}</span><span>${bdi(eps.length)}</span></h4>${eps.length ? eps.slice(0, 5).map(e => { const tt = epTitles(e);
  return `<button data-ep="${e.id}" data-sres>${e.n != null ? `<span class="house">${bdi(e.n)}</span>` : ''}<span><b>${inLang(tt.main, tt.ml)}</b><br><small class="muted">${esc(prodName(e.p))} · ${esc(covWord(e.cov))}</small></span></button>`; }).join('') : `<p class="muted" style="margin:4px 6px">${esc(t('sNone'))}</p>`}
  <h4><span>${esc(t('sVideos'))}</span><span>${bdi(recs.length)}</span></h4>${recs.length ? recs.slice(0, 4).map(r => { const tt = recTitles(r);
  return `<button data-q-browse="${esc(q)}" data-sres><span><b>${inLang(tt.main, tt.ml)}</b><br><small class="muted">${esc(t('k1_' + r.k))} · ${bdi(dur(r.d))} · ${esc(t('host_' + hostOf(r)))}</small></span></button>`; }).join('') +
  `<button class="more" data-q-browse="${esc(q)}" data-sres>${esc(t('sAll', {n: recs.length}))}</button>` : `<p class="muted" style="margin:4px 6px">${esc(t('sNone'))}</p>`}`;
 box.hidden = false;
}

/* ---------- render and events ---------- */
const VIEWS = {street: viewStreet, guide: viewGuide, browse: viewBrowse, episode: viewEpisode, desk: viewDesk};
function render(scrollTop) {
 const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
 const filtOpen = document.getElementById('filt') ? document.getElementById('filt').open : null;
 document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'he' ? 'rtl' : 'ltr';
 renderMast();
 document.getElementById('main').innerHTML = VIEWS[S.screen]();
 const filt = document.getElementById('filt'); if (filt && filtOpen !== null && innerWidth <= 760) filt.open = filtOpen;
 if (fk) { const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el) el.focus({preventScroll: true}); }
 if (scrollTop) scrollTo(0, 0);
}
function go(screen) { S.screen = screen; S.themeOpen = false; render(true); }
function applyScheme() {
 const sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
 document.documentElement.dataset.appearance = S.app;
 document.documentElement.dataset.scheme = S.app === 'system' ? sys : S.app;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyScheme);
document.addEventListener('click', ev => {
 const el = ev.target.closest('button,a,[data-open-part]'); if (!el) { if (S.themeOpen && !ev.target.closest('.theme-pop')) { S.themeOpen = false; renderMast(); } return; }
 const d = el.dataset;
 if (el.closest('.theme-pop')) return;
 if (d.openPart) { S.opened.add(d.openPart); setTimeout(() => render(), 0); return; }
 if (el.tagName === 'A') return;
 if (d.sres !== undefined) { document.getElementById('sres').hidden = true; }
 if (d.act === 'theme') { S.themeOpen = !S.themeOpen; renderMast(); document.querySelector('[data-fk="theme"]').focus(); return; }
 if (S.themeOpen) { S.themeOpen = false; }
 if (d.go) return go(d.go);
 if (d.prod) { S.prod = d.prod; return go('guide'); }
 if (d.ep) { S.ep = d.ep; return go('episode'); }
 if (d.browseSeries) { for (const k in S.f) S.f[k] = []; S.f.series = [d.browseSeries]; S.q = ''; return go('browse'); }
 if (d.ch) { if (S.screen === 'browse') { const a = S.f.ch; S.f.ch = a.includes(d.ch) ? a.filter(x => x !== d.ch) : a.concat(d.ch); return render(); }
  for (const k in S.f) S.f[k] = []; S.f.ch = [d.ch]; S.q = ''; return go('browse'); }
 if (d.f) { const a = S.f[d.f]; S.f[d.f] = a.includes(d.v) ? a.filter(x => x !== d.v) : a.concat(d.v); return render(); }
 if (d.clear !== undefined) { for (const k in S.f) S.f[k] = []; S.q = ''; return render(); }
 if (d.clearq !== undefined) { S.q = ''; return render(); }
 if (d.zt !== undefined) { S.zeroThemes = !S.zeroThemes; return render(); }
 if (d.layout) { S.layout = d.layout; return render(); }
 if (d.star) { S.stars.has(d.star) ? S.stars.delete(d.star) : S.stars.add(d.star); return render(); }
 if (d.mineStar !== undefined) { S.stars.has(S.ep) ? S.stars.delete(S.ep) : S.stars.add(S.ep); return render(); }
 if (d.mineWatch !== undefined) { S.watched.has(S.ep) ? S.watched.delete(S.ep) : S.watched.add(S.ep); return render(); }
 if (d.qBrowse !== undefined) { for (const k in S.f) S.f[k] = []; S.q = d.qBrowse; return go('browse'); }
});
document.addEventListener('change', ev => {
 const el = ev.target;
 if (el.name === 'lang') { S.lang = el.value; render(); }
 else if (el.name === 'app') { S.app = el.value; applyScheme(); }
 else if (el.dataset.sort !== undefined) { S.sort = el.value; render(); }
});
document.addEventListener('input', ev => { if (ev.target.id === 'q') { S.qLive = ev.target.value; searchPanel(); } });
document.addEventListener('keydown', ev => {
 if (ev.target.id === 'q' && ev.key === 'Enter') { for (const k in S.f) S.f[k] = []; S.q = ev.target.value.trim(); S.qLive = ''; go('browse'); }
 if (ev.key === 'Escape') { const b = document.getElementById('sres'); if (b && !b.hidden) b.hidden = true; if (S.themeOpen) { S.themeOpen = false; renderMast(); document.querySelector('[data-fk="theme"]').focus(); } }
});
document.addEventListener('focusout', ev => { if (ev.target.id === 'q') setTimeout(() => { const b = document.getElementById('sres'); if (b && !b.contains(document.activeElement)) b.hidden = true; }, 150); });
const start = Object.assign({}, document.documentElement.dataset);
new URLSearchParams(location.search).forEach((v, k) => { start['start' + k[0].toUpperCase() + k.slice(1)] = v; });
if (start.startLang) S.lang = start.startLang;
if (start.startScreen) S.screen = start.startScreen;
if (start.startAppearance) S.app = start.startAppearance;
if (start.startEp) S.ep = start.startEp;
if (start.startLayout) S.layout = start.startLayout;
if (innerWidth <= 760) document.getElementById('note').open = false;
applyScheme(); render();

</script>
</body>
