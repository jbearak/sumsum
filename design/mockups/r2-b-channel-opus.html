<!doctype html>
<html lang="en" dir="ltr" data-palette="terracotta" data-appearance="system" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark" id="meta-cs">
<meta name="theme-color" content="#803414">
<title>Sumsum</title>
<style>
/* Terracotta tokens, copied from library.template.html (scheme tokens and the Terracotta palette) */
:root{color-scheme:light;
 --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
 --whole:#1b7a4b;--parts:#a86400;--excerpt:#5f4fb3;--missing:#b3392c;--unknown:#7e8a83;--whole-ink:#fff;
 --whole-bg:#e2f1e7;--parts-bg:#faefd9;--excerpt-bg:#ece9fa;--missing-bg:#fbe8e4;--unknown-bg:#eef0ea;
 --acc-ok:#1f5fa8;--acc-public:#5c6b75;--acc-vpn:#8f3f71;--acc-lic:#1d6a6a;--acc-bad:#3d3d3d;
 --ser-modern:#126844;--ser-classic:#7a5e10;--ser-shalom-classic:#2f5f8c;--ser-shalom-modern:#7a4a80;--ser-elmo:#9c4a2f;
 --star:#f5cf45;--star-ink:#a77300;--scrim:#000000a0;--scrim-ink:#fff;--host-bg:#fffffff2;--host-ink:#18291f;
 --seg-hatch:#ffffff5c;--seg-dot:#ffffff80;--shadow-badge:0 1px 3px #0003;--shadow-toast:0 6px 30px #0004}
:root[data-scheme=dark]{color-scheme:dark;
 --whole:#5cc790;--parts:#e9a640;--excerpt:#ab9ef2;--missing:#f2826f;--unknown:#84928a;--whole-ink:#05231a;
 --whole-bg:#173827;--parts-bg:#3a2c12;--excerpt-bg:#29244a;--missing-bg:#40201b;--unknown-bg:#1c2823;
 --acc-ok:#8cc3ff;--acc-public:#a9b6bf;--acc-vpn:#e59ac6;--acc-lic:#7fd1cc;--acc-bad:#cfcfcf;
 --ser-modern:#86d6a8;--ser-classic:#e3c167;--ser-shalom-classic:#9cc4ec;--ser-shalom-modern:#d6a6dc;--ser-elmo:#f2a28e}

:root,.tp-sw-terracotta{
 --bg:#f9f2eb;--surface:#fffcf8;--surface-2:#f3e9e0;--surface-3:#eaddd1;
 --ink:#301f18;--muted:#6a5449;--line:#e3d7cc;--line-strong:#c2ac9b;
 --brand:#803414;--primary:#00445f;--primary-ink:#fff;--primary-hover:#00364c;
 --accent:#dfbd7c;--focus:#1e3a71;--link:#164878;--chip:#e4dad3;--chip-ink:#4b382f;
 --art-veil:#fffcf8cc;--shadow:0 1px 2px #3a1a100f,0 6px 18px #3a1a100d;
 --mast-ink:#fff;--mast-ink-soft:#fdf7f3;--mast-hover:#ffffff18;--mast-chip:#ffffff26;
 --mast-current:#fff;--mast-current-ink:#803414;--mast-ctl:#ffffff14;--mast-ctl-hover:#ffffff26;--mast-ctl-line:#ffffff80;
 --mast-focus:#f3d68f;--mast-divider:#ffffff59;--mast-current-divider:#80341499}
:root[data-scheme=dark],[data-scheme=dark] .tp-sw-terracotta{
 --bg:#140e0b;--surface:#1e1511;--surface-2:#281c17;--surface-3:#33251f;
 --ink:#f1e9e3;--muted:#c1ad9f;--line:#382a25;--line-strong:#56433a;
 --brand:#58230c;--primary:#2f7990;--primary-ink:#fff;--primary-hover:#256a80;
 --accent:#e0d2b4;--focus:#c1e3fc;--link:#b3d6ff;--chip:#463e39;--chip-ink:#e6dbd3;
 --art-veil:#1e1511cc;--shadow:0 1px 2px #0006}
/* Mockup-only derived tokens: mixes of the palette tokens above, so they follow the palette and scheme */
:root{--bezel:var(--ink);--screen-bg:var(--surface-3);--cab:var(--brand);--cab-ink:var(--mast-ink);--cab-soft:var(--mast-ink-soft);
 --cab-line:var(--mast-divider);--cab-key:var(--mast-ctl);--cab-key-hover:var(--mast-ctl-hover);
 --serif:"New York","Iowan Old Style",Charter,Georgia,"Times New Roman",serif;
 --he-font:"Arial Hebrew","Noto Sans Hebrew","Arial",sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --round:"Arial Rounded MT Bold",ui-rounded,var(--font);
 --r:14px;--r-lg:22px}
:root[data-scheme=dark]{--bezel:var(--bg);--screen-bg:var(--surface-2)}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;line-height:1.4;font-size:15px}
[dir=rtl] body{font-size:15.5px}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
bdi{unicode-bidi:isolate}
.he-t{font-family:var(--he-font)}
.muted{color:var(--muted)}
/* ---------- masthead ---------- */
.mast{background:var(--brand);color:var(--mast-ink);border-bottom:4px solid var(--accent)}
.mast-in{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px}
.word{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.01em;color:var(--mast-ink);text-decoration:none;white-space:nowrap}
[dir=rtl] .word{font-family:var(--he-font);font-weight:700}
.nav{display:flex;gap:4px}
.nav a{color:var(--mast-ink);text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;min-height:40px;display:inline-flex;align-items:center}
.nav a:hover{background:var(--mast-hover)}
.nav a[aria-current=page]{background:var(--mast-current);color:var(--mast-current-ink)}
.mast :focus-visible{outline-color:var(--mast-focus)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--mast-ctl);border:1px solid var(--mast-ctl-line);border-radius:999px;padding:0 14px;min-height:40px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--mast-ink);font:inherit;padding:8px 0}
.search input::placeholder{color:var(--mast-ink-soft);opacity:.85}
.search input:focus{outline:none}
.search:focus-within{outline:3px solid var(--mast-focus);outline-offset:1px}
.mast-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--mast-ctl-line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mast-ink);padding:0 13px;min-height:38px;min-width:44px;cursor:pointer;font-weight:600}
.seg button[aria-checked=true]{background:var(--mast-current);color:var(--mast-current-ink)}
.appear{position:relative}
.appear>summary{list-style:none;cursor:pointer;width:40px;height:40px;border-radius:50%;border:1px solid var(--mast-ctl-line);display:grid;place-items:center;background:var(--mast-ctl)}
.appear>summary::-webkit-details-marker{display:none}
.appear>summary:hover{background:var(--mast-ctl-hover)}
.appear .menu{position:absolute;inset-inline-end:0;top:46px;z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-toast);padding:6px;min-width:160px}
.appear .menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:start}
.appear .menu button:hover{background:var(--surface-2)}
.appear .menu button[aria-checked=true]::after{content:"✓";margin-inline-start:auto;color:var(--primary)}
.moon{width:16px;height:16px;border-radius:50%;background:var(--mast-ink);box-shadow:inset -5px -2px 0 0 var(--brand)}
[data-scheme=dark] .moon{box-shadow:inset -5px -2px 0 0 var(--brand)}
/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 40px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:22px;align-items:start}
/* ---------- the TV set ---------- */
.tv{position:relative;background:var(--cab);color:var(--cab-ink);border-radius:30px;padding:16px;
 background-image:repeating-linear-gradient(100deg,transparent 0 22px,var(--mast-hover) 22px 23px,transparent 23px 47px);
 box-shadow:inset 0 0 0 2px var(--cab-line),var(--shadow);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:12px}
.tv::before,.tv::after{content:"";position:absolute;bottom:-11px;width:54px;height:12px;border-radius:0 0 10px 10px;background:var(--line-strong)}
.tv::before{inset-inline-start:58px}.tv::after{inset-inline-end:58px}
.tv-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.bezel{background:var(--bezel);border-radius:26px;padding:12px;box-shadow:inset 0 0 0 3px var(--cab-line)}
.screen{position:relative;aspect-ratio:16/9;border-radius:20px/24px;overflow:hidden;background:var(--screen-bg);display:block;width:100%;border:0;padding:0;cursor:pointer}
.screen img{width:100%;height:100%;object-fit:cover;display:block}
.screen::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(ellipse at 50% 45%,transparent 58%,color-mix(in srgb,var(--scrim) 45%,transparent) 100%)}
.osd{position:absolute;z-index:2;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--scrim);color:var(--scrim-ink);padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.osd.ch{top:10px;inset-inline-start:12px}.osd.dur{bottom:10px;inset-inline-end:12px}
.osd.pick{top:10px;inset-inline-end:12px;font-family:var(--font);letter-spacing:0}
.screen .static{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;
 background:repeating-radial-gradient(circle at 37% 61%,var(--scrim-ink) 0 1px,transparent 1px 3px),repeating-radial-gradient(circle at 70% 20%,var(--scrim) 0 1px,transparent 1px 2px),var(--screen-bg)}
.screen.tuning .static{animation:stat .18s ease-out}
@keyframes stat{from{opacity:.55}to{opacity:0}}
.ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted);background:repeating-linear-gradient(135deg,var(--surface-3) 0 14px,var(--surface-2) 14px 28px);font-family:var(--mono)}
.ph b{font-size:clamp(22px,5vw,44px);color:var(--ink)}
.ph small{font-family:var(--font);font-size:13px}
.grille{flex:1;min-height:34px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px;
 background:repeating-linear-gradient(0deg,transparent 0 4px,var(--cab-line) 4px 5px);color:var(--cab-soft);font-size:13px}
.grille .sum{background:var(--cab);padding:3px 10px;border-radius:999px;box-shadow:0 0 0 1px var(--cab-line)}
.grille .badge{font-family:var(--serif);font-style:italic;font-size:15px;background:var(--cab);padding:2px 10px;border-radius:6px;box-shadow:0 0 0 1px var(--cab-line);white-space:nowrap}
[dir=rtl] .grille .badge{font-family:var(--he-font);font-style:normal;font-weight:700}
.tv-right{display:flex;flex-direction:column;gap:10px;min-width:0}
.tuner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.chwin{background:var(--bezel);border-radius:12px;padding:8px 12px;box-shadow:inset 0 0 0 2px var(--cab-line);color:var(--accent);min-width:0}
.chwin .chn{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.1;letter-spacing:.04em}
.chwin .chname{font-size:12.5px;line-height:1.25;color:var(--accent);opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chwin select{width:100%;border:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;padding:2px 0;cursor:pointer}
.chwin select option{color:var(--ink);background:var(--surface)}
.chsteps{display:none}
/* the dial */
.dial-wrap{position:relative;width:128px;height:128px;flex:none}
.dial-lab{position:absolute;inset:0;pointer-events:none}
.dial-lab button{pointer-events:auto;position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:0;background:transparent;
 color:var(--cab-soft);font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer;border-radius:50%;padding:0}
.dial-lab button[aria-current=true]{color:var(--cab-ink);background:var(--cab-key-hover)}
.dial{position:absolute;inset:27px;border-radius:50%;cursor:grab;touch-action:none;
 background:radial-gradient(circle at 40% 35%,var(--surface) 0 18%,var(--surface-2) 19% 55%,var(--surface-3) 56% 100%);
 box-shadow:0 3px 0 var(--line-strong),0 0 0 3px var(--cab-line),inset 0 -3px 6px color-mix(in srgb,var(--scrim) 25%,transparent);transition:transform .22s cubic-bezier(.3,1.4,.6,1)}
.dial::before{content:"";position:absolute;left:50%;top:5px;width:5px;height:22px;margin-left:-2.5px;border-radius:3px;background:var(--primary)}
.dial::after{content:"";position:absolute;inset:8px;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0 8deg,color-mix(in srgb,var(--line-strong) 55%,transparent) 8deg 10deg);
 -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.dial:active{cursor:grabbing}
/* the label plate */
.plate{background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 16px 14px;box-shadow:inset 0 0 0 1px var(--line),0 2px 0 var(--cab-line);flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.plate .ticket{font-size:15px}
.plate .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.plate .meta .num{font-family:var(--mono)}
.t1{font-family:var(--serif);font-size:23px;line-height:1.15;font-weight:600;margin:0;overflow-wrap:anywhere}
[dir=rtl] .t1{font-family:var(--he-font);font-weight:700;font-size:24px}
.t2{font-size:15px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.t2[lang=he]{font-family:var(--he-font);font-size:16px}
.ours{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-inline-start:6px;white-space:nowrap;vertical-align:middle;font-family:var(--font);font-weight:400}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
.acc{font-size:12.5px;color:var(--muted)}
/* ticket-stub watch button */
.ticket{display:inline-flex;align-items:stretch;text-decoration:none;border-radius:12px;min-height:48px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:16px;
 box-shadow:0 2px 0 color-mix(in srgb,var(--primary) 60%,var(--ink));max-width:100%}
.ticket:hover{background:var(--primary-hover)}
.ticket .go{display:flex;align-items:center;gap:8px;padding:0 16px;min-width:0}
.ticket .go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .stub{display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-size:14px;font-weight:600;border-inline-start:2px dashed color-mix(in srgb,var(--primary-ink) 55%,transparent);position:relative}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;inset-inline-start:-7px;width:12px;height:12px;border-radius:50%;background:var(--surface)}
.ticket .stub::before{top:-6px}.ticket .stub::after{bottom:-6px}
.ticket svg{flex:none}
.nobtn{font-size:14px;color:var(--muted);padding:6px 0}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px;font-weight:600;text-decoration:none;
 box-shadow:0 2px 0 var(--line-strong)}
.ibtn:hover{background:var(--surface-2)}
.ibtn:active{transform:translateY(2px);box-shadow:none}
.ibtn[aria-pressed=true]{background:var(--chip);border-color:var(--line-strong)}
.ibtn .st{color:var(--star-ink)}
.ibtn[aria-pressed=true] .st{color:var(--star-ink)}
.star-on{color:var(--star)!important;-webkit-text-stroke:1px var(--star-ink)}
.link{background:none;border:0;padding:6px 2px;color:var(--link);text-decoration:underline;cursor:pointer;font-size:14px}
/* rubber keys on the cabinet */
.keys{display:grid;grid-template-columns:auto 1fr auto;gap:8px}
.key{min-height:46px;border-radius:12px;border:1px solid var(--cab-line);background:var(--cab-key);color:var(--cab-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;
 box-shadow:0 3px 0 var(--cab-line)}
.key:hover{background:var(--cab-key-hover)}
.key:active{transform:translateY(3px);box-shadow:none}
.key:focus-visible{outline-color:var(--mast-focus)}
.key.big{background:var(--surface);color:var(--ink);border-color:var(--line-strong);box-shadow:0 3px 0 var(--line-strong)}
.key.big:hover{background:var(--surface-2)}
.key .cnt{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted)}
/* Hebrew-numeral die */
.die{width:26px;height:26px;border-radius:7px;background:var(--surface);border:2px solid var(--ink);color:var(--ink);display:grid;place-items:center;font-family:var(--he-font);font-weight:700;font-size:15px;line-height:1}
.die.roll{animation:roll .5s cubic-bezier(.3,.7,.4,1)}
@keyframes roll{0%{transform:rotate(0) scale(1)}40%{transform:rotate(200deg) scale(.8)}100%{transform:rotate(360deg) scale(1)}}
/* ---------- Tonight ---------- */
.tonight{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 12px;box-shadow:var(--shadow)}
.tonight h2{font-family:var(--serif);font-size:22px;margin:0;font-weight:600}
[dir=rtl] .tonight h2,[dir=rtl] .h2{font-family:var(--he-font);font-weight:700}
.tn-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.tn-head .mono{font-size:13px;color:var(--muted)}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:18px 84px minmax(0,1fr);gap:8px;align-items:center;padding:4px;border-radius:12px}
.qi.cur{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent)}
.qi.done{opacity:.6}
.qi .qn{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.qi.done .qn::before{content:"✓"}
.qi.done .qn span{display:none}
.qi .qt{width:84px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--surface-3);position:relative;border:0;padding:0;cursor:pointer}
.qi .qt img{width:100%;height:100%;object-fit:cover;display:block}
.qi .qx{min-width:0;font-size:13.5px;line-height:1.25}
.qi .qx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.qi .qx small{color:var(--muted);font-family:var(--mono);font-size:12px}
.qi .qrow{display:flex;align-items:center;justify-content:space-between;gap:4px}
.qi .qc{display:flex;gap:2px}
.qi .mini{width:28px;height:26px}
.mini{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center;font-size:14px}
.mini:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.opennext{display:flex;width:100%;margin-top:10px;justify-content:space-between}
.opennext .go{flex:1}
.opennext .go span{white-space:normal;line-height:1.2;padding:6px 0}
.tn-empty{display:flex;gap:12px;align-items:center;padding:8px 2px 4px;color:var(--muted);font-size:14px}
.recent{margin-top:12px;border-top:1px dashed var(--line-strong);padding-top:10px}
.recent h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ri{display:flex;align-items:center;gap:8px;font-size:13.5px}
.ri .rt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:6px 0;text-align:start;cursor:pointer;color:var(--ink)}
.ri .rt:hover{text-decoration:underline}
.ri .rc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.again{min-height:32px;padding:0 10px;font-size:13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;font-weight:600}
.again:hover{background:var(--surface-2)}
/* ---------- tuning strip (filters) ---------- */
.strip{display:flex;flex-direction:column;gap:12px;margin:24px 0 18px}
.stoop{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:thin;scroll-snap-type:x proximity}
.tok{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;cursor:pointer;padding:4px 2px 6px;border-radius:14px;scroll-snap-align:start;color:var(--ink)}
.tok .face{position:relative;width:62px;height:62px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;transition:transform .15s}
.tok .face .fi{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.tok .face img{width:100%;height:100%;object-fit:cover;display:block}
.tok .face .ini{font-family:var(--round);font-size:26px;font-weight:700;color:var(--muted)}
[dir=rtl] .tok .face .ini{font-family:var(--he-font)}
.tok .face::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--line)}
.tok.kippi .face::before{content:"";position:absolute;inset:-9px;border-radius:50%;z-index:-1;
 background:repeating-conic-gradient(var(--accent) 0 7deg,transparent 7deg 15deg);-webkit-mask:radial-gradient(circle,transparent 56%,#000 57%);mask:radial-gradient(circle,transparent 56%,#000 57%)}
.tok.oofnik .face{border-radius:12px 12px 18px 18px}
.tok.oofnik .face::after{border-radius:12px 12px 18px 18px;box-shadow:0 0 0 2px var(--line-strong)}
.tok.oofnik .face::before{content:"";position:absolute;top:-9px;left:-6px;right:-6px;height:8px;border-radius:6px 6px 2px 2px;background:var(--line-strong);transform:rotate(-8deg);transform-origin:right bottom}
.tok b{font-size:13px;font-weight:600;line-height:1.1;text-align:center}
.tok small{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 7px}
.tok:hover .face{transform:rotate(-4deg)}
.tok[aria-pressed=true] .face{transform:translateY(-3px)}
.tok[aria-pressed=true] .face::after{box-shadow:0 0 0 3px var(--primary)}
.tok[aria-pressed=true] small{background:var(--primary);color:var(--primary-ink)}
.tok.zero{opacity:.5}
.row2{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp>.gl{font-size:13px;color:var(--muted);font-weight:600}
.chip{min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;
 box-shadow:0 2px 0 var(--line-strong)}
.chip:hover{background:var(--surface-2)}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip[aria-pressed=true],.chip[aria-checked=true]{background:var(--chip-on,var(--primary));color:var(--primary-ink);border-color:var(--primary);box-shadow:none;transform:translateY(2px)}
.chip .c{font-family:var(--mono);font-size:12px;font-weight:500;opacity:.85}
.timer{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid var(--ink);position:relative;background:conic-gradient(var(--primary) 0 var(--w,0deg),var(--surface) var(--w,0deg) 360deg)}
.timer::after{content:"";position:absolute;top:-6px;left:50%;width:6px;height:4px;margin-left:-3px;border-radius:2px 2px 0 0;background:var(--ink)}
.layout-sw{margin-inline-start:auto}
.seg2{display:inline-flex;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg2 button{border:0;background:transparent;padding:0 14px;min-height:38px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.seg2 button+button{border-inline-start:1px solid var(--line)}
.seg2 button[aria-checked=true]{background:var(--ink);color:var(--bg)}
/* ---------- guide ---------- */
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:0}
.sec-h .mono{font-size:13px;color:var(--muted)}
.sec-h .more{margin-inline-start:auto;font-size:14px}
.prod-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-top:6px}
.prod-h .h2{font-size:28px}
.prod-h .yrs{font-family:var(--mono);font-size:14px;color:var(--muted)}
.prod-h .sub{width:100%;font-size:14px;color:var(--muted)}
.prod-h .sub [lang=he]{font-family:var(--he-font)}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:228px;gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;scroll-snap-align:start}
.card .pic{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface-3);border:0;padding:0;cursor:pointer;display:block;width:100%}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.card .pic:hover img{transform:scale(1.03)}
.card .pic .d{position:absolute;bottom:6px;inset-inline-end:6px;background:var(--scrim);color:var(--scrim-ink);font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:5px}
.card .pic.ontv{box-shadow:0 0 0 3px var(--accent)}
.card .pic .ontvl{position:absolute;top:6px;inset-inline-start:6px;background:var(--accent);color:var(--ink);font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px}
.card .ct{font-weight:600;font-size:15px;line-height:1.25;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ct2{font-size:13px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ct2[lang=he]{font-family:var(--he-font);font-size:13.5px}
.card .cm{font-size:12.5px;color:var(--muted);margin:0}
.card .pic:not(.ld) .plaque{display:none}
:root[dir=ltr] :is(.ct2,.t2,.qx b,.rt,.tbar small,.lt small,.ct,.t1,.chname,.sub span){text-align:left}
:root[dir=rtl] :is(.ct2,.t2,.qx b,.rt,.tbar small,.lt small,.ct,.t1,.chname,.sub span){text-align:right}
.card .addq{position:absolute;top:6px;inset-inline-end:6px;width:34px;height:34px;border-radius:9px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px;font-weight:700;box-shadow:var(--shadow-badge);display:grid;place-items:center}
.card .addq[aria-pressed=true]{background:var(--primary);color:var(--primary-ink)}
.card .stk{position:absolute;top:-6px;inset-inline-start:-6px;z-index:2;font-size:22px;color:var(--star);-webkit-text-stroke:1px var(--star-ink);transform:rotate(-12deg);pointer-events:none}
/* album tiles with house-number plaques */
.season{margin:18px 0 8px;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.season::after{content:"";flex:1;height:1px;background:var(--line)}
.plaque{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12.5px;font-weight:700;background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong);border-radius:6px;padding:1px 8px;position:relative}
.plaque::before,.plaque::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.card .pic .plaque{position:absolute;top:6px;inset-inline-start:6px}
.cov{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.cov.w{background:var(--whole-bg);color:var(--whole)}.cov.p{background:var(--parts-bg);color:var(--parts)}
.cov.e{background:var(--excerpt-bg);color:var(--excerpt)}.cov.m{background:var(--missing-bg);color:var(--missing)}
.hang{font-size:12.5px;color:var(--muted)}
/* numbers: house-number plaques */
.plaques{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.hp{border:2px solid var(--line-strong);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:stretch;overflow:hidden;cursor:pointer;padding:0;min-height:62px;color:var(--ink);text-decoration:none;position:relative}
.hp .n{font-family:var(--mono);font-size:20px;font-weight:700;padding:8px 0 4px;text-align:center;position:relative}
.hp .n::before,.hp .n::after{content:"";position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
.hp .n::before{left:6px}.hp .n::after{right:6px}
.hp .band{font-size:11px;font-weight:600;padding:2px 2px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp .band.w{background:var(--whole-bg);color:var(--whole)}.hp .band.p{background:var(--parts-bg);color:var(--parts)}
.hp .band.e{background:var(--excerpt-bg);color:var(--excerpt)}.hp .band.m{background:var(--missing-bg);color:var(--missing)}
.hp:hover{border-color:var(--ink)}
.hp.ontv{box-shadow:0 0 0 3px var(--accent)}
.hp-tip{font-size:13px;color:var(--muted);margin:10px 0 0;min-height:20px}
/* list with duration ruler */
.ltable{width:100%;border-collapse:collapse;font-size:14px}
.ltable th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line-strong);padding:6px 8px}
.ltable td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
.ltable tr{cursor:pointer}
.ltable tr:hover td{background:var(--surface-2)}
.ltable .lt{font-weight:600}
.ltable .lt small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.ruler{height:6px;border-radius:3px;background:var(--surface-3);margin-top:5px;position:relative;max-width:320px;
 background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--tick) - 1px),var(--line-strong) calc(var(--tick) - 1px) var(--tick))}
.ruler i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px;background:var(--ink);opacity:.55}
/* ---------- episode page ---------- */
.crumbs{font-size:14px;margin:4px 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ep-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.box h2{margin:0 0 4px}
.box h3{font-size:15px;margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
.box h3 .mono{font-size:12.5px;color:var(--muted);font-weight:400}
.copy{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.copy:first-of-type{border-top:0}
.copy .cth{width:120px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--surface-3);position:relative}
.copy .cth img{width:100%;height:100%;object-fit:cover;display:block}
.copy .cx{min-width:0;font-size:13.5px}
.copy .cx b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.copy .cx .role{font-size:12px;font-weight:700;color:var(--ink);background:var(--chip);border-radius:5px;padding:0 6px;margin-inline-end:6px}
.copy .cx .ev{display:block;color:var(--muted)}
.copy .ticket{min-height:42px;font-size:14.5px}
.copy .ticket .go{padding:0 12px}
.copy.dim{opacity:.75}
.copy .status{font-size:13px;color:var(--muted);text-align:end}
/* parts as a train */
.train{display:flex;align-items:flex-end;gap:0;overflow-x:auto;padding:10px 2px 16px}
.engine,.car{flex:none;position:relative;border-radius:10px;padding:8px 12px 10px;text-decoration:none;color:var(--ink);background:var(--surface-2);border:2px solid var(--line-strong);min-width:118px}
.engine{background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:18px 10px 10px 10px;min-width:126px}
[dir=rtl] .engine{border-radius:10px 18px 10px 10px}
.engine::before{content:"";position:absolute;top:-12px;inset-inline-start:16px;width:16px;height:12px;border-radius:4px 4px 0 0;background:var(--ink)}
.engine b,.car b{display:block;font-family:var(--mono);font-size:15px}
.engine small,.car small{font-size:12px}
.car{cursor:pointer;border-top-width:8px}
.car:hover{border-color:var(--ink)}
.car.opened{border-top-color:var(--accent)}
.car .op{display:block;font-size:11.5px;color:var(--muted)}
.car::after,.engine::after{content:"";position:absolute;bottom:-9px;inset-inline-start:18px;width:14px;height:14px;border-radius:50%;background:var(--ink);box-shadow:60px 0 0 var(--ink)}
.couple{flex:none;width:16px;height:4px;background:var(--line-strong);margin-bottom:22px}
.dl{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:8px 14px;margin:8px 0 0;font-size:14px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;overflow-wrap:anywhere}
.dl dd [lang=he]{font-family:var(--he-font)}
.quote{border-inline-start:3px solid var(--accent);padding-inline-start:10px;font-family:var(--he-font);font-size:15px}
.ladder{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.ladder li{padding:5px 0;display:flex;gap:8px;align-items:center;color:var(--muted)}
.ladder li::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--line-strong)}
.ladder li.now{color:var(--ink);font-weight:700}
.ladder li.now::before{background:var(--ink);border-color:var(--ink)}
.ladder li.now::after{content:attr(data-now);font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 6px}
.srcs{font-size:13px;margin:6px 0 0;padding-inline-start:18px}
.possible{margin-top:14px}
.possible summary{cursor:pointer;font-size:14px;color:var(--muted);font-weight:600;min-height:32px}
.personal{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* ---------- browse ---------- */
.browse{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;margin-top:18px}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:96px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding-inline-end:6px}
.fg h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between}
.fg .opts{display:flex;flex-wrap:wrap;gap:6px}
.fg .chip{min-height:34px;font-size:13.5px;padding:0 11px}
.minifaces{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.minifaces .tok{width:auto}
.minifaces .tok .face{width:46px;height:46px}
.minifaces .tok b{font-size:11.5px}
.res-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.res-h .n{font-family:var(--mono);font-size:14px}
.pegs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1}
.peg{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 4px 0 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:13px;font-weight:600;border:0;cursor:pointer}
[dir=rtl] .peg{padding:0 10px 0 4px}
.peg::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line-strong)}
.peg span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.peg:hover span{background:var(--surface)}
.sortsel{min-height:38px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit;font-size:14px}
/* portable TV (browse) */
.ptv{position:sticky;top:0;z-index:12;background:var(--cab);color:var(--cab-ink);border-radius:20px;padding:10px;display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:14px;align-items:center;box-shadow:inset 0 0 0 2px var(--cab-line),var(--shadow);
 background-image:repeating-linear-gradient(100deg,transparent 0 22px,var(--mast-hover) 22px 23px,transparent 23px 47px)}
.ptv .bezel{padding:6px;border-radius:14px}
.ptv .screen{border-radius:10px/12px}
.ptv .osd{font-size:10.5px;padding:2px 6px}
.ptv .pinfo{min-width:0;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-self:stretch;justify-content:center}
.ptv .pinfo .t1{font-size:19px}
.ptv .pinfo .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ptv .pkeys{display:flex;flex-direction:column;gap:8px}
/* empty states */
.empty{display:flex;gap:16px;align-items:center;padding:26px 8px;color:var(--muted)}
.empty .say{font-size:16px;color:var(--ink);font-weight:600}
.relax{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bin{width:54px;height:56px;position:relative;flex:none}
.bin i{position:absolute;bottom:0;left:6px;right:6px;height:40px;border-radius:4px 4px 10px 10px;background:repeating-linear-gradient(90deg,var(--surface-3) 0 7px,var(--line-strong) 7px 9px);border:2px solid var(--line-strong)}
.bin b{position:absolute;top:6px;left:0;right:0;height:9px;border-radius:6px 6px 2px 2px;background:var(--line-strong);transform:rotate(-14deg);transform-origin:left bottom;transition:transform .3s}
.bin s{position:absolute;top:16px;left:18px;width:20px;height:6px;text-decoration:none}
.bin s::before,.bin s::after{content:"";position:absolute;top:0;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.bin s::before{left:0}.bin s::after{right:0}
.hedge{width:54px;height:44px;position:relative;flex:none}
.hedge i{position:absolute;inset:8px 4px 0;border-radius:50% 50% 40% 40%;background:var(--surface-3);border:2px solid var(--line-strong)}
.hedge b{position:absolute;inset:0 0 10px;border-radius:50% 50% 0 0;background:repeating-conic-gradient(from -90deg at 50% 100%,var(--accent) 0 9deg,transparent 9deg 18deg);-webkit-mask:linear-gradient(#000 60%,transparent 60%);mask:linear-gradient(#000 60%,transparent 60%)}
.hedge s{position:absolute;bottom:12px;inset-inline-end:2px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
/* not found */
.nf h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0 0 4px}
[dir=rtl] .nf h1{font-family:var(--he-font);font-weight:700}
.nf section{margin-top:22px}
.nf ul{list-style:none;padding:0;margin:8px 0 0;columns:2 340px;column-gap:28px;font-size:14px}
.nf li{padding:5px 0;border-bottom:1px solid var(--line);break-inside:avoid;display:flex;gap:10px;align-items:baseline}
.nf li .mono{color:var(--muted);min-width:56px}
.nf li a{color:var(--ink)}
/* footer */
.foot{max-width:1280px;margin:0 auto;padding:18px 24px 90px;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)}
.foot a,.foot button{color:var(--muted)}
.binlink{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.binlink:hover{color:var(--ink)}
.binlink .bin{width:20px;height:22px}
.binlink .bin i{left:2px;right:2px;height:15px;border-width:1.5px;background:repeating-linear-gradient(90deg,var(--surface-3) 0 3px,var(--line-strong) 3px 4px)}
.binlink .bin b{top:3px;height:4px;border-radius:3px}
.binlink .bin s{display:none}
.binlink:hover .bin b{transform:rotate(-30deg)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:20px 22px;box-shadow:var(--shadow-toast)}
dialog::backdrop{background:var(--scrim)}
dialog h2{margin:0 0 8px;font-family:var(--serif);font-weight:600}
dialog ul{padding-inline-start:20px;font-size:14px}
.btnp{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-ink);font-weight:700;cursor:pointer}
.btnp:hover{background:var(--primary-hover)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow-toast);display:none}
.toast.on{display:block}
/* phone tonight bar */
.tbar{display:none}
/* ---------- responsive ---------- */
@media (max-width:1100px){
 .top{grid-template-columns:minmax(0,1fr)}
 .tonight{display:none}
 .tbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line-strong);padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:10px;align-items:center;box-shadow:var(--shadow-toast)}
 .tbar .tl{flex:1;min-width:0;background:none;border:0;text-align:start;cursor:pointer;padding:4px 0;color:var(--ink)}
 .tbar .tl b{display:block;font-size:15px}
 .tbar .tl small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
 .tbar .btnp{min-height:48px}
 body.sheet .tonight{display:block;position:fixed;inset-inline:0;bottom:0;z-index:50;border-radius:22px 22px 0 0;max-height:78vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
 body.sheet::after{content:"";position:fixed;inset:0;background:var(--scrim);z-index:45}
 .sheet-x{display:inline-grid!important}
}
.sheet-x{display:none!important}
@media (max-width:860px){
 .tv{display:flex;flex-direction:column;padding:12px;border-radius:24px;gap:10px}
 .tv-left,.tv-right{display:contents}
 .tv .bezel{order:1}.tv .plate{order:2}.tv .keys{order:3}.tv .chsteps{order:4}.tv .tuner{order:5}
 .grille{display:none}
 .tuner{grid-template-columns:minmax(0,1fr)}
 .dial-wrap{display:none}
 .chsteps{display:flex;gap:8px;align-items:center}
 .chsteps .key{min-width:52px;min-height:48px;font-size:18px}
 .chsteps .chwin{flex:1}
 .tuner>.chwin{display:none}
 .ep-cols{grid-template-columns:minmax(0,1fr)}
 .browse{grid-template-columns:minmax(0,1fr)}
 .side{position:static;max-height:none;overflow:visible}
 .ptv{grid-template-columns:120px minmax(0,1fr);border-radius:16px}
 .ptv .pkeys{grid-column:1/-1;flex-direction:row}
 .ptv .pkeys .key{flex:1}
 .plaques{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:600px){
 body{font-size:15px}
 .mast-in{padding:8px 12px;gap:10px;flex-wrap:wrap}
 .word{font-size:21px}
 .mast-in>.word{display:none}
 .mast-end{gap:6px}
 .search{order:5;flex-basis:100%;max-width:none}
 .nav a{padding:6px 11px}
 .wrap{padding:12px 12px 30px}
 .t1{font-size:21px}
 .bezel{padding:7px;border-radius:18px}
 .screen{border-radius:12px/14px}
 .acts .ticket{flex:1 1 100%}
 .ticket{min-height:54px;font-size:17px}
 .ticket .go{flex:1;justify-content:center}
 .shelf{grid-auto-columns:minmax(168px,62%)}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .card .ct{font-size:14px}
 .layout-sw{margin-inline-start:0}
 .copy{grid-template-columns:84px minmax(0,1fr)}
 .copy .cth{width:84px}
 .copy>:last-child{grid-column:1/-1}
 .copy .ticket{width:100%}
 .ltable .hide-s{display:none}
 .ptv{position:static;grid-template-columns:112px minmax(0,1fr);grid-template-areas:"scr ttl" "act act" "key key";gap:8px;padding:8px}
 .ptv .bezel{grid-area:scr}
 .ptv .pinfo{display:contents}
 .ptv .pinfo .t1{grid-area:ttl;font-size:16px;color:var(--cab-ink);align-self:center}
 .ptv .pinfo .row{grid-area:act;background:var(--surface);border-radius:12px;padding:8px}
 .ptv .pinfo .row .ticket{flex:1 1 100%}
 .ptv .pinfo .acc{display:none}
 .ptv .pkeys{grid-area:key}
 .foot{padding-bottom:100px}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (forced-colors:active){.ticket,.key,.chip,.ibtn{border:1px solid ButtonText}}
.pic img,.screen img,.cth img,.qt img{position:relative;z-index:1}
.cth .ph,.qt .ph{font-size:11px}
.card .pic .d,.card .pic .plaque,.card .pic .ontvl,.card .addq,.card .stk{z-index:3}

.fdet>summary{list-style:none;cursor:pointer;display:none}
.fdet>summary::-webkit-details-marker{display:none}
@media (max-width:860px){.fdet>summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);font-weight:700;box-shadow:0 2px 0 var(--line-strong)}
 .fdet[open]>summary{margin-bottom:14px}
 .fdet>summary::after{content:"▾";color:var(--muted)}.fdet[open]>summary::after{content:"▴"}}
[dir=rtl] .res-h .n{font-family:var(--font)}

  ${list.length ? `<div class="grid">${list.slice(0, shownN).map(x => cardHTML(x, {acc: true})).join('')}</div>${list.length > shownN ? `<p style="text-align:center;margin-top:18px"><button class="ibtn" data-act="more">+ ${fmtN(Math.min(60, list.length - shownN))}</button></p>` : ''}` : emptyHTML('oofnik', relaxHTML('browse'))}</div>`;
 return `${ptvHTML(it)}<div class="browse">${side}${res}</div>`;
}
/* ================= Not found ================= */
function notFoundHTML() {
 const groups = P.map((p, c) => ({p, c, list: E.filter(e => e.p === c && e.cov !== 'w').sort((a, b) => (a.cov === 'm' ? 0 : 1) - (b.cov === 'm' ? 0 : 1) || a.n - b.n)})).filter(g => g.list.length || g.p.id === 'coproduction-1998-arabic');
 return `<div class="nf"><h1>${t('nf_title')}</h1><p class="muted">${t('nf_eps')} · <a href="#/">${t('nf_back')}</a></p>
 ${groups.map(g => `<section><h2 class="h2" style="font-size:20px">${esc(pName(g.c))} <span class="mono muted" style="font-size:13px">${esc(g.p.y)} · ${fmtN(g.list.length)}</span></h2>
  ${g.list.length ? `<ul>${g.list.map(e => { const tt = epTitle(e); const m = (e.c.match(/x(\d+)/) || [])[1];
   return `<li><span class="mono">${esc(t('ietv', {n: e.n}))}</span><a href="#/ep/${encodeURIComponent(e.id)}" lang="${langOf(tt.s)}" dir="auto">${esc(tt.s)}</a>${e.cov !== 'm' ? covTag(e) : ''}${m ? `<small class="muted">${t('poss_n', {n: m})}</small>` : ''}</li>`; }).join('')}</ul>` : `<p class="muted">${t('nf_arabic')}</p>`}</section>`).join('')}
 <section><p>${t('nf_queue', {n: fmtN(D.T.queue)})}</p></section></div>`;
}
/* ================= page shell ================= */
function mastHTML() {
 const ap = root.dataset.appearance || 'system';
 return `<div class="mast-in">
 <a class="word" href="#/" lang="${lang}">${lang === 'he' ? 'סומסום' : 'Sumsum'}</a>
 <nav class="nav" aria-label="${esc(lang === 'he' ? 'ניווט' : 'Main')}"><a href="#/" ${S.route === 'watch' || S.route === 'ep' ? 'aria-current="page"' : ''}>${t('nav_watch')}</a><a href="${S.route === 'browse' ? browseHash() : '#/browse'}" ${S.route === 'browse' ? 'aria-current="page"' : ''}>${t('nav_browse')}</a></nav>
 <form class="search" role="search" data-act="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input type="search" name="q" value="${esc(S.f.q)}" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}"></form>
 <div class="mast-end">
  <div class="seg" role="radiogroup" aria-label="${esc(t('lang'))}"><button role="radio" data-act="lang" data-v="en" aria-checked="${lang === 'en'}" lang="en">EN</button><button role="radio" data-act="lang" data-v="he" aria-checked="${lang === 'he'}" lang="he">עב</button></div>
  <details class="appear"><summary aria-label="${esc(t('appear'))}"><span class="moon" aria-hidden="true"></span></summary><div class="menu" role="radiogroup" aria-label="${esc(t('appear'))}">${['system', 'light', 'dark'].map(v => `<button role="radio" data-act="appear" data-v="${v}" aria-checked="${ap === v}">${t('ap_' + v)}</button>`).join('')}</div></details>
 </div></div>`;
}
function footHTML() {
 const nf = E.filter(e => e.cov === 'm').length;
 return `<a class="binlink" href="#/notfound"><span class="bin" aria-hidden="true"><b></b><i></i><s></s></span>${t('nf_link', {n: fmtN(nf)})}</a>
 <button class="link" data-act="about" style="color:var(--muted)">${t('about')}</button>`;
}
let lastRoute = '';
function render() {
 const fk = focusKey();
 document.getElementById('mast').innerHTML = mastHTML();
 let html = '';
 if (S.route === 'browse') html = browseHTML();
 else if (S.route === 'ep') html = episodeHTML();
 else if (S.route === 'notfound') html = notFoundHTML();
 else { if (!S.tv || !BYKEY.has(S.tv)) { const f = guideOrder(scopeItems('watch')).find(itFree); if (f) S.tv = f.key; } html = watchHTML(); }
 document.getElementById('app').innerHTML = html;
 document.getElementById('foot').innerHTML = footHTML();
 document.getElementById('tbar').innerHTML = S.route === 'notfound' ? '' : tbarHTML();
 document.getElementById('aboutdlg').innerHTML = aboutHTML();
 document.title = (lang === 'he' ? 'סומסום · ' : 'Sumsum · ') + ({watch: t('nav_watch'), browse: t('nav_browse'), ep: t('ep_page'), notfound: t('nf_title')}[S.route]);
 // dial animation from the previous angle
 const dial = document.getElementById('dial');
 if (dial && S.dialMoved) { void dial.offsetWidth; dial.style.transform = `rotate(${dialAngle(S.ci)}deg)`; }
 S.dialMoved = false; S.tuning = false; S.rolled = false;
 if (S.route !== lastRoute) { if (lastRoute) window.scrollTo(0, 0); lastRoute = S.route; }
 restoreFocus(fk);
 wireDial();
}
function focusKey() { const a = document.activeElement; if (!a || a === document.body) return null; if (a.id === 'dial') return '#dial'; const act = a.getAttribute('data-act'); if (!act) return a.name === 'q' ? 'input[name=q]' : null; return `[data-act="${act}"]` + (a.hasAttribute('data-k') ? `[data-k="${CSS.escape(a.getAttribute('data-k'))}"]` : '') + (a.hasAttribute('data-v') ? `[data-v="${CSS.escape(a.getAttribute('data-v'))}"]` : ''); }
function restoreFocus(k) { if (!k) return; const el = document.querySelector(k); if (el) el.focus({preventScroll: true}); }
function aboutHTML() {
 return `<h2>${t('ab_h')}</h2><p>${t('ab_p')}</p><ul>${t('ab_items').map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="muted">${t('ab_not')}</p>
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btnp" data-act="export">${t('export')}</button><button class="ibtn" data-act="import">${t('import')}</button><button class="ibtn" data-act="aboutclose" style="margin-inline-start:auto">${t('close')}</button></div>`;
}
/* ================= preferences ================= */
function applyLang(l, persist) {
 lang = l === 'he' ? 'he' : 'en'; root.lang = lang; root.dir = lang === 'he' ? 'rtl' : 'ltr';
 if (persist) ls.set(K.lang, lang);
}
function applyAppearance(a, persist) {
 a = ['system', 'light', 'dark'].includes(a) ? a : 'system'; root.dataset.appearance = a;
 const dark = a === 'dark' || (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
 root.dataset.scheme = dark ? 'dark' : 'light';
 document.getElementById('meta-cs').content = a === 'system' ? 'light dark' : (dark ? 'dark' : 'light');
 if (persist) ls.set(K.appear, a);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (root.dataset.appearance === 'system') applyAppearance('system'); });
/* ================= events ================= */
document.addEventListener('click', ev => {
 const el = ev.target.closest('[data-act]'); if (!el) return;
 const act = el.dataset.act, v = el.dataset.v;
 const scope = currentScope();
 switch (act) {
  case 'lang': if (v !== lang) { applyLang(v, true); render(); } return;
  case 'appear': applyAppearance(v, true); el.closest('details').open = false; render(); return;
  case 'chan': setChannel(+v); render(); return;
  case 'chstep': setChannel(S.ci + (+v)); render(); return;
  case 'gochan': ev.preventDefault(); S.ci = +v; location.hash = '#/'; return;
  case 'shuffle': shuffle(); render(); return;
  case 'next': nextItem(1); render(); return;
  case 'back': if (S.hist.length) { tune(S.hist.pop(), {noHist: true}); render(); } return;
  case 'tune': tune(v); render(); if (S.route === 'ep' && v[0] === 'e') { const e = BYKEY.get(v).e; location.hash = '#/ep/' + encodeURIComponent(e.id); }
   { const tv = document.querySelector('.tv,.ptv'); if (tv) { const r = tv.getBoundingClientRect(); if (r.top < -40 || (S.route !== 'browse' && r.top > innerHeight)) tv.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'}); } }
   return;
  case 'open': markOpened(v); setTimeout(render, 50); return;
  case 'part': ST.parts.add(+v); save(); setTimeout(render, 50); return;
  case 'qnext': { const x = ST.q.find(y => y.k === v && !y.done); if (x) x.done = 1; markOpened(v); save(); tune(v); setTimeout(render, 50); return; }
  case 'qadd': qAdd(v); render(); return;
  case 'qmove': { const [i, d] = v.split(',').map(Number); const q = ST.q.filter(x => BYKEY.has(x.k)); const j = i + d; if (j < 0 || j >= q.length) return; [q[i], q[j]] = [q[j], q[i]]; ST.q = q; save(); render(); return; }
  case 'qrm': { const q = ST.q.filter(x => BYKEY.has(x.k)); q.splice(+v, 1); ST.q = q; save(); render(); return; }
  case 'qclear': ST.q = ST.q.filter(x => !x.done); save(); render(); return;
  case 'star': ST.stars.has(v) ? ST.stars.delete(v) : ST.stars.add(v); save(); render(); return;
  case 'watched': if (ST.watched[v]) delete ST.watched[v]; else ST.watched[v] = Date.now(); save(); render(); return;
  case 'fch': { const i = S.f.ch.indexOf(v); i >= 0 ? S.f.ch.splice(i, 1) : S.f.ch.push(v); S.more = 0; syncBrowseHash(); render(); return; }
  case 'flen': S.f.len = +v; S.more = 0; syncBrowseHash(); render(); return;
  case 'fsp': { const o = v === 'he' ? 'en' : 'he'; if (S.f.sp[v] && !S.f.sp[o]) S.f.sp = {he: 1, en: 1}; else S.f.sp[v] = S.f.sp[v] ? 0 : 1; S.more = 0; syncBrowseHash(); render(); return; }
  case 'fmulti': { const k = el.dataset.k, a = S.f[k], i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); S.more = 0; syncBrowseHash(); render(); return; }
  case 'fstar': S.f.star = S.f.star ? 0 : 1; syncBrowseHash(); render(); return;
  case 'fclear': S.f = fBlank(); syncBrowseHash(); render(); return;
  case 'peg': { const k = el.dataset.k; if (k === 'ch' || k === 'type' || k === 'th' || k === 'where') S.f[k] = S.f[k].filter(x => x !== v); else if (k === 'len') S.f.len = 0; else if (k === 'sp') S.f.sp = {he: 1, en: 1}; else if (k === 'star') S.f.star = 0; else if (k === 'p') S.f.p = -1; else if (k === 'q') S.f.q = ''; syncBrowseHash(); render(); return; }
  case 'relax': { if (v === 'len') S.f.len = 0; else if (v === 'sp') S.f.sp = {he: 1, en: 1}; else if (v === 'type') S.f.type = []; else if (v === 'all') { const q = S.f.q; S.f = fBlank(); } else if (v.startsWith('ch:')) S.f.ch = S.f.ch.filter(x => x !== v.slice(3)); syncBrowseHash(); render(); return; }
  case 'layout': S.layout = v; try { sessionStorage.setItem('sumsum-r2b-layout', v); } catch (e) {} render(); return;
  case 'more': S.more++; render(); return;
  case 'sheet': document.body.classList.toggle('sheet'); render(); if (document.body.classList.contains('sheet')) { const x = document.querySelector('.tonight .sheet-x'); if (x) x.focus(); } return;
  case 'fdet': ev.preventDefault(); S.fopen = !el.parentElement.open; el.parentElement.open = S.fopen; return;
  case 'about': { const d = document.getElementById('aboutdlg'); d.showModal(); return; }
  case 'aboutclose': document.getElementById('aboutdlg').close(); return;
  case 'export': { const data = {format: 'sumsum-backup', exportedAt: new Date().toISOString(), stars: [...ST.stars], watched: ST.watched, links: ST.links, recent: ST.recent, tonight: ST.q};
   const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'})); a.download = 'sumsum-backup.json'; a.click(); toast(t('exported')); return; }
  case 'import': { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json'; inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(s => { try { const d = JSON.parse(s); if (d.stars) ST.stars = new Set(d.stars); if (d.watched) ST.watched = d.watched; if (d.recent) ST.recent = d.recent; if (d.tonight) ST.q = d.tonight; if (d.links) ST.links = d.links; save(); render(); } catch (e) {} }); }; inp.click(); return; }
 }
});
document.addEventListener('change', ev => {
 const el = ev.target;
 if (el.dataset.act === 'chsel') { setChannel(+el.value); render(); }
 else if (el.dataset.act === 'sort') { S.sort = el.value; syncBrowseHash(); render(); }
 else if (el.dataset.act === 'fp') { S.f.p = +el.value; syncBrowseHash(); render(); }
});
document.addEventListener('submit', ev => {
 if (ev.target.dataset.act !== 'search') return; ev.preventDefault();
 S.f.q = ev.target.q.value.trim();
 location.hash = browseHash(); if (S.route === 'browse') { parseHash(); render(); }
});
document.addEventListener('keydown', ev => {
 if (ev.key === 'Escape' && document.body.classList.contains('sheet')) { document.body.classList.remove('sheet'); render(); return; }
 const tr = ev.target.closest && ev.target.closest('tr[data-act=tune]');
 if (tr && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); tr.click(); }
});
document.addEventListener('mouseover', ev => { const hp = ev.target.closest('.hp'); const tip = document.getElementById('hp-tip'); if (hp && tip) tip.textContent = hp.getAttribute('aria-label'); });
document.addEventListener('focusin', ev => { const hp = ev.target.closest && ev.target.closest('.hp'); const tip = document.getElementById('hp-tip'); if (hp && tip) tip.textContent = hp.getAttribute('aria-label'); });
/* the dial: drag, wheel and keys; it only commits the channel when you let go */
function wireDial() {
 const dial = document.getElementById('dial'); if (!dial) return;
 const wrap = dial.parentElement;
 let drag = null;
 const angleAt = ev => { const r = wrap.getBoundingClientRect(); const x = ev.clientX - (r.left + r.width / 2), y = ev.clientY - (r.top + r.height / 2); return Math.atan2(x, -y) * 180 / Math.PI; };
 const nearest = a => { let best = 0, bd = 1e9; CH.forEach((c, i) => { const d = Math.abs(dialAngle(i) - a); if (d < bd) { bd = d; best = i; } }); return best; };
 dial.addEventListener('pointerdown', ev => { drag = {i: S.ci}; dial.setPointerCapture(ev.pointerId); ev.preventDefault(); });
 dial.addEventListener('pointermove', ev => {
  if (!drag) return; const a = Math.max(-140, Math.min(140, angleAt(ev))); const i = nearest(a);
  if (i !== drag.i) { drag.i = i; dial.style.transform = `rotate(${dialAngle(i)}deg)`; const w = document.querySelector('.tuner .chwin'); if (w) w.innerHTML = `<div class="chn">${t('ch')} ${String(i).padStart(2, '0')}</div><div class="chname">${esc(chName(CH[i]))}</div>`; }
 });
 const end = () => { if (!drag) return; const i = drag.i; drag = null; if (i !== S.ci) { setChannel(i); S.dialMoved = false; render(); } };
 dial.addEventListener('pointerup', end); dial.addEventListener('pointercancel', end);
 let wheelT = 0;
 wrap.addEventListener('wheel', ev => { ev.preventDefault(); const now = Date.now(); if (now - wheelT < 160) return; wheelT = now; setChannel(S.ci + (ev.deltaY > 0 ? 1 : -1)); render(); document.getElementById('dial')?.focus({preventScroll: true}); }, {passive: false});
 dial.addEventListener('keydown', ev => {
  const rtl = lang === 'he'; let d = 0;
  if (ev.key === 'ArrowUp' || ev.key === (rtl ? 'ArrowLeft' : 'ArrowRight')) d = 1;
  else if (ev.key === 'ArrowDown' || ev.key === (rtl ? 'ArrowRight' : 'ArrowLeft')) d = -1;
  else if (ev.key === 'Home') d = -S.ci; else if (ev.key === 'End') d = CH.length - 1 - S.ci;
  if (!d) return; ev.preventDefault(); setChannel(S.ci + d); render();
 });
 dial.addEventListener('click', ev => { if (ev.detail === 0) return; });
}
window.addEventListener('hashchange', () => { parseHash(); render(); });
/* ================= boot ================= */
applyLang(root.dataset.startLang || ls.get(K.lang, 'en'));
applyAppearance(root.dataset.startAppearance || ls.get(K.appear, 'system'));
seed();
parseHash();
if (!S.tv) { const hug = ITEMS.find(it => it.e && it.e.id === 'original-1980s-ietv-1'); if (hug) S.tv = hug.key; }
render();

</script>
