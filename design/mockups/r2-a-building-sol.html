function filterPanel(){return `<section class="filters"><div class="filter-grid">${filterSelect('series',t('Series','סדרה'),['classic','modern','shalom-modern','elmo'])}${filterSelect('type',t('Program type','סוג תכנית'),['episode','short','talk','clip','parts'])}${filterSelect('theme',t('Theme','נושא'),[...new Set(E.flatMap(e=>allTags(e,'themes')))].sort())}${filterSelect('character',t('Character','דמות'),[...new Set(E.flatMap(e=>allTags(e,'characters')))].sort())}</div><div class="quick">${['','300','600'].map((v,i)=>`<button class="peg ${filters.length===v?'active':''}" onclick="setFilter('length','${v}')">${i===0?t('Any length','כל אורך'):t('Under ','פחות מ־')+(i===1?'5':'10')+t(' min',' דק׳')} · ${E.filter(e=>matches(e,'length')&&(!v||seconds(e)>0&&seconds(e)<=+v)).length}</button>`).join('')}</div><div class="row between" style="margin-top:12px"><div class="row"><span class="small muted">${t('Spoken','שפת הסרטון')}</span>${['','he','en'].map(v=>`<button class="${filters.spoken===v?'active':''}" style="font-size:12px" onclick="setFilter('spoken','${v}')">${v?label(v):t('Any language','כל שפה')}</button>`).join('')}</div><button class="text small" onclick="clearFilters()">${t('Clear filters','ניקוי מסננים')}</button></div></section>`}
function guide(){let p=P.find(p=>p.id===production);return `<div class="row between"><div class="sign"><h1>${p?prodName(p.id):t('Episode guide','מדריך פרקים')}</h1><p class="mono">${p?bi(p.years):t('All productions','כל ההפקות')}</p></div><button onclick="pick()">א ${t('Surprise me','בהפתעה')}</button></div>${stoop()}${listing(true)}${footer()}`}
function listing(isGuide=false){let es=results().filter(e=>!isGuide||!e.standalone);return `${screen==='browse'?filterPanel():''}${surpriseId?`<div class="choice" style="margin-bottom:22px">${feature(E.find(e=>e.id===surpriseId))}</div>`:''}<div class="row between guide-toolbar"><div class="row"><h2>${es.length}</h2><span class="small muted">${t(isGuide?'episode entries':'entries','רשומות')}</span></div><div class="row">${isGuide?`<div class="segments">${['album','numbers','list'].map(v=>`<button class="${layout===v?'active':''}" onclick="layout='${v}';render()">${v==='album'?t('Album','אלבום'):v==='numbers'?t('Numbers','מספרים'):t('List','רשימה')}</button>`).join('')}</div>`:''}<select class="sort" aria-label="${t('Sort','מיון')}" onchange="sort=this.value;render()"><option value="duration">${t('Longest first','הארוכים תחילה')}</option><option value="number" ${sort==='number'?'selected':''}>${t('Programme number','מספר תכנית')}</option></select></div></div><div class="results ${isGuide?layout:''}">${es.length?es.map(card).join(''):`<div class="empty"><h2>${t('Nothing here.','אין כלום.')}</h2><button class="text" onclick="clearFilters()">${t('Clear filters','ניקוי מסננים')}</button></div>`}</div>`}
function browse(){return `<div class="section-head"><h1>${t('Browse','עיון')}</h1><button onclick="pick()">א ${t('Surprise me','בהפתעה')}</button></div>${stoop()}${listing()}${footer()}`}
function episode(){let e=E.find(e=>e.id===selected)||E[0],parts=copies(e).filter(u=>u.role==='part'),others=copies(e).filter(u=>u.role!=='part'),possible=uploads(e).filter(u=>u.role==='possible');return `<button class="text crumb" onclick="go('guide')">${t('← Episode guide','מדריך פרקים →')}</button><div class="episode-top">${feature(e)}</div><div class="row personal"><span class="small muted">${t('Your marks','הסימונים שלך')}</span><button class="text" onclick="star('${e.id}')">${personal.stars.includes(e.id)?'★':'☆'} ${t('Favourite','מועדף')}</button><label><input type="checkbox" ${personal.watched.includes(e.id)?'checked':''} onchange="personal.watched=this.checked?[...new Set([...personal.watched,'${e.id}'])]:personal.watched.filter(x=>x!=='${e.id}');save()">${t('Watched','צפיתי')}</label>${best(e)?`<button class="text" onclick="addQueue('${e.id}')">+ ${t('This sitting','המפגש הזה')}</button>`:''}</div><div class="copies"><div class="section-head"><h2>${t('Copies','עותקים')}</h2><span class="small muted">${others.length} ${t('linked','מקושרים')}</span></div>${others.map(u=>`<div class="copy"><div><strong>${role(u)} · ${bi(host(u.r))} · <bdi dir="ltr">${duration(u.r)}</bdi></strong><p class="${u.r.access==='licensed'?'licensed':''}">${playable(u.r)?access(u.r):t('Unavailable in recorded check','לא זמין בבדיקה המתועדת')}</p><p>${u.r.playbackVerified?t('Seen to play','נצפתה תחילת ניגון'):t('Details checked, not test-played','הפרטים נבדקו, הניגון לא נבדק')}</p></div>${playable(u.r)?watch(u.r,e):`<span class="small muted">${t('No viewing link','אין קישור לצפייה')}</span>`}</div>`).join('')}</div>${parts.length?`<div class="section-head"><h2>${t('Parts','חלקים')}</h2><span class="small muted">${t('Open one at a time','פתיחה בזה אחר זה')}</span></div><div class="train">${parts.map((u,i)=>`<div class="car"><strong>${role(u)}</strong><small><bdi dir="ltr">${duration(u.r)}</bdi> · ${bi(host(u.r))}</small>${playable(u.r)?watch(u.r,e):t('Unavailable','לא זמין')}</div>`).join('')}</div>`:''}<details class="source-notes"><summary>${t('Titles, sources & what was checked','כותרות, מקורות ומה נבדק')}</summary><p>${evidence(e)}. ${t('Project evidence is separate from your Watched mark.','ראיות הפרויקט נפרדות מסימון הצפייה האישי שלך.')}</p><dl><dt>${t('Catalogue title','כותרת הקטלוג')}</dt><dd>${bi(e.titleHe||e.titleEn)}</dd><dt>${t('English title','כותרת באנגלית')}</dt><dd>${bi(e.titleEn)} · ${e.production?.startsWith('shalom')?t('Published title','כותרת מקור'):t('Editorial title','כותרת בעריכתנו')}</dd>${e.storyHe?`<dt>${t('Story title','כותרת הסיפור')}</dt><dd>${bi(e.storyHe)}<br>${bi(lang==='he'?(e.storySourceHe||e.storySourceEn):e.storySourceEn)}</dd>`:''}${e.titleHeEditorial?`<dt>${t('Our Hebrew translation','תרגום שלנו לעברית')}</dt><dd>${bi(e.titleHeEditorial)}</dd>`:''}</dl>${possible.length?`<p>${possible.length} ${t('possible copies, unresolved. Excluded from viewing choices and coverage.','עותקים אפשריים שטרם זוהו. אינם נספרים בכיסוי ואינם מוצעים לצפייה.')}</p>`:''}<p dir="auto">${esc(e.noteEn||'')}</p>${(e.sources||[]).filter(s=>s.url).slice(0,2).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${t('Source','מקור')} ↗</a>`).join('')}${uploads(e).filter(u=>u.r.hopUrl).map(u=>`<a href="${esc(u.r.hopUrl)}" target="_blank" rel="noopener noreferrer">${t('Hop! source · Israeli connection required','מקור בהופ! · נדרש חיבור ישראלי')} ↗</a>`).join('')}</details>${queue()}${footer()}`}
function footer(){return `<footer class="footer"><button class="text" onclick="go('missing')"><span class="bin" aria-hidden="true"></span>${t('Not found','לא נמצא')} · ${E.filter(e=>e.coverage==='missing').length}</button><button class="text" onclick="go('about')">${t('About & backup','אודות וגיבוי')}</button></footer>`}
function about(){return `<h1>${t('About & backup','אודות וגיבוי')}</h1><div class="backup" style="margin-top:22px"><p>${t('Links and metadata. Videos open on their original host.','קישורים ונתונים. הסרטונים נפתחים באתר המקור.')}</p><p>${t('Backup includes favourites, Watched marks, recently opened, this sitting and pasted links. Appearance and interface language stay out.','הגיבוי כולל מועדפים, סימוני צפייה, פתיחות אחרונות, המפגש הזה וקישורים שהודבקו. המראה ושפת הממשק אינם כלולים.')}</p><button onclick="exportBackup()">${t('Export backup','ייצוא גיבוי')}</button><label style="display:block;margin-top:18px">${t('Restore backup','שחזור גיבוי')}<input type="file" accept="application/json" onchange="importBackup(this.files[0])"></label></div>${footer()}`}
function exportBackup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,...personal},null,2)],{type:'application/json'}));a.href=u;a.download='sumsum-building-personal.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function importBackup(file){if(!file)return;try{let d=JSON.parse(await file.text());for(let k of ['stars','watched','recent','queue','pasted'])if(!Array.isArray(d[k])||!d[k].every(x=>typeof x==='string'))throw Error();personal={stars:d.stars,watched:d.watched,recent:d.recent,queue:d.queue,pasted:d.pasted};save();render();notify(t('Backup restored','הגיבוי שוחזר'))}catch{notify(t('Could not read that backup','לא ניתן לקרוא את הגיבוי'))}}
function missing(){return `<h1>${t('Not found','לא נמצא')}</h1>${E.filter(e=>e.coverage==='missing').map(e=>`<div class="quiet-list"><button class="text" onclick="go('episode','${e.id}')">${t('No. ','מס׳ ')+e.number} · ${bi(title(e))}</button><p>${uploads(e).filter(u=>u.role==='possible').length} ${t('possible copies, unresolved and not counted','עותקים אפשריים, טרם זוהו ואינם נספרים')}</p></div>`).join('')}${footer()}`}
function render(){document.documentElement.dataset.palette=palette;document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.documentElement.dataset.scheme=appearance==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):appearance;document.getElementById('header').innerHTML=`<div class="mast-inner"><div class="top"><a class="word" href="#" onclick="go('home');return false">${t('sumsum','סומסום')}<sup aria-hidden="true">א</sup></a><div class="search"><input id="search" aria-label="${t('Search episodes and videos','חיפוש פרקים וסרטונים')}" placeholder="${t('Search episodes and videos','חיפוש פרקים וסרטונים')}" value="${esc(query)}" onkeydown="if(event.key==='Enter'){query=this.value;screen='browse';render()}"></div><div class="tools"><details class="theme"><summary aria-label="${t('Theme and appearance','ערכת צבעים ומראה')}">◐</summary><div class="theme-panel"><label>${t('Palette','ערכת צבעים')}<select aria-label="${t('Palette','ערכת צבעים')}" onchange="palette=this.value;render()">${['terracotta','stone','sea','sage','kippi','bauhaus'].map((p,i)=>`<option value="${p}" ${palette===p?'selected':''}>${t(['Terracotta','Stone','Sea','Sage','Kippi','Bauhaus'][i],['טרקוטה','אבן','ים','מרווה','קיפי','באוהאוס'][i])}</option>`).join('')}</select></label><label>${t('Appearance','מראה')}<select aria-label="${t('Appearance','מראה')}" onchange="appearance=this.value;render()">${['system','light','dark'].map((x,i)=>`<option value="${x}" ${appearance===x?'selected':''}>${t(['System','Light','Dark'][i],['מערכת','בהיר','כהה'][i])}</option>`).join('')}</select></label></div></details><div class="lang" role="radiogroup" aria-label="${t('Interface language','שפת הממשק')}"><button role="radio" aria-checked="${lang==='en'}" onclick="lang='en';render()" onkeydown="if(event.key.startsWith('Arrow')){lang='he';render()}">EN</button><button role="radio" aria-checked="${lang==='he'}" onclick="lang='he';render()" onkeydown="if(event.key.startsWith('Arrow')){lang='en';render()}">עב</button></div></div></div><nav class="nav">${[['home',t('Home','בית')],['guide',t('Episode guide','מדריך פרקים')],['browse',t('Browse','עיון')],['starred',t('Favourites','מועדפים')]].map(([s,n])=>`<button class="${s===screen?'current':''}" ${s===screen?'aria-current="page"':''} onclick="go('${s}')">${n}</button>`).join('')}</nav></div>`;let prodButtons=P.map(p=>`<button class="${production===p.id?'active':''}" onclick="production='${p.id}';screen='guide';render()">${prodName(p.id)}<small><bdi dir="ltr">${p.years}</bdi></small></button>`).join('');document.getElementById('rail').innerHTML=`<div class="rail-inner"><p class="rail-label">${t('Productions','הפקות')}</p><button class="${!production?'active':''}" onclick="production='';screen='guide';render()">${t('All productions','כל ההפקות')}</button>${prodButtons}<div class="rail-foot">${t(palette[0].toUpperCase()+palette.slice(1),'ערכת צבעים')}<br>${t('Links only','קישורים בלבד')}</div></div>`;let mobile=`<div class="mobile-prod"><select aria-label="${t('Production','הפקה')}" onchange="production=this.value;screen='guide';render()"><option value="">${t('All productions','כל ההפקות')}</option>${P.map(p=>`<option value="${p.id}" ${production===p.id?'selected':''}>${prodName(p.id)} · ${p.years}</option>`).join('')}</select></div>`;document.getElementById('main').innerHTML=mobile+(screen==='home'?home():screen==='guide'?guide():screen==='browse'?browse():screen==='episode'?episode():screen==='about'?about():screen==='missing'?missing():`<h1>${t('Favourites','מועדפים')}</h1>${shelfSection('',E.filter(e=>personal.stars.includes(e.id)),'stars')}${footer()}`)}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(appearance==='system')render()});render();
</script></body></html>
