<!doctype html>
<html lang="en" dir="ltr" data-palette="terracotta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark" id="meta-color-scheme">
<meta name="theme-color" content="#803414">
<title>Sumsum</title>
<style>
/* Tokens: Terracotta, copied from library.template.html. Coverage colours and --acc-lic mean only coverage and licensed access. */
:root{color-scheme:light;
 --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
 --serif:"New York","Iowan Old Style",Charter,Georgia,"Arial Hebrew","Noto Sans Hebrew",serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --round:"Arial Rounded MT Bold",ui-rounded,"Arial Hebrew","Noto Sans Hebrew",var(--font);
 --whole:#1b7a4b;--parts:#a86400;--excerpt:#5f4fb3;--missing:#b3392c;--unknown:#7e8a83;--whole-ink:#fff;
 --whole-bg:#e2f1e7;--parts-bg:#faefd9;--excerpt-bg:#ece9fa;--missing-bg:#fbe8e4;--unknown-bg:#eef0ea;
 --acc-ok:#1f5fa8;--acc-public:#5c6b75;--acc-vpn:#8f3f71;--acc-lic:#1d6a6a;--acc-bad:#3d3d3d;
 --star:#f5cf45;--star-ink:#a77300;--scrim:#000000a0;--scrim-ink:#fff;
 --bg:#f9f2eb;--surface:#fffcf8;--surface-2:#f3e9e0;--surface-3:#eaddd1;
 --ink:#301f18;--muted:#6a5449;--line:#e3d7cc;--line-strong:#c2ac9b;
 --brand:#803414;--primary:#00445f;--primary-ink:#fff;--primary-hover:#00364c;
 --accent:#dfbd7c;--focus:#1e3a71;--link:#164878;--chip:#e4dad3;--chip-ink:#4b382f;
 --shadow:0 1px 2px #3a1a100f,0 6px 18px #3a1a100d;
 --mast-ink:#fff;--mast-ink-soft:#fdf7f3;--mast-hover:#ffffff18;--mast-chip:#ffffff26;
 --mast-current:#fff;--mast-current-ink:#803414;--mast-ctl:#ffffff14;--mast-ctl-hover:#ffffff26;--mast-ctl-line:#ffffff80;
 --mast-focus:#f3d68f}
:root[data-scheme=dark]{color-scheme:dark;
 --whole:#5cc790;--parts:#e9a640;--excerpt:#ab9ef2;--missing:#f2826f;--unknown:#84928a;--whole-ink:#05231a;
 --whole-bg:#173827;--parts-bg:#3a2c12;--excerpt-bg:#29244a;--missing-bg:#40201b;--unknown-bg:#1c2823;
 --acc-ok:#8cc3ff;--acc-public:#a9b6bf;--acc-vpn:#e59ac6;--acc-lic:#7fd1cc;--acc-bad:#cfcfcf;
 --bg:#140e0b;--surface:#1e1511;--surface-2:#281c17;--surface-3:#33251f;
 --ink:#f1e9e3;--muted:#c1ad9f;--line:#382a25;--line-strong:#56433a;
 --brand:#58230c;--primary:#2f7990;--primary-ink:#fff;--primary-hover:#256a80;
 --accent:#e0d2b4;--focus:#c1e3fc;--link:#b3d6ff;--chip:#463e39;--chip-ink:#e6dbd3;
 --shadow:0 1px 2px #0006}

*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--link)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* masthead */
.mast{background:var(--brand);color:var(--mast-ink);border-bottom:5px solid var(--accent);position:sticky;top:0;z-index:30}
.mast-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.word{font:700 24px/1 var(--serif);color:var(--mast-ink);text-decoration:none;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.word small{font:600 14px var(--font);color:var(--mast-ink-soft);opacity:.9}
.tabs{display:flex;gap:4px}
.tabs a{color:var(--mast-ink);text-decoration:none;font-weight:650;padding:9px 14px;border-radius:999px;min-height:44px;display:inline-flex;align-items:center}
.tabs a:hover{background:var(--mast-hover)}
.tabs a[aria-current=page]{background:var(--mast-current);color:var(--mast-current-ink)}
.search{flex:1;min-width:120px;position:relative}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);padding:0 16px 0 40px}
[dir=rtl] .search input{padding:0 40px 0 16px}
.search input::placeholder{color:var(--mast-ink-soft);opacity:.85}
.search::before{content:'';position:absolute;inset-inline-start:15px;top:14px;width:11px;height:11px;border:2px solid var(--mast-ink);border-radius:50%;pointer-events:none}
.search::after{content:'';position:absolute;inset-inline-start:27px;top:27px;width:6px;height:2px;background:var(--mast-ink);transform:rotate(45deg);pointer-events:none}
.search input:focus-visible{outline-color:var(--mast-focus)}
.mctl{display:flex;gap:8px;align-items:center}
.langsw{display:flex;border:1px solid var(--mast-ctl-line);border-radius:999px;overflow:hidden;height:44px}
.langsw button{background:transparent;border:0;color:var(--mast-ink);padding:0 13px;min-width:44px;font-weight:700;cursor:pointer}
.langsw button[aria-checked=true]{background:var(--mast-current);color:var(--mast-current-ink)}
.langsw button:focus-visible,.roundbtn:focus-visible,.tabs a:focus-visible,.word:focus-visible{outline-color:var(--mast-focus)}
.roundbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);cursor:pointer;display:grid;place-items:center;position:relative}
.roundbtn:hover{background:var(--mast-ctl-hover)}
.moon{width:18px;height:18px;border-radius:50%;border:2px solid var(--mast-ink);background:linear-gradient(90deg,var(--mast-ink) 50%,transparent 50%)}
[dir=rtl] .moon{transform:scaleX(-1)}
.pop{position:absolute;top:52px;inset-inline-end:0;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);padding:10px;min-width:190px;z-index:40;text-align:start}
.pop h4{margin:2px 6px 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop button{display:flex;width:100%;align-items:center;gap:10px;padding:10px;border-radius:10px;border:0;background:transparent;cursor:pointer;min-height:44px}
.pop button:hover{background:var(--surface-2)}
.pop button[aria-checked=true]{font-weight:700}
.pop button[aria-checked=true]::after{content:'✓';margin-inline-start:auto}
.pop .sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-strong)}
.sw-system{background:linear-gradient(90deg,var(--surface) 50%,var(--ink) 50%)}.sw-light{background:var(--surface)}.sw-dark{background:var(--ink)}

main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:18px 20px 40px}
.foot{max-width:1240px;margin:0 auto;width:100%;padding:18px 20px 28px;display:flex;gap:18px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.foot a{color:var(--muted)}
.bin{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;min-height:44px}
.bin:hover{color:var(--ink);text-decoration:underline}
.binicon{width:16px;height:16px;position:relative;display:inline-block}
.binicon::before{content:'';position:absolute;left:2px;right:2px;bottom:0;height:11px;border:1.5px solid currentColor;border-top:0;border-radius:0 0 4px 4px}
.binicon::after{content:'';position:absolute;left:0;right:0;top:2px;height:3px;border:1.5px solid currentColor;border-radius:3px;transform:rotate(-12deg);transform-origin:left}

/* bottom bar, phone */
.tabbar{display:none}
.nextbar{display:none}

/* shared bits */
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0}
h2{font-size:24px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:650;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn[aria-pressed=true]{background:var(--chip);color:var(--chip-ink);border-color:var(--chip)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn[aria-pressed=true]{border-color:var(--line-strong)}
.i-star{width:20px;height:20px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--muted)}
[aria-pressed=true] .i-star{background:var(--star)}
.i-plus{font:700 22px/1 var(--font)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:38px;padding:0 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-checked=true]{background:var(--ink);color:var(--bg)}
.lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}

/* ticket-stub Watch button */
.ticket{--notch:var(--surface);display:inline-flex;align-items:stretch;text-decoration:none;color:var(--primary-ink);background:var(--primary);border-radius:12px;min-height:48px;font-weight:700;position:relative;max-width:100%}
.ticket:hover{background:var(--primary-hover)}
.ticket .tk-main{display:flex;flex-direction:column;justify-content:center;padding:6px 14px 6px 16px;line-height:1.2;min-width:0}
.ticket .tk-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .tk-main small{font-weight:600;font-size:12px;opacity:.9}
.ticket .tk-stub{display:flex;align-items:center;padding:0 14px;font:600 14px var(--mono);position:relative;border-inline-start:2px dashed var(--primary-ink);border-start-start-radius:0;white-space:nowrap}
.ticket .tk-stub::before,.ticket .tk-stub::after{content:'';position:absolute;inset-inline-start:-8px;width:14px;height:14px;border-radius:50%;background:var(--notch)}
.ticket .tk-stub::before{top:-8px}.ticket .tk-stub::after{bottom:-8px}
.ticket .ext{display:inline-block;margin-inline-start:6px;font-weight:700}
[dir=rtl] .ticket .ext{transform:scaleX(-1)}
.ticket.big{min-height:60px;font-size:18px;border-radius:14px}
.ticket.big .tk-stub{font-size:16px;padding:0 18px}
.ticket.sm{min-height:44px;font-size:14px;border-radius:10px}
.ticket.sm .tk-main{padding:4px 8px 4px 11px}
.ticket.sm .tk-stub{padding:0 9px;font-size:13px}
.ticket.sm .tk-stub::before,.ticket.sm .tk-stub::after{width:12px;height:12px;inset-inline-start:-7px}
.ticket.sm .tk-stub::before{top:-7px}.ticket.sm .tk-stub::after{bottom:-7px}
.noplay{font-size:14px;color:var(--muted)}
.accline{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--acc-public)}
.dot.lic{background:var(--acc-lic)}.dot.vpn{background:var(--acc-vpn)}.dot.ok{background:var(--acc-ok)}.dot.bad{background:var(--acc-bad)}

/* coverage words: the only use of the coverage colours */
.cov{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.cov-whole-candidate{background:var(--whole-bg);color:var(--whole)}
.cov-parts-only{background:var(--parts-bg);color:var(--parts)}
.cov-excerpt-only{background:var(--excerpt-bg);color:var(--excerpt)}
.cov-missing{background:var(--missing-bg);color:var(--missing)}

/* pictures, paper corners, placeholders */
.pic{position:relative;display:block;aspect-ratio:16/9;border-radius:6px;background:var(--surface-3);overflow:visible}
.pic img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.pic .ph{position:absolute;inset:0;display:grid;place-items:center;border-radius:4px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface-3) 10px 20px);color:var(--muted);font:700 22px var(--mono)}
.pic .corners{position:absolute;inset:-4px;pointer-events:none;background:
 linear-gradient(135deg,var(--surface-3) 0 11px,var(--line-strong) 11px 12px,transparent 12px) top left/20px 20px no-repeat,
 linear-gradient(225deg,var(--surface-3) 0 11px,var(--line-strong) 11px 12px,transparent 12px) top right/20px 20px no-repeat,
 linear-gradient(45deg,var(--surface-3) 0 11px,var(--line-strong) 11px 12px,transparent 12px) bottom left/20px 20px no-repeat,
 linear-gradient(315deg,var(--surface-3) 0 11px,var(--line-strong) 11px 12px,transparent 12px) bottom right/20px 20px no-repeat}
.pic .dur{position:absolute;inset-inline-end:8px;bottom:8px;background:var(--scrim);color:var(--scrim-ink);font:600 12px var(--mono);padding:2px 6px;border-radius:5px}

/* stickers: personal marks only */
.stk{position:absolute;top:-10px;inset-inline-end:-8px;display:flex;gap:2px;align-items:center;z-index:2;pointer-events:none}
.st{display:grid;place-items:center;transform:rotate(var(--tilt,0deg))}
.st-star{width:40px;height:40px;filter:drop-shadow(0 0 0 var(--surface)) drop-shadow(1.5px 0 0 var(--surface)) drop-shadow(-1.5px 0 0 var(--surface)) drop-shadow(0 1.5px 0 var(--surface)) drop-shadow(0 -1.5px 0 var(--surface)) drop-shadow(0 2px 2px var(--line-strong))}
.st-star i{width:100%;height:100%;background:var(--star);clip-path:polygon(50% 2%,62% 36%,98% 37%,69% 58%,80% 93%,50% 72%,20% 93%,31% 58%,2% 37%,38% 36%)}
.st-n{min-width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);font:800 14px/1 var(--round);border:2.5px solid var(--surface);box-shadow:0 2px 3px var(--line-strong);padding:0 4px}
.st-w{height:28px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font:700 12px/1 var(--round);border:2.5px solid var(--surface);box-shadow:0 2px 3px var(--line-strong);padding:0 9px;white-space:nowrap}
.st-q{height:26px;border-radius:5px;background:var(--surface-3);color:var(--ink);font:700 11px/1 var(--font);border:2px solid var(--surface);padding:0 7px;white-space:nowrap;box-shadow:0 2px 3px var(--line-strong)}
.pressed{animation:press .14s ease-out}
@keyframes press{from{transform:rotate(var(--tilt,0deg)) scale(1.18)}to{transform:rotate(var(--tilt,0deg)) scale(1)}}

/* house-number plaque */
.plaque{display:inline-flex;align-items:center;gap:6px;font:700 14px/1 var(--mono);background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong);border-radius:7px;padding:6px 15px;position:relative;white-space:nowrap;box-shadow:0 1px 0 var(--line-strong)}
.plaque::before,.plaque::after{content:'';position:absolute;top:50%;margin-top:-2px;width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
.plaque::before{left:5px}.plaque::after{right:5px}
.plaque small{font:600 11px var(--font);color:var(--muted)}

/* cards */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.card .pic{margin:2px}
.card .pqrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:-26px;padding-inline-start:10px;position:relative;z-index:1;min-height:30px}
.card .pqrow .cov{box-shadow:0 0 0 2px var(--surface)}
.card h3{font-size:17px;line-height:1.25}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.card .sub{font-size:14px;color:var(--muted);margin:-4px 0 0}
.card .meta{font-size:13px;color:var(--muted);margin:0}
.card{container-type:inline-size}
.card .mrow{display:flex;gap:6px;align-items:center;margin-top:auto}
.card .covl{margin:0;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--muted)}
@container (max-width:250px){.tk-pre{display:none}}
@container (max-width:185px){.card .mrow{flex-wrap:wrap}.card .mrow p.meta{flex-basis:100%}}
.card .mrow .meta{flex:1;min-width:0}
.card .acts{display:flex;gap:8px;align-items:center}
.card .acts .ticket{flex:1;min-width:0}
.card .acts .ticket .tk-main{flex:1}
.ed{font:600 11px var(--font);color:var(--muted);border:1px solid var(--line-strong);border-radius:5px;padding:0 5px;margin-inline-start:6px;vertical-align:2px;white-space:nowrap}

/* shelves */
.sec{margin:30px 0 0}
.sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.sechead h2{font-size:22px}
.sechead .n{font:600 13px var(--mono);color:var(--muted)}
.sechead a.all{margin-inline-start:auto;font-weight:650;min-height:44px;display:inline-flex;align-items:center}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:16px;overflow-x:auto;padding:14px 4px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.shelf>*{scroll-snap-align:start}

/* the album spread */
.sitting{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow),6px 6px 0 -1px var(--surface-2),6px 6px 0 0 var(--line),11px 11px 0 -1px var(--surface-2),11px 11px 0 0 var(--line)}
.spread::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:44px;margin-left:-22px;background:linear-gradient(90deg,transparent,var(--surface-2) 40%,var(--line-strong) 50%,var(--surface-2) 60%,transparent);pointer-events:none}
.page{padding:22px 34px 26px 26px;min-width:0}
.page+.page{padding:22px 26px 26px 34px}
.page h2{font-size:22px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.page h2 .n{font:600 13px var(--mono);color:var(--muted)}
.hero .pic{margin:4px}
.hero h3{font-size:24px;margin:12px 0 2px}
.hero h3 a{color:var(--ink);text-decoration:none}
.hero .sub{margin:0;color:var(--muted)}
.hero .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.recent{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:4px}
.recent li{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:8px 6px;border-top:1px dashed var(--line-strong)}
.recent .pic{border-radius:4px}
.recent .pic .corners{display:none}
.recent b{display:block;font-size:15px;line-height:1.25}
.recent b a{color:var(--ink);text-decoration:none}
.recent small{color:var(--muted);font-size:13px}
.recent .cnt{font:800 13px var(--round);background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 8px;margin-inline-start:6px;vertical-align:1px}
.stargrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.stargrid .card{padding:10px;box-shadow:none;transform:rotate(var(--lean,0deg))}
.stargrid .card h3{font-size:15px}
.empty{display:flex;gap:14px;align-items:center;padding:26px 6px;color:var(--muted)}
.empty b{font:700 18px var(--serif);color:var(--ink)}

/* tonight band */
.tonight{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:16px;padding:10px 12px 10px 16px;margin:0 0 22px;flex-wrap:wrap}
.tonight h2{font-size:18px;white-space:nowrap}
.tonight .tsum{font:600 13px var(--mono);color:var(--muted);white-space:nowrap}
.tq{display:flex;gap:8px;list-style:none;margin:0;padding:0;overflow-x:auto;flex:1;min-width:120px}
.tq li{flex:none;width:92px;position:relative}
.tq .pic{border-radius:4px}.tq .pic .corners{display:none}
.tq .pic .dur{font-size:10px;inset-inline-end:3px;bottom:3px;padding:1px 4px}
.tq .num{position:absolute;top:-6px;inset-inline-start:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:800 12px/22px var(--round);text-align:center;z-index:1}

/* character stoop */
.stoop{position:relative;padding:8px 0 0}
.stoop::after{content:'';display:block;height:16px;margin-top:-20px;background:var(--surface-3);border-radius:6px;border-top:2px solid var(--line-strong);position:relative;z-index:0}
.toks{display:flex;gap:10px;overflow-x:auto;padding:12px 6px 2px;list-style:none;margin:0;position:relative;z-index:1;scrollbar-width:thin}
.tok{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--ink);background:transparent;border:0;cursor:pointer;width:96px;height:156px;flex:none;padding:4px 2px 24px;border-radius:14px;position:relative}
.tok .face{width:76px;height:76px;border-radius:50%;position:relative;display:block;transition:transform .15s}
.tok .face img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-strong);display:block}
.tok .face .ini{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:var(--surface-3);font:700 24px var(--round);color:var(--muted)}
.tok:hover .face{transform:rotate(-5deg)}
.tok b{font-size:14px;line-height:1.1;text-align:center}
.tok small{font-size:12px;color:var(--muted);line-height:1.1}
.tok .cnt{position:absolute;bottom:2px;font:600 11px var(--mono);background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:1px 7px}
.tok[aria-pressed=true] .face{transform:translateY(-4px)}
.tok[aria-pressed=true] .face img{box-shadow:0 0 0 3px var(--primary)}
.tok.zero{opacity:.55}
.tok-kippi .face::before{content:'';position:absolute;inset:-9px;border-radius:50%;background:repeating-conic-gradient(var(--accent) 0 7deg,transparent 7deg 16deg);-webkit-mask:radial-gradient(circle,transparent 56%,var(--ink) 57%);mask:radial-gradient(circle,transparent 56%,var(--ink) 57%)}
.tok-oofnik .face img,.tok-oofnik .face .ini{border-radius:12px 12px 20px 20px}
.tok-oofnik .face::before{content:'';position:absolute;left:-5px;right:-5px;top:-11px;height:8px;border-radius:5px;background:var(--line-strong);transform:rotate(-8deg);transform-origin:left center;z-index:1}
.tok-oofnik .face::after{content:'';position:absolute;left:50%;top:-16px;width:14px;height:6px;margin-left:-7px;border:2px solid var(--line-strong);border-bottom:0;border-radius:6px 6px 0 0;transform:rotate(-8deg)}

/* die */
.die{width:30px;height:30px;border-radius:8px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);display:inline-grid;place-items:center;font:800 17px/1 var(--round);box-shadow:2px 2px 0 var(--ink)}
.die.roll{animation:roll .55s cubic-bezier(.3,.7,.4,1)}
@keyframes roll{0%{transform:rotate(0) translateY(0)}35%{transform:rotate(200deg) translateY(-8px)}70%{transform:rotate(330deg) translateY(0)}100%{transform:rotate(360deg)}}
.pickbtn{gap:10px;padding:0 16px 0 8px}

/* production plates (guide entry) */
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.plate{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--brand);border-radius:10px;padding:10px 14px;min-height:64px}
.plate:hover{background:var(--surface-2)}
.plate b{font-family:var(--serif);font-size:16px}
.plate small{color:var(--muted);font-size:13px}

/* guide */
.guide{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
.rail{position:sticky;top:96px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 110px);overflow:auto;padding-inline-end:4px}
.rail h4{margin:12px 8px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rail a{display:block;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:0 10px 10px 0;border-inline-start:4px solid transparent;background:transparent}
[dir=rtl] .rail a{border-radius:10px 0 0 10px}
.rail a:hover{background:var(--surface-2)}
.rail a[aria-current=page]{background:var(--surface);border-inline-start-color:var(--brand);box-shadow:var(--shadow)}
.rail a b{display:block;font-size:14px}
.rail a small{color:var(--muted);font-size:12px}
.gh{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.gh h1{font-size:30px}
.gh .he{color:var(--muted);font-size:15px;margin:4px 0 0}
.gh .counts{font-size:14px;color:var(--muted)}
.layouts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.layouts .seg button{min-height:40px}
.season{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.season h3{font-size:18px}
.season small{font:600 12px var(--mono);color:var(--muted)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 18px}
.album .card .covl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
.nplate{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:9px;overflow:hidden;position:relative;min-height:84px}
.nplate:hover{box-shadow:var(--shadow);border-color:var(--ink)}
.nplate .nn{font:700 22px/1 var(--mono);text-align:center;padding:12px 4px 4px;position:relative}
.nplate .nn::before,.nplate .nn::after{content:'';position:absolute;top:8px;width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
.nplate .nn::before{left:6px}.nplate .nn::after{right:6px}
.nplate .tt{font-size:11px;line-height:1.2;color:var(--muted);text-align:center;padding:0 5px 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.nplate .band{font-size:10px;font-weight:700;text-align:center;padding:3px 2px}
.nplate .stk{top:-6px;inset-inline-end:-6px;transform:scale(.6);transform-origin:top right}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:70px minmax(0,1.6fr) minmax(0,1fr) 130px auto;gap:14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.lrow .no{font:700 14px var(--mono);color:var(--muted)}
.lrow b a{color:var(--ink);text-decoration:none}
.lrow .sub{font-size:13px;color:var(--muted);display:block}
.ruler{display:flex;flex-direction:column;gap:3px}
.ruler .track{height:10px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.ruler .bar{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(90deg,var(--line-strong) 0 calc(var(--t) - 1px),var(--surface) calc(var(--t) - 1px) var(--t));border-radius:3px}
.ruler .brk{position:absolute;inset-inline-end:6px;top:-2px;bottom:-2px;width:6px;background:var(--surface-2);transform:skewX(-20deg)}
.ruler small{font:600 12px var(--mono);color:var(--muted)}
.sorter{display:flex;gap:8px;align-items:center}
.sorter select{min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px}

/* browse */
.browse{display:grid;grid-template-columns:290px 1fr;gap:28px;align-items:start}
.filters{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto;padding:4px 6px 20px;display:flex;flex-direction:column;gap:20px}
.fg h3{font:700 14px var(--font);margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.fg h3 small{font-weight:500;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:14px;box-shadow:0 2px 0 var(--line-strong);position:relative;top:0;transition:top .08s,box-shadow .08s}
.chip .c{font:600 11px var(--mono);color:var(--muted)}
.chip[aria-pressed=true]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);top:2px;box-shadow:0 0 0 var(--line-strong)}
.chip[aria-pressed=true] .c{color:var(--primary-ink)}
.chip.zero{opacity:.5}
.minitoks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.minitoks .tok{width:auto;height:112px;padding-bottom:22px}
.minitoks .tok .face{width:52px;height:52px}
.minitoks .tok b{font-size:12px}
.minitoks .tok small{display:none}
.minitoks .tok-kippi .face::before{inset:-6px}
.minitoks .tok-oofnik .face::before,.minitoks .tok-oofnik .face::after{display:none}
.timer{position:relative;width:240px;height:138px;margin:0 auto}
.timer .face{position:absolute;left:0;right:0;top:0;height:240px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong);clip-path:inset(0 0 42% 0);box-shadow:inset 0 0 0 10px var(--surface-2)}
.timer .hand{position:absolute;left:50%;bottom:20px;width:4px;height:76px;margin-left:-2px;background:var(--primary);border-radius:2px;transform-origin:50% 100%;transform:rotate(var(--a,0deg));transition:transform .25s}
.timer .hub{position:absolute;left:50%;bottom:12px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ink)}
.timer button{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font:700 14px/1 var(--mono);display:grid;place-items:center;padding:0}
.timer button small{font:600 9px var(--mono);color:var(--muted);display:block;margin-top:1px}
.timer button[aria-checked=true]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.timer button[aria-checked=true] small{color:var(--primary-ink)}
.timerlbl{text-align:center;font-size:13px;color:var(--muted);margin-top:2px}
.pegs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;padding:8px 0;border-top:2px solid var(--line-strong)}
.peg{display:inline-flex;align-items:center;gap:6px;padding:0 4px 0 12px;min-height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--line-strong);font-size:14px;position:relative;margin-top:6px}
.peg::before{content:'';position:absolute;top:-8px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--line-strong)}
.peg button{border:0;background:transparent;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:18px;color:var(--muted)}
.peg button:hover{background:var(--surface-2);color:var(--ink)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 18px}
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.rhead h1{font-size:26px}
.rhead .n{font:600 14px var(--mono);color:var(--muted)}
.filtersbtn{display:none}
.relax{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.oof{width:84px;height:84px;position:relative;flex:none}
.oof .can{position:absolute;left:12px;right:12px;bottom:0;height:56px;background:var(--surface-3);border:2px solid var(--line-strong);border-radius:6px 6px 14px 14px;background-image:repeating-linear-gradient(90deg,transparent 0 12px,var(--line-strong) 12px 14px)}
.oof .lid{position:absolute;left:6px;right:6px;top:14px;height:11px;background:var(--surface-2);border:2px solid var(--line-strong);border-radius:7px;transform:rotate(-14deg);transform-origin:left bottom;animation:lid .5s ease-out}
.oof .eyes{position:absolute;left:28px;top:22px;width:28px;height:10px;background:radial-gradient(circle at 6px 5px,var(--ink) 3px,transparent 3.5px),radial-gradient(circle at 20px 5px,var(--ink) 3px,transparent 3.5px)}
@keyframes lid{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
.kip{width:72px;height:72px;border-radius:50%;flex:none;position:relative;background:var(--surface-3)}
.kip::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:repeating-conic-gradient(var(--accent) 0 7deg,transparent 7deg 16deg);-webkit-mask:radial-gradient(circle,transparent 55%,var(--ink) 56%);mask:radial-gradient(circle,transparent 55%,var(--ink) 56%)}
.kip::after{content:'';position:absolute;left:22px;top:28px;width:28px;height:8px;background:radial-gradient(circle at 4px 4px,var(--ink) 3px,transparent 3.5px),radial-gradient(circle at 24px 4px,var(--ink) 3px,transparent 3.5px)}

/* episode page */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600}
.ep{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:34px;align-items:start;margin-top:6px}
.ep .pic{margin:6px;box-shadow:var(--shadow)}
.ep .pic .stk{transform:scale(1.25);transform-origin:top right}
.ep .crumbs{font-size:14px;color:var(--muted);margin:0 0 10px}
.ep h1{font-size:36px;margin:10px 0 4px}
.ep .sub{font-size:18px;color:var(--muted);margin:0}
.ep .facts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.ep>div{min-width:0}
.ep .decide{display:flex;flex-direction:column;gap:10px;margin:16px 0 8px;align-items:flex-start}
.ep .decide>*{max-width:100%}
.train{max-width:100%}
.ep .mine{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.ep .mine .btn{min-height:48px}
.ep .opened{font-size:13px;color:var(--muted);margin:8px 0 0}
.copies{margin-top:34px}
.copies h2{font-size:22px;margin:0 0 4px}
.copies .hint{margin:0 0 14px;color:var(--muted);font-size:14px}
.copy{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.copy .pic .corners{display:none}
.copy .role{font:700 11px var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.copy b{display:block}
.train{list-style:none;display:flex;gap:0;padding:14px 0 18px;margin:0;overflow-x:auto;align-items:flex-end}
.train li{flex:none;position:relative}
.train li+li{margin-inline-start:18px}
.train li+li::before{content:'';position:absolute;inset-inline-start:-19px;bottom:26px;width:20px;height:3px;background:var(--line-strong)}
.car,.engine{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;width:132px;min-height:96px;padding:12px 8px 20px;border-radius:12px 12px 8px 8px;border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;position:relative;border-top-width:8px}
.car:hover{background:var(--surface-2)}
.car.opened{border-top-color:var(--accent)}
.car b{font:700 15px var(--round)}
.car .d{font:600 14px var(--mono)}
.car small{font-size:12px;color:var(--muted)}
.car::after,.engine::after{content:'';position:absolute;bottom:-9px;left:16px;right:16px;height:16px;background:radial-gradient(circle at 8px 8px,var(--ink) 6px,transparent 6.5px) left/16px 16px no-repeat,radial-gradient(circle at 8px 8px,var(--ink) 6px,transparent 6.5px) right/16px 16px no-repeat}
.engine{background:var(--surface-3);border-radius:12px 26px 8px 8px;width:120px}
[dir=rtl] .engine{border-radius:26px 12px 8px 8px}
.engine b{font:700 18px var(--mono)}
.engine small{font-size:12px;color:var(--muted)}
.excerpts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.notes{margin-top:30px;border:1px solid var(--line);border-radius:14px;background:var(--surface);background-image:repeating-linear-gradient(180deg,transparent 0 27px,var(--line) 27px 28px)}
.notes summary{cursor:pointer;padding:14px 18px;font-weight:700;min-height:44px}
.notes .in{padding:0 18px 16px}
.notes dl{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;margin:0;font-size:14px}
.notes dt{color:var(--muted)}
.notes dd{margin:0}
.notes ul{margin:0;padding-inline-start:18px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.pn a{min-height:44px;display:inline-flex;align-items:center}

/* not found */
.nf h1{font-size:28px;margin:6px 0 4px}
.nf h2{font-size:18px;margin:24px 0 6px}
.nf ul{list-style:none;padding:0;margin:0}
.nf li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.nf li .mono{color:var(--muted);min-width:60px}

/* dialogs and sheets */
dialog{border:1px solid var(--line-strong);border-radius:20px;background:var(--surface);color:var(--ink);padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:var(--scrim)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:22px}
.dlg .x{position:absolute;top:10px;inset-inline-end:10px}
.dlg p,.dlg h2{margin:0}
.dlg .row .ticket{flex:1 1 auto;justify-content:space-between}
.dlg .bubble .tok-oofnik .face::before,.dlg .bubble .tok-oofnik .face::after{display:none}
.bubble{display:flex;gap:12px;align-items:center}
.bubble .tok{width:auto;height:auto;padding:0}
.bubble .tok .face{width:56px;height:56px}
.bubble .tok-kippi .face::before{inset:-7px}
.bubble p{margin:0;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:16px;padding:8px 14px;font:700 16px var(--round);position:relative}
.bubble p::before{content:'';position:absolute;top:50%;inset-inline-start:-8px;width:14px;height:14px;margin-top:-7px;background:var(--surface-2);border-inline-start:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:rotate(45deg)}
[dir=rtl] .bubble p::before{transform:rotate(-45deg)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tlist li{display:grid;grid-template-columns:28px 88px 1fr auto;gap:10px;align-items:center}
.tlist .num{font:800 14px var(--round);text-align:center}
.tlist .pic .corners{display:none}
.tlist b{font-size:14px;line-height:1.25;display:block}
.tlist small{color:var(--muted);font-size:12px}
.tlist .ctl{display:flex;gap:2px}
.tlist .ctl button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.about p{margin:0;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;display:flex;gap:14px;align-items:center;font-weight:600;max-width:calc(100vw - 24px)}
.toast button{background:transparent;border:1px solid var(--bg);color:var(--bg);border-radius:8px;min-height:36px;padding:0 10px;cursor:pointer;font-weight:700}

/* phone */
@media (max-width:820px){
 .mast-in{flex-wrap:wrap;padding:8px 12px;gap:8px}
 .tabs{display:none}
 .word{font-size:21px;flex:1}
 .word small{display:none}
 .search{order:5;flex-basis:100%}
 .search input{height:44px}
 main{padding:14px 12px 150px}
 .foot{padding:16px 12px 150px;flex-wrap:wrap}
 .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line-strong);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
 .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700;background:transparent;border:0;cursor:pointer;position:relative}
 .tabbar [aria-current=page]{color:var(--ink)}
 .tabbar [aria-current=page]::before{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
 .tabbar .ti{font:800 18px/1 var(--round)}
 .tabbar .badge{position:absolute;top:6px;inset-inline-end:calc(50% - 22px);background:var(--ink);color:var(--bg);font:800 11px/18px var(--round);min-width:18px;height:18px;border-radius:9px;padding:0 4px}
 .nextbar{display:flex;position:fixed;left:8px;right:8px;bottom:68px;z-index:29;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:16px;padding:6px 6px 6px 8px;gap:10px;align-items:center;box-shadow:var(--shadow)}
 .nextbar .pic{width:72px;flex:none}.nextbar .pic .corners{display:none}
 .nextbar .pic .dur{display:none}
 .nextbar .nt{flex:1;min-width:0;font-size:13px;line-height:1.2}
 .nextbar .nt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
 .nextbar .nt small{color:var(--muted)}
 .nextbar .ticket{--notch:var(--surface-2)}
 .spread{grid-template-columns:1fr;box-shadow:var(--shadow);border-radius:16px}
 .spread::before{display:none}
 .page,.page+.page{padding:16px 14px 18px}
 .page+.page{border-top:2px dashed var(--line-strong)}
 .hero h3{font-size:21px}
 .recent li{grid-template-columns:84px 1fr;}
 .recent li .ticket{grid-column:1/-1;justify-self:start}
 .stargrid{gap:16px 12px}
 .stargrid .card{padding:8px}
 .stargrid .card .acts .ticket .tk-main small{display:none}
 .tonight{display:none}
 .shelf{grid-auto-columns:72%}
 .guide,.browse{grid-template-columns:1fr;gap:12px}
 .rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;gap:6px}
 .rail h4{display:none}
 .rail a{flex:none;border-radius:10px;border-inline-start:0;border-bottom:4px solid transparent;background:var(--surface);border:1px solid var(--line);padding:8px 12px}
 [dir=rtl] .rail a{border-radius:10px}
 .rail a[aria-current=page]{border-bottom:4px solid var(--brand)}
 .gh h1{font-size:24px}
 .album{grid-template-columns:1fr 1fr;gap:16px 10px}
 .album .card{padding:8px}
 .album .card h3{font-size:15px}
 .album .card .acts .ticket .tk-main small{display:none}
 .numbers{grid-template-columns:repeat(4,1fr);gap:8px}
 .lrow{grid-template-columns:52px 1fr;gap:4px 10px}
 .lrow .ruler,.lrow .cv,.lrow .ac{grid-column:2}
 .results{grid-template-columns:1fr 1fr;gap:16px 10px}
 .results .card{padding:8px}
 .results .card h3{font-size:15px}
 .results .card .acts{flex-wrap:wrap}
 .results .card .acts .ticket{width:100%}
 .results .card .acts .ticket .tk-main small{display:none}
 .album .card .acts{flex-wrap:wrap}
 .album .card .acts .ticket{width:100%}
 .stargrid .card .acts{flex-wrap:wrap}
 .stargrid .card .acts .ticket{width:100%}
 .filters{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);max-height:none;padding:16px 16px 100px;overflow:auto}
 .filters.open{display:flex}
 .filtersbtn{display:inline-flex}
 .closefilters{position:sticky;bottom:0}
 .ep{grid-template-columns:1fr;gap:6px}
 .ep h1{font-size:28px}
 .copy{grid-template-columns:96px 1fr}
 .copy .ticket{grid-column:1/-1;justify-self:start}
 .notes dl{grid-template-columns:1fr}
 .notes dt{margin-top:8px}
}
@media (min-width:821px){.closefilters,.fhead{display:none!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------------- browse ---------------- */
const FKEYS = ['ch', 'len', 'ser', 'type', 'th', 'where'];
const WHERE = r => ['played', 'vimeo', 'public', 'web'].includes(r.a) ? 'free' : ['hop', 'restricted'].includes(r.a) ? 'vpn' : r.a === 'licensed' ? 'lic' : 'none';
function readF(q) { const f = {}; for (const k of FKEYS) f[k] = (q.get(k) || '').split(',').filter(Boolean); f.len = f.len[0] || ''; f.q = q.get('q') || ''; f.sort = q.get('sort') === 'title' ? 'title' : 'long'; return f; }
function fhref(f) { const q = new URLSearchParams(); for (const k of FKEYS) { const v = k === 'len' ? f.len : f[k].join(','); if (v) q.set(k, v); } if (f.q) q.set('q', f.q); if (f.sort !== 'long') q.set('sort', f.sort); const s = q.toString(); return '#/browse' + (s ? '?' + s : ''); }
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[֑-ׇ]/g, '');
function textMatch(r, q) { if (!q) return true; const n = norm(q); return [r.t, r.h, r.he, D.ups[r.up], r.ep && T(r.ep).main, r.ep && r.ep.t].some(s => norm(s).includes(n)); }
function match(r, f, skip) {
 if (!spokenOK(r.l)) return false;
 if (skip !== 'ch' && !f.ch.every(c => r.c.includes(c))) return false;
 if (skip !== 'len' && f.len && !(r.d > 0 && r.d <= +f.len * 60)) return false;
 if (skip !== 'ser' && f.ser.length && !f.ser.includes(r.s)) return false;
 if (skip !== 'type' && f.type.length && !f.type.includes(r.k)) return false;
 if (skip !== 'th' && !f.th.every(x => r.g.includes(x))) return false;
 if (skip !== 'where' && f.where.length && !f.where.includes(WHERE(r))) return false;
 return textMatch(r, f.q);
}
const bkey = r => (r.ep && isWhole(r.role) ? 'e:' + r.ep.i : 'r:' + r.i);
function results(f) {
 const seen = new Set(), out = [];
 const list = RC.filter(r => match(r, f));
 list.sort(f.sort === 'title' ? (a, b) => T(a).main.localeCompare(T(b).main, he() ? 'he' : 'en') : (a, b) => (b.d || -1) - (a.d || -1));
 for (const r of list) { const k = 'r:' + r.i; if (!seen.has(k)) { seen.add(k); out.push(r); } }
 return out;
}
function counts(f, key, opts, pred) { const o = {}; const base = RC.filter(r => match(r, f, key)); for (const v of opts) o[v] = base.filter(r => pred(r, v)).length; return o; }
function vBrowse(q) {

 $('#apbtn').setAttribute('aria-label', t('appearance'));
 const ap = H.getAttribute('data-appearance');
 $('#appop').innerHTML = `<h4>${t('appearance')}</h4>${['system', 'light', 'dark'].map(v => `<button type="button" role="menuitemradio" aria-checked="${ap === v}" data-act="ap" data-v="${v}"><span class="sw sw-${v}"></span>${t('ap_' + v)}</button>`).join('')}<h4>${t('theme')}</h4><button type="button" role="menuitemradio" aria-checked="true"><span class="sw" style="background:var(--brand)"></span>${t('terracotta')}</button>`;
 $('#appop').setAttribute('role', 'menu');
 const gaps = EPS.filter(e => e.cov !== 'whole-candidate' && GROUPS.some(g => g[1].includes(e.p))).length;
 $('#foot').innerHTML = `<a class="bin" href="#/notfound"><span class="binicon" aria-hidden="true"></span>${esc(t('nfLink', {n: gaps}))}</a><button type="button" class="btn" data-act="about">${t('about')}</button>`;
 const tc = M.tonight.filter(itemOf).length;
 $('#tabbar').innerHTML = [['shelf', '#/'], ['guide', '#/guide'], ['browse', '#/browse']].map(([k, h]) => `<a href="${h}" ${sec === k ? 'aria-current="page"' : ''}>${ICONS[k]}${t('tab_' + k)}</a>`).join('') + `<button type="button" data-act="tonedit">${ICONS.tonight}${t('tab_tonight')}${tc ? `<span class="badge">${tc}</span>` : ''}</button>`;
 const first = M.tonight.map(itemOf).filter(Boolean)[0];
 const nb = $('#nextbar');
 if (first && first.copy && sec !== 'ep') { nb.hidden = false; nb.innerHTML = `${pic(first, first.href)}<div class="nt"><small>${t('nextTonight')} · ${tc}</small><b><bdi>${esc(T(first.x).main)}</bdi></b></div>${ticket(first.copy, first.key, 'sm', '', {ton: true, short: true})}`; }
 else nb.hidden = true;
}
function render(newRoute) {
 const {parts, q} = route(); let html = '', sec = '';
 const v = parts[0] || '';
 if (v === 'guide') { sec = 'guide'; html = vGuide(parts[1], q); if (q.get('v')) LS.setItem(P + 'layout', q.get('v')); }
 else if (v === 'browse') { sec = 'browse'; html = vBrowse(q); }
 else if (v === 'ep') { sec = 'ep'; html = vEpisode(parts[1]); }
 else if (v === 'v') { sec = 'ep'; html = vVideo(parts[1]); }
 else if (v === 'notfound') { html = vNotFound(); }
 else if (v === 'search') { html = vSearch(q); }
 else if (v === 'starred') { html = vStarred(); }
 else { sec = 'shelf'; html = vShelf(); }
 $('#main').innerHTML = html;
 chrome(sec);
 if (v !== 'search' && document.activeElement !== $('#q')) $('#q').value = v === 'browse' ? (q.get('q') || '') : '';
 for (const im of document.querySelectorAll('#main img, #nextbar img')) im.addEventListener('error', () => { const s = document.createElement('span'); s.className = 'ph'; s.textContent = im.dataset.n || ''; if (im.parentNode.classList.contains('face')) { im.remove(); } else im.replaceWith(s); }, {once: true});
 if (newRoute) { window.scrollTo(0, 0); }
}

/* ---------------- actions ---------------- */
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function rerender() { render(false); if ($('#dlg').open && $('#dlg').dataset.kind === 'ton') openTonight(); }
function bump(key, rid, fromTon) {
 const o = M.opened[key] || {n: 0}; M.opened[key] = {n: o.n + 1, last: Date.now(), rid};
 const r = RID[rid]; if (r && r.role === 'part') M.parts[rid] = 1;
 if (fromTon) M.tonight = M.tonight.filter(k => k !== key);
 save(); setTimeout(rerender, 400);
}
let pickSeen = new Set();
function pickPool() {
 const {parts, q} = route();
 if (parts[0] === 'browse') { const f = readF(q); return [...new Set(results(f).filter(r => playable(r) && !(r.possOf.length && !r.ep)).map(bkey))]; }
 return shelfPool();
}
function doPick() {
 const pool = pickPool(); const dlg = $('#dlg');
 let avail = pool.filter(k => !pickSeen.has(k)); if (!avail.length) { pickSeen = new Set(); avail = pool; }
 if (!avail.length) { showDlg(`<div class="dlg"><p>${t('pickNone')}</p><button type="button" class="btn" data-act="close">${t('close')}</button></div>`, 'pick'); return; }
 const key = avail[Math.floor(Math.random() * avail.length)]; pickSeen.add(key);
 const it = itemOf(key), x = it.x, chars = (it.r ? it.r.c : it.copy?.c || []).filter(c => CH[c] && c !== 'count');
 const who = chars.length ? chars[Math.floor(Math.random() * chars.length)] : ['kippi', 'oofnik', 'elmo', 'grover'][Math.floor(Math.random() * 4)];
 const line = (LINES[who] || LINES._)[he() ? 1 : 0];
 dieFace = DIE[Math.floor(Math.random() * 6)];
 for (const d of document.querySelectorAll('.pickbtn .die')) { d.textContent = dieFace; if (!reduced()) { d.classList.remove('roll'); void d.offsetWidth; d.classList.add('roll'); } }
 const title = T(x).main;
 const html = `<div class="dlg"><button type="button" class="iconbtn x" data-act="close" aria-label="${t('close')}">×</button>
  <div class="bubble"><span class="tok tok-${who.replace(/\s/g, '-')}">${face(who)}</span><p><span class="sr">${esc(chName(who))}: </span>${esc(line)}</p></div>
  <div style="position:relative">${pic(it, it.href, it.e?.n)}${stickers(key)}</div>
  ${tline(x, 'h2', it.href)}${tsub(x)}<p class="meta small muted" style="margin:0">${metaLine(it)}</p>
  <div class="row">${ticket(it.copy, key, 'big')}${starBtn(key, title)}${tonBtn(key, title)}</div>
  <div class="row"><button type="button" class="btn pickbtn" data-act="pick"><span class="die" aria-hidden="true">${dieFace}</span>${t('another')}</button><span class="muted small">${esc(t('pickFrom', {n: pool.length}))}</span></div></div>`;
 const delay = reduced() || dlg.open ? 0 : 450;
 setTimeout(() => { showDlg(html, 'pick'); const b = dlg.querySelector('.pickbtn .die'); if (b && !reduced()) b.classList.add('roll'); }, delay);
}
function showDlg(html, kind) {
 const dlg = $('#dlg'); dlg.innerHTML = html; dlg.dataset.kind = kind;
 for (const im of dlg.querySelectorAll('img')) im.addEventListener('error', () => { const s = document.createElement('span'); s.className = 'ph'; s.textContent = im.dataset.n || ''; if (im.parentNode.classList.contains('face')) im.remove(); else im.replaceWith(s); }, {once: true});
 for (const tk of dlg.querySelectorAll('.ticket')) tk.style.setProperty('--notch', 'var(--surface)');
 if (!dlg.open) dlg.showModal();
}
function openTonight() {
 const its = M.tonight.map(itemOf).filter(Boolean); const total = its.reduce((s, it) => s + (it.d || 0), 0);
 const first = its[0];
 showDlg(`<div class="dlg"><button type="button" class="iconbtn x" data-act="close" aria-label="${t('close')}">×</button><h2>${t('tonight')} <span class="mono muted small">${its.length ? its.length + ' · ' + mins(total) + ' ' + t('minShort') : ''}</span></h2>
  ${its.length ? `<ol class="tlist">${its.map((it, i) => `<li><span class="num">${i + 1}</span>${pic(it, it.href)}<div>${tline(it.x, 'b')}<small>${it.copy ? esc(watchOf(it.copy)?.host || '') : ''}${it.d ? ' · <span class="ltr">' + dur(it.d) + '</span>' : ''}</small></div><span class="ctl"><button type="button" data-act="tup" data-i="${i}" aria-label="${t('up')}" ${i === 0 ? 'disabled' : ''}>↑</button><button type="button" data-act="tdown" data-i="${i}" aria-label="${t('down')}" ${i === its.length - 1 ? 'disabled' : ''}>↓</button><button type="button" data-act="trm" data-i="${i}" aria-label="${t('rm')}">×</button></span></li>`).join('')}</ol>
  ${first.copy ? ticket(first.copy, first.key, 'big', t('openNext'), {ton: true}) : ''}<button type="button" class="btn" data-act="tclear">${t('clear')}</button>` : `<div class="empty"><span class="kip" aria-hidden="true"></span><b>${t('emptyTonight')}</b></div>`}</div>`, 'ton');
}
function openAbout() {
 showDlg(`<div class="dlg about"><button type="button" class="iconbtn x" data-act="close" aria-label="${t('close')}">×</button><h2>${t('about')}</h2><p>${t('aboutP')}</p><p class="muted">${t('aboutP2')}</p>
 <div class="row"><button type="button" class="btn" data-act="export">${t('exportB')}</button><label class="btn">${t('importB')}<input type="file" accept="application/json,.json" class="sr" data-act="import"></label></div>
 <div class="row"><button type="button" class="btn" data-act="clearmarks">${t('clearMarks')}</button><button type="button" class="btn" data-act="samplemarks">${t('sampleMarks')}</button></div></div>`, 'about');
}
function setLang(l) { lang = l; LS.setItem(P + 'language', l); H.lang = l; H.dir = l === 'he' ? 'rtl' : 'ltr'; render(false); if ($('#dlg').open) $('#dlg').close(); }

document.addEventListener('click', ev => {
 const a = ev.target.closest('a[data-open]');
 if (a) { bump(a.dataset.open, a.dataset.rid, !!a.dataset.ton); return; }
 const go = ev.target.closest('[data-go]');
 if (go) { keepScroll = true; location.hash = go.dataset.go; return; }
 const b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') { if (!ev.target.closest('#appop,#apbtn')) closeAp(); return; }
 const act = b.dataset.act, key = b.dataset.key;
 if (act !== 'ap') closeAp();
 if (act === 'star') { if (M.stars[key]) delete M.stars[key]; else M.stars[key] = Date.now(); save(); rerender(); const s = document.querySelector(`[data-stk="${CSS.escape(key)}"] .st-star`); if (s && M.stars[key] && !reduced()) s.classList.add('pressed'); }
 else if (act === 'ton') { if (M.tonight.includes(key)) { M.tonight = M.tonight.filter(k => k !== key); toast(t('removedTon')); } else { M.tonight.push(key); toast(t('addedTon', {n: M.tonight.length})); } save(); rerender(); }
 else if (act === 'watched') { if (M.watched[key]) delete M.watched[key]; else M.watched[key] = Date.now(); save(); rerender(); }
 else if (act === 'spoken') { spoken = b.dataset.v; LS.setItem(P + 'spoken', spoken); pickSeen = new Set(); rerender(); }
 else if (act === 'pick') doPick();
 else if (act === 'close') $('#dlg').close();
 else if (act === 'tonedit') openTonight();
 else if (act === 'tup' || act === 'tdown') { const i = +b.dataset.i, j = act === 'tup' ? i - 1 : i + 1; const L = M.tonight.filter(itemOf); [L[i], L[j]] = [L[j], L[i]]; M.tonight = L; save(); rerender(); }
 else if (act === 'trm') { const L = M.tonight.filter(itemOf); L.splice(+b.dataset.i, 1); M.tonight = L; save(); rerender(); }
 else if (act === 'tclear') { M.tonight = []; save(); rerender(); }
 else if (act === 'about') openAbout();
 else if (act === 'export') { const blob = new Blob([JSON.stringify({format: 'sumsum-mock-c-backup', exportedAt: new Date().toISOString(), marks: M}, null, 1)], {type: 'application/json'}); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'sumsum-backup.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); }
 else if (act === 'clearmarks') { M = {v: 1, stars: {}, watched: {}, opened: {}, tonight: [], parts: {}}; save(); $('#dlg').close(); render(false); toast(t('cleared')); }
 else if (act === 'samplemarks') { M = sampleMarks(); save(); $('#dlg').close(); render(false); }
 else if (act === 'ap') { const v = b.dataset.v; H.setAttribute('data-appearance', v); LS.setItem(P + 'appearance', v); window.__applyScheme(); chrome(route().parts[0] === 'guide' ? 'guide' : ''); render(false); $('#appop').hidden = false; $('#apbtn').setAttribute('aria-expanded', 'true'); }
 else if (act === 'openfilters') { filtersOpen = true; $('#filters').classList.add('open'); }
 else if (act === 'closefilters') { filtersOpen = false; $('#filters').classList.remove('open'); }
});
document.addEventListener('change', ev => {
 const s = ev.target;
 if (s.dataset.act === 'gsort' || s.dataset.act === 'bsort') { keepScroll = true; location.hash = s.value; }
 if (s.dataset.act === 'import' && s.files[0]) { s.files[0].text().then(txt => { const j = JSON.parse(txt); const m = j.marks || j; if (m && typeof m === 'object') { M = {v: 1, stars: m.stars || {}, watched: m.watched || {}, opened: m.opened || {}, tonight: Array.isArray(m.tonight) ? m.tonight : [], parts: m.parts || {}}; save(); $('#dlg').close(); render(false); toast(t('imported')); } }).catch(() => {}); }
});
function closeAp() { $('#appop').hidden = true; $('#apbtn').setAttribute('aria-expanded', 'false'); }
$('#apbtn').addEventListener('click', ev => { ev.stopPropagation(); const p = $('#appop'); p.hidden = !p.hidden; $('#apbtn').setAttribute('aria-expanded', String(!p.hidden)); if (!p.hidden) p.querySelector('[aria-checked=true]')?.focus(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeAp(); });
$('#langsw').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.dataset.lang !== lang) setLang(b.dataset.lang); });
$('#langsw').addEventListener('keydown', ev => { if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key)) { ev.preventDefault(); setLang(lang === 'en' ? 'he' : 'en'); $(`#langsw [data-lang="${lang}"]`).focus(); } });
document.addEventListener('keydown', ev => { const g = ev.target.closest?.('[role=radiogroup]'); if (!g || g.id === 'langsw' || !['ArrowLeft', 'ArrowRight'].includes(ev.key)) return; const bs = [...g.querySelectorAll('[role=radio]')]; let i = bs.indexOf(ev.target.closest('[role=radio]')); if (i < 0) return; ev.preventDefault(); const dir = (ev.key === 'ArrowRight') !== (H.dir === 'rtl') ? 1 : -1; i = (i + dir + bs.length) % bs.length; bs[i].click(); setTimeout(() => { const n = document.querySelectorAll(`#${g.id || 'x'} [role=radio]`)[i]; n?.focus(); }, 30); });
let qTimer;
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { const s = $('#q').value.trim(); keepScroll = true; location.hash = s ? '#/search?q=' + encodeURIComponent(s) : '#/'; }, 300); });
$('#sform').addEventListener('submit', ev => { ev.preventDefault(); const s = $('#q').value.trim(); if (s) location.hash = '#/search?q=' + encodeURIComponent(s); });
let keepScroll = false;
window.addEventListener('hashchange', () => { const ks = keepScroll; keepScroll = false; render(!ks); if (!ks) $('#main').focus({preventScroll: true}); });
render(true);
})();

</script>
</body>
</html>
