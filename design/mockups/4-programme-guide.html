const values={series:[...new Set(R.map(r=>r.series))],type:['episode','short','talk','clip','part','unresolved'],theme:[...new Set(R.flatMap(r=>r.themes||[]))].sort(),character:[...new Set(R.flatMap(r=>r.characters||[]))].sort()};
function match(r,omit=''){if(query&&!JSON.stringify(r).toLowerCase().includes(query.toLowerCase()))return false;return Object.entries(filters).every(([k,v])=>!v||k===omit||(k==='type'?type(r)===v:k==='series'?r.series===v:(r[k==='theme'?'themes':'characters']||[]).includes(v)))}
function browse(){let rs=R.filter(r=>match(r));rs.sort((a,b)=>sort==='duration'?(b.durationSeconds||0)-(a.durationSeconds||0):String(a.titleEn).localeCompare(String(b.titleEn)));return `<div class="intro"><div><p class="eyebrow">${t('Video records','רשומות סרטונים')}</p><h1>${t('Browse the copies.','עיון בעותקים.')}</h1><p>${t('Look for a video, then follow its link back to the episode it belongs to.','מוצאים סרטון וחוזרים ממנו לזהות הפרק שאליו הוא משויך.')}</p></div><span class="folio">↗</span></div><div class="filter-panel"><div class="filter-grid">${Object.keys(filters).map(k=>`<label>${({series:t('Series','סדרה'),type:t('Programme type','סוג תכנית'),theme:t('Theme · editorial','נושא · בעריכתנו'),character:t('Character · editorial','דמות · בעריכתנו')})[k]}<select aria-label="${k}" onchange="filters.${k}=this.value;render()"><option value="">${t('All','הכול')} · ${R.filter(r=>match(r,k)).length}</option>${values[k].map(v=>`<option value="${esc(v)}" ${filters[k]===v?'selected':''}>${esc(label(v,k))} · ${R.filter(r=>match(r,k)&&(k==='type'?type(r)===v:k==='series'?r.series===v:(r[k==='theme'?'themes':'characters']||[]).includes(v))).length}</option>`).join('')}</select></label>`).join('')}</div><div class="filter-bottom"><p>${t('Counts update with your other filters. Tags describe this sample.','הספירות מתעדכנות עם המסננים האחרים. התגיות מתארות דוגמה זו.')}</p><button class="text-action" onclick="filters={series:'',type:'',theme:'',character:''};render()">${t('Clear filters','ניקוי מסננים')}</button></div></div><div class="result-title"><div><h2 aria-live="polite">${rs.length} ${t('video records','רשומות סרטונים')}</h2><p class="small muted">${Object.values(filters).filter(Boolean).map(label).join(' · ')||t('All sample videos','כל סרטוני הדוגמה')}</p></div><select aria-label="Sort videos" onchange="sort=this.value;render()"><option value="duration" ${sort==='duration'?'selected':''}>${t('Duration · longest first','משך · הארוך תחילה')}</option><option value="title" ${sort==='title'?'selected':''}>${t('Title · A–Z','כותרת · א–ת')}</option></select></div><div class="cards browse-cards">${rs.map(r=>{let ep=E.find(e=>e.uploads.some(u=>u.recordId===r.id)),u=ep?.uploads.find(u=>u.recordId===r.id);return `<article class="entry">${picture(r,ep?.number)}<div class="entry-body"><p class="programme">${label(type(r))} · ${bi(host(r))}</p><h3>${bi(title(r))}</h3><p class="secondary">${bi(secondary(r))}</p><p class="title-origin">${origin(r)}</p><div class="copy-annotation">${u?role(u):t('Clip · episode not identified','קטע · הפרק לא זוהה')}<br>${access(r)}</div><div class="entry-actions">${u?.role==='possible'?'':action(r)}${ep?`<button class="text-action" onclick="go('episode','${ep.id}')">${t('Episode entry →','לרשומת הפרק ←')}</button>`:''}</div></div></article>`}).join('')}</div>${!rs.length?`<div class="empty"><p>${t('No video matches these filters.','אין סרטון שמתאים למסננים האלה.')}</p><button onclick="filters={series:'',type:'',theme:'',character:''};render()">${t('Show all sample videos','הצגת כל סרטוני הדוגמה')}</button></div>`:''}<p class="guide-foot">${R.length} ${t('sample upload records. Counts here are videos, not distinct episodes. Full episodes and complete short installments stay separate.','רשומות העלאה בדוגמה. הספירות כאן הן של סרטונים, לא של פרקים שונים. פרקים מלאים ופרקים קצרים שלמים מוצגים בנפרד.')}</p>`+footer()}
function episode(){let e=E.find(e=>e.id===selected),us=uploads(e),b=best(e),r=representative(e),parts=us.filter(u=>u.role==='part').sort((a,b)=>(a.part??Infinity)-(b.part??Infinity)),possible=us.filter(u=>u.role==='possible'),p=P.find(p=>p.id===e.production);return `<div class="crumb"><button class="text-action" onclick="setProduction('${e.production}')">${t('← Back to ','חזרה אל ← ')}${prodName(e.production)}</button><span>${t('Episode identity','זהות הפרק')} · ${bi(e.number??'—')}</span></div><section class="decision"><div class="decision-top">${picture(r,e.number)}<div class="entry-body"><p class="eyebrow">${prodName(e.production)} · ${bi(p.years)}</p><h1>${bi(title(e))}</h1><p class="secondary">${bi(secondary(e))}</p><p class="title-origin">${origin(e)}</p><div class="identity-line" style="margin-top:18px"><span class="programme">${e.production==='original-1980s'?t('IETV no.','מס׳ חינוכית'):t('Installment','פרק')} ${bi(e.number??'—')}</span><span class="coverage ${e.coverage}">${cov(e)}</span></div><div class="entry-actions">${b?action(b):parts.length?`<a class="primary" href="#copies">${t('Choose an available part ↓','בחירת חלק זמין ↓')}</a>`:`<a class="text-action" href="#identity">${t('Read the unresolved identity ↓','לקריאת פרטי הזיהוי ↓')}</a>`}</div><p class="evidence-line">${evidence(e)}</p><p class="small muted">${b?access(b):parts.length?t('Listed parts do not establish a complete programme.','החלקים הרשומים אינם מוכיחים שהתכנית שלמה.'):t('Possible copies do not count as coverage or viewing choices.','עותקים אפשריים אינם נספרים בכיסוי או באפשרויות הצפייה.')}</p></div></div><div class="personal"><span class="muted">${t('Your library','הספרייה שלך')}</span><label><input type="checkbox" ${marks.has(e.id)?'checked':''} onchange="this.checked?marks.add('${e.id}'):marks.delete('${e.id}')">${t('Watched','צפיתי')}</label><label><input type="checkbox" ${stars.has(e.id)?'checked':''} onchange="this.checked?stars.add('${e.id}'):stars.delete('${e.id}')">${t('Save entry','שמירת הרשומה')}</label><span class="muted">${t('Personal marks · this preview only','סימונים אישיים · בהדגמה זו בלבד')}</span></div></section><nav class="jump"><a href="#copies">${t('Available copies','עותקים זמינים')}</a><a href="#identity">${t('Identity & sources','זהות ומקורות')}</a><a href="#evidence">${t('What was checked','מה נבדק')}</a></nav><div class="dossier"><section id="copies"><p class="eyebrow muted">${t('The decision','בחירת עותק')}</p><h2>${parts.length?t('Watch the available parts','צפייה בחלקים הזמינים'):t('Copies attached to this episode','עותקים המקושרים לפרק')}</h2>${[...parts,...us.filter(u=>!['possible','part'].includes(u.role))].map(u=>`<div class="copy-row"><div><strong>${role(u)} · ${bi(host(u.r))} · <bdi dir="ltr">${duration(u.r)}</bdi></strong><p class="${u.r.access==='licensed'?'licensed':''}">${access(u.r)}</p><p>${u.r.playbackVerified?t('Seen to play','נצפתה תחילת ניגון'):t('Details checked, not test-played','הפרטים נבדקו, הניגון לא נבדק')}</p><details class="copy-provenance"><summary>${t('Upload title & source','כותרת ההעלאה ומקור')}</summary><p dir="auto">${esc(u.r.titleHe||u.r.titleEn)}</p>${u.r.uploader?`<p>${t('Uploaded by','הועלה בידי')} ${bi(u.r.uploader)}</p>`:''}${u.r.directUrl&&host(u.r)==='Vimeo'?`<a class="source-link" href="${esc(u.r.hopUrl||u.r.sourceUrl||u.r.url)}" target="_blank" rel="noopener noreferrer">${t('Hop! source page · Israeli connection required ↗','עמוד המקור בהופ! · נדרש חיבור ישראלי ↗')}</a>`:''}</details>${u.role==='part'?`<label class="small"><input type="checkbox" ${opened.has(u.recordId)?'checked':''} onchange="this.checked?opened.add('${u.recordId}'):opened.delete('${u.recordId}')"> ${t('Opened this part · this visit','פתחתי חלק זה · בביקור זה')}</label>`:''}</div>${playable(u.r)?action(u.r):`<span class="small muted">${t('No viewing link','אין קישור לצפייה')}</span>`}</div>`).join('')}${possible.length?`<div class="research-note"><strong>${t('Possible copies · unresolved','עותקים אפשריים · טרם זוהו')}</strong><p>${t('These uploads may belong to this identity. They are excluded from coverage and viewing choices.','ייתכן שהעלאות אלה שייכות לפרק. הן אינן נספרות בכיסוי ואינן מוצעות לצפייה.')}</p>${possible.map(u=>`<p style="margin-top:12px">${bi(u.r.titleHe||u.r.titleEn)} · ${duration(u.r)} · ${bi(host(u.r))}</p>`).join('')}</div>`:''}<p class="footnote">${t('Every viewing action opens the original host in a new tab. Opening a part never marks the episode Watched or changes the project evidence.','כל פעולת צפייה פותחת את אתר המקור בלשונית חדשה. פתיחת חלק אינה מסמנת שצפית בפרק ואינה משנה את הראיות.')}</p><section id="evidence" style="margin-top:35px"><p class="eyebrow muted">${t('Project evidence','ראיות הפרויקט')}</p><h2>${t('What was checked','מה נבדק')}</h2><div class="evidence-steps">${['metadata-checked','playback-started','complete-playback-reviewed','reference-compared'].map(l=>`<p class="${e.evidence===l?'now':''}">${evidence({evidence:l})}${e.evidence===l?' · '+t('Now','כעת'):''}</p>`).join('')}</div><p class="footnote">${t('These are evidence levels, separate from your personal viewing history.','אלה רמות הראיות, בנפרד מהיסטוריית הצפייה האישית שלך.')}</p></section></section><aside id="identity" class="source-card"><p class="eyebrow muted">${t('The dossier','תיק הפרק')}</p><h2>${t('Identity & sources','זהות ומקורות')}</h2><dl><dt>${t('Catalogue / source title','כותרת קטלוג / מקור')}</dt><dd>${bi(e.titleHe||e.titleEn)}</dd>${e.storyHe?`<dt>${t('Source story title','שם הסיפור במקור')}</dt><dd>${bi(e.storyHe)}</dd><dt>${t('Story title source','מקור שם הסיפור')}</dt><dd>${esc(lang==='he'?(e.storySourceHe||e.storySourceEn):e.storySourceEn)}</dd>`:''}${e.titleHeEditorial?`<dt>${t('Editorial Hebrew title','כותרת עברית בעריכתנו')}</dt><dd>${bi(e.titleHeEditorial)}</dd>`:''}<dt>${t('Identity confidence','ביטחון בזיהוי')}</dt><dd>${e.confidence==='documented'?t('Documented','מתועד'):t('Provisional','זמני')}</dd>${(e.altLabels||[]).map(a=>`<dt>${t('Alternate uploader label','תווית חלופית של המעלה')}</dt><dd>${bi(lang==='he'?(a.labelHe||a.labelEn):a.labelEn)}</dd>`).join('')}<dt>${t('Stable episode ID','מזהה פרק קבוע')}</dt><dd>${bi(e.id)}</dd></dl>${e.sources.filter(s=>s.url).slice(0,2).map(s=>`<a class="source-link" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${t('Source','מקור')} ↗ <span dir="auto">${esc(s.label)}</span></a>`).join('')}<details class="research-note"><summary>${t('Read the source note','קריאת הערת המקור')}</summary><p style="margin-top:12px" dir="auto">${esc(e.noteEn||'')}</p><p class="footnote">${t('Repository research note, in its original English.','הערת מחקר מהמאגר, באנגלית המקורית.')}</p></details></aside></div>`+footer()}
function applyAppearance(){document.documentElement.dataset.appearance=appearance;document.documentElement.dataset.scheme=appearance==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):appearance}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';applyAppearance();document.getElementById('note-title').textContent=t('04 · Annotated programme guide · About this direction','04 · מדריך פרקים עם הערות · על הכיוון');document.getElementById('note-copy').textContent=t('One entry per episode, with copies and parts attached. A production index keeps your place. Album chooses by picture, Numbers scans catalogue identities, and List compares copies. Real sample records; personal marks last only for this visit.','זהויות הפרקים מובילות, והעותקים מקושרים לכל רשומה. מפתח ההפקות שומר על ההקשר. אלבום, מספרים ורשימה עונים על שאלות שונות. הדגמת עיצוב אינטראקטיבית עם רשומות אמיתיות וסימונים אישיים לביקור בלבד.');document.getElementById('search').setAttribute('aria-label',t('Search episodes and videos','חיפוש פרקים וסרטונים'));document.getElementById('appearance').setAttribute('aria-label',t('Appearance','מראה'));document.querySelector('.wordmark span').textContent=t('רחוב סומסום · A video-link library','רחוב סומסום · ספריית קישורי וידאו');document.getElementById('language').textContent=lang==='en'?'עברית':'English';let a=document.getElementById('appearance');a.options[0].text=t('System','מערכת');a.options[1].text=t('Light','בהיר');a.options[2].text=t('Dark','כהה');a.value=appearance;document.getElementById('search').placeholder=t('Search episodes, videos or an uploader label…','חיפוש פרקים, סרטונים או תווית של מעלה…');document.getElementById('nav').innerHTML=[['guide',t('Episode guide','מדריך פרקים')],['browse',t('Browse videos','עיון בסרטונים')],['episode',t('Episode entry','רשומת פרק')]].map(([s,n])=>`<button class="${screen===s?'active':''}" onclick="go('${s}')" ${screen===s?'aria-current="page"':''}>${n}</button>`).join('');document.getElementById('rail').innerHTML=rail();document.getElementById('main').innerHTML=screen==='guide'?guide():screen==='browse'?browse():episode()}
document.getElementById('language').onclick=()=>{lang=lang==='en'?'he':'en';render()};document.getElementById('appearance').onchange=e=>{appearance=e.target.value;applyAppearance()};document.getElementById('search').addEventListener('input',e=>{query=e.target.value;if(screen==='episode')screen='guide';render()});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(appearance==='system')applyAppearance()});render();
</script></body></html>
