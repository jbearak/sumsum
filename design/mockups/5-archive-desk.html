<!doctype html>
<html lang="en" dir="ltr" data-palette="terracotta" data-appearance="system" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Archive desk · Rechov Sumsum library (mockup 5)</title>
<style>
/* Tokens copied from library.template.html: the shared scheme tokens and the Terracotta palette. Rules below use only
   var(--...) and transparent. Coverage colours and --acc-lic mark only coverage and licensed access. */
:root{color-scheme:light;
 --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --whole:#1b7a4b;--parts:#a86400;--excerpt:#5f4fb3;--missing:#b3392c;--unknown:#7e8a83;--whole-ink:#fff;
 --whole-bg:#e2f1e7;--parts-bg:#faefd9;--excerpt-bg:#ece9fa;--missing-bg:#fbe8e4;--unknown-bg:#eef0ea;
 --acc-ok:#1f5fa8;--acc-public:#5c6b75;--acc-vpn:#8f3f71;--acc-lic:#1d6a6a;--acc-bad:#3d3d3d;
 --ser-modern:#126844;--ser-classic:#7a5e10;--ser-shalom-classic:#2f5f8c;--ser-shalom-modern:#7a4a80;--ser-elmo:#9c4a2f;
 --star:#f5cf45;--star-ink:#a77300;--scrim:#000000a0;--scrim-ink:#fff;--host-bg:#fffffff2;--host-ink:#18291f;
 --seg-hatch:#ffffff5c;--seg-dot:#ffffff80;--shadow-badge:0 1px 3px #0003;--shadow-toast:0 6px 30px #0004}
:root[data-scheme=dark]{color-scheme:dark;
 --whole:#5cc790;--parts:#e9a640;--excerpt:#ab9ef2;--missing:#f2826f;--unknown:#84928a;--whole-ink:#05231a;
 --whole-bg:#173827;--parts-bg:#3a2c12;--excerpt-bg:#29244a;--missing-bg:#40201b;--unknown-bg:#1c2823;
 --acc-ok:#8cc3ff;--acc-public:#a9b6bf;--acc-vpn:#e59ac6;--acc-lic:#7fd1cc;--acc-bad:#cfcfcf;
 --ser-modern:#86d6a8;--ser-classic:#e3c167;--ser-shalom-classic:#9cc4ec;--ser-shalom-modern:#d6a6dc;--ser-elmo:#f2a28e}
:root{
 --bg:#f9f2eb;--surface:#fffcf8;--surface-2:#f3e9e0;--surface-3:#eaddd1;
 --ink:#301f18;--muted:#6a5449;--line:#e3d7cc;--line-strong:#c2ac9b;
 --brand:#803414;--primary:#00445f;--primary-ink:#fff;--primary-hover:#00364c;
 --accent:#dfbd7c;--focus:#1e3a71;--link:#164878;--chip:#e4dad3;--chip-ink:#4b382f;
 --art-veil:#fffcf8cc;--shadow:0 1px 2px #3a1a100f,0 6px 18px #3a1a100d;
 --mast-ink:#fff;--mast-ink-soft:#fdf7f3;--mast-hover:#ffffff18;--mast-chip:#ffffff26;
 --mast-current:#fff;--mast-current-ink:#803414;--mast-ctl:#ffffff14;--mast-ctl-hover:#ffffff26;--mast-ctl-line:#ffffff80;
 --mast-focus:#f3d68f;--mast-divider:#ffffff59;--mast-current-divider:#80341499}
:root[data-scheme=dark]{
 --bg:#140e0b;--surface:#1e1511;--surface-2:#281c17;--surface-3:#33251f;
 --ink:#f1e9e3;--muted:#c1ad9f;--line:#382a25;--line-strong:#56433a;
 --brand:#58230c;--primary:#2f7990;--primary-ink:#fff;--primary-hover:#256a80;
 --accent:#e0d2b4;--focus:#c1e3fc;--link:#b3d6ff;--chip:#463e39;--chip-ink:#e6dbd3;
 --art-veil:#1e1511cc;--shadow:0 1px 2px #0006}

*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
body{margin:0;min-height:100vh}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
.num,.tnum,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
bdi{unicode-bidi:isolate}

/* masthead */
.mast{background:var(--brand);color:var(--mast-ink);position:sticky;top:0;z-index:30}
.mast-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 18px;min-height:54px}
.brand{display:flex;flex-direction:column;line-height:1.1;text-decoration:none;color:var(--mast-ink);flex:none}
.brand b{font-size:15px;letter-spacing:.02em}
.brand span{font-size:11.5px;color:var(--mast-ink-soft);opacity:.92}
.mnav{display:flex;gap:2px}
.mnav a{color:var(--mast-ink);text-decoration:none;padding:7px 11px;border-radius:6px;font-weight:600;white-space:nowrap}
.mnav a:hover{background:var(--mast-hover)}
.mnav a[aria-current=page]{background:var(--mast-current);color:var(--mast-current-ink)}
.mnav a .k{font-weight:400;font-size:11px;opacity:.75;margin-inline-start:6px}
.mast :focus-visible{outline-color:var(--mast-focus)}
.msearch{flex:1;min-width:160px;position:relative}
.msearch input{width:100%;background:var(--mast-ctl);border:1px solid var(--mast-ctl-line);color:var(--mast-ink);border-radius:6px;padding:7px 10px 7px 30px;}
[dir=rtl] .msearch input{padding:7px 30px 7px 10px}
.msearch input::placeholder{color:var(--mast-ink-soft);opacity:.85}
.msearch svg{position:absolute;inset-inline-start:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:none;stroke:var(--mast-ink);stroke-width:2}
.msearch kbd{background:transparent;position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);font-size:11px;border:1px solid var(--mast-ctl-line);border-radius:4px;padding:0 5px;color:var(--mast-ink-soft)}
.seg{display:inline-flex;border:1px solid var(--mast-ctl-line);border-radius:6px;overflow:hidden;flex:none}
.seg button{background:transparent;border:0;color:var(--mast-ink);padding:5px 9px;cursor:pointer;font-size:12.5px}
.seg button+button{border-inline-start:1px solid var(--mast-divider)}
.seg button:hover{background:var(--mast-ctl-hover)}
.seg button[aria-checked=true]{background:var(--mast-current);color:var(--mast-current-ink);font-weight:700}
.stripe{height:4px;background:var(--accent)}
.results{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-toast);max-height:70vh;overflow:auto;padding:6px 0;z-index:40}
.results h4{margin:8px 12px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.results a{display:flex;gap:10px;align-items:baseline;padding:6px 12px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a.hl{background:var(--surface-2)}
.results a .sub{color:var(--muted);font-size:12px;margin-inline-start:auto;text-align:end}
.results .none{padding:10px 12px;color:var(--muted)}

/* mockup note */
.note{max-width:1400px;margin:12px auto 0;padding:0 18px}
.note details{background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;padding:8px 14px}
.note summary{cursor:pointer;font-weight:700}
.note ol{margin:8px 0 4px;padding-inline-start:22px}
.note li{margin:3px 0}

/* layout */
main{max-width:1400px;margin:0 auto;padding:14px 18px 80px}
.desk{display:grid;gap:16px}
.desk>*{min-width:0}
.deskTop{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.deskTop>*{min-width:0}
.levels .evlist{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.levels .evlist li{border-top:0;padding:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px 10px;border-bottom:2px solid var(--brand)}
.panel>header h2{margin:0;font-size:16px}
.panel>header .meta{color:var(--muted);font-size:12.5px}
.panel .body{padding:12px 14px}
h1.page{font-size:22px;margin:4px 0 2px}
.lede{margin:0 0 12px;color:var(--muted);max-width:80ch}
.goal{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 14px}
.goal .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.goal .unit{color:var(--muted)}
.goal p{margin:0;flex-basis:100%;color:var(--muted);font-size:13px}

/* ledger table */
table{border-collapse:collapse;width:100%}
.ledger th,.ledger td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.ledger thead th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:58px;background:var(--surface);z-index:2;border-bottom:1px solid var(--line-strong)}
.ledger td.n,.ledger th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger tr.grp th{background:var(--surface-2);font-size:12px;color:var(--ink);text-transform:none;letter-spacing:0;padding:7px 8px;position:static}
.ledger tr.grp th small{font-weight:400;color:var(--muted);margin-inline-start:8px}
.ledger tbody tr.row{cursor:pointer}
.ledger tbody tr.row:hover td{background:var(--surface-2)}
.ledger tbody tr.row[aria-expanded=true] td{background:var(--surface-2)}
.pname{display:flex;gap:8px;align-items:flex-start}
.pname i{flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--ser)}
.pname b{display:block;font-weight:600}
.ledger td.pcell{min-width:190px}
.ledger td.kcell{min-width:150px}
.ledger td.ecell{min-width:180px}
.ledger th,.ledger td{font-size:13px}
.ledger thead th{white-space:normal;line-height:1.2}
.pname small{color:var(--muted)}
.zero{color:var(--muted);opacity:.7}
.conf{display:block;font-size:11.5px;color:var(--muted);white-space:normal}
.conf.contested{color:var(--ink);font-weight:600}
.bar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--unknown-bg);min-width:90px;border:1px solid var(--line)}
.bar span{display:block;height:100%}
.c-w{background:var(--whole)}.c-p{background:var(--parts)}.c-e{background:var(--excerpt)}.c-m{background:var(--missing)}.c-u{background:var(--unknown)}
.evw{font-size:12px;color:var(--muted);line-height:1.3}
.evw b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.expand td{background:var(--surface)!important;padding:10px 12px 14px}
.strip{display:flex;flex-direction:column;gap:6px}
.strip .srow{display:flex;gap:8px;align-items:center}
.strip .slab{flex:none;width:200px;font-size:12px;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:2px}
.cells a,.cells span{display:block;width:12px;height:16px;border-radius:2px}
.cells a:hover{outline:2px solid var(--ink)}
.cells .c-u{background:var(--unknown-bg);border:1px dashed var(--unknown)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.totals{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:12.5px}
.totals li{display:grid;grid-template-columns:52px 96px 1fr;gap:8px}
.totals b{font-variant-numeric:tabular-nums;text-align:end}

/* side column */
.watchdoor{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:14px;}
.watchdoor h3{margin:0 0 4px;font-size:16px}
.watchdoor p{margin:0 0 10px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--primary-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--primary-hover)}
.btn small{font-weight:400;opacity:.9}
.btn.big{padding:11px 18px;font-size:15px}
.btn2{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:6px 11px;text-decoration:none;cursor:pointer;line-height:1.2}
.btn2:hover{background:var(--surface-2)}
.btn2[aria-pressed=true]{background:var(--chip);color:var(--chip-ink);border-color:var(--chip-ink)}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{border-top:1px solid var(--line)}
.tasks a{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;text-decoration:none;color:var(--ink)}
.tasks a:hover{background:var(--surface-2)}
.tasks a b{font-variant-numeric:tabular-nums}
.tasks small{display:block;color:var(--muted)}
.evlist{margin:0;padding:0;list-style:none}
.evlist li{padding:6px 0;border-top:1px solid var(--line)}
.evlist li:first-child{border-top:0}
.evlist b{display:block}
.evlist span{color:var(--muted);font-size:12.5px}

/* workbench */
.wb{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:16px;align-items:start}
.wbnav{position:sticky;top:74px;display:grid;gap:2px}
.wbnav a{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.wbnav a:hover{background:var(--surface-2)}
.wbnav a[aria-current=page]{background:var(--surface);border:1px solid var(--line-strong);font-weight:700;box-shadow:var(--shadow)}
.wbnav a b{font-variant-numeric:tabular-nums;font-weight:600}
.wbnav .k{font-size:11px;color:var(--muted)}
.wbnav hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.tools select,.tools input{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px}
.grid th,.grid td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.grid thead th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface);border-bottom:1px solid var(--line-strong);position:sticky;top:58px;z-index:2}
.grid td.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid tbody tr[aria-selected=true] td{background:var(--chip);color:var(--chip-ink)}
.grid tbody tr[aria-selected=true] td:first-child{box-shadow:inset 3px 0 0 var(--focus)}
[dir=rtl] .grid tbody tr[aria-selected=true] td:first-child{box-shadow:inset -3px 0 0 var(--focus)}
.grid tr.gh td{background:var(--surface-2);font-weight:700;cursor:default;font-size:12.5px}
.url{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-w{background:var(--whole-bg);color:var(--ink)}.p-w i{background:var(--whole)}
.p-p{background:var(--parts-bg);color:var(--ink)}.p-p i{background:var(--parts)}
.p-e{background:var(--excerpt-bg);color:var(--ink)}.p-e i{background:var(--excerpt)}
.p-m{background:var(--missing-bg);color:var(--ink)}.p-m i{background:var(--missing)}
.p-u{background:var(--unknown-bg);color:var(--ink)}.p-u i{background:var(--unknown)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--chip);color:var(--chip-ink);font-weight:600;vertical-align:middle;white-space:nowrap}
.tag.out{background:transparent;border:1px solid var(--line-strong);color:var(--muted);font-weight:500}
.detail{position:sticky;top:74px}
.detail h3{margin:0 0 6px;font-size:16px}
.detail dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:8px 0;font-size:13px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
.next{background:var(--surface-2);border-inline-start:3px solid var(--accent);padding:8px 10px;border-radius:4px;margin:10px 0}
.next b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kbd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.report{width:100%;min-height:120px;font-family:var(--mono);font-size:11.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.thumbS{position:relative;flex:none;width:72px;aspect-ratio:16/9;border-radius:3px;overflow:hidden;background:var(--surface-3);display:block}
.thumbS .ph{position:absolute;inset:0;font-size:10px}
.thumbS img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{display:flex;align-items:center;justify-content:center;background:var(--surface-3);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

/* compare */
.cmp{overflow-x:auto}
.cmp table th,.cmp table td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:start}
.cmp thead th{background:var(--surface-2);font-size:12.5px}
.cmp tbody th{background:var(--surface-2);font-weight:600;width:130px;font-size:12.5px;color:var(--muted)}
.cmp .colU{border-top:3px solid var(--line-strong)}
.cmp .colC{border-top:3px solid var(--brand)}
.delta{font-variant-numeric:tabular-nums;font-size:12.5px}
.clues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.clues section{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.clues h4{margin:0 0 6px;font-size:13px}
.clues ul{margin:0;padding-inline-start:18px}
.clues li{margin:4px 0}
.src{font-size:11.5px;color:var(--muted)}

/* episode */
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--link)}
.epnav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.ep{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
.decide{padding:14px}
.hero{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/9;background:var(--surface-3)}
.hero .ph{position:absolute;inset:0;font-size:34px}
.dur{position:absolute;inset-inline-end:6px;bottom:6px;background:var(--scrim);color:var(--scrim-ink);font-size:12px;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums;font-weight:600}
.titles{margin:12px 0 6px}
.titles h1{font-size:23px;margin:0;line-height:1.2}
.titles .t2{margin:4px 0 0;font-size:15.5px;color:var(--muted)}
.titles .lab{font-size:11px;font-weight:600;color:var(--muted);margin-inline-start:6px;vertical-align:middle;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;white-space:nowrap}
.facts{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:8px 0 12px;font-size:13px}
.facts .sep{color:var(--line-strong)}
.watch{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.acc{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.acc i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none;background:var(--acc-public)}
.acc.a-vimeo i,.acc.a-played i{background:var(--acc-ok)}
.acc.a-hop i,.acc.a-restricted i{background:var(--acc-vpn)}
.acc.a-licensed i{background:var(--acc-lic)}
.acc.a-unavailable i{background:var(--acc-bad)}
.others{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px}
.others li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 10px;border-top:1px solid var(--line);align-items:center}
.others li:first-child{border-top:0}
.blank{padding:12px;border:1px dashed var(--line-strong);border-radius:6px;color:var(--ink)}
.parts{list-style:none;margin:0;padding:0;counter-reset:p}
.parts li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.parts li:first-child{border-top:0}
.parts input{width:16px;height:16px;margin:0}
.parts .gone{color:var(--muted)}
.mine{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
.mine .why{font-size:12px;color:var(--muted);flex-basis:100%}
.dossier{display:grid;gap:14px}
.ladder{list-style:none;margin:0;padding:0}
.ladder li{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ladder li:first-child{border-top:0}
.ladder .now{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ladder li.cur b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ladder li.off{color:var(--muted)}
.idl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:13px}
.idl dt{color:var(--muted)}
.idl dd{margin:0;min-width:0}
blockquote{margin:0;padding:8px 12px;border-inline-start:3px solid var(--line-strong);background:var(--surface-2);border-radius:4px}
.uptab td,.uptab th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top;font-size:13px}
.uptab thead th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.uptab td.n{text-align:end;font-variant-numeric:tabular-nums}
.uptab tr.rh td{background:var(--surface-2);font-weight:700}
.possbox{border:1px dashed var(--missing);border-radius:6px;padding:10px 12px;margin-top:10px}
.sources{margin:0;padding-inline-start:18px;font-size:12.5px}
.sources li{margin:4px 0}

/* reading room */
.room{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.room h1{font-size:24px;margin:0}
.fpanel{position:sticky;top:74px;max-height:calc(100vh - 90px);overflow:auto;padding-inline-end:4px}
.fpanel>details>summary{display:none}
.fg{border-top:1px solid var(--line);padding:10px 0}
.fg:first-child{border-top:0;padding-top:0}
.fg h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.fg h3 small{text-transform:none;letter-spacing:0;font-weight:400}
.opt{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:13.5px}
.opt:hover{background:var(--surface-2)}
.opt input{margin:0;accent-color:var(--primary)}
.opt .c{margin-inline-start:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.opt.z{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid transparent;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.chip .c{opacity:.75;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--primary);color:var(--primary-ink)}
.chip:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--link);text-decoration:underline;cursor:pointer;padding:2px 0;font-size:12.5px}
.ftext{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;background:var(--surface);margin-bottom:6px}
.sumbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 14px}
.sumbar p{margin:0;font-size:15px;flex:1 1 380px}
.sumbar select{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.active button{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.active button:hover{background:var(--surface-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card .pic{position:relative;aspect-ratio:16/9;background:var(--surface-3)}
.card .pic img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .pic .ph{position:absolute;inset:0;font-size:22px}
.card .cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h3{margin:0;font-size:15px;line-height:1.3}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.card .pf{font-size:12.5px;color:var(--muted)}
.card .act{margin-top:auto;padding-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .prov{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.lng{font-size:10.5px;font-weight:700;border:1px solid var(--line-strong);border-radius:3px;padding:0 4px;color:var(--muted)}
.empty{padding:30px;text-align:center;border:1px dashed var(--line-strong);border-radius:8px}
.empty button{margin:4px}
.foot{font-size:12px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:10px}

.tabbar{display:none}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;box-shadow:var(--shadow-toast);z-index:60;font-size:13px}
[dir=rtl] .toast{transform:translateX(50%)}
.help{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:70}
.help>div{background:var(--surface);color:var(--ink);border-radius:8px;padding:18px 22px;max-width:420px;width:90%}
.help dl{display:grid;grid-template-columns:90px 1fr;gap:6px}

@media (max-width:1180px){
 .wb{grid-template-columns:180px minmax(0,1fr)}
 .wb .detail{grid-column:2;position:static}
 .deskTop{grid-template-columns:1fr 1fr}
 .deskTop .goalp{grid-column:1/-1}
 .levels .evlist{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
 html{font-size:15px}
 .mast-in{flex-wrap:wrap;gap:8px;padding:8px 12px}
 .brand{flex:1}
 .mnav{display:none}
 .msearch{order:5;flex-basis:100%}
 .msearch kbd{display:none}
 .seg button{padding:5px 7px;font-size:12px}
 .seg.app .lbl{display:none}
 main{padding:12px 12px 90px}
 .note{padding:0 12px}
 .tabbar{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line-strong);z-index:35;padding-bottom:env(safe-area-inset-bottom)}
 .tabbar a{flex:1;text-align:center;padding:9px 4px 10px;color:var(--muted);text-decoration:none;font-size:12.5px;font-weight:600;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
 .tabbar a b{font-size:11px;font-weight:400;font-variant-numeric:tabular-nums}
 .tabbar a[aria-current=page]{color:var(--ink);box-shadow:inset 0 3px 0 var(--brand)}
 .deskTop{grid-template-columns:1fr}
 .levels .evlist{grid-template-columns:1fr}
 .ledger thead{display:none}
 .ledger,.ledger tbody,.ledger tr,.ledger td,.ledger th{display:block}
 .ledger tr.row{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);padding:8px 0}
 .ledger tr.row td{border:0;padding:2px 8px}
 .ledger tr.row td.pcell{grid-column:1/-1}
 .ledger tr.row td.bcell,.ledger tr.row td.ecell{grid-column:1/-1}
 .ledger tr.row td.n{text-align:start}
 .ledger tr.row td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
 .ledger tr.row td.hide-s{display:none}
 .strip .srow{flex-direction:column;align-items:flex-start}
 .strip .slab{width:auto}
 .totals li{grid-template-columns:44px 1fr}
 .totals li span:nth-child(2){display:none}
 .wb{grid-template-columns:1fr}
 .wb .detail{grid-column:auto}
 .wbnav{position:static;display:flex;overflow-x:auto;gap:4px}
 .wbnav a{flex:none;border:1px solid var(--line)}
 .wbnav hr,.wbnav .k{display:none}
 .grid thead{display:none}
 .grid,.grid tbody,.grid tr,.grid td{display:block}
 .grid tbody tr{padding:8px 4px;border-bottom:1px solid var(--line)}
 .grid td{border:0;padding:1px 8px}
 .grid td.n{text-align:start}
 .grid td.hide-s{display:none}
 .kbd{display:none}
 .clues{grid-template-columns:1fr}
 .ep{grid-template-columns:1fr}
 .idl{grid-template-columns:1fr}
 .idl dt{margin-top:6px}
 .room{grid-template-columns:1fr}
 .fpanel{position:static;max-height:none;overflow:visible}
 .fpanel>details>summary{display:flex;justify-content:space-between;cursor:pointer;font-weight:700;padding:10px 12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px}
 .fpanel>details[open]>summary{margin-bottom:10px}
 .cards{grid-template-columns:1fr 1fr;gap:10px}
 .card .cb{padding:8px 9px 10px}
 .card h3{font-size:14.5px}
 .card .act .btn{padding:7px 10px;font-size:13px}
 .card .prov{display:none}
 .uptab .hide-s{display:none}
 .detail dl{grid-template-columns:96px 1fr}
}
@media (forced-colors:active){.c-w,.c-p,.c-e,.c-m,.c-u{forced-color-adjust:none}}

 const x = h('div', {class: 'help', role: 'dialog', 'aria-modal': 'true', 'aria-label': t('helpH'), onclick: ev => { if (ev.target === x) x.remove(); }}, h('div', null, h('h3', {style: 'margin-top:0'}, t('helpH')),
  h('dl', null, [['/', t('kSearch')], ['J / K', t('kMove')], ['Enter', t('kOpen')], ['1–4', t('kTabs')], ['g d', t('nDesk')], ['g w', t('nWork')], ['g r', t('nRoom')], ['?', t('kHelp')]].map(([k, v]) => [h('dt', null, h('kbd', null, k)), h('dd', {style: 'margin:0'}, v)])),
  h('button', {class: 'btn', type: 'button', onclick: () => x.remove()}, t('close'))));
 document.body.append(x); x.querySelector('button').focus(); }

render();
</script>
