function matches(x,omit=''){let r=first(x);return Object.entries(filters).every(([k,v])=>!v||k===omit||(k==='series'?r.series===v:k==='type'?type(x)===v:k==='time'?r.durationSeconds&&r.durationSeconds<=+v:k==='language'?(v==='unknown'?!x.copies.some(c=>c.language):x.copies.some(c=>c.language===v)):k==='theme'?x.copies.some(c=>c.themes?.some(t=>v==='music'?['music','songs'].includes(t.toLowerCase()):t.toLowerCase()===v)):k==='character'?x.copies.some(c=>c.characters?.includes(v)):true))}
function label(k,v){return facets.find(f=>f[0]===k)?.[2]().find(o=>o[0]===v)?.[1]||v}
function browse(){let results=DATA.filter(x=>matches(x));if(layout!=='title')results.sort((a,b)=>(first(b).durationSeconds||0)-(first(a).durationSeconds||0));return `<div class="page-head"><div><p class="eyebrow">${T('Watch / Browse','צפייה / עיון')}</p><h1>${T('Find your next video','מוצאים את הסרטון הבא')}</h1></div><p class="sample">${T('8 sample items · upload lengths include parts','8 פריטים במדגם · משכי ההעלאות כוללים חלקי פרקים')}</p></div><div class="browse"><div><button class="mobile-filters" onclick="filterOpen=!filterOpen;render()">${T('Filters','מסננים')} · ${Object.values(filters).filter(Boolean).length} ${T('active','פעילים')} ⌄</button><aside class="filters ${filterOpen?'open':''}"><h3>${T('Narrow your choices','מצמצמים את הבחירה')}</h3><p class="filter-help">${T('Each group narrows the others. Counts show the choices available with your other filters.','כל קבוצה מצמצמת את האחרות. המספרים מתחשבים במסננים האחרים.')}</p>${facets.map(([k,f,opts],i)=>`<details class="facet" ${i<4||filters[k]?'open':''}><summary>${f()}</summary><div class="options">${opts().map(([v,l])=>`<button class="chip" aria-pressed="${filters[k]===v}" onclick="setFilter('${k}','${v}')">${l}<b>${DATA.filter(x=>{let old=filters[k];filters[k]=v;let ok=matches(x);filters[k]=old;return ok}).length}</b></button>`).join('')}</div></details>`).join('')}</aside></div><section class="results"><p class="summary-line" aria-live="polite">${results.length} ${T('videos','סרטונים')}${Object.entries(filters).filter(([,v])=>v).length?T(' matching ',' לפי ')+Object.entries(filters).filter(([,v])=>v).map(([k,v])=>label(k,v)).join(' · '):T(' across the sample library','בכל המדגם')}.</p><div class="active-filters">${Object.entries(filters).filter(([,v])=>v).map(([k,v])=>button(esc(label(k,v))+' ×',`setFilter('${k}','${v}')`,'chip')).join('')}${Object.values(filters).some(Boolean)?button(T('Clear all','ניקוי הכול'),"filters={};render()",'chip'):''}</div><div class="toolbar"><div class="layouts">${button(T('Album','אלבום'),"layout='album';render()",layout==='album'?'selected':'')}${button(T('List','רשימה'),"layout='list';render()",layout==='list'?'selected':'')}</div><select aria-label="${T('Sort videos','מיון סרטונים')}" onchange="window.sortOrder=this.value;render()"><option value="long" ${window.sortOrder!=='short'?'selected':''}>${T('Longest first','מהארוך לקצר')}</option><option value="short" ${window.sortOrder==='short'?'selected':''}>${T('Shortest first','מהקצר לארוך')}</option></select></div>${results.length?`<div class="grid ${layout==='list'?'list':''}">${(window.sortOrder==='short'?results.reverse():results).map(card).join('')}</div>`:`<div class="empty"><h2>${T('No match with these filters','אין התאמה למסננים האלה')}</h2><p class="muted">${T('Try removing one filter. Your other choices will stay.','אפשר להסיר מסנן אחד. יתר הבחירות יישארו.')}</p>${Object.entries(filters).filter(([,v])=>v).map(([k,v])=>button(T('Remove ','הסרת ')+label(k,v)+' · '+DATA.filter(x=>matches(x,k)).length,`setFilter('${k}','${v}')`)).join(' ')}</div>`}</section></div>`}
function episode(){let x=DATA[current],e=x.e,r=best(x),c=cov(x),parts=x.copies.filter(r=>r.role==='part').sort((a,b)=>(a.part||0)-(b.part||0));return `<button class="back" onclick="nav('home')">${T('← Back to the guide','→ חזרה למדריך')}</button><div class="episode-hero">${pic(x)}<section><p class="eyebrow">${esc(prod(x))} ${e?.number?'· '+T('Programme ','תכנית ')+e.number:''}</p><h1 dir="auto">${esc(title(x))}</h1><p class="translation" dir="auto">${esc(other(x))}</p><p class="meta">${T(...typeNames[type(x)])} · <bdi>${duration(first(x).durationSeconds)}</bdi> · ${first(x).language==='en'?T('English','אנגלית'):first(x).language==='he'?T('Hebrew','עברית'):T('Language not recorded for this copy','שפה לא תועדה לעותק זה')}</p><p class="coverage ${c[0]}" style="margin-top:12px">${c[1]}</p><p class="small muted">${evidence(x)}</p><div class="decision"><p class="access ${r?.access==='licensed'?'licensed':''}">${access(r)}</p><div class="action-row">${r?link(r):`<span class="badge">${T('No Watch button until identity is resolved','ללא כפתור צפייה עד להכרעת הזיהוי')}</span>`}<a class="button" href="#copies">${T('Other copies','עותקים אחרים')}</a></div><p class="small muted" style="margin-top:10px">${r?T('Opens the original site in a new tab.','נפתח באתר המקורי בכרטיסייה חדשה.'):T('The possible copies below are research leads.','העותקים האפשריים להלן הם כיווני מחקר.')}</p></div><div class="personal"><label><input type="checkbox" ${watched.has(current)?'checked':''} onchange="this.checked?watched.add(current):watched.delete(current)">${T('I have watched this','צפיתי בפרק')}</label><label><input type="checkbox" ${stars.has(current)?'checked':''} onchange="this.checked?stars.add(current):stars.delete(current)">${T('Star for later','שמירה במועדפים')}</label></div><p class="small muted">${T('Your marks are personal. They do not change project evidence.','הסימונים שלך אישיים. הם אינם משנים את ראיות המחקר.')}</p></section></div><div class="episode-lower"><section><div class="panel" id="copies"><h2>${T('Available copies','עותקים זמינים')}</h2><p class="small muted">${T('Roles describe the copy. A whole candidate is not a completeness check.','התפקיד מתאר את העותק. מועמד לתכנית שלמה אינו בדיקת שלמות.')}</p>${x.copies.filter(r=>r.role!=='part').map(r=>copyRow(r,x)).join('')}</div>${parts.length?`<div class="panel"><h2>${T('Follow the parts in order','החלקים לפי הסדר')}</h2><p class="small muted">${T('Opening every listed part does not establish completeness.','פתיחת כל החלקים ברשימה אינה מוכיחה שלמות.')}</p>${parts.map(r=>copyRow(r,x,true)).join('')}</div>`:''}</section><aside><div class="panel"><details open><summary>${T('Evidence and identity','ראיות וזיהוי')}</summary><p class="small"><strong>${T('Now','כעת')} · ${evidence(x)}</strong></p><p class="small muted">${T('Evidence levels: Details checked, not test-played. Seen to play. Checked in full. Compared with a reference. Each requires a separate recorded check.','רמות הראיות: פרטים נבדקו, הניגון לא נבדק. נצפתה תחילת ניגון. נבדק במלואו. הושווה לעותק ייחוס. לכל רמה נדרשת בדיקה מתועדת נפרדת.')}</p><dl class="facts"><dt>${T('Catalogue title','כותרת קטלוג')}</dt><dd dir="auto">${esc(e?.titleHe||T('Not recorded','לא תועדה'))}</dd><dt>${T('English title','כותרת באנגלית')}</dt><dd>${esc(e?.titleEn||first(x).titleEn)}<br><span class="muted">${T(e?.production?.startsWith('shalom')?'Published title':'Editorial title',e?.production?.startsWith('shalom')?'כותרת מקורית':'כותרת עריכתית')}</span></dd>${e?.titleHeEditorial?`<dt>${T('Hebrew title','כותרת עברית')}</dt><dd>${esc(e.titleHeEditorial)}<br>${T('Our editorial translation','תרגום עריכתי שלנו')}</dd>`:''}${e?.storyHe?`<dt>${T('Story source','מקור שם הסיפור')}</dt><dd>${esc(T(e.storySourceEn,e.storySourceHe||e.storySourceEn))}</dd>`:''}${e?.altLabels?.length?`<dt>${T('Alternate label','תווית חלופית')}</dt><dd>${esc(T(e.altLabels[0].labelEn,e.altLabels[0].labelHe||e.altLabels[0].labelEn))}</dd>`:''}</dl></details></div><div class="panel"><details><summary>${T('Sources and provenance','מקורות ופרטי מקור')}</summary><p class="small muted">${esc(first(x).uploader)}</p><p class="small" dir="auto">${esc(first(x).titleHe||first(x).titleEn)}</p><p class="small">${T('Published upload title, verbatim.','כותרת ההעלאה המקורית, כלשונה.')}</p><p><a target="_blank" rel="noopener noreferrer" href="${esc(first(x).sourceUrl||first(x).url)}">${T('Original source ↗','המקור המקורי ↗')}</a></p>${e?.sources?.filter(s=>s.url).slice(0,2).map(s=>`<p class="small"><a target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">${esc(s.label||s.url)} ↗</a></p>`).join('')||''}</details></div></aside></div>`}
function recordEvidence(r){return r.playbackVerified?T('Seen to play · 2026-10-17 · direct Vimeo URL','נצפתה תחילת ניגון · 2026-10-17 · קישור Vimeo ישיר'):T('Details checked, not test-played','פרטים נבדקו, הניגון לא נבדק')}
function copyRow(r,x,part=false){let bad=isBad(r),possible=r.role==='possible';return `<div class="copy"><div><strong>${part?T('Part ','חלק ')+(r.part||T('incomplete copy','עותק חלקי')):possible?T('Possible copy · unresolved','עותק אפשרי · לא הוכרע'):r.role==='whole-candidate'?T('Whole candidate','מועמד לתכנית שלמה'):r.role==='alternate-edition'?T('Alternate edition','מהדורה חלופית'):T('Excerpt','קטע')}</strong><p class="small">${esc(host(r))} · <bdi>${duration(r.durationSeconds)}</bdi>${r.access==='licensed'?' · '+T('Licensed','מורשה'):''}</p><p class="small muted">${bad?T('Unavailable or region-restricted. No public play link.','לא זמין או מוגבל אזורית. אין קישור ציבורי לצפייה.'):possible?T('Excluded from coverage and viewing choices.','אינו נכלל בכיסוי ובאפשרויות הצפייה.'):recordEvidence(r)}</p>${part?`<label class="small"><input type="checkbox"> ${T('Opened this part · this visit only','פתחתי חלק זה · בביקור הזה בלבד')}</label>`:''}</div>${!bad&&!possible?link(r,'button'):''}</div>`}
function research(){return `<div class="page-head"><div><p class="eyebrow">${T('Research / Workbench','מחקר / שולחן העבודה')}</p><h1>${T('What still needs a closer look','מה עדיין דורש בדיקה')}</h1><p class="intro">${T('Keep acquisition, episode identity and playback evidence separate.','איסוף קישורים, זיהוי פרקים ובדיקת ניגון הם משימות נפרדות.')}</p></div><button onclick="nav('home')">${T('Back to Watch','חזרה לצפייה')}</button></div><div class="panel"><h2>${T('From the sample collection','מתוך אוסף המדגם')}</h2><table class="research-table"><thead><tr><th>${T('Episode','פרק')}</th><th>${T('Coverage','כיסוי')}</th><th>${T('Next step','הצעד הבא')}</th></tr></thead><tbody>${[DATA[6],DATA[2],DATA[0],DATA[3]].map(x=>{let c=cov(x);return `<tr><td><strong dir="auto">${esc(title(x))}</strong><br><span class="small muted">${esc(prod(x))} · <bdi>${num(x)}</bdi></span></td><td><span class="coverage ${c[0]}">${c[1]}</span></td><td>${button(x===DATA[6]?T('Compare possible identities','השוואת זיהויים אפשריים'):x===DATA[2]?T('Review the parts','בדיקת החלקים'):T('Inspect playback evidence','עיון בראיות הניגון'),`openEpisode(${DATA.indexOf(x)})`)}</td></tr>`}).join('')}</tbody></table></div><p class="muted small">${T('Sample counts are not production totals. Possible copies never fill a gap.','ספירות המדגם אינן סך ההפקה. עותקים אפשריים אינם ממלאים פער בכיסוי.')}</p>`}
function searchFor(v){query=v;screen=v?'search':'home';document.getElementById('main').innerHTML=body()}
function searchResults(){let q=query.toLowerCase(),items=DATA.filter(x=>JSON.stringify([x.e?.titleEn,x.e?.titleHe,x.e?.titleHeEditorial,x.e?.storyHe,x.e?.altLabels,...x.copies.map(r=>[r.titleEn,r.titleHe,r.url,r.directUrl])]).toLowerCase().includes(q)),episodes=items.filter(x=>x.e);let videos=items.flatMap(x=>x.copies.map(r=>({x,r}))).filter(({r})=>JSON.stringify([r.titleEn,r.titleHe,r.url,r.directUrl]).toLowerCase().includes(q));return `<h1>${T('Search the library','חיפוש בספרייה')}</h1><p class="search-label">${T('Episodes','פרקים')} · ${episodes.length}</p><div class="grid">${episodes.map(card).join('')}</div><p class="search-label">${T('Videos','סרטונים')} · ${videos.length}</p><div class="panel">${videos.map(({x,r})=>`<div class="copy"><div><strong dir="auto">${esc(lang==='he'?(r.titleHe||r.titleEn):r.titleEn)}</strong><p class="small muted">${esc(r.uploader)} · ${esc(host(r))}</p></div>${button(T('View episode / details','פרק / פרטים'),`openEpisode(${DATA.indexOf(x)})`)}</div>`).join('')||T('No videos match this search.','אין סרטונים תואמים.')}</div>`}
function body(){return screen==='home'?home():screen==='browse'?browse():screen==='episode'?episode():screen==='research'?research():screen==='search'?searchResults():`<h1>${T('Your starred videos','הסרטונים המועדפים שלך')}</h1><p class="intro">${T('Saved for this mockup visit.','נשמרים לביקור זה בהדמיה.')}</p><div class="grid" style="margin-top:24px">${[...stars].map(i=>card(DATA[i])).join('')||T('Use a star on a card to add a video.','מסמנים כוכב בכרטיס כדי להוסיף סרטון.')}</div>`}
function render(){sync();document.getElementById('app').innerHTML=header()}
render();
</script></body></html>
