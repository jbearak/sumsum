function nav(to){screen=to;query='';$('#search').value='';if(to==='browse'&&!Object.values(filters).some(Boolean))filters.time='600';render();window.scrollTo(0,0)}

function queueHTML(){let rr=queue.map(rec).filter(Boolean);return `<aside class="queue"><div class="row"><h2>${t('Tonight','הערב')}</h2><span class="small muted">${rr.length} ${t('videos','סרטונים')} · <bdi>${dur(rr.reduce((a,r)=>a+r.durationSeconds,0))}</bdi></span></div>${rr.map((r,i)=>`<div class="queue-item"><img src="${esc(r.thumbnailUrl)}" alt="" onerror="this.hidden=true"><div class="grow"><strong>${i+1}. ${esc(title(r))}</strong><span class="small muted"><bdi>${dur(r.durationSeconds)}</bdi> · Vimeo</span></div><button onclick="remove('${r.id}')" aria-label="${t('Remove','הסרה')}">×</button></div>`).join('')}${rr.length?`<div style="margin-top:16px">${action(rr[0])}</div>`:`<p class="muted">${t('Add a video with +.','הוסיפו סרטון בעזרת +.')}</p>`}<p class="small muted" style="margin-top:10px">${t('Each video opens on its original site.','כל סרטון נפתח באתר המקורי.')}</p></aside>`}
function preference(){return `<button class="preference" onclick="settings()"><span><strong>${t('How do you watch?','איך אתם צופים?')}</strong><span class="muted">${viaLabel()}</span></span><span>⌄</span></button>`}function viaLabel(){return t(...{free:['No Israel VPN','ללא חיבור ישראלי'],israel:['I have an Israel VPN','יש לי חיבור ישראלי'],hoopla:['I have a hoopla card','יש לי כרטיס hoopla'],rent:['I buy or rent','קנייה או השכרה']}[watchVia])}
const featured=()=>['hop-10333','hop-8864',records.find(r=>!r.ep)?.id,'web-2891664a2f'].map(rec).filter(Boolean);
function home(){return `<section class="home-top home-layout"><div><div class="intro"><div><p class="eyebrow">${t('Your pocket of Sesame Street','רחוב סומסום בכיס שלכם')}</p><h1>${t('A little time<br>for Sumsum.','קצת זמן<br>לסומסום.')}</h1><p class="muted">${t('Pick a short one. Save a few for tonight.','בחרו משהו קצר. שמרו כמה להערב.')}</p></div></div>${preference()}</div>${queueHTML()}</section><div class="section-head row"><h2>${t('Pick something for tonight','מה רואים הערב?')}</h2><button class="plain" onclick="filters.time='600';nav('browse')">${t('Under 10 min →','עד 10 דקות ←')}</button></div><div class="grid">${featured().map(card).join('')}</div><div class="section-head row"><h2>${t('An old favourite','חוזרים לקלאסיקה')}</h2><button class="plain" onclick="detail('original-1980s-ietv-167')">${t('See the parts →','לרשימת החלקים ←')}</button></div><div class="grid">${[rec('ia-rechov_sumsum_1983-a18c24c67f'),rec('yt-q99JQRJbHE0')].map(card).join('')}</div>`}
const facets={series:['Series','סדרה'],type:['Program type','סוג תכנית'],theme:['Theme · editorial','נושא · עריכה שלנו'],character:['Character · editorial','דמות · עריכה שלנו'],time:['Time per video','משך הסרטון']};
const choices={series:[['classic','Classic Rechov Sumsum','רחוב סומסום הקלאסי'],['modern','Modern Rechov Sumsum','רחוב סומסום החדש'],['elmo',"Elmo's talk show",'תכנית האירוח של אלמו'],['shalom-modern','Shalom Sesame','שלום סומסום']],type:Object.entries(typeNames).map(([k,v])=>[k,...v]),theme:['music','israel','sports','emotions'].map((k,i)=>[k,...[['Music','מוזיקה'],['Israel','ישראל'],['Sports','ספורט'],['Emotions','רגשות']][i]]),character:['elmo','ofnik','kippi','grover','sivan'].map((k,i)=>[k,...[['Elmo','אלמו'],['Ofnik','אופניק'],['Kippi','קיפי'],['Grover','גרובר'],['Sivan','סיון']][i]]),time:[['300','Under 5 minutes','עד 5 דקות'],['600','Under 10 minutes','עד 10 דקות']]};
function match(r,omit){return (!query||[r.titleEn,r.titleHe,r.titleHeEditorial].join(' ').toLowerCase().includes(query.toLowerCase()))&&Object.entries(filters).every(([k,v])=>!v||k===omit||(k==='series'?r.series===v:k==='type'?type(r)===v:k==='theme'?r.themes.includes(v):k==='character'?r.characters.includes(v):r.durationSeconds<=Number(v)))}function results(){return records.filter(r=>match(r)).sort((a,b)=>sort==='long'?b.durationSeconds-a.durationSeconds:a.durationSeconds-b.durationSeconds)}
function browse(){let rr=results(),n=Object.values(filters).filter(Boolean).length;return `<div class="intro"><div><p class="eyebrow">${t('Find your next one','מוצאים את הסרטון הבא')}</p><h1>${t('Browse','עיון')}</h1><p class="muted" aria-live="polite">${rr.length} ${t('sample uploads','העלאות לדוגמה')}</p></div></div><div class="filterbar"><button class="primary" onclick="filterSheet()">☷ ${t('Filters','סינון')} · ${n} ${t('active','פעילים')}</button><select aria-label="${t('Duration sort','מיון לפי משך')}" onchange="sort=this.value;render()"><option value="long" ${sort==='long'?'selected':''}>${t('Longest first','מהארוך לקצר')}</option><option value="short" ${sort==='short'?'selected':''}>${t('Shortest first','מהקצר לארוך')}</option></select></div><div class="pills">${Object.entries(filters).filter(([k,v])=>v).map(([k,v])=>`<button onclick="filters['${k}']='';render()">${t(...choices[k].find(c=>c[0]===v).slice(1))} ×</button>`).join('')}</div><div class="grid">${rr.map(card).join('')}</div>${!rr.length?`<div class="empty"><h2>${t('No matches in this sample','אין התאמות בדוגמה')}</h2><button onclick="filters={series:'',type:'',theme:'',character:'',time:''};render()">${t('Clear all filters','ניקוי כל המסננים')}</button></div>`:''}`}
function guide(){return `<div class="intro"><div><p class="eyebrow">${t('Six identities from the catalogue','שש זהויות מהקטלוג')}</p><h1>${t('Episode guide','מדריך הפרקים')}</h1><p class="muted">${t('Broadcasts, short series and talk shows stay distinct.','פרקי שידור, סדרות קצרות ותכנית האירוח מוצגים בנפרד.')}</p></div></div><div class="guide-grid">${episodes.map(e=>`<div class="guide-row" role="button" tabindex="0" onclick="detail('${e.id}')" onkeydown="if(event.key==='Enter')detail('${e.id}')"><span class="number">${e.number}</span><div class="grow"><h3>${esc(title(e))}</h3><p class="small muted">${e.production==='original-1980s'?t('Classic · IETV no. ','קלאסי · מס׳ חינוכית ')+e.number:e.production==='word-of-day-2023'?t('Word of the day · short series','מילת היום · סדרה קצרה'):e.production==='elmo'?t('Elmo · talk-show installment','אלמו · פרק בתכנית האירוח'):'Shalom Sesame · 2010'}</p><span class="coverage ${e.coverage}">${t(...coverageNames[e.coverage])}</span></div><span>›</span></div>`).join('')}</div>`}
function episode(){let e=ep(current),r=e?rec(e.uploads[0].recordId):rec(current);if(!r)return '';let parts=e?e.uploads.filter(u=>u.role==='part').sort((a,b)=>a.part-b.part):[],possible=e?.uploads.some(u=>u.role==='possible'),cov=e?.coverage;return `<section class="episode"><button class="plain" onclick="nav('guide')">${t('← Episode guide','→ מדריך הפרקים')}</button><div class="episode-layout"><div>${picture(r)}<p class="small muted" style="margin-top:8px">${t('Videos open on the original host in a new tab.','הסרטונים נפתחים באתר המקורי בלשונית חדשה.')}</p></div><div><p class="eyebrow">${esc(sn(r))} ${e?' · '+t('No. ','מס׳ ')+e.number:''}</p><h1>${esc(title(e||r))}</h1><p class="subtitle" dir="auto">${esc(lang==='en'?(e?.storyHe||e?.titleHe||r.titleHe||e?.titleHeEditorial||r.titleHeEditorial):e?.titleEn||r.titleEn)}</p>${cov?`<span class="coverage ${cov}">${t(...coverageNames[cov])}</span>`:''}<p class="evidence">${possible?t('Identity unresolved. No eligible whole copy.','הזיהוי לא הוכרע. אין עותק שלם מתאים.'):e?.evidence==='playback-started'?t('Seen to play · exact Vimeo link only','נצפתה תחילת ניגון · רק בקישור Vimeo המדויק'):evidence(r)}</p>${possible?`<p>${t('Two uploads may be IETV 133 or 178. Neither counts toward coverage.','שתי העלאות עשויות להיות תכנית 133 או 178. אף אחת אינה נספרת בכיסוי.')}</p>`:parts.length?`<a class="btn primary" href="#parts">${t('Choose a part below ↓','בחירת חלק בהמשך ↓')}</a>`:action(r)}<div class="row" style="margin-top:16px;justify-content:flex-start"><button onclick="star('${r.id}')">${stars.has(r.id)?'★':'☆'} ${t('Star','כוכב')}</button><button onclick="watched.has(current)?watched.delete(current):watched.add(current);render()" aria-pressed="${watched.has(current)}">${watched.has(current)?'☑':'□'} ${t('Watched','צפיתי')}</button></div><p class="small muted" style="margin-top:8px">${t('Your Watched mark is personal. It does not change the evidence.','הסימון ״צפיתי״ אישי ואינו משנה את הראיות.')}</p></div></div>${parts.length?`<section class="panel" id="parts"><h2>${t('One part at a time','חלק אחד בכל פעם')}</h2><p class="small muted">${t('Available parts, in order. These do not establish a complete broadcast.','החלקים הזמינים, לפי הסדר. אין בכך אישור לשידור שלם.')}</p>${parts.map(u=>{let p=rec(u.recordId);return `<div class="part"><input type="checkbox" id="part-${u.part}" ${opened.has(p.id)?'checked':''} onchange="this.checked?opened.add('${p.id}'):opened.delete('${p.id}')" aria-label="${t('Opened part ','פתחתי חלק ')+u.part}"><div><strong>${t('Part ','חלק ')+u.part} · <bdi>${dur(p.durationSeconds)}</bdi></strong><p class="muted">YouTube · ${evidence(p)}</p><label for="part-${u.part}">${t('Opened this part · this visit only','פתחתי את החלק · בביקור הזה בלבד')}</label></div>${action(p)}</div>`}).join('')}</section>`:''}<details class="dossier"><summary>${t('Identity, titles & sources','זיהוי, כותרות ומקורות')}</summary>${e?`<p><strong>${t('Catalogue title','כותרת הקטלוג')}</strong><br><bdi>${esc(e.titleHe||t('No published Hebrew title recorded','לא תועדה כותרת עברית שפורסמה'))}</bdi></p>${e.storyHe?`<p>${esc(e.storyHe)}<br>${esc(e.storySourceEn)}</p>`:''}<p>${t('English title is editorial.','הכותרת באנגלית היא בעריכה שלנו.')}${e.titleHeEditorial?' '+t('Hebrew title is our translation: ','הכותרת בעברית היא תרגום שלנו: ')+esc(e.titleHeEditorial):''}</p><p>${esc(lang==='he'?e.noteHe||e.noteEn:e.noteEn)}</p>${e.sources.filter(s=>s.url).slice(0,2).map(s=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a></p>`).join('')}`:`<p>${esc(r.titleHe||r.titleHeEditorial||r.titleEn)}</p><p>${t('English title and tags are editorial.','הכותרת באנגלית והתגיות הן בעריכה שלנו.')}</p><a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener noreferrer">${t('Source','מקור')}</a>`}</details><details class="dossier"><summary>${t('Other copies & access requirements','עותקים נוספים ותנאי גישה')}</summary>${(e?e.uploads:[]).map(u=>{let x=rec(u.recordId);return x?`<p>${esc(title(x))} · ${esc(u.role)}<br>${evidence(x)}<br>${x.role==='possible'?t('Possible only. Excluded from Watch.','אפשרי בלבד. לא נכלל באפשרויות הצפייה.'):action(x)}${x.url.includes('hop.co.il')?`<br><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${t('Hop source · Israel connection required','מקור בהופ! · דרוש חיבור ישראלי')}</a>`:''}</p>`:''}).join('')}</details></section>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';$('#language').textContent=lang==='he'?'English':'עברית';$('#brand-sub').textContent=t('A little street. A lot to watch.','רחוב קטן. הרבה מה לראות.');$('#note-title').textContent=t('06 / Pocket · phone first','06 / Pocket · קודם הטלפון');$('#note-body').textContent=t('Tonight within reach. Two-column cards you can read. Filters in a full-height sheet. A working design sample; personal choices last for this visit.','הערב במרחק נגיעה. כרטיסים קריאים בשתי עמודות. מסננים בגיליון בגובה מלא. דוגמת עיצוב פעילה; הבחירות האישיות נשמרות לביקור הזה.');$('#search').placeholder=t('Find an episode or video…','חיפוש פרק או סרטון…');$('#search').setAttribute('aria-label',t('Search sample videos','חיפוש בסרטונים לדוגמה'));$('#sample').textContent=t('Design sample · real catalogue data · titles and tags may be editorial · no video is stored here.','דוגמת עיצוב · נתוני קטלוג אמיתיים · כותרות ותגיות עשויות להיות בעריכה שלנו · אין כאן אחסון וידאו.');$('#nav').innerHTML=[['watch','⌂','Watch','צפייה'],['guide','▤','Guide','מדריך'],['browse','⌕','Browse','עיון'],['starred','☆','Starred','כוכבים']].map(([k,i,a,b])=>`<button class="${screen===k?'active':''}" ${screen===k?'aria-current="page"':''} onclick="nav('${k}')"><span class="navicon" aria-hidden="true">${i}</span>${t(a,b)}</button>`).join('');$('#main').innerHTML=screen==='watch'?home():screen==='browse'?browse():screen==='guide'?guide():screen==='episode'?episode():`<div class="intro"><h1>${t('Your stars','הכוכבים שלכם')}</h1></div><div class="grid">${records.filter(r=>stars.has(r.id)).map(card).join('')}</div>`}
let returnFocus;function openSheet(content){returnFocus=document.activeElement;$('#modal').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${t('Preferences and filters','העדפות ומסננים')}">${content}</section></div>`;document.body.style.overflow='hidden';$('#modal button')?.focus()}function closeSheet(){ $('#modal').innerHTML='';document.body.style.overflow='';returnFocus?.focus()}

function scheme(){let dark=appearance==='dark'||appearance==='system'&&matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.scheme=dark?'dark':'light';document.documentElement.dataset.appearance=appearance}

$('#language').onclick=()=>{lang=lang==='en'?'he':'en';render()};$('#settings').onclick=settings;$('#search').oninput=e=>{query=e.target.value;screen='browse';render()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Tab'&&$('#modal .sheet')){let els=[...$('#modal').querySelectorAll('button,a,input,select')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});matchMedia('(prefers-color-scheme:dark)').addEventListener('change',scheme);scheme();render();
