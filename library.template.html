   - Scheme: color-scheme, the font and the colours every palette shares, so their meaning reads the same in each one:
     coverage (whole, parts, excerpt, missing, unknown), access kinds, series inks, the star and the thumbnail overlays.

     masthead controls. Terracotta is the default, on :root and :root[data-scheme=dark]. Another palette NAME is

/* ---------- base ---------- */
*{box-sizing:border-box}
/* The gutter is kept on short pages too, so classic scrollbars never move the masthead between routes. */
html{background:var(--bg);scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
img{max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
html[dir=ltr] [dir=auto]{text-align:left}
html[dir=rtl] [dir=auto]{text-align:right}
.skip{position:fixed;top:-80px;inset-inline-start:12px;z-index:20;background:var(--surface);color:var(--ink);
 padding:10px 14px;border-radius:8px;font-weight:700}
.skip:focus{top:10px}
.wrap{max-width:1380px;margin-inline:auto;padding-inline:clamp(14px,3vw,40px)}
main{display:block;outline:none}

/* ---------- masthead ---------- */
/* Positioned for the awning below its band. */
.masthead{position:relative;background:var(--brand);color:var(--mast-ink);border-bottom:4px solid var(--accent)}
/* Physical layout in both languages: the views nav fills the left column and the control group is pinned to the right
   edge, so the language toggle keeps its place and size when the page direction flips. The nav takes the page direction
   back. The group (#mast-tools) holds the theme button and the language toggle; it spans the band's height, so the theme
   popover can drop from its bottom edge. */
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:18px;min-height:64px;direction:ltr}
.tabs{min-width:0}
html[dir=rtl] .tabs{direction:rtl}
.tabs>ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.tab{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--mast-ink-soft);
 text-decoration:none;font-weight:650;font-size:14px;padding:8px 12px;border-radius:8px;min-height:40px;white-space:nowrap}
.tab:hover{background:var(--mast-hover)}
.tab[aria-current]{background:var(--mast-current);color:var(--mast-current-ink)}
.tab .short,.tab-ico{display:none}
.tab-count{font-size:11px;font-weight:700;background:var(--mast-chip);border-radius:99px;padding:1px 7px;
 font-variant-numeric:tabular-nums}
.tab[aria-current] .tab-count{background:var(--mast-current-ink);color:var(--mast-current)}
.tab-count .cnt-short{display:none}
.mast-tools{position:relative;align-self:stretch;display:flex;align-items:center;gap:8px}
/* Language toggle: a radiogroup of two options. dir=ltr keeps EN on the left and עב on the right in both languages; the
   thumb sits under the checked option and follows aria-checked, so the state shown is the state announced. A click
   anywhere on it switches the language. */
.lang{--lang-pad:3px;position:relative;display:grid;grid-template-columns:1fr 1fr;padding:var(--lang-pad);
 border:1px solid var(--mast-ctl-line);border-radius:99px;background:var(--mast-ctl);cursor:pointer}
.lang:hover{background:var(--mast-ctl-hover)}
.lang-opt{position:relative;z-index:1;min-width:0;min-height:32px;padding:0 12px;border:0;border-radius:99px;
 background:transparent;color:var(--mast-ink-soft);font-size:13.5px;font-weight:700;line-height:1;white-space:nowrap}
.lang-opt[aria-checked=true]{color:var(--mast-current-ink)}
.lang-short{display:none}
.lang-thumb{position:absolute;top:var(--lang-pad);bottom:var(--lang-pad);left:var(--lang-pad);
 width:calc(50% - var(--lang-pad));border-radius:99px;background:var(--mast-current);pointer-events:none}
.lang-opt[lang=he][aria-checked=true]~.lang-thumb{transform:translateX(100%)}
/* Theme picker: a round button before the language toggle (40 px, 36 px at 480 px and below; no text, so it has the same
   size and place in both languages) discloses a popover with two radio groups, Theme (named swatches) and Appearance
   (System, Light, Dark). The popover drops from the control group's right edge to just below the masthead band, on the
   page surface, and its content takes the page direction. Each swatch (.tp-sw-NAME) takes its palette's tokens from that
   palette's blocks, in the current scheme: the masthead colour, the stripe, the page and a button dot. Palettes sit in two
   columns, one at 480 px and below. */
.theme{flex:none}
.theme-btn{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--mast-ctl-line);border-radius:50%;
 background:var(--mast-ctl);color:var(--mast-ink-soft)}
.theme-btn:hover{background:var(--mast-ctl-hover)}
.theme-btn[aria-expanded=true]{background:var(--mast-current);border-color:var(--mast-current);color:var(--mast-current-ink)}
.theme-btn svg{display:block}
/* Surprise and the queue: pills before the theme button. */
.mbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 8px;border:1px solid var(--mast-ctl-line);
 border-radius:99px;background:var(--mast-ctl);color:var(--mast-ink);font-size:13.5px;font-weight:750;white-space:nowrap}
.mbtn:hover{background:var(--mast-ctl-hover)}
.mbtn[aria-expanded=true]{background:var(--mast-current);border-color:var(--mast-current);color:var(--mast-current-ink)}
.queue-btn{padding-inline:14px 6px}
.qcount{min-width:24px;padding:0 6px;border-radius:99px;background:var(--mast-chip);text-align:center;font-variant-numeric:tabular-nums}
.mbtn .die{width:24px;height:24px;font-size:14px}
.tab-pick{display:none}
.tab-surprise{border:0;background:transparent;font:inherit}
/* The awning: a scalloped fringe under the masthead's stripe (decoration only). */
.masthead::after{content:"";position:absolute;inset-inline:0;top:100%;height:9px;pointer-events:none;z-index:1;
 background:radial-gradient(circle at 50% 0,var(--accent) 7px,transparent 7.5px) 0 0/18px 9px repeat-x}
.tp{position:absolute;z-index:26;top:calc(100% + 12px);right:0;width:min(360px,calc(100vw - 20px));padding:12px 12px 10px;
 background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);
 font-size:14px;line-height:1.3;text-align:start}
html[dir=rtl] .tp{direction:rtl}
.tp-h{margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
[dir=rtl] .tp-h{letter-spacing:0}
.tp-pals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:14px}
.tp-pal{display:flex;align-items:center;gap:9px;min-width:0;min-height:44px;padding:5px 8px;border:1px solid var(--line);
 border-radius:10px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:650;text-align:start}
.tp-pal:hover{background:var(--surface-2)}
.tp-pal[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tp-name{min-width:0}
.tp-check{display:block;flex:none;margin-inline-start:auto;line-height:0;visibility:hidden}
.tp-pal[aria-checked=true] .tp-check{visibility:visible}
.tp-sw{position:relative;flex:none;width:34px;height:24px;border:1px solid var(--line-strong);border-radius:6px;
 background:linear-gradient(var(--brand) 0 52%,var(--accent) 52% 66%,var(--bg) 66%)}
.tp-sw::after{content:"";position:absolute;right:4px;bottom:2px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.tp-apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:10px}
.tp-app{min-width:0;min-height:40px;padding:4px 6px;border:0;background:var(--surface);color:var(--ink);font-size:13px;
 font-weight:650;line-height:1.2}
.tp-app+.tp-app{border-inline-start:1px solid var(--line-strong)}
.tp-app:first-child{border-start-start-radius:9px;border-end-start-radius:9px}
.tp-app:last-child{border-start-end-radius:9px;border-end-end-radius:9px}
.tp-app:hover{background:var(--surface-2)}
.tp-app[aria-checked=true]{background:var(--ink);color:var(--bg)}
.tp-app:focus-visible{position:relative;z-index:1}
.tp-note{margin:10px 0 0;font-size:12px;color:var(--muted)}
/* The popover is on the page surface, so it uses the page focus ring. */
.masthead .tp :focus-visible{outline-color:var(--focus)}
.masthead :focus-visible{outline-color:var(--mast-focus)}

/* ---------- page heads ---------- */
.page-head{padding-block:24px 14px}
.page-title{font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;line-height:1.15;margin:0 0 6px;outline:none}
[dir=rtl] .page-title{letter-spacing:0}
.lede{color:var(--muted);max-width:780px;margin:0;font-size:15px}
.kicker{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
[dir=rtl] .kicker,[dir=rtl] .rail-fam,[dir=rtl] .u-kicker,[dir=rtl] .fmt,[dir=rtl] .fh{letter-spacing:0}

/* ---------- glyphs, evidence badges, chips, tags ---------- */
.glyph{--c:var(--unknown);--f:0%;display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--c);
 background:conic-gradient(var(--c) var(--f),transparent 0);flex:none;vertical-align:-1px}
.g-whole{--c:var(--whole);--f:100%}
.g-parts{--c:var(--parts);--f:50%}
.g-excerpt{--c:var(--excerpt);--f:25%}
.g-missing{--c:var(--missing);--f:0%}
.g-slot{--c:var(--unknown);border-style:dotted}
.g-gap{--c:var(--unknown);border-style:dashed;border-radius:3px}
/* Evidence is said in words (request 06: the four rising bars read as signal strength). A badge marks the levels above the
   baseline on tiles and compact rows; it is text, with no check mark, so it never looks like the user's own Watched mark. */
.ev-badge{display:inline-block;min-width:0;font-size:10.5px;font-weight:700;line-height:1.3;border-radius:5px;padding:1px 6px;
 background:var(--chip);color:var(--chip-ink);white-space:normal;overflow-wrap:normal}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);
 border-radius:99px;padding:4px 12px;font-size:13px;font-weight:650;min-height:36px;line-height:1.2}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .count{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed=true] .count{color:inherit;opacity:.85}
.chip[aria-pressed=true] .glyph{box-shadow:0 0 0 1.5px var(--bg)}
.chip.zero:not([aria-pressed=true]){color:var(--muted);border-style:dashed}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;border-radius:6px;padding:2px 8px;
 background:var(--chip);color:var(--chip-ink);line-height:1.5}
.tag.t-whole{background:var(--whole-bg)}.tag.t-parts{background:var(--parts-bg)}
.tag.t-excerpt{background:var(--excerpt-bg)}.tag.t-missing{background:var(--missing-bg)}
.tag.t-queue{background:var(--parts-bg);outline:1px dashed var(--parts);outline-offset:-1px}
.tag.t-seen{background:transparent;border:1px solid var(--line-strong)}
.tag.t-possible{background:transparent;border:1px dashed var(--unknown)}
.fmt{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px;
 background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.fmt-short-series{background:var(--parts-bg)}
.prod-kicker .fmt{white-space:normal;overflow-wrap:anywhere}
.fmt-home-video,.fmt-queue{background:var(--unknown-bg);outline:1px dashed var(--unknown);outline-offset:-1px}
.fmt-talk-show{background:var(--excerpt-bg)}
.fmt-related-series{background:var(--surface-2);outline:1px solid var(--line-strong);outline-offset:-1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--primary);color:var(--primary-ink);
 border:1px solid var(--primary);border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:750;text-decoration:none;
 min-height:40px;white-space:nowrap}
.btn:hover{background:var(--primary-hover)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--ink);background:var(--surface-2)}
.btn.big{min-height:46px;font-size:15px;padding:9px 18px}
/* Long Watch labels ("Watch on hoopla with a library card", "Watch on YouTube · Part 2 of 3", "Watch on YouTube · Unavailable")
   wrap on phones. */
.btn.big,.urow-actions>.btn,.trow-act>.btn{min-width:0;max-width:100%;white-space:normal;text-align:center;line-height:1.25}
.btn[aria-pressed=true]{background:var(--surface-2);color:var(--ink);border-color:var(--ink)}
.btn svg{flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.linkbtn{border:0;background:none;color:var(--link);text-decoration:underline;text-underline-offset:3px;padding:6px 2px;
 font-size:13px;font-weight:600;min-height:32px}
.star{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--muted);
 display:inline-grid;place-items:center;padding:0}
.star:hover{background:var(--surface-2);border-color:var(--line)}
.star[aria-pressed=true]{color:var(--star-ink)}
.star[aria-pressed=true] svg{fill:var(--star)}
.note{font-size:13px;color:var(--muted)}
.callout{border:1px solid var(--line);border-inline-start:4px solid var(--parts);background:var(--surface);border-radius:10px;
 padding:10px 14px;font-size:13.5px;margin:0 0 14px}
.callout.info{border-inline-start-color:var(--acc-ok)}

/* access shapes: never coverage colours */
.acc{display:inline-block;width:9px;height:9px;flex:none}
.acc-ok{border-radius:50%;background:var(--acc-ok)}
.acc-public{background:var(--acc-public);transform:rotate(45deg) scale(.85)}
.acc-vpn{border:2px solid var(--acc-vpn);border-radius:2px}
.acc-web{border:1.5px solid var(--acc-public);transform:rotate(45deg) scale(.8)}
/* licensed listing: a ring with a centre dot (hoopla with a library card; Apple TV or Prime Video to buy or rent) */
.acc-lic{border:2px solid var(--acc-lic);border-radius:50%;background:radial-gradient(var(--acc-lic) 1.3px,transparent 1.6px)}
.acc-bad{position:relative}
.acc-bad::before,.acc-bad::after{content:"";position:absolute;inset-inline-start:4px;top:-1px;width:2px;height:11px;
 background:var(--acc-bad);transform:rotate(45deg)}
.acc-bad::after{transform:rotate(-45deg)}
.u-access{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:6px 0 0}

/* ---------- meters ---------- */
.meter{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-3)}
.meter.big{height:18px;border-radius:6px}
.meter.small{height:6px}
.seg{flex:1 1 0;min-width:3px}
.seg-whole{background:var(--whole)}
.seg-parts{background:repeating-linear-gradient(45deg,var(--seg-hatch) 0 2px,transparent 2px 6px),var(--parts)}
.seg-excerpt{background:radial-gradient(var(--seg-dot) 1px,transparent 1.6px) 0 0/5px 5px,var(--excerpt)}
.seg-missing{background:var(--missing-bg);box-shadow:inset 0 0 0 2px var(--missing)}
.seg-slots{background:repeating-linear-gradient(135deg,var(--unknown) 0 1.5px,var(--unknown-bg) 1.5px 5px)}
.seg-gaps{background:repeating-linear-gradient(90deg,var(--line-strong) 0 1px,var(--unknown-bg) 1px 4px)}
.seg-open{flex:0 0 12%;min-width:18px;background:transparent;border:1.5px dashed var(--unknown);border-inline-start:0;
 border-start-end-radius:99px;border-end-end-radius:99px}
.meter.big .seg-open{border-start-end-radius:6px;border-end-end-radius:6px}
.seg-empty{flex:1;background:transparent}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend-row li{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.seg-open{min-width:0;border-radius:3px;border:1.5px dashed var(--unknown);flex:none}

/* ---------- goal panel ---------- */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px;
 box-shadow:var(--shadow)}
.goal-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;align-items:baseline}
.goal h2{font-size:18px;margin:0;letter-spacing:-.01em}
.goal-top p{margin:0}
.goal-more{display:none}
.goal-rows{display:grid;grid-template-columns:1fr 1fr;gap:16px 36px;margin-top:12px}
.goal-row h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:750}
.goal-big{margin:8px 0 2px;font-size:14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.goal-big strong{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.goal-floor{margin:0;font-size:13px}
.goal-floor .inf{color:var(--muted)}
.infer{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border:1px dashed var(--unknown);
 border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
[dir=rtl] .infer{letter-spacing:0}
.goal-stats{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;color:var(--muted);margin:6px 0 0;padding:0;list-style:none}
.goal-stats li{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.goal-foot{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;
 border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.goal-note{font-size:12.5px;color:var(--muted);margin:8px 0 0;max-width:920px}
.sep-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.sep-list li{display:inline-flex;gap:6px;align-items:center}
.sep-list a{color:var(--ink);font-weight:650}
details.covtable{margin-top:10px}
details.covtable>summary{cursor:pointer;font-size:13px;font-weight:700;padding:6px 0;min-height:32px}

/* ---------- home ---------- */
/* Home: the two preferences, then Up next beside the queue and Again, the characters on their step, the shelves, the doors. */
.prefs{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding-block:22px 14px}
.pref{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pref-h{font-size:12.5px;font-weight:750;color:var(--muted)}
.pref .seg-toggle{margin-inline-start:0}
.pref .seg-toggle button{min-height:44px}
.pref .short{display:none}
/* A kitchen timer: a dial with one hand. */
.timer{position:relative;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;flex:none}
.timer::after{content:"";position:absolute;inset-block-start:2px;inset-inline-start:8px;width:2px;height:8px;background:var(--muted);
 border-radius:1px;transform-origin:50% 100%;transform:rotate(40deg)}
.home-top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:18px;align-items:start}
.home-side{display:grid;gap:14px}
.home-side .card{margin:0}
.next{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start;background:var(--surface);
 border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.next.none{display:block}
.next .u-art{border-radius:10px}
.next-body{min-width:0}
.next-body h2{margin:2px 0 6px}
.next-title{font-weight:800;font-size:24px;line-height:1.2;margin:0 0 4px;overflow-wrap:anywhere}
.next-title a{color:var(--ink);text-decoration:none}
.next-title a:hover{text-decoration:underline}
.next-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.again-hero{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line-strong)}
.again-title{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.again-lbl,.open-lbl{font-weight:800}
/* A house-number plaque: an enamel plate with two screws. */
.plaque{position:absolute;inset-block-start:8px;inset-inline-start:8px;display:inline-flex;align-items:center;min-height:26px;
 padding:0 14px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);
 font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-badge)}
.plaque::before,.plaque::after{content:"";position:absolute;inset-block-start:calc(50% - 2px);width:4px;height:4px;border-radius:50%;
 background:var(--line-strong)}
.plaque::before{inset-inline-start:4px}
.plaque::after{inset-inline-end:4px}
/* The Watch ticket: a perforated stub at the end shows the length. */
.ticket{padding-inline-end:0}
.ticket .stub{display:inline-flex;align-items:center;align-self:stretch;margin-inline-start:5px;padding-inline:11px 12px;
 border-inline-start:2px dashed currentColor;font-variant-numeric:tabular-nums;font-weight:800}
/* "+": queue a video; a ✓ while it is queued. A 44 px target, apart from the Watch ticket. */
.qadd{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);
 font-size:20px;font-weight:800;line-height:1}
.qadd:hover{background:var(--surface-2)}
.qadd[aria-pressed=true]{background:var(--surface-3);border-color:var(--ink)}
/* Queue and Again lists. */
.qcard h2 small,.again h2 small{font-weight:650;color:var(--muted)}
.qlist,.alist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.qrow,.arow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center}
.qthumb{position:relative;display:block;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--surface-3)}
.qthumb img{width:100%;height:100%;object-fit:cover;display:block}
.qtext{display:grid;min-width:0;font-size:13.5px;line-height:1.3}
.qtext a{color:var(--ink);font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.qtext a:hover{text-decoration:underline}
.qctl{display:flex;gap:2px}
.qbtn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:17px;font-weight:800}
.qbtn:hover{background:var(--surface-2);color:var(--ink)}
.qact{display:flex;flex-wrap:wrap;gap:8px}
/* Stickers on a picture: how often it was opened, and the episode's Watched mark. */
.sticker{position:absolute;z-index:1;display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border:2px solid var(--line-strong);
 border-radius:99px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:800;box-shadow:var(--shadow-badge)}
.s-n{inset-block-start:8px;inset-inline-start:8px;transform:rotate(-5deg)}
.s-seen{inset-block-start:8px;inset-inline-end:8px;transform:rotate(6deg)}
/* The characters sit on a stone step. */
.stoop{margin-top:30px}
.tokens{position:relative;display:flex;gap:4px;list-style:none;margin:0;padding:12px 6px 0;overflow-x:auto;scroll-snap-type:x proximity}
.tokens li{scroll-snap-align:start}
.tok{display:grid;justify-items:center;gap:2px;width:96px;padding:6px 2px 10px;border-radius:12px;color:var(--ink);text-decoration:none;
 text-align:center;font-size:12.5px;line-height:1.2}
.tok:hover{background:var(--surface-2)}
.face{position:relative;display:block;width:72px;height:72px;margin-bottom:4px;border-radius:50%;overflow:hidden;background:var(--surface-3);
 border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-strong)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
/* Kippi's quills: a ring of spikes; Oofnik looks out of his bin. */
.face.quills{overflow:visible;isolation:isolate;z-index:0}
.face.quills::before{content:"";position:absolute;inset:-10px;border-radius:50%;z-index:-1;
 background:repeating-conic-gradient(var(--muted) 0 7deg,transparent 7deg 15deg)}
.face.quills img{border-radius:50%}
.face.bin-face{border-radius:12px 12px 18px 18px;overflow:visible}
.face.bin-face img{border-radius:9px 9px 15px 15px}
.face.bin-face::before{content:"";position:absolute;inset-block-start:-9px;inset-inline:2px;height:7px;border-radius:5px 5px 2px 2px;
 background:var(--line-strong);transform:rotate(-10deg);transform-origin:0 100%}
.tok-name{font-weight:750}
.tok-alt{color:var(--muted);font-size:11.5px}
.tok-n{margin-top:2px;padding:0 7px;border-radius:99px;background:var(--chip);color:var(--chip-ink);font-size:11px;font-weight:750;
 font-variant-numeric:tabular-nums}
.stoop-step{height:14px;margin-top:-6px;border-radius:4px;background:var(--surface-3);border-top:2px solid var(--line-strong)}
/* Shelves: a row of cards on a ledge, scrolled sideways. */
.shelf{margin-top:30px}
.shelf-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shelf-head h2{margin:0;font-size:21px}
.shelf-head .see-all{margin-inline-start:auto;font-weight:700;font-size:13.5px;color:var(--link)}
.shuf{width:44px;padding:0}
.shelf-row{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3 * 14px) / 4);gap:14px;list-style:none;margin:0;
 padding:2px 2px 6px;overflow-x:auto;scroll-snap-type:x mandatory}
.shelf-row>li{scroll-snap-align:start;min-width:0}
.ledge{height:12px;margin-top:-4px;border-radius:3px;background:var(--surface-3);border-top:2px solid var(--line-strong)}
.hcard{position:relative;display:flex;flex-direction:column;height:100%;background:var(--surface);border:1px solid var(--line);
 border-radius:12px;overflow:hidden}
.hcard:hover{box-shadow:var(--shadow);border-color:var(--line-strong)}
.h-body{display:grid;gap:5px;padding:10px 12px 0;flex:1;align-content:start}
.h-title{margin:0;font-size:15px;line-height:1.25}
.h-title a{color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.h-title a:hover{text-decoration:underline}
.h-meta{margin:0;font-size:12.5px;color:var(--muted)}
.h-body .u-access{margin:0}
.h-act{display:flex;align-items:center;gap:8px;padding:10px 12px 12px;flex-wrap:wrap}
.h-act .ticket{flex:1 1 auto}
/* Productions as doors. */
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.door{display:grid;align-content:end;gap:2px;min-height:118px;padding:16px 14px 12px;border:1.5px solid var(--line-strong);
 border-radius:60px 60px 10px 10px;background:var(--surface-2);color:var(--ink);text-decoration:none}
.door:hover{background:var(--surface-3)}
.door-name{font-weight:800;line-height:1.2}
.door-years{font-size:12.5px;color:var(--muted)}
/* The die: a Hebrew letter on a small cube face. */
.die{display:inline-grid;place-items:center;width:26px;height:26px;flex:none;border:1.5px solid var(--line-strong);border-radius:7px;
 background:var(--surface);color:var(--ink);font-size:15px;font-weight:800;line-height:1}
/* Popovers: Surprise and the queue. Below the masthead on wide screens; a sheet above the bottom bar on phones. */
.pop{position:fixed;z-index:40;inset-block-start:76px;inset-inline-end:16px;width:min(420px,calc(100vw - 32px));
 max-height:calc(100vh - 96px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);
 border-radius:16px;box-shadow:var(--shadow-toast);padding:14px}
.pop-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pop-head h2{margin:0;font-size:17px;flex:1;outline:none}
.pop-x{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:24px;line-height:1}
.pop-x:hover{background:var(--surface-2);color:var(--ink)}
.pop .qcard{border:0;padding:0;margin:0}
.pop .qcard>h2{display:none}
.pick{list-style:none;margin:0;padding:0}
.pop-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
/* The queue bar: phones only (below). */
.qbar{display:none}
.quiet-links{margin:0;font-size:13.5px}
.quiet-links a{color:var(--link)}

/* ---------- guide layout ---------- */
.guide-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:48px}
.rail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:4px 4px 12px;scrollbar-width:thin}
.rail-toggle{display:none}
.rail-fam{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
.rail ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail-item{display:grid;gap:4px;padding:8px 10px;border-radius:9px;color:inherit;text-decoration:none;border:1px solid transparent}
.rail-item:hover{background:var(--surface-2)}
.rail-item[aria-current=true]{background:var(--surface);border-color:var(--line-strong);box-shadow:var(--shadow)}
/* The rail scrolls (overflow:auto clips at its padding edge), so the ring sits closer to the item. */
.rail-item:focus-visible{outline-offset:-1px}
.ri-name{font-size:13.5px;font-weight:650;line-height:1.3}
.ri-sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.ri-stat{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-all .ri-name{font-weight:800}
.toolbar{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.toolbar.more-open{position:static}
@media (min-width:981px){html{scroll-padding-top:calc(var(--tb-h,0px) + 8px)}}
.tb-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tb-row+.tb-row{margin-top:8px}
.search{position:relative;flex:1 1 240px;max-width:420px}
.search svg{position:absolute;inset-inline-start:12px;top:12px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:42px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);
 padding:0 10px 0 38px;font-size:14px}
/* The inputs have dir=auto (a pasted link keeps its order in Hebrew); the icon and its padding follow the page. */
html[dir=rtl] .search input{padding:0 38px 0 10px}
html[dir=rtl] .search input:placeholder-shown{direction:rtl}
html[dir=ltr] .search input:placeholder-shown{direction:ltr}
.search input::placeholder{color:var(--muted);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fh{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.seg-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;margin-inline-start:auto;flex:none}
.seg-toggle button{border:0;background:var(--surface);padding:0 12px;min-height:40px;font-size:13px;font-weight:650;
 display:inline-flex;align-items:center;gap:6px}
.seg-toggle button+button{border-inline-start:1px solid var(--line-strong)}
.seg-toggle button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg-toggle button:first-child{border-start-start-radius:9px;border-end-start-radius:9px}
.seg-toggle button:last-child{border-start-end-radius:9px;border-end-end-radius:9px}
.seg-toggle button:focus-visible{position:relative;z-index:1}
.more-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;min-height:36px;padding:4px 12px;
 font-size:13px;font-weight:650}
.more-btn[aria-expanded=true]{border-color:var(--ink)}
.more-panel{display:grid;gap:10px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.fline{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.fline .fh{min-width:96px}
.status-line{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.active-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.xchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-2);
 border-radius:99px;padding:2px 6px 2px 10px;font-size:12px;font-weight:650;min-height:30px}
.xchip span[aria-hidden]{font-size:15px;line-height:1;color:var(--muted)}
.banner{margin-top:10px;border:1px solid var(--line);border-inline-start:4px solid var(--acc-ok);border-radius:10px;
 background:var(--surface);padding:9px 12px;font-size:13.5px}
details.legend{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.legend>summary{cursor:pointer;padding:9px 14px;font-size:13px;font-weight:700}
.legend-body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 22px;padding:4px 14px 14px;font-size:12.5px;
 color:var(--muted)}
.legend-body h2{font-size:12px;color:var(--ink);margin:0 0 6px}
.legend-body dl{margin:0;display:grid;gap:6px}
.legend-body dt{display:flex;gap:7px;align-items:center;color:var(--ink);font-weight:650}
.legend-body dd{margin:0}

/* ---------- production section ---------- */
.prod{padding:22px 0 26px;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod-kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.prod h2{font-size:21px;letter-spacing:-.02em;margin:6px 0 8px;line-height:1.25}
[dir=rtl] .prod h2{letter-spacing:0}
.prod h2 a{color:inherit;text-decoration:none}
.prod h2 a:hover{text-decoration:underline;text-underline-offset:4px}
.have{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 6px}
.have strong{font-size:20px;font-variant-numeric:tabular-nums}
.prod-meter{max-width:640px}
.prod-stats{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;color:var(--muted);margin:8px 0 0;padding:0;list-style:none}
.prod-stats li{display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.totals{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;font-size:13px}
.total-badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--chip)}
.total-badge.contested,.total-badge.unknown{background:transparent;border:1.5px dashed var(--unknown)}
.totals-panel{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
 font-size:13px;max-width:880px}
.totals-panel p{margin:0 0 8px}
.ev-list{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.ev-list li{display:grid;grid-template-columns:minmax(64px,max-content) 1fr;gap:10px;align-items:baseline}
.ev-val{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.conf{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:1px 6px;
 background:var(--chip);color:var(--chip-ink);margin-inline-end:6px;white-space:nowrap}
[dir=rtl] .conf{letter-spacing:0}
.conf-conflicting{background:var(--missing-bg)}
.conf-primary{background:var(--whole-bg)}
.conf-annual-accounting-only,.conf-current-listing-only{background:var(--parts-bg)}
.inference{font-size:13px;margin:6px 0 0;max-width:880px;color:var(--muted)}
.inference strong{color:var(--ink)}
.evsum{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.evsum span{display:inline-flex;gap:6px;align-items:center}
.season{margin-top:18px}
.season-h{font-size:14px;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.prod .season-h{font-size:15px;letter-spacing:0;margin:0 0 6px}
.season-h small{font-weight:500;color:var(--muted);font-size:12.5px}
.numtag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;border:1px solid var(--line-strong);color:var(--muted)}
.numtag.n-uploader,.numtag.n-provisional,.numtag.n-inferred{border-style:dashed}

/* numbering strip */
.strip{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 4px;padding:0;list-style:none;max-width:980px}
.cell{width:24px;height:24px;border-radius:5px;font-size:10.5px;font-weight:750;display:grid;place-items:center;
 text-decoration:none;color:var(--ink);border:1.5px solid transparent;font-variant-numeric:tabular-nums;line-height:1}
.cell:focus-visible{outline-offset:1px}
.cell.cov-whole{background:var(--whole);color:var(--whole-ink)}
.cell.cov-parts{background:linear-gradient(0deg,var(--parts) 0 5px,var(--parts-bg) 5px);border-color:var(--parts)}
.cell.cov-excerpt{background:var(--excerpt-bg);border:2px dotted var(--excerpt)}
.cell.cov-missing{background:transparent;border:2px solid var(--missing);color:var(--missing)}
.cell.gap{border:1.5px dashed var(--line-strong);color:var(--muted)}
.strip.inferred .cell.gap{border-style:dotted;border-color:var(--line-strong);color:var(--muted)}
.cell.exp{border:1.5px dotted var(--unknown);color:var(--muted);background:var(--unknown-bg)}
.strip .cell.dim{opacity:.28}
.cell:hover{box-shadow:0 0 0 2px var(--line-strong)}
.strip-note{font-size:12px;color:var(--muted);margin:0 0 8px}
.unnum-h{font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 0}
.unnum{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.unnum a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:99px;
 padding:3px 10px;color:var(--ink);text-decoration:none;background:var(--surface);min-height:30px}

/* tiles */
.tiles{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px}
.tile{--c:var(--unknown);position:relative;display:flex;flex-direction:column;height:100%;border:1px solid var(--line);
 border-top:3px solid var(--c);border-radius:10px;background:var(--surface);overflow:hidden}
.tile:hover{border-color:var(--line-strong);border-top-color:var(--c);box-shadow:var(--shadow)}
.tile.cov-whole{--c:var(--whole)}.tile.cov-parts{--c:var(--parts)}.tile.cov-excerpt{--c:var(--excerpt)}.tile.cov-missing{--c:var(--missing)}
.art{position:relative;display:block;aspect-ratio:16/9;background:var(--surface-3);overflow:hidden}
.art img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.cov-parts .art::after,.cov-excerpt .art::after{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:50%;
 background:var(--art-veil);-webkit-backdrop-filter:grayscale(1) blur(2px);backdrop-filter:grayscale(1) blur(2px);
 border-inline-start:2px dashed var(--c)}
.cov-excerpt .art::after{width:75%}
.tile.cov-missing{border-style:dashed;border-top-style:solid;background:transparent}
.cov-missing .art{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--missing-bg) 7px 14px)}
.num{position:absolute;inset-block-start:6px;inset-inline-start:6px;background:var(--surface);color:var(--ink);font-weight:800;
 font-size:12px;border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-badge);z-index:1}
.bignum{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--missing);opacity:.75;
 font-variant-numeric:tabular-nums}
.bignum.muted{color:var(--muted);opacity:.4}
.seen{position:absolute;inset-block-start:6px;inset-inline-end:6px;background:var(--surface);color:var(--ink);border-radius:99px;
 font-size:11px;font-weight:800;padding:1px 7px;z-index:1;border:1px solid var(--line-strong)}
.tile-body{display:flex;flex-direction:column;gap:5px;padding:8px 10px 6px;flex:1}
.tile-title{font-size:13px;font-weight:650;line-height:1.32;color:var(--ink);text-decoration:none;display:-webkit-box;
 -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-title::after{content:"";position:absolute;inset:0;z-index:0}
.tile-title:focus-visible{outline:0}
.tile-title:focus-visible::after{outline:3px solid var(--focus);outline-offset:-3px;border-radius:9px}
.tile:hover .tile-title{text-decoration:underline}
/* alternate labels (an uploader's S2E20): one muted line under the title */
/* Up to two lines, so a long source prefix ('ארכיון האינטרנט') never hides the season and episode that follow it. */
.tile-alt{font-size:11px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
 overflow:hidden;overflow-wrap:anywhere}
.tile-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:auto}
.tile-meta .ev-badge{margin-inline-start:auto;flex:0 1 auto}
/* A badge that does not fit beside the coverage word goes to its own line, so neither is broken. */
.tile-meta.has-ev{flex-wrap:wrap;row-gap:3px}
/* On a phone the List hides its Evidence column, so a row shows the badge of a stronger level under its title. */
.eptable .c-title .ev-inline{display:none}
.tile-act{position:relative;z-index:2;padding:0 8px 8px}
.tbtn{display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;justify-content:safe center;
 gap:1px 5px;width:100%;min-height:34px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface-2);
 color:var(--ink);font-size:12px;font-weight:700;text-decoration:none;padding:3px 6px;line-height:1.2;text-align:center;
 overflow-wrap:break-word}
/* The label wraps between words beside the icon; a word too long for that space moves the label under the icon. */
.tbtn svg{flex:none}
.tbtn .wl{flex:1 1 min-content;min-width:0;max-width:max-content}
.tbtn:hover{border-color:var(--ink)}
.tbtn.vpn{border-style:dashed}
.tbtn.lic{border-style:dotted}
/* A Watch link that failed an availability check: no fill and muted text, beside the legend's failed-check mark. */
.tbtn.bad,.btn.bad{background:transparent;color:var(--muted);border-color:var(--line-strong)}
.tbtn.bad:hover,.btn.bad:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink)}
.slots{grid-column:1/-1;border:1.5px dashed var(--unknown);border-radius:10px;padding:10px 12px;background:var(--unknown-bg);
 margin-top:10px}
.slot-cap{font-size:13px;font-weight:700;margin:0;display:flex;gap:7px;align-items:center}
.slot-help{font-size:12px;color:var(--muted);margin:2px 0 8px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:12px;height:12px;border:1.5px dotted var(--unknown);border-radius:3px}
.show-more{margin-top:12px}

/* list layout */
.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:12px}
.eptable{width:100%;border-collapse:collapse;font-size:13.5px}
.eptable th,.eptable td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
.eptable thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);
 font-weight:800;white-space:nowrap}
[dir=rtl] .eptable thead th{letter-spacing:0}
.eptable tbody th[colspan]{background:var(--surface-2);font-size:13px}
.eptable tr:last-child td{border-bottom:0}
.eptable .c-no{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;width:1%}
.eptable .c-title a{font-weight:650;color:var(--ink);text-decoration:none}
.eptable .c-title a:hover{text-decoration:underline}
.eptable .alt{display:block;font-size:12px;color:var(--muted)}
.eptable .c-cov{white-space:nowrap}
.cell-flex{display:inline-flex;gap:7px;align-items:center}
.eptable .c-act{text-align:end;white-space:nowrap}
/* List rows carry the long Watch label and the tile's short one; phones show the short one (the link name stays long). */
.wl-short{display:none}
.eptable .btn{min-height:34px;padding:4px 10px;font-size:12.5px}
.covt td,.covt th{white-space:nowrap}
.covt .c-name{white-space:normal;min-width:180px}
.covt td.n{font-variant-numeric:tabular-nums;text-align:end}

/* queue */
.queue{margin-top:20px;border:1px solid var(--line);border-inline-start:4px solid var(--parts);border-radius:10px;padding:12px 14px;
 background:var(--surface)}
.queue h3{font-size:14px;margin:0;display:flex;gap:8px;align-items:center}
.queue>p{margin:2px 0 10px;font-size:12.5px;color:var(--muted)}
.qlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.qitem{display:flex;gap:10px;align-items:center;position:relative;min-width:0}
.qthumb{position:relative;width:112px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--surface-3);flex:none}
.qthumb img{width:100%;height:100%;object-fit:cover;display:block}
.qtext{min-width:0;font-size:12.5px;color:var(--muted)}
.qtext a{display:block;font-weight:650;font-size:13.5px;color:var(--ink);text-decoration:none;line-height:1.3;overflow-wrap:anywhere}
.qtext a::after{content:"";position:absolute;inset:0}
.qtext a:hover{text-decoration:underline}
.qtext a:focus-visible{outline:0}
.qtext a:focus-visible::after{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.u-dur{position:absolute;inset-block-end:5px;inset-inline-end:5px;background:var(--scrim);color:var(--scrim-ink);font-size:11px;font-weight:700;
 border-radius:4px;padding:0 5px;font-variant-numeric:tabular-nums}

/* ---------- uploads ---------- */
.u-layout{display:grid;grid-template-columns:262px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:48px}
.filters{padding:2px 4px 12px 2px}
.filters .search{max-width:none}
.filters-toggle{display:none}
.facets{display:grid;gap:18px;margin-top:16px}
.fgroup h2,.fgroup label.fh{display:block;margin:0 0 8px}
.fpills{display:flex;flex-wrap:wrap;gap:6px}
.fpills .chip{border-radius:8px;min-height:34px;font-size:12.5px;padding:4px 10px}
.fhelp{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.fgroup select{width:100%;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:8px 10px;
 min-height:40px;font-size:13px}
.results-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:4px 0 10px}
.results-count{font-size:13.5px;color:var(--muted);margin:0}
.results-count strong{font-size:18px;color:var(--ink)}
.sortf{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sortf select{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:6px 8px;min-height:38px;
 font-size:13px;font-weight:650;color:var(--ink)}
.ugrid{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.ucard{position:relative;display:flex;flex-direction:column;height:100%;background:var(--surface);border:1px solid var(--line);
 border-radius:12px;overflow:hidden}
.ucard:hover{box-shadow:var(--shadow);border-color:var(--line-strong)}
.u-art{position:relative;display:block;aspect-ratio:16/9;background:var(--surface-3);overflow:hidden}
.u-art img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.u-host{position:absolute;inset-block-start:6px;inset-inline-start:6px;font-size:10.5px;font-weight:800;border-radius:4px;
 padding:1px 6px;background:var(--host-bg);color:var(--host-ink);max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
.u-body{display:flex;flex-direction:column;gap:3px;padding:10px 12px 0;flex:1;min-width:0}
.u-kicker{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--series-ink,var(--muted));
 margin:0;line-height:1.4}
.u-title{font-size:15px;line-height:1.3;margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;
 -webkit-box-orient:vertical;overflow:hidden}
.u-title a{color:inherit;text-decoration:none}
.u-title a::after{content:"";position:absolute;inset:0;z-index:1;border-radius:12px}
.u-title a:hover{text-decoration:underline;text-underline-offset:3px}
.u-title a:focus-visible{outline:0}
.u-title a:focus-visible::after{outline:3px solid var(--focus);outline-offset:-3px}
.u-pub{font-size:12.5px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.u-pub b{font-weight:600}
.u-by{font-size:12px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.u-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
/* A tag wider than the card wraps inside its pill like text, the glyph staying beside the first word, instead of being
   clipped by the card. */
.u-tags .tag{display:inline-block;max-width:100%;overflow-wrap:anywhere}
.u-tags .tag .glyph{margin-inline-end:6px}
.u-actions{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 12px}
.lat-tok{white-space:nowrap}
/* A number range in a Hebrew note stays on one line, so "#1–#12" is not split after its dash (R4-04). */
.num-range{white-space:nowrap}
/* A long Watch label ("Watch on hoopla with a library card") wraps inside the card instead of overflowing it. */
.u-actions>.btn{min-width:0;white-space:normal;text-align:center;line-height:1.25}
.ser-modern{--series-ink:var(--ser-modern)}.ser-classic{--series-ink:var(--ser-classic)}
.ser-shalom-classic{--series-ink:var(--ser-shalom-classic)}.ser-shalom-modern{--series-ink:var(--ser-shalom-modern)}
.ser-elmo{--series-ink:var(--ser-elmo)}
.more-row{display:flex;justify-content:center;padding-top:22px}
.empty{padding:40px 20px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:12px;margin-top:18px}
.empty p{margin:0 0 14px;color:var(--muted)}
/* Oofnik's bin: a ribbed can, a tipped lid and two eyes in the gap. */
.bin{display:block;position:relative;width:64px;height:72px;margin:0 auto 14px}
.bin::before{content:"";position:absolute;inset:auto 6px 0;height:52px;border:2px solid var(--line-strong);border-top:0;
 border-radius:0 0 10px 10px;background:repeating-linear-gradient(90deg,var(--surface-3) 0 9px,var(--line-strong) 9px 11px)}
.bin::after{content:"";position:absolute;top:4px;inset-inline:0;height:9px;border-radius:6px 6px 2px 2px;background:var(--line-strong);
 transform:rotate(-12deg);transform-origin:0 100%}
html[dir=rtl] .bin::after{transform:rotate(12deg);transform-origin:100% 100%}
.bin i{position:absolute;top:14px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.bin i:first-child{inset-inline-start:22px}
.bin i:last-child{inset-inline-start:34px}
.relax{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

/* ---------- detail pages ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;padding-top:18px;margin:0}
.crumbs .sep{color:var(--muted)}
.pager{display:flex;gap:8px;margin-inline-start:auto}
.pager .btn{min-height:36px;padding:4px 10px;font-size:12.5px}
.hero{display:grid;grid-template-columns:minmax(260px,460px) minmax(0,1fr);gap:28px;align-items:start;padding:14px 0 18px}
.hero .u-art{border-radius:12px;box-shadow:var(--shadow)}
.hero .u-art.ph{background:repeating-linear-gradient(135deg,transparent 0 9px,var(--missing-bg) 9px 18px);
 border:1.5px dashed var(--line-strong);box-shadow:none}
.hero .u-art.ph.gapph{background:repeating-linear-gradient(135deg,transparent 0 9px,var(--unknown-bg) 9px 18px)}
.hero .bignum{font-size:56px}
.head-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.alsolab{font-size:13px;color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}
.alsolab strong{color:var(--ink);font-weight:650}
.urows.possible .urow{border-style:dashed}
.primary{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:14.5px;margin:0 0 10px}
.card p{margin:0 0 8px;font-size:13.5px}
.card p:last-child{margin-bottom:0}
/* How to watch on a licensed service (hoopla): the headline, the steps and their links, the check date and the sources,
   all from data/licensed-services.json. The start rule uses the licensed-access colour. */
.howto{border-inline-start:4px solid var(--acc-lic)}
.howto .howto-lead{font-weight:650;color:var(--ink)}
.howto-steps{margin:0 0 10px;padding-inline-start:20px;font-size:13.5px}
.howto-steps li{margin:0 0 5px}
.howto-link{white-space:normal;font-weight:650}
.howto-src>summary{cursor:pointer;font-size:12.5px;font-weight:650;color:var(--muted);padding-block:6px;min-height:32px}
.howto-src ul{margin:4px 0 0;padding-inline-start:20px;font-size:12.5px;color:var(--muted)}
.howto-src li{margin:0 0 6px;overflow-wrap:anywhere}
.src-finding{display:block}
/* The per-service summaries in the access legend and About. */
.lic-svcs{margin:4px 0 6px;padding-inline-start:18px}
.lic-svcs li{margin:0 0 4px}
.sec-h{font-size:16px;margin:22px 0 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.sec-h:first-child{margin-top:0}
.sec-h small{font-size:12.5px;color:var(--muted);font-weight:500}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ladder li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:13px;color:var(--muted)}
.ladder strong{display:block;color:var(--ink);font-size:13.5px}
.step{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:11px;
 font-weight:800;color:var(--muted);background:var(--surface)}
.ladder .done .step{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.nowtag{margin-inline-start:8px;font-size:10.5px;font-weight:800;text-transform:uppercase;background:var(--chip);border-radius:4px;
 padding:1px 6px}
.urows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.urow{position:relative;display:grid;grid-template-columns:168px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);
 border:1px solid var(--line);border-radius:12px;padding:10px}
.urow .u-art{border-radius:8px}
.urow-body{min-width:0;display:grid;gap:3px}
.urow-body h4{font-size:14.5px;margin:0;line-height:1.3;overflow-wrap:anywhere}
.urow-body h4 a{color:inherit;text-decoration:none}
.urow-body h4 a:hover{text-decoration:underline}
.urow-meta{font-size:12px;color:var(--muted);margin:0;display:flex;flex-wrap:wrap;gap:2px 10px}
.urow-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.cmp-wrap{margin-top:18px}
.cmp{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
.cmp .u-access{margin:0}
.cmp th,.cmp td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.cmp thead th{font-size:11px;color:var(--muted);text-transform:uppercase;background:var(--surface-2);white-space:nowrap}
.lenbar{display:block;height:6px;border-radius:3px;background:var(--ink);opacity:.55;margin-top:3px;min-width:2px}
.find-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;font-size:13.5px;margin:0}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;overflow-wrap:anywhere}
dl.facts .story-src{display:block;margin-top:2px;color:var(--muted);font-size:12.5px}
.research{font-size:13px;color:var(--muted)}
.research p{margin:0 0 8px;overflow-wrap:anywhere}
.research strong{color:var(--ink)}
.urlbit{overflow-wrap:anywhere}
.tagbtns{display:flex;flex-wrap:wrap;gap:6px}
.tagbtns .chip{min-height:34px;font-size:12px;padding:3px 10px;color:var(--ink);text-decoration:none}
.map-form{display:grid;gap:8px}
details.map-card>summary{cursor:pointer;font-weight:700;font-size:14.5px}
details.map-card[open]>summary{margin-bottom:8px}
.map-form label{font-size:12.5px;font-weight:700}
.map-form input{width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);
 font-size:13.5px;direction:ltr}
.map-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.error{color:var(--missing);font-size:12.5px;margin:0;min-height:1em}
.sugg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.sugg a{display:inline-flex;gap:6px;align-items:center;font-weight:650}
.why{font-size:12px;color:var(--muted)}

/* ---------- lists: videos to identify, missing episodes, research to-do ---------- */
.todo-top,.page-tools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 16px;max-width:1080px}
.page-tools .note{margin:0}
.todo-sec,.page-sec{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;max-width:1080px}
.page-sec>h2{padding:14px 16px 6px}
/* A card without a heading (Videos to identify) starts with its help line. */
.page-sec>.todo-help:first-child{margin-top:14px}
.sub-h{font-size:14px;margin:14px 16px 2px;display:flex;gap:8px;align-items:center}
.todo-link h2 a{color:var(--ink);text-underline-offset:3px}
.page-tools .results-count,.page-tools .prod-stats{margin:0}
.todo-link{padding-bottom:4px}
.lede+.lede{margin-top:6px}
/* An expected-not-identified row's numbered places, each a link to its slot page. */
.slot-nums{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:6px 0 0;font-size:12px;color:var(--muted)}
.slot-list{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0;padding:0;list-style:none}
.slot-list a{display:inline-flex;align-items:center;min-height:28px;padding:2px 9px;border:1px dashed var(--line-strong);
 border-radius:99px;color:var(--ink);text-decoration:none;background:var(--surface);font-variant-numeric:tabular-nums}
.slot-list a:hover{border-color:var(--ink)}
.todo-sec>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none;min-height:48px;
 border-radius:11px}
.todo-sec>summary:focus-visible{outline-offset:-4px}
.todo-sec>summary::-webkit-details-marker{display:none}
.todo-sec>summary::after{content:"+";content:"+" / "";margin-inline-start:auto;font-size:20px;line-height:1;color:var(--muted)}
.todo-sec[open]>summary::after{content:"\2212";content:"\2212" / ""}
.todo-sec h2,.page-sec h2{font-size:16px;margin:0;display:flex;gap:10px;align-items:center}
.tcount{font-size:12.5px;font-weight:800;border-radius:99px;padding:1px 9px;background:var(--chip);font-variant-numeric:tabular-nums}
.todo-help{margin:0 16px 8px;font-size:13px;color:var(--muted)}
.tlist{list-style:none;margin:0;padding:0 16px 8px}
.trow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;
 border-top:1px solid var(--line)}
.trow .u-art{border-radius:6px}
.trow .u-art.ph{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--missing-bg) 6px 12px);
 border:1px dashed var(--line-strong)}
.trow .u-art.ph.gapph{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--unknown-bg) 6px 12px)}
.trow .bignum{font-size:18px}
.trow-main{min-width:0}
.trow-main>a{font-weight:650;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.trow-main>a:hover{text-decoration:underline}
.trow-sub{display:block;font-size:12px;color:var(--muted)}
.trow-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.trow-act .btn{min-height:36px;padding:4px 10px;font-size:12.5px}
.tgroup{font-size:12px;font-weight:800;color:var(--muted);padding:12px 0 4px;border-top:1px solid var(--line);display:flex;gap:8px;
 align-items:center}

/* ---------- footer ---------- */
.foot{padding-block:10px 30px;border-top:1px solid var(--line)}
.foot-links{margin:10px 0 0;font-size:13.5px}
.foot-links a{font-weight:650;text-underline-offset:3px}
.foot-links a[aria-current]{color:var(--ink);text-decoration-thickness:2px}
details.about>summary{cursor:pointer;font-weight:700;padding:12px 0;font-size:14px}
.about-body{font-size:13px;color:var(--muted);max-width:900px;line-height:1.65}
.about-body p{margin:0 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.file-btn{cursor:pointer}
.file-btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.rights{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;bottom:22px;inset-inline:16px;margin:auto;width:max-content;max-width:calc(100vw - 32px);background:var(--ink);
 color:var(--bg);border-radius:9px;padding:11px 18px;box-shadow:var(--shadow-toast);font-size:13.5px;z-index:30}
.toast:not(.show){width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;box-shadow:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){.legend-body{grid-template-columns:1fr 1fr}}
@media (max-width:980px){
 .guide-grid,.u-layout{grid-template-columns:minmax(0,1fr);gap:14px}
 .rail,.filters{position:static;max-height:none;overflow:visible;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);padding:0}
 .rail-toggle,.filters-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:0;
  background:transparent;
  padding:12px 14px;font-weight:700;font-size:14px;min-height:46px;text-align:start}
 .rail-toggle::after,.filters-toggle::after{content:"+";content:"+" / "";font-size:20px;line-height:1;color:var(--muted)}
 .rail-toggle[aria-expanded=true]::after,.filters-toggle[aria-expanded=true]::after{content:"\2212";content:"\2212" / ""}
 .rail-list{padding:0 8px 10px}
 .rail:not(.open) .rail-list,.filters:not(.open) .facets{display:none}
 .filters{display:flex;flex-direction:column}
 .filters .search{margin:14px 14px 12px;width:auto}
 .filters .facets{padding:0 14px 14px;margin-top:0}
 .detail-grid,.hero,.home-top{grid-template-columns:minmax(0,1fr)}
 .shelf-row{grid-auto-columns:calc((100% - 2 * 14px) / 3)}
 .hero .u-art{max-width:560px}

}

 /* The views nav is a bar fixed to the bottom of the screen, in thumb reach: each tab stacks an icon over a short label, and

 .mast{column-gap:8px;min-height:52px;padding-block:5px}
 .mast-tools{grid-column:2}
 .tabs{position:fixed;z-index:30;inset-inline:0;bottom:0;background:var(--brand);border-top:3px solid var(--accent);
  padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
 .tab-pick{display:block}
 .surprise-btn{display:none}
 .queue-btn .mlong{display:none}
 .queue-btn{padding-inline:8px 6px}
 .queue-btn::before{content:"\2630";content:"\2630" / "";font-size:16px}
 /* Room at the bottom for the bar (and the queue bar above it), so the footer and focused controls stay in view. */
 body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
 html{scroll-padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
 html[data-qbar=on] body{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}
 html[data-qbar=on]{scroll-padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
 .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
 html[data-qbar=on] .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
 .qbar:not([hidden]){position:fixed;z-index:29;inset-inline:6px;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;
  align-items:center;gap:8px;padding:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-toast)}
 .qbar .qthumb{width:64px}
 .qbar-more{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center;flex:1;min-width:0;min-height:44px;
  padding:0;border:0;background:transparent;color:var(--ink);text-align:start;font:inherit}
 .qb-k{font-size:11px;color:var(--muted);font-weight:700}
 .qb-t{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .qbar .ticket .open-lbl{display:none}
 .pop{inset-block-start:auto;inset-inline:8px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:auto;max-height:calc(100vh - 150px)}
 .home-top{grid-template-columns:minmax(0,1fr)}
 .next{grid-template-columns:minmax(0,1fr);gap:12px;padding:10px}
 .next-title{font-size:20px}
 .shelf-row{grid-auto-columns:76%}
 .prefs{padding-block:14px 10px;gap:10px}
 .pref .seg-toggle button{padding:0 10px}
 .pref .long{display:none}.pref .short{display:inline}
 .tab-ico .die{width:20px;height:20px;font-size:12px;border-radius:5px}
 .tabs>ul{gap:2px}
 .tabs>ul>li{flex:1 1 0}
 .tab{display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.15;padding:4px 3px;min-height:46px}
 .tab-ico{display:block;line-height:0}
 .tab-ico svg{width:20px;height:20px}
 .tab .long{display:none}.tab .short{display:inline}
 /* The badge sits on the icon's top corner, so a three-character "99+" stays inside a 320 px phone's tab. Over 99 it
    reads "99+"; the full count stays in the accessible name, visually hidden. */
 .tab-count{position:absolute;inset-block-start:2px;inset-inline-start:calc(50% + 2px);min-width:16px;padding:0 3px;
  font-size:9.5px;line-height:15px;text-align:center}
 .tab-count.capped{padding:0 2px;letter-spacing:-.3px}
 /* Over the icon the chip tint sits on the masthead colour, so the icon's lines do not show through the count. */
 .tab-count{background:linear-gradient(var(--mast-chip),var(--mast-chip)),var(--brand)}
 .tab-count .cnt-full{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
 .tab-count .cnt-short{display:inline}
 /* The control group spans the row inside the band's 5 px padding: the popover starts 8 px below the band. */
 .tp{top:calc(100% + 17px)}
 .page-head{padding-block:16px 10px}
 .guide-head .lede{display:none}
 .goal{padding:12px 14px;border-radius:12px}
 .goal-more{display:inline-flex}
 .goal:not(.open) .goal-detail{display:none}
 .goal-rows{gap:12px;margin-top:8px}
 .goal-big strong{font-size:22px}
 .goal-more{margin-top:8px}
 .legend-body{grid-template-columns:1fr}
 .search{max-width:none;flex-basis:100%}
 .seg-toggle{margin-inline-start:0}
 .fline .fh{min-width:0;width:100%}
 .tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
 .eptable .c-ev,.eptable .c-links{display:none}
 .eptable .c-title .ev-inline{display:table;margin-top:3px}
 .urow{grid-template-columns:112px minmax(0,1fr)}
 .urow-actions{grid-column:1/-1;justify-content:space-between}
 .ugrid{grid-template-columns:1fr 1fr;gap:12px}
 .ucard .u-title{font-size:14px}
 .ucard .u-body{padding:8px 10px 0}
 .ucard .u-actions{padding:8px 10px 10px;flex-wrap:wrap}
 .ucard .btn{padding:6px 9px;font-size:12.5px}
 dl.facts{grid-template-columns:1fr;gap:0}
 dl.facts dd{margin-bottom:8px}
 .trow{grid-template-columns:72px minmax(0,1fr)}
 .trow-act{grid-column:2;justify-content:flex-start}
 .pager{margin-inline-start:0;width:100%}
 .cmp .c-pub{display:none}
}
@media (max-width:480px){
 /* 320 px holds the four tabs, the toggle and a 40 px control beside it. */
 .mast{column-gap:6px;padding-inline:10px}
 .mast-tools{gap:6px}
 .tabs>ul{gap:0}
 .tab{font-size:11px;padding-inline:2px}
 .lang{--lang-pad:2px}
 .theme-btn{width:36px;height:36px}
 /* One palette per row: two columns would cut a long name ("Terracotta") beside its swatch and check mark. */
 .tp-pals{grid-template-columns:minmax(0,1fr)}
 .lang-opt{min-height:30px;padding:0 5px;font-size:12px}

    band's 4 px border. */
 .mast-tools{position:static}
 .tp{left:10px;right:10px;width:auto;max-width:360px;margin-left:auto;top:calc(100% + 12px)}
 .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .tile-body{padding:6px 7px 4px;gap:3px}
 .tile-title{font-size:12px}
 .tile-meta{font-size:10.5px;gap:4px}
 .tile-meta .cov-word{display:none}
 .tile-act{padding:0 5px 6px}
 .tbtn{font-size:11px;min-height:34px;padding:2px 3px}
 .eptable th,.eptable td{padding:6px 5px}
 .eptable thead th{font-size:10px;letter-spacing:0}

 .eptable .c-act .btn .acc-bad{display:none}

 .num{font-size:11px;padding:0 5px;inset-block-start:4px;inset-inline-start:4px}

 .ucard{display:grid;grid-template-columns:116px minmax(0,1fr);gap:0 10px;padding:10px;align-items:start}

@media (pointer:coarse){.cell{width:32px;height:32px;font-size:12px}.chip{min-height:40px}.btn{min-height:44px}

@media (prefers-reduced-motion:no-preference){
 .tile,.ucard,.chip,.rail-item,.btn{transition:box-shadow .15s,border-color .15s,background-color .15s}

}
@keyframes die-roll{from{transform:rotate(-200deg) scale(.6)}}
@keyframes sticker-pop{from{transform:scale(.6)}}

<script id="prefs-boot">
// Theme and appearance, applied before the first paint, so the page never shows the default palette first. Language,
// theme and appearance are browser-local UI preferences, stored in localStorage beside 'sumsum-language' as 'sumsum-theme'
// (a palette name) and 'sumsum-appearance' (system, light or dark). A palette id from before 2026-10-18 (green, blue, plum,
// sunny, graphite) is read as the palette that replaced it (RENAMED); the stored value is left as it is. Only listed names
// are used: any other stored value ('constructor', '__proto__', an unknown name, a number, broken JSON) falls back to the
// default (terracotta, system). While the appearance is System, data-scheme follows prefers-color-scheme, also when it
// changes. data-start-palette and data-start-appearance on <html> take the place of the stored values (tests and probes).
// The application script calls sumsumTheme.apply() from the theme picker.
(() => {
 const PALETTES = Object.freeze(['terracotta', 'stone', 'sea', 'sage', 'kippi', 'bauhaus']);
 // Palette ids before 2026-10-18 (dce7eba) and the palette each became, so a stored choice survives the change.
 const RENAMED = Object.freeze({__proto__: null, green: 'sage', blue: 'sea', plum: 'kippi', sunny: 'stone', graphite: 'bauhaus'});
 const renamed = v => (typeof v === 'string' && Object.prototype.hasOwnProperty.call(RENAMED, v) ? RENAMED[v] : v);
 const APPEARANCES = Object.freeze(['system', 'light', 'dark']);
 const de = document.documentElement, w = typeof window === 'undefined' ? {} : window;
 const mq = typeof w.matchMedia === 'function' ? w.matchMedia('(prefers-color-scheme: dark)') : null;
 const read = key => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } };
 const valid = (v, list) => (typeof v === 'string' && list.includes(v) ? v : list[0]);
 const meta = (id, value) => { const m = document.getElementById(id); if (m && value) m.setAttribute('content', value); };
 function apply(palette, appearance) {
  const p = valid(palette, PALETTES), a = valid(appearance, APPEARANCES), s = a === 'system' ? (mq && mq.matches ? 'dark' : 'light') : a;
  de.setAttribute('data-palette', p); de.setAttribute('data-appearance', a); de.setAttribute('data-scheme', s);
  meta('meta-color-scheme', a === 'system' ? 'light dark' : s);
  // The browser's own toolbar takes the masthead colour.
  if (typeof getComputedStyle === 'function') meta('meta-theme-color', getComputedStyle(de).getPropertyValue('--brand').trim());
  return {palette: p, appearance: a, scheme: s};
 }
 const start = name => de.getAttribute('data-start-' + name);
 apply(renamed(start('palette') ?? read('sumsum-theme')), start('appearance') ?? read('sumsum-appearance'));
 if (mq) {
  const follow = () => { if (de.getAttribute('data-appearance') === 'system') apply(de.getAttribute('data-palette'), 'system'); };
  if (typeof mq.addEventListener === 'function') mq.addEventListener('change', follow);
  else if (typeof mq.addListener === 'function') mq.addListener(follow);
 }
 w.sumsumTheme = Object.freeze({palettes: PALETTES, appearances: APPEARANCES, apply});
})();
</script>

   <script id="lang-boot">
   // The toggle shows the stored language from the first paint. The application script comes after the embedded data, so
   // without this the page would first draw English checked and then slide the thumb over. Same choice as the application:
   // data-start-lang, else the stored 'sumsum-language'; anything but Hebrew leaves the markup's English.
   (() => {
    let l = document.documentElement.getAttribute('data-start-lang');
    if (!l) { try { l = JSON.parse(localStorage.getItem('sumsum-language')); } catch { l = null; } }
    if (l !== 'he') return;
    for (const o of [document.getElementById('lang-en'), document.getElementById('lang-he')]) {
     const on = o.getAttribute('lang') === l; o.setAttribute('aria-checked', String(on)); o.setAttribute('tabindex', on ? '0' : '-1');
    }
   })();
   </script>

/* ================= Surprise and the queue popover ================= */
// Surprise picks one video at random. On Browse and Starred it picks from the list on screen; elsewhere from every video Home
// offers. Either way only offered videos (see offerable). Previous goes back through this round's picks.
const pops = {open: '', opener: null};
const surprise = {hist: [], pos: -1, pool: [], face: 0};
const DIE = ['א', 'ב', 'ג', 'ד', 'ה', 'ו'];
function surprisePool() { return UVIEWS.includes(state.view) && U.list ? U.list.filter(offerable) : records.filter(pickable); }
function rollSurprise() {
 const pool = surprise.pool, cur = surprise.hist[surprise.pos];
 if (pool.length) {
  let r = pool[Math.floor(rand() * pool.length)];
  for (let k = 0; k < 8 && pool.length > 1 && r === cur; k++) r = pool[Math.floor(rand() * pool.length)];
  surprise.hist = surprise.hist.slice(0, surprise.pos + 1); surprise.hist.push(r); surprise.pos = surprise.hist.length - 1;
 }
 surprise.face = Math.floor(rand() * DIE.length);
}
function dieEl() {
 const d = el('span', 'die', DIE[surprise.face]); d.setAttribute('aria-hidden', 'true'); d.setAttribute('data-roll', String(surprise.pos));
 return d;
}
function popHead(id, title) {
 const head = el('div', 'pop-head'); const h = el('h2', '', title); h.setAttribute('id', id + '-h'); h.tabIndex = -1;
 const x = btn('pop-x', '×', () => closePop(true), id + '-close'); x.setAttribute('aria-label', t('close'));
 head.append(h, x); return head;
}
function renderSurprise() {
 const pop = $('surprise-pop'), r = surprise.hist[surprise.pos];
 const who = UVIEWS.includes(state.view) && state.u.character ? tagName(state.u.character) : '';
 const head = popHead('surprise', who ? t('charPicks', {name: who}) : t('surprise')); head.prepend(dieEl());
 const body = el('div', 'pop-body');
 if (!r) {
  body.append(el('p', '', t(UVIEWS.includes(state.view) ? 'surpriseNoneHere' : 'nothingFits')));
  if (!UVIEWS.includes(state.view)) body.append(prefClears());
 } else {
  const ul = el('ul', 'pick'); ul.append(homeCard(r, 'sp-')); body.append(ul);
  const act = el('div', 'pop-act');
  if (surprise.pos > 0) act.append(btn('btn ghost', t('previous'), () => { surprise.pos--; renderSurprise(); restoreFocus('sp-prev', 'sp-another'); }, 'sp-prev'));
  if (surprise.pool.length > 1) act.append(btn('btn', t('another'), () => { rollSurprise(); renderSurprise(); restoreFocus('sp-another'); }, 'sp-another'));
  body.append(act);
 }

}

 else renderQueuePop();

}
function closePop(returnFocus) {

 const o = pops.opener; pops.open = ''; pops.opener = null;
